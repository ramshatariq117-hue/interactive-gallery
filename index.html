<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,sans-serif;
}
canvas{display:block}

#welcome{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 42%,rgba(52,76,112,.30),transparent 40%),
    linear-gradient(145deg,#080d18,#111c30 52%,#070b13);
  color:white;
}

.welcomeInner{
  width:min(620px,90vw);
  text-align:center;
  padding:40px;
}

#welcome h1{
  margin:0 0 12px;
  font-family:Georgia,serif;
  font-size:clamp(40px,7vw,76px);
  font-weight:400;
  letter-spacing:.12em;
}

#welcome p{
  color:#bdc8d8;
  font-size:15px;
  letter-spacing:.08em;
  margin:0 0 35px;
}

#nameInput{
  width:min(350px,90%);
  padding:14px 17px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.25);
  color:white;
  outline:none;
  border-radius:4px;
  font-size:15px;
  text-align:center;
}

#enterBtn{
  display:block;
  margin:14px auto 0;
  padding:13px 30px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.07);
  color:white;
  border-radius:4px;
  cursor:pointer;
  letter-spacing:.12em;
  transition:.2s;
}

#enterBtn:hover{
  background:rgba(255,255,255,.14);
}

#welcomeMsg{
  min-height:22px;
  margin-top:17px;
  color:#9eafc8;
  font-size:13px;
}

#loading{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#06080d;
  color:#dbe5f2;
  letter-spacing:.18em;
  font-size:12px;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:8px;
  height:8px;
  margin:-4px;
  border:1px solid rgba(255,255,255,.75);
  border-radius:50%;
  z-index:8;
  pointer-events:none;
  opacity:.75;
}

#hint{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  color:rgba(255,255,255,.7);
  font-size:12px;
  letter-spacing:.06em;
  z-index:8;
  pointer-events:none;
  text-shadow:0 1px 4px #000;
}

#muteBtn{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:10;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.3);
  color:#ddd;
  padding:8px 12px;
  border-radius:4px;
  cursor:pointer;
}

#roomLabel{
  position:fixed;
  left:50%;
  top:27px;
  transform:translateX(-50%);
  color:rgba(255,255,255,.72);
  font-family:Georgia,serif;
  font-size:15px;
  letter-spacing:.16em;
  z-index:8;
  text-shadow:0 1px 5px #000;
  pointer-events:none;
}

#noteOverlay{
  position:fixed;
  inset:0;
  z-index:25;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(5px);
}

#noteBox{
  width:min(570px,88vw);
  background:#10131a;
  color:#e7ebf1;
  padding:32px;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 80px rgba(0,0,0,.65);
}

#noteTitle{
  font-family:Georgia,serif;
  font-size:27px;
  margin-bottom:13px;
}

#noteBody{
  color:#aeb7c4;
  line-height:1.7;
  font-size:14px;
}

#noteClose{
  margin-top:22px;
  background:none;
  color:#dfe7f1;
  border:1px solid rgba(255,255,255,.2);
  padding:9px 16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="loading">ENTERING GALLERY…</div>

<div id="welcome">
  <div class="welcomeInner">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of quiet, strange places</p>

    <div id="stepEnterName">
      <input id="nameInput" maxlength="28" placeholder="Your name">
      <button id="enterBtn">ENTER GALLERY</button>
      <div id="welcomeMsg"></div>
    </div>
  </div>
</div>

<div id="crosshair"></div>
<div id="roomLabel"></div>
<div id="hint">WASD to walk · Mouse to look · Click paintings to view</div>
<button id="muteBtn">SOUND ON</button>

<div id="noteOverlay">
  <div id="noteBox">
    <div id="noteTitle"></div>
    <div id="noteBody"></div>
    <button id="noteClose">CLOSE</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =========================================================
   RAMSHA ART STUDIO — INTERACTIVE GALLERY
   ========================================================= */

const THREE = window.THREE;

/* ---------------------------------------------------------
   BASIC SETUP
--------------------------------------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070b);
scene.fog = new THREE.FogExp2(0x070a10,0.014);

const camera = new THREE.PerspectiveCamera(
  72,
  innerWidth/innerHeight,
  .05,
  220
);

camera.position.set(0,1.68,5);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.92;

document.body.appendChild(renderer.domElement);


/* ---------------------------------------------------------
   LIGHTING
--------------------------------------------------------- */

const hemi=new THREE.HemisphereLight(
  0x9baeca,
  0x07090d,
  .34
);
scene.add(hemi);

const ambient=new THREE.AmbientLight(0x65738d,.18);
scene.add(ambient);


/* ---------------------------------------------------------
   WORLD CONSTANTS
--------------------------------------------------------- */

const HALL_HALF=1.4;
const HALL_LENGTH=132;

const ROOM_W=15;
const ROOM_D=24;
const ROOM_H=4.8;

const DOOR_HALF=1.62;

const lobbyCenters=[18,43,68,93,118];


/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */

function material(color,opts={}){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:opts.roughness ?? .78,
    metalness:opts.metalness ?? 0,
    emissive:opts.emissive ?? 0x000000,
    emissiveIntensity:opts.emissiveIntensity ?? 0,
    transparent:opts.transparent ?? false,
    opacity:opts.opacity ?? 1,
    side:opts.side ?? THREE.FrontSide
  });
}

function mesh(geometry,mat){
  const m=new THREE.Mesh(geometry,mat);
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function box(
  x,y,z,
  sx,sy,sz,
  color,
  opts={}
){
  const m=mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    material(color,opts)
  );
  m.position.set(x,y,z);
  return m;
}

function sphere(
  x,y,z,
  r,
  color,
  opts={}
){
  const m=mesh(
    new THREE.SphereGeometry(r,16,12),
    material(color,opts)
  );
  m.position.set(x,y,z);
  return m;
}

function cylinder(
  x,y,z,
  r1,r2,h,
  color,
  segments=16,
  opts={}
){
  const m=mesh(
    new THREE.CylinderGeometry(r1,r2,h,segments),
    material(color,opts)
  );
  m.position.set(x,y,z);
  return m;
}

function lineBetween(a,b,color,width=.025){
  const geometry=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(...a),
    new THREE.Vector3(...b)
  ]);

  const line=new THREE.Line(
    geometry,
    new THREE.LineBasicMaterial({
      color,
      linewidth:width
    })
  );

  return line;
}


/* ---------------------------------------------------------
   PROCEDURAL TEXTURES
--------------------------------------------------------- */

function canvasTexture(draw,w=512,h=512){
  const c=document.createElement("canvas");
  c.width=w;
  c.height=h;

  const ctx=c.getContext("2d");
  draw(ctx,w,h);

  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;

  return t;
}

function paintingTexture(seed=1){
  return canvasTexture((ctx,w,h)=>{
    let g=ctx.createLinearGradient(0,0,w,h);

    const palettes=[
      ["#0b1520","#29455b","#927d61"],
      ["#171018","#4c2932","#a67864"],
      ["#07161a","#28515a","#c4a57c"],
      ["#101216","#303743","#77705e"],
      ["#160f14","#47333b","#8d6557"]
    ];

    const p=palettes[(seed-1)%palettes.length];

    g.addColorStop(0,p[0]);
    g.addColorStop(.5,p[1]);
    g.addColorStop(1,p[2]);

    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);

    for(let i=0;i<18;i++){
      ctx.fillStyle=
        `rgba(${60+((seed*i)%120)},${50+((seed*7+i*9)%100)},${50+((seed*3+i*13)%100)},.16)`;

      ctx.beginPath();

      const x=(seed*97+i*53)%w;
      const y=(seed*43+i*71)%h;
      const r=30+(seed*i)%100;

      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fill();
    }

    ctx.strokeStyle="rgba(255,255,255,.12)";
    ctx.lineWidth=5;

    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(i*w/4,0);
      ctx.lineTo((i+.4)*w/4,h);
      ctx.stroke();
    }
  },640,420);
}

function wallpaperTexture(base,accent){
  return canvasTexture((ctx,w,h)=>{
    ctx.fillStyle="#"+base.toString(16).padStart(6,"0");
    ctx.fillRect(0,0,w,h);

    ctx.strokeStyle="#"+accent.toString(16).padStart(6,"0");
    ctx.globalAlpha=.28;
    ctx.lineWidth=2;

    for(let x=0;x<w;x+=42){
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x,h);
      ctx.stroke();
    }

    for(let y=0;y<h;y+=55){
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(w,y);
      ctx.stroke();
    }

    ctx.globalAlpha=1;
  },512,512);
}


/* ---------------------------------------------------------
   PAINTINGS
--------------------------------------------------------- */

const clickable=[];

function createPainting(cfg){
  const g=new THREE.Group();

  const frame=box(
    0,0,0,
    cfg.w+.20,
    cfg.h+.20,
    .12,
    cfg.frame ?? 0x17181b,
    {roughness:.38,metalness:.15}
  );

  const art=mesh(
    new THREE.PlaneGeometry(cfg.w,cfg.h),
    new THREE.MeshStandardMaterial({
      map:cfg.texture || paintingTexture(cfg.seed||1),
      roughness:.9
    })
  );

  art.position.z=.071;

  g.add(frame);
  g.add(art);

  if(cfg.rotation){
    g.rotation.set(
      cfg.rotation.x||0,
      cfg.rotation.y||0,
      cfg.rotation.z||0
    );
  }

  g.position.set(
    cfg.x||0,
    cfg.y||1.9,
    cfg.z||0
  );

  scene.add(g);

  const data={
    title:cfg.title||"Untitled",
    body:cfg.body||
      "A quiet place caught somewhere between memory and imagination."
  };

  g.userData.painting=data;
  clickable.push(g);

  return g;
}


/* ---------------------------------------------------------
   ARCHITECTURAL MATERIALS
--------------------------------------------------------- */

const MAT={
  hallwayWall:material(0x20252d,{roughness:.96}),
  hallwayTrim:material(0x11151b,{roughness:.62}),
  hallwayFloor:material(0x28252a,{roughness:.88}),
  darkWood:material(0x211719,{roughness:.7}),
  brass:material(0x8e7040,{roughness:.35,metalness:.65}),
  glass:material(0x152735,{
    roughness:.12,
    metalness:.1,
    transparent:true,
    opacity:.38
  })
};


/* ---------------------------------------------------------
   COLLISION SYSTEM
--------------------------------------------------------- */

const collisions=[];

function addCollisionRect(minX,minZ,maxX,maxZ){
  collisions.push({
    minX:Math.min(minX,maxX),
    maxX:Math.max(minX,maxX),
    minZ:Math.min(minZ,maxZ),
    maxZ:Math.max(minZ,maxZ)
  });
}

function circleIntersectsRect(x,z,r,rect){
  const cx=Math.max(rect.minX,Math.min(x,rect.maxX));
  const cz=Math.max(rect.minZ,Math.min(z,rect.maxZ));

  const dx=x-cx;
  const dz=z-cz;

  return dx*dx+dz*dz<r*r;
}

function resolveCollision(x,z,r){
  let px=x;
  let pz=z;

  for(let pass=0;pass<4;pass++){
    for(const rect of collisions){

      if(!circleIntersectsRect(px,pz,r,rect)) continue;

      const cx=Math.max(rect.minX,Math.min(px,rect.maxX));
      const cz=Math.max(rect.minZ,Math.min(pz,rect.maxZ));

      let dx=px-cx;
      let dz=pz-cz;

      const d2=dx*dx+dz*dz;

      if(d2>.000001){
        const d=Math.sqrt(d2);
        const push=r-d;

        px+=dx/d*push;
        pz+=dz/d*push;
      }else{
        const left=Math.abs(px-rect.minX);
        const right=Math.abs(rect.maxX-px);
        const top=Math.abs(pz-rect.minZ);
        const bottom=Math.abs(rect.maxZ-pz);

        const smallest=Math.min(left,right,top,bottom);

        if(smallest===left) px=rect.minX-r;
        else if(smallest===right) px=rect.maxX+r;
        else if(smallest===top) pz=rect.minZ-r;
        else pz=rect.maxZ+r;
      }
    }
  }

  return {x:px,z:pz};
}


/* ---------------------------------------------------------
   HALLWAY
--------------------------------------------------------- */

function buildHallSide(side){

  const wallX=side*HALL_HALF;

  let previous=1;

  for(const center of lobbyCenters){

    const start=center-DOOR_HALF;

    if(start>previous){

      const length=start-previous;

      scene.add(
        box(
          wallX,
          ROOM_H/2,
          (previous+start)/2,
          .20,
          ROOM_H,
          length,
          0x20252d,
          {roughness:.96}
        )
      );

      addCollisionRect(
        wallX-.12,
        previous,
        wallX+.12,
        start
      );
    }

    previous=center+DOOR_HALF;
  }

  if(previous<HALL_LENGTH){

    scene.add(
      box(
        wallX,
        ROOM_H/2,
        (previous+HALL_LENGTH)/2,
        .20,
        ROOM_H,
        HALL_LENGTH-previous,
        0x20252d,
        {roughness:.96}
      )
    );

    addCollisionRect(
      wallX-.12,
      previous,
      wallX+.12,
      HALL_LENGTH
    );
  }

  /* decorative vertical trim, avoiding doors */

  for(let z=5;z<HALL_LENGTH;z+=8){

    let nearDoor=false;

    for(const c of lobbyCenters){
      if(Math.abs(z-c)<DOOR_HALF+.65){
        nearDoor=true;
        break;
      }
    }

    if(nearDoor) continue;

    scene.add(
      box(
        wallX-side*.055,
        2.35,
        z,
        .08,
        4.55,
        .07,
        0x11151a,
        {roughness:.55}
      )
    );
  }

  /* lower baseboard */

  scene.add(
    box(
      wallX-side*.08,
      .16,
      HALL_LENGTH/2,
      .16,
      .30,
      HALL_LENGTH,
      0x0e1116,
      {roughness:.5}
    )
  );

  /* wallpaper panels */

  for(let z=4;z<HALL_LENGTH-3;z+=12){

    let nearDoor=false;

    for(const c of lobbyCenters){
      if(Math.abs(z-c)<DOOR_HALF+1.8){
        nearDoor=true;
      }
    }

    if(nearDoor) continue;

    const panel=mesh(
      new THREE.PlaneGeometry(1.05,3.25),
      new THREE.MeshStandardMaterial({
        map:wallpaperTexture(0x242b34,0x667080),
        roughness:.96
      })
    );

    panel.position.set(
      wallX-side*.112,
      2.22,
      z
    );

    panel.rotation.y=side<0?Math.PI/2:-Math.PI/2;

    scene.add(panel);
  }
}

buildHallSide(-1);
buildHallSide(1);


/* hallway floor */

scene.add(
  box(
    0,-.09,HALL_LENGTH/2,
    HALL_HALF*2,
    .18,
    HALL_LENGTH,
    0x262229,
    {roughness:.98}
  )
);

addCollisionRect(
  -HALL_HALF-.18,
  0,
  HALL_HALF+.18,
  0.1
);


/* runner carpet */

scene.add(
  box(
    0,.012,HALL_LENGTH/2,
    1.42,
    .035,
    HALL_LENGTH,
    0x34303a,
    {roughness:.98}
  )
);

for(let z=3;z<HALL_LENGTH;z+=5){

  scene.add(
    box(
      0,.034,z,
      1.1,
      .012,
      .025,
      0x5a505b,
      {roughness:1}
    )
  );
}


/* hallway ceiling */

scene.add(
  box(
    0,
    ROOM_H+.08,
    HALL_LENGTH/2,
    HALL_HALF*2+.35,
    .18,
    HALL_LENGTH,
    0x0e1117,
    {roughness:.96}
  )
);


/* ceiling beams */

for(let z=6;z<HALL_LENGTH;z+=10){

  scene.add(
    box(
      0,
      ROOM_H-.10,
      z,
      HALL_HALF*2+.25,
      .20,
      .22,
      0x151920,
      {roughness:.68}
    )
  );
}


/* hallway console tables */

for(const z of [9,31,56,81,106,128]){

  const side=z%2?1:-1;
  const x=side*1.02;

  scene.add(
    box(x,.58,z,.58,1.05,.38,0x30262a,{roughness:.7})
  );

  scene.add(
    box(x,.12,z,.52,.18,.32,0x151318,{roughness:.65})
  );

  scene.add(
    sphere(x,.93,z,.10,0x625044,{roughness:.8})
  );

  const glow=new THREE.PointLight(0xffd5a1,.12,4);
  glow.position.set(x-side*.2,.95,z);
  scene.add(glow);
}


/* hallway sconces */

for(let z=7;z<HALL_LENGTH-2;z+=9){

  for(const side of [-1,1]){

    const x=side*(HALL_HALF-.12);

    const fixture=box(
      x,
      2.85,
      z,
      .08,
      .32,
      .20,
      0x71604d,
      {metalness:.5,roughness:.35}
    );

    scene.add(fixture);

    const lamp=new THREE.PointLight(0xffd6a2,.30,5);
    lamp.position.set(
      x-side*.24,
      2.72,
      z
    );

    scene.add(lamp);
  }
}


/* hallway art */

for(let i=0;i<16;i++){

  const z=4+i*8;

  if(lobbyCenters.some(c=>Math.abs(c-z)<3)) continue;

  const side=i%2===0?-1:1;

  createPainting({
    x:side*(HALL_HALF-side*.015),
    y:2.18,
    z,
    w:.75,
    h:1.10,
    rotation:{y:side<0?Math.PI/2:-Math.PI/2},
    seed:i+10,
    title:"A Quiet Passage",
    body:"The hallway feels different when no one else is here."
  });
}


/* ---------------------------------------------------------
   DOORWAYS
--------------------------------------------------------- */

function createDoorway(cfg){

  const side=cfg.side;
  const wallX=side*HALL_HALF;

  const g=new THREE.Group();

  const recess=box(
    0,
    ROOM_H/2,
    0,
    .30,
    ROOM_H,
    DOOR_HALF*2+.5,
    0x07090c,
    {roughness:1}
  );

  recess.position.x=-side*.04;
  g.add(recess);

  const door=box(
    -side*.035,
    2.05,
    0,
    .12,
    3.9,
    DOOR_HALF*2-.12,
    cfg.doorColor||0x211719,
    {roughness:.72}
  );

  g.add(door);

  /* door panels */

  for(const z of [-.95,.95]){

    g.add(
      box(
        -side*.105,
        2.08,
        z,
        .025,
        1.32,
        .72,
        0x130f12,
        {roughness:.7}
      )
    );
  }

  /* frame */

  g.add(
    box(
      -side*.14,
      2.28,
      -DOOR_HALF-.14,
      .24,
      4.55,
      .20,
      0x17151a,
      {roughness:.55}
    )
  );

  g.add(
    box(
      -side*.14,
      2.28,
      DOOR_HALF+.14,
      .24,
      4.55,
      .20,
      0x17151a,
      {roughness:.55}
    )
  );

  g.add(
    box(
      -side*.14,
      4.48,
      0,
      .24,
      .20,
      DOOR_HALF*2+.48,
      0x17151a,
      {roughness:.55}
    )
  );

  /* brass handle */

  const knob=sphere(
    -side*.22,
    2.02,
    1.0,
    .07,
    0xb28b4f,
    {metalness:.8,roughness:.22}
  );

  g.add(knob);

  /* room plaque */

  const plaque=box(
    -side*.19,
    4.04,
    0,
    .06,
    .38,
    1.22,
    0x11161c,
    {metalness:.25,roughness:.5}
  );

  g.add(plaque);

  /* warm doorway light */

  const light=new THREE.PointLight(
    cfg.neon||0xffc28d,
    .42,
    5
  );

  light.position.set(
    -side*.65,
    3.45,
    0
  );

  g.add(light);

  g.position.set(
    0,
    0,
    cfg.z
  );

  scene.add(g);

  return g;
}

--------------------------------------------------------- */

const rooms=[];

function createRoom(cfg){

  const g=new THREE.Group();

  const side=cfg.side;

  const centerX=side*(HALL_HALF+ROOM_W/2);

  g.position.set(centerX,0,cfg.z);

  scene.add(g);

  const half=ROOM_W/2;
  const depth=ROOM_D/2;

  /* floor */

  g.add(
    box(
      0,-.12,0,
      ROOM_W,.24,ROOM_D,
      cfg.floor,
      {roughness:.97}
    )
  );


  /* ceiling */

  g.add(
    box(
      0,
      ROOM_H+.10,
      0,
      ROOM_W+.2,
      .20,
      ROOM_D+.2,
      cfg.ceiling,
      {roughness:.95}
    )
  );


  /* OUTER SIDE WALL */

  g.add(
    box(
      side<0?-half:half,
      ROOM_H/2,
      0,
      .20,
      ROOM_H,
      ROOM_D,
      cfg.wall,
      {roughness:.95}
    )
  );

  addCollisionRect(
    centerX+(side<0?-half-.12:half-.12),
    cfg.z-depth,
    centerX+(side<0?-half+.12:half+.12),
    cfg.z+depth
  );


  /* HALLWAY SIDE WALL WITH DOOR OPENING */

  const hallSideX=-side*half;

  const doorStart=-DOOR_HALF;
  const doorEnd=DOOR_HALF;

  /* negative section */

  g.add(
    box(
      hallSideX,
      ROOM_H/2,
      (doorStart-depth)/2,
      .20,
      ROOM_H,
      doorStart-depth,
      cfg.wall,
      {roughness:.95}
    )
  );

  /* positive section */

  g.add(
    box(
      hallSideX,
      ROOM_H/2,
      (doorEnd+depth)/2,
      .20,
      ROOM_H,
      depth-doorEnd,
      cfg.wall,
      {roughness:.95}
    )
  );

  const worldHallX=centerX+hallSideX;

  addCollisionRect(
    worldHallX-.12,
    cfg.z-depth,
    worldHallX+.12,
    cfg.z+doorStart
  );

  addCollisionRect(
    worldHallX-.12,
    cfg.z+doorEnd,
    worldHallX+.12,
    cfg.z+depth
  );


  /* NEGATIVE-Z END WALL */

  g.add(
    box(
      0,
      ROOM_H/2,
      -depth,
      ROOM_W,
      ROOM_H,
      .20,
      cfg.wall,
      {roughness:.95}
    )
  );

  addCollisionRect(
    centerX-half,
    cfg.z-depth-.12,
    centerX+half,
    cfg.z-depth+.12
  );


  /* POSITIVE-Z BACK WALL */

  g.add(
    box(
      0,
      ROOM_H/2,
      depth,
      ROOM_W,
      ROOM_H,
      .20,
      cfg.wall,
      {roughness:.95}
    )
  );

  addCollisionRect(
    centerX-half,
    cfg.z+depth-.12,
    centerX+half,
    cfg.z+depth+.12
  );


  /* lower wall trim */

  for(const z of [-depth+.18,depth-.18]){

    g.add(
      box(
        0,
        .22,
        z,
        ROOM_W-.25,
        .34,
        .10,
        0x161317,
        {roughness:.65}
      )
    );
  }

  g.add(
    box(
      side<0?-half+.08:half-.08,
      .22,
      0,
      .10,
      .34,
      ROOM_D-.25,
      0x161317,
      {roughness:.65}
    )
  );


  /* wall panels */

  const panelMat=new THREE.MeshStandardMaterial({
    map:wallpaperTexture(
      cfg.wall,
      cfg.accent||0x5b4c4c
    ),
    roughness:.98
  });

  for(const z of [-8,-4,4,8]){

    const p=mesh(
      new THREE.PlaneGeometry(2.7,3.25),
      panelMat
    );

    p.position.set(
      hallSideX-side*.112,
      2.25,
      z
    );

    p.rotation.y=side<0?Math.PI/2:-Math.PI/2;

    g.add(p);
  }


  /* room main light */

  const mainLight=new THREE.PointLight(
    cfg.light,
    cfg.intensity||.55,
    13
  );

  mainLight.position.set(
    side*.5,
    3.6,
    1
  );

  g.add(mainLight);

  cfg.mainLight=mainLight;


  /* doorway */

  createDoorway(cfg);


  /* pendant */

  const cord=cylinder(
    0,
    3.78,
    0,
    .025,.025,
    .72,
    0x101216,
    8
  );

  g.add(cord);

  const shade=cylinder(
    0,
    3.37,
    0,
    .26,.16,
    .25,
    cfg.lampShade||0x343039,
    18,
    {roughness:.6}
  );

  g.add(shade);

  const pendantLight=new THREE.PointLight(
    cfg.light,
    .24,
    6
  );

  pendantLight.position.set(0,3.15,0);

  g.add(pendantLight);


  rooms.push({
    cfg,
    group:g,
    mainLight,
    centerX
  });

  return g;
}

/* ---------------------------------------------------------
   AUDIO
--------------------------------------------------------- */

let audioContext=null;
let masterGain=null;
let muted=false;

function initAudio(){

  if(audioContext) return;

  audioContext=new (
    window.AudioContext ||
    window.webkitAudioContext
  )();

  masterGain=audioContext.createGain();
  masterGain.gain.value=.24;
  masterGain.connect(audioContext.destination);

  const drone=audioContext.createOscillator();
  const droneGain=audioContext.createGain();

  drone.type="sine";
  drone.frequency.value=49;

  droneGain.gain.value=.035;

  drone.connect(droneGain);
  droneGain.connect(masterGain);

  drone.start();


  /* subtle noise */

  const buffer=audioContext.createBuffer(
    1,
    audioContext.sampleRate*2,
    audioContext.sampleRate
  );

  const data=buffer.getChannelData(0);

  for(let i=0;i<data.length;i++){
    data[i]=Math.random()*2-1;
  }

  const noise=audioContext.createBufferSource();
  noise.buffer=buffer;
  noise.loop=true;

  const filter=audioContext.createBiquadFilter();

  filter.type="lowpass";
  filter.frequency.value=180;

  const noiseGain=audioContext.createGain();
  noiseGain.gain.value=.012;

  noise.connect(filter);
  filter.connect(noiseGain);
  noiseGain.connect(masterGain);

  noise.start();
}

function footstep(){

  if(!audioContext || muted) return;

  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();

  osc.type="triangle";
  osc.frequency.value=65+Math.random()*20;

  gain.gain.setValueAtTime(
    .045,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime+.09
  );

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start();
  osc.stop(audioContext.currentTime+.1);
}

const keys={
  KeyW:false,
  KeyA:false,
  KeyS:false,
  KeyD:false
};

let yaw=Math.PI;
let pitch=0;

let lastStep=0;

const PLAYER_RADIUS=.34;

document.addEventListener("keydown",e=>{

  if(keys[e.code]!==undefined){
    keys[e.code]=true;
  }
});

document.addEventListener("keyup",e=>{

  if(keys[e.code]!==undefined){
    keys[e.code]=false;
  }
});

  if(document.pointerLockElement!==renderer.domElement){
    return;
  }

  yaw-=e.movementX*.0021;
  pitch-=e.movementY*.0018;

  pitch=Math.max(
    -Math.PI/2+.12,
    Math.min(Math.PI/2-.12,pitch)
  );
});


renderer.domElement.addEventListener("click",()=>{

  if(!document.pointerLockElement){

    renderer.domElement.requestPointerLock();
  }
});


function updateMovement(dt){

  const forward=new THREE.Vector3(
    Math.sin(yaw),
    0,
    Math.cos(yaw)
  );

  const right=new THREE.Vector3(
    Math.cos(yaw),
    0,
    -Math.sin(yaw)
  );

  const move=new THREE.Vector3();

  if(keys.KeyW) move.add(forward);
  if(keys.KeyS) move.sub(forward);
  if(keys.KeyD) move.add(right);
  if(keys.KeyA) move.sub(right);

  if(move.lengthSq()===0) return;

  move.normalize();

  const speed=3.35;

  let nextX=
    camera.position.x+
    move.x*speed*dt;

  let nextZ=
    camera.position.z+
    move.z*speed*dt;

  /* resolve X and Z separately for natural wall sliding */

  const xResolved=resolveCollision(
    nextX,
    camera.position.z,
    PLAYER_RADIUS
  );

  camera.position.x=xResolved.x;

  const zResolved=resolveCollision(
    camera.position.x,
    nextZ,
    PLAYER_RADIUS
  );

  camera.position.z=zResolved.z;

  camera.position.y=1.68;

  const now=performance.now();

  if(now-lastStep>390){

    footstep();

    lastStep=now;
  }
}


/* ---------------------------------------------------------
   PAINTING INTERACTION
--------------------------------------------------------- */

const raycaster=new THREE.Raycaster();

function openNote(data){

  document.exitPointerLock();

  document.getElementById("noteTitle").textContent=data.title;
  document.getElementById("noteBody").textContent=data.body;

  document.getElementById("noteOverlay").style.display="flex";
}

function inspectPainting(){

  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );

  const hits=raycaster.intersectObjects(
    clickable,
    true
  );

  if(!hits.length) return;

  let obj=hits[0].object;

  while(obj && !obj.userData.painting){
    obj=obj.parent;
  }

  if(obj && obj.userData.painting){
    openNote(obj.userData.painting);
  }
}

document.addEventListener("mousedown",e=>{

  if(e.button!==0) return;

  if(document.pointerLockElement===renderer.domElement){
    inspectPainting();
  }
});


document.getElementById("noteClose").onclick=()=>{

  document.getElementById("noteOverlay").style.display="none";

  renderer.domElement.requestPointerLock();
};


/* ---------------------------------------------------------
   ROOM DETECTION
--------------------------------------------------------- */

function updateRoomLabel(){

  let label="THE HALLWAY";

  for(const room of rooms){

    const dx=Math.abs(
      camera.position.x-room.centerX
    );

    const dz=Math.abs(
      camera.position.z-room.cfg.z
    );

    if(
      dx<ROOM_W/2 &&
      dz<ROOM_D/2
    ){

      label=roomNames[room.cfg.number-1];
      break;
    }
  }

  document.getElementById("roomLabel").textContent=label;
}


/* ---------------------------------------------------------
   WORLD ANIMATION
--------------------------------------------------------- */

let lastTime=performance.now();

function animateWorld(time){

  const dt=Math.min(
    .05,
    (time-lastTime)/1000
  );

  lastTime=time;


  /* fireplace flicker */

  for(const room of rooms){

    if(room.cfg.number===1){

      room.mainLight.intensity=
        .23+
        Math.sin(time*.004)*.035+
        Math.sin(time*.009)*.025;
    }

    if(room.cfg.number===2){

      room.mainLight.intensity=
        .57+
        Math.sin(time*.005)*.05+
        Math.sin(time*.013)*.025;
    }

    if(room.cfg.number===3){

      room.mainLight.intensity=
        .49+
        Math.sin(time*.006)*.035;
    }

    if(room.cfg.number===5){

      room.mainLight.intensity=
        .38+
        Math.sin(time*.004)*.025;
    }
  }


  /* snow */

  const snow=rooms[1].group.userData.snow;

  if(snow){

    const arr=snow.geometry.attributes.position.array;

    for(let i=1;i<arr.length;i+=3){

      arr[i]-=dt*.65;

      if(arr[i]<0){
        arr[i]=4.2;
      }
    }

    snow.geometry.attributes.position.needsUpdate=true;
  }


  /* rain */

  const rain=rooms[2].group.userData.rain;

  if(rain){

    const arr=rain.geometry.attributes.position.array;

    for(let i=1;i<arr.length;i+=3){

      arr[i]-=dt*3.5;

      if(arr[i]<.2){
        arr[i]=4.4;
      }
    }

    rain.geometry.attributes.position.needsUpdate=true;
  }


  /* pendulum */

  const pendulum=rooms[4].group.userData.pendulum;

  if(pendulum){

    pendulum.rotation.z=
      Math.sin(time*.0022)*.10;
  }
}


/* ---------------------------------------------------------
   WELCOME
--------------------------------------------------------- */

const welcome=document.getElementById("welcome");
const loading=document.getElementById("loading");

document.getElementById("enterBtn").onclick=()=>{

  const name=
    document.getElementById("nameInput").value.trim();

  if(!name){

    document.getElementById("welcomeMsg").textContent=
      "Please enter your name.";

    return;
  }

  document.getElementById("welcomeMsg").textContent=
    "Welcome, "+name+".";

  initAudio();

  loading.style.display="flex";

  setTimeout(()=>{

    loading.style.display="none";
    welcome.style.display="none";

    renderer.domElement.requestPointerLock();

  },700);
};


document.getElementById("nameInput").addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      document.getElementById("enterBtn").click();
    }
  }
);


/* ---------------------------------------------------------
   SOUND BUTTON
--------------------------------------------------------- */

document.getElementById("muteBtn").onclick=()=>{

  if(!masterGain) return;

  muted=!muted;

  masterGain.gain.value=
    muted?0:.24;

  document.getElementById("muteBtn").textContent=
    muted?"SOUND OFF":"SOUND ON";
};


/* ---------------------------------------------------------
   RESIZE
--------------------------------------------------------- */

addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );
});


/* ---------------------------------------------------------
   MAIN LOOP
--------------------------------------------------------- */

function animate(time){

  requestAnimationFrame(animate);

  const dt=Math.min(
    .05,
    (time-lastTime)/1000
  );

  updateMovement(dt);

  camera.rotation.order="YXZ";

  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  animateWorld(time);
  updateRoomLabel();

  renderer.render(
    scene,
    camera
  );
}

animate(performance.now());

</script>
