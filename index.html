<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
:root{
  --neon:#5ef2ff;
  --paper:#e8dcc0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'Georgia',serif;
}

#app{
  position:relative;
  width:100%;
  height:100%;
}

canvas{
  display:block;
}

/* ---------- ORIGINAL WELCOME SCREEN ---------- */

#welcome{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 40%,#0a0a14 0%,#000 80%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:50;
  color:#cbd6e6;
}

#welcome h1{
  font-size:2.2em;
  letter-spacing:2px;
  color:var(--neon);
  text-shadow:0 0 12px var(--neon),0 0 30px var(--neon);
  margin-bottom:8px;
}

#welcome p{
  opacity:.7;
  margin-bottom:22px;
}

#nameInput{
  padding:12px 16px;
  font-size:1.1em;
  border-radius:6px;
  border:1px solid #345;
  background:#0e1420;
  color:#e8f0ff;
  width:280px;
  text-align:center;
  margin-bottom:16px;
}

#enterBtn{
  padding:12px 28px;
  font-size:1.05em;
  letter-spacing:1px;
  cursor:pointer;
  border-radius:6px;
  border:1px solid var(--neon);
  background:transparent;
  color:var(--neon);
  text-shadow:0 0 8px var(--neon);
  transition:all .25s;
}

#enterBtn:hover{
  background:var(--neon);
  color:#001;
  box-shadow:0 0 20px var(--neon);
}

#welcomeMsg{
  font-size:1.3em;
  color:#fff;
  text-align:center;
  max-width:520px;
  line-height:1.5;
}

/* ---------- HUD ---------- */

#crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:6px;
  height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
  z-index:20;
  pointer-events:none;
}

#hint{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:#c5c0b4;
  font-size:.85em;
  background:rgba(20,15,12,.62);
  padding:7px 15px;
  border-radius:20px;
  z-index:20;
  pointer-events:none;
  border:1px solid rgba(255,255,255,.08);
}

#muteBtn{
  position:absolute;
  top:16px;
  right:16px;
  z-index:30;
  background:rgba(20,15,12,.7);
  color:#ddd;
  border:1px solid #66594b;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-size:.9em;
}

#roomLabel{
  position:absolute;
  top:16px;
  left:16px;
  z-index:20;
  color:#d5b97b;
  text-shadow:0 1px 8px #000;
  font-size:.9em;
  letter-spacing:2px;
  opacity:0;
  transition:opacity .6s;
}

/* ---------- MODAL ---------- */

.modalOverlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(2px);
}

.note{
  width:340px;
  max-width:80vw;
  background:var(--paper);
  color:#3a2f22;
  padding:26px 24px;
  border-radius:2px;
  box-shadow:
    0 0 40px rgba(0,0,0,.7),
    inset 0 0 40px rgba(120,90,50,.25);
  transform:rotate(-1.2deg);
  font-family:'Georgia',serif;
  position:relative;
}

.note::before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 24px,
    rgba(0,0,0,.03) 25px
  );
  pointer-events:none;
}

.note h3{
  font-size:1.15em;
  margin-bottom:10px;
  border-bottom:1px solid rgba(0,0,0,.2);
  padding-bottom:6px;
}

.note p{
  line-height:1.5;
  font-size:.95em;
}

.note button{
  margin-top:16px;
  padding:8px 16px;
  border:1px solid #3a2f22;
  background:transparent;
  cursor:pointer;
  color:#3a2f22;
}

.win{
  background:#111;
  color:#ffd27a;
  border:2px solid #ffd27a;
  box-shadow:0 0 40px #ffb84a;
  transform:rotate(0);
  text-align:center;
}

.win h3{
  color:#ffd27a;
  border-color:#553;
}

.win button{
  border-color:#ffd27a;
  color:#ffd27a;
}

#loading{
  position:absolute;
  inset:0;
  background:#000;
  color:#5ef2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  font-size:1.1em;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div id="app">

<div id="loading">LOADING GALLERY…</div>

<div id="welcome">

  <h1>RAMSHA ART STUDIO</h1>

  <p>an interactive gallery of cozy &amp; eerie things</p>

  <div id="stepEnterName">
    <input id="nameInput"
           placeholder="Enter your name"
           maxlength="20">

    <br>

    <button id="enterBtn">
      ENTER GALLERY
    </button>
  </div>

  <div id="welcomeMsg" style="display:none;"></div>

</div>

<div id="roomLabel"></div>

<div id="crosshair" style="display:none;"></div>

<div id="hint" style="display:none;">
  WASD to move · mouse to look · click a painting
</div>

<button id="muteBtn" style="display:none;">
  🔊 Sound
</button>

<div class="modalOverlay" id="noteOverlay">

  <div class="note" id="noteBox">

    <h3 id="noteTitle">Untitled</h3>

    <p id="noteBody">...</p>

    <button id="noteClose">
      close
    </button>

  </div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ================================================================
   RAMSHA ART STUDIO
   LIFELIKE PRIVATE GALLERY
================================================================ */

const $ = id => document.getElementById(id);

let gameStarted = false;
let galleryReady = false;

let scene;
let camera;
let renderer;
let dom;

let yaw = Math.PI;
let pitch = 0;

const keys = {};

const clickable = [];
const flickerLights = [];
const animatedObjects = [];
const snowSystems = [];

let audioCtx = null;
let master = null;
let muted = false;


/* ================================================================
   ARCHITECTURAL DIMENSIONS
================================================================ */

const HALL_HALF = 2.05;
const HALL_LENGTH = 118;
const HALL_HEIGHT = 4.35;

const ROOM_W = 10.5;
const ROOM_D = 14.5;
const ROOM_HEIGHT = 4.35;

const DOOR_HALF = 1.15;

const PLAYER_RADIUS = .34;
const PLAYER_HEIGHT = 1.68;


/* ================================================================
   ROOM CONFIGURATION
================================================================ */

const ROOM_CONFIGS = [

  {
    tag:'LOBBY 1',
    side:-1,
    z:15,
    type:'playroom'
  },

  {
    tag:'LOBBY 2',
    side:1,
    z:37,
    type:'farmhouse'
  },

  {
    tag:'LOBBY 3',
    side:-1,
    z:59,
    type:'snowcottage'
  },

  {
    tag:'LOBBY 4',
    side:1,
    z:81,
    type:'night'
  },

  {
    tag:'LOBBY 5',
    side:-1,
    z:103,
    type:'eerie'
  }

];


/* ================================================================
   WELCOME
================================================================ */

function showFatalError(msg){

  const lbl = $('roomLabel');

  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';
  lbl.textContent = '⚠ ' + msg;

  console.error(msg);
}


$('enterBtn').onclick = () => {

  const name =
    $('nameInput').value.trim() || 'friend';

  $('stepEnterName').style.display = 'none';

  const wm = $('welcomeMsg');

  wm.style.display = 'block';

  wm.textContent =
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn('Audio failed:',e);
  }

  setTimeout(()=>{

    $('welcome').style.display = 'none';

    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';

    gameStarted = true;

    if(!galleryReady){

      showFatalError(
        '3D engine did not start — open the browser console (F12) for details.'
      );

    }else if(dom){

      dom.requestPointerLock();

    }

  },2200);

};


$('muteBtn').onclick = ()=>{

  muted = !muted;

  if(master){
    master.gain.value =
      muted ? 0 : .25;
  }

  $('muteBtn').textContent =
    muted ? '🔇 Sound' : '🔊 Sound';

};


$('noteClose').onclick = ()=>{
  $('noteOverlay').style.display = 'none';
};


function openNote(d){

  if(dom)
    document.exitPointerLock();

  const box = $('noteBox');

  box.classList.toggle(
    'win',
    !!d.winner
  );

  $('noteTitle').textContent =
    d.winner
      ? '🎉 You found a free print!'
      : d.label;

  $('noteBody').textContent =
    d.story;

  $('noteOverlay').style.display =
    'flex';

}


/* ================================================================
   AUDIO
================================================================ */

function startAudio(){

  if(audioCtx)
    return;

  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  master =
    audioCtx.createGain();

  master.gain.value = .25;

  master.connect(
    audioCtx.destination
  );


  const drone =
    audioCtx.createOscillator();

  drone.type = 'sine';
  drone.frequency.value = 46;

  const droneGain =
    audioCtx.createGain();

  droneGain.gain.value = .045;

  drone
    .connect(droneGain)
    .connect(master);

  drone.start();


  const bufSize =
    2 * audioCtx.sampleRate;

  const buf =
    audioCtx.createBuffer(
      1,
      bufSize,
      audioCtx.sampleRate
    );

  const data =
    buf.getChannelData(0);

  for(let i=0;i<bufSize;i++){
    data[i] =
      Math.random()*2-1;
  }

  const noise =
    audioCtx.createBufferSource();

  noise.buffer = buf;
  noise.loop = true;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type = 'lowpass';
  filter.frequency.value = 380;

  const noiseGain =
    audioCtx.createGain();

  noiseGain.gain.value = .018;

  noise
    .connect(filter)
    .connect(noiseGain)
    .connect(master);

  noise.start();

}


/* ================================================================
   INITIALISE
================================================================ */

try{

  initGallery();

  galleryReady = true;

}catch(err){

  showFatalError(
    'Gallery failed to load: ' +
    err.message
  );

  console.error(err);

}


/* ================================================================
   THREE INIT
================================================================ */

function initGallery(){

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(0x171311);

  scene.fog =
    new THREE.Fog(
      0x171311,
      32,
      125
    );


  camera =
    new THREE.PerspectiveCamera(
      72,
      innerWidth/innerHeight,
      .05,
      180
    );

  camera.position.set(
    0,
    PLAYER_HEIGHT,
    5
  );


  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

  renderer.outputEncoding =
    THREE.sRGBEncoding;

  renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

  renderer.toneMappingExposure =
    .92;


  $('app').prepend(
    renderer.domElement
  );

  dom =
    renderer.domElement;


  $('loading').style.display =
    'none';


  window.addEventListener(
    'resize',
    resize
  );


  buildArchitecture();
  buildHallwayDecor();
  buildRooms();
  setupControls();

  loop();

}


/* ================================================================
   RESIZE
================================================================ */

function resize(){

  camera.aspect =
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

}


/* ================================================================
   MATERIALS
================================================================ */

function mat(
  color,
  roughness=.8,
  metalness=0
){

  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });

}


function mesh(
  geometry,
  material,
  x=0,
  y=0,
  z=0,
  rx=0,
  ry=0,
  rz=0
){

  const m =
    new THREE.Mesh(
      geometry,
      material
    );

  m.position.set(x,y,z);
  m.rotation.set(rx,ry,rz);

  m.castShadow = true;
  m.receiveShadow = true;

  scene.add(m);

  return m;

}


function addTo(
  parent,
  geometry,
  material,
  x=0,
  y=0,
  z=0,
  rx=0,
  ry=0,
  rz=0
){

  const m =
    new THREE.Mesh(
      geometry,
      material
    );

  m.position.set(x,y,z);
  m.rotation.set(rx,ry,rz);

  m.castShadow = true;
  m.receiveShadow = true;

  parent.add(m);

  return m;

}


/* ================================================================
   TEXTURE HELPERS
================================================================ */

function canvasTexture(
  draw,
  w=512,
  h=512
){

  const c =
    document.createElement('canvas');

  c.width = w;
  c.height = h;

  const ctx =
    c.getContext('2d');

  draw(ctx,w,h);

  const texture =
    new THREE.CanvasTexture(c);

  texture.encoding =
    THREE.sRGBEncoding;

  texture.wrapS =
    THREE.RepeatWrapping;

  texture.wrapT =
    THREE.RepeatWrapping;

  return texture;

}


/* ================================================================
   WALLPAPER
================================================================ */

function wallpaperTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle='#55282f';
      ctx.fillRect(0,0,w,h);


      for(let x=0;x<w;x+=42){

        ctx.fillStyle =
          x%84===0
            ? 'rgba(125,72,72,.16)'
            : 'rgba(25,8,13,.15)';

        ctx.fillRect(
          x,
          0,
          20,
          h
        );

      }


      /* faded antique pattern */

      for(let x=18;x<w;x+=84){

        for(let y=20;y<h;y+=90){

          ctx.strokeStyle =
            'rgba(178,142,99,.16)';

          ctx.lineWidth=2;

          ctx.beginPath();

          ctx.moveTo(x,y-15);
          ctx.quadraticCurveTo(
            x+18,y,
            x,y+15
          );

          ctx.quadraticCurveTo(
            x-18,y,
            x,y-15
          );

          ctx.stroke();

        }

      }


      /* age marks */

      for(let i=0;i<260;i++){

        const x =
          Math.random()*w;

        const y =
          Math.random()*h;

        ctx.fillStyle =
          Math.random()>.5
            ? 'rgba(230,210,175,.10)'
            : 'rgba(20,4,8,.16)';

        ctx.fillRect(
          x,
          y,
          1+Math.random()*7,
          1+Math.random()*3
        );

      }

    }
  );

}


/* ================================================================
   WOOD TEXTURE
================================================================ */

function woodTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle='#302119';
      ctx.fillRect(0,0,w,h);

      for(let i=0;i<90;i++){

        const y =
          Math.random()*h;

        ctx.strokeStyle =
          `rgba(7,4,2,${.15+Math.random()*.22})`;

        ctx.lineWidth =
          .7+Math.random()*2;

        ctx.beginPath();

        ctx.moveTo(0,y);

        for(let x=0;x<w;x+=24){

          ctx.lineTo(
            x,
            y+
            Math.sin(x*.025+i)*3
          );

        }

        ctx.stroke();

      }

    }
  );

}


/* ================================================================
   FLOOR / CARPET
================================================================ */

function carpetTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle='#493039';
      ctx.fillRect(0,0,w,h);

      ctx.strokeStyle =
        'rgba(184,151,105,.42)';

      ctx.lineWidth=12;

      ctx.strokeRect(
        12,12,w-24,h-24
      );

      ctx.strokeStyle =
        'rgba(184,151,105,.20)';

      ctx.lineWidth=3;

      ctx.strokeRect(
        30,30,w-60,h-60
      );


      for(let i=0;i<130;i++){

        ctx.fillStyle =
          Math.random()>.5
            ? 'rgba(10,5,8,.22)'
            : 'rgba(220,190,140,.10)';

        ctx.fillRect(
          Math.random()*w,
          Math.random()*h,
          2+Math.random()*5,
          1+Math.random()*3
        );

      }

    },
    256,
    1024
  );

}


/* ================================================================
   ARCHITECTURE
================================================================ */

function buildArchitecture(){

  /* hallway floor */

  const floorTex =
    woodTexture();

  floorTex.repeat.set(
    1,
    20
  );

  const floorMat =
    new THREE.MeshStandardMaterial({
      map:floorTex,
      roughness:.96
    });

  mesh(
    new THREE.PlaneGeometry(
      HALL_HALF*2,
      HALL_LENGTH
    ),
    floorMat,
    0,
    0,
    HALL_LENGTH/2,
    -Math.PI/2
  );


  /* ceiling */

  mesh(
    new THREE.PlaneGeometry(
      HALL_HALF*2,
      HALL_LENGTH
    ),
    mat(0x29221f,1),
    0,
    HALL_HEIGHT,
    HALL_LENGTH/2,
    Math.PI/2
  );


  buildHallWall(-1);
  buildHallWall(1);


  /* end walls */

  mesh(
    new THREE.BoxGeometry(
      HALL_HALF*2,
      HALL_HEIGHT,
      .25
    ),
    mat(0x3d2926,.95),
    0,
    HALL_HEIGHT/2,
    0
  );


  mesh(
    new THREE.BoxGeometry(
      HALL_HALF*2,
      HALL_HEIGHT,
      .25
    ),
    mat(0x3d2926,.95),
    0,
    HALL_HEIGHT/2,
    HALL_LENGTH
  );


  /* ceiling moulding */

  [-1,1].forEach(side=>{

    mesh(
      new THREE.BoxGeometry(
        .16,
        .18,
        HALL_LENGTH
      ),
      mat(0x806748,.68),
      side*(HALL_HALF-.07),
      HALL_HEIGHT-.11,
      HALL_LENGTH/2
    );

  });


  /* ambient */

  scene.add(
    new THREE.HemisphereLight(
      0x75666a,
      0x1b100c,
      .62
    )
  );


  const broad =
    new THREE.PointLight(
      0x876f5b,
      .42,
      24
    );

  broad.position.set(
    0,
    3.6,
    8
  );

  scene.add(broad);

}


/* ================================================================
   HALL WALLS
================================================================ */

function buildHallWall(side){

  const wallpaper =
    wallpaperTexture();

  wallpaper.repeat.set(
    3,
    1
  );


  const wallpaperMat =
    new THREE.MeshStandardMaterial({
      map:wallpaper,
      roughness:1,
      side:THREE.DoubleSide
    });


  const wood =
    new THREE.MeshStandardMaterial({
      map:woodTexture(),
      roughness:.94
    });


  const rooms =
    ROOM_CONFIGS
      .filter(r=>r.side===side)
      .sort((a,b)=>a.z-b.z);


  let cursor=0;


  rooms.forEach(room=>{

    const start =
      room.z-DOOR_HALF;

    if(start>cursor){

      createWallSegment(
        side,
        cursor,
        start,
        wallpaperMat
      );

      createWainscotSegment(
        side,
        cursor,
        start,
        wood
      );

    }

    cursor =
      room.z+
      DOOR_HALF;

  });


  if(cursor<HALL_LENGTH){

    createWallSegment(
      side,
      cursor,
      HALL_LENGTH,
      wallpaperMat
    );

    createWainscotSegment(
      side,
      cursor,
      HALL_LENGTH,
      wood
    );

  }


  rooms.forEach(room=>{

    addDoorCasing(
      side,
      room.z
    );

  });

}


/* ================================================================
   WALL SEGMENT
================================================================ */

function createWallSegment(
  side,
  start,
  end,
  material
){

  const len=end-start;

  if(len<=0)
    return;

  mesh(
    new THREE.BoxGeometry(
      .18,
      HALL_HEIGHT-1.0,
      len
    ),
    material,
    side*HALL_HALF,
    1+
    (HALL_HEIGHT-1)/2,
    start+len/2
  );

}


/* ================================================================
   WAINSCOT
================================================================ */

function createWainscotSegment(
  side,
  start,
  end,
  material
){

  const len=end-start;

  if(len<=0)
    return;


  mesh(
    new THREE.BoxGeometry(
      .22,
      1.08,
      len
    ),
    material,
    side*(HALL_HALF-.02),
    .54,
    start+len/2
  );


  for(
    let z=start+1.1;
    z<end-.3;
    z+=1.35
  ){

    mesh(
      new THREE.BoxGeometry(
        .035,
        .83,
        .05
      ),
      mat(0x684735,.82),
      side*(HALL_HALF-.14),
      .57,
      z
    );

  }

}


/* ================================================================
   DOOR CASING
================================================================ */

function addDoorCasing(
  side,
  z
){

  const brassWood =
    mat(
      0x765536,
      .65,
      .05
    );


  const x =
    side*(HALL_HALF+.055);


  mesh(
    new THREE.BoxGeometry(
      .18,
      2.75,
      .14
    ),
    brassWood,
    x,
    1.375,
    z-DOOR_HALF-.07
  );


  mesh(
    new THREE.BoxGeometry(
      .18,
      2.75,
      .14
    ),
    brassWood,
    x,
    1.375,
    z+DOOR_HALF+.07
  );


  mesh(
    new THREE.BoxGeometry(
      .18,
      .14,
      DOOR_HALF*2+.28

function roomWorldX(cfg){

  return cfg.side *
    (HALL_HALF+ROOM_W/2);

}


function buildRooms(){

  ROOM_CONFIGS.forEach(
    cfg=>createRoom(cfg)
  );

}


function createRoom(cfg){

  const g =
    new THREE.Group();

  g.position.set(
    roomWorldX(cfg),
    0,
    cfg.z
  );

  scene.add(g);


  /* floor */

  const floorColor =
    cfg.type==='playroom'
      ? 0x57534d
      : cfg.type==='farmhouse'
        ? 0x654936
        : cfg.type==='snowcottage'
          ? 0x504945
          : cfg.type==='night'
            ? 0x302f38
            : 0x211918;


  addTo(
    g,
    new THREE.PlaneGeometry(
      ROOM_W,
      ROOM_D
    ),
    mat(floorColor,.94),
    0,
    .01,
    0,
    -Math.PI/2
  );


  /* ceiling */

  addTo(
    g,
    new THREE.PlaneGeometry(
      ROOM_W,
      ROOM_D
    ),
    mat(0x292421,1),
    0,
    ROOM_HEIGHT,
    0,
    Math.PI/2
  );


  /*
     BACK WALL
  */

  addTo(
    g,
    new THREE.BoxGeometry(
      ROOM_W,
      ROOM_HEIGHT,
      .16
    ),
    mat(
      cfg.type==='playroom'
        ? 0xb6a797
        : cfg.type==='farmhouse'
          ? 0x705646
          : cfg.type==='snowcottage'
            ? 0x716b65
            : 0x302b32,
      .94
    ),
    0,
    ROOM_HEIGHT/2,
    ROOM_D/2
  );


  /*
     OUTER SIDE WALL
  */

  addTo(
    g,
    new THREE.BoxGeometry(
      .16,
      ROOM_HEIGHT,
      ROOM_D
    ),
    mat(
      cfg.type==='playroom'
        ? 0xb9aa98
        : cfg.type==='farmhouse'
          ? 0x765c4b
          : cfg.type==='snowcottage'
            ? 0x706b66
            : 0x302c33,
      .94
    ),
    cfg.side*ROOM_W/2,
    ROOM_HEIGHT/2,
    0
  );


  /*
     INNER SIDE WALL

     The wall is continuous because the doorway
     is on the x-facing end, not here.
  */

  addTo(
    g,
    new THREE.BoxGeometry(
      .16,
      ROOM_HEIGHT,
      ROOM_D
    ),
    mat(
      cfg.type==='playroom'
        ? 0xb9aa98
        : cfg.type==='farmhouse'
          ? 0x765c4b
          : cfg.type==='snowcottage'
            ? 0x706b66
            : 0x302c33,
      .94
    ),
    -cfg.side*ROOM_W/2,
    ROOM_HEIGHT/2,
    0
  );


  /*
     HALLWAY-FACING WALL

     IMPORTANT:
     It is built in three pieces, leaving
     a real doorway in the centre.
  */

  const frontColor =
    cfg.type==='playroom'
      ? 0xb6a797
      : cfg.type==='farmhouse'
        ? 0x705646
        : cfg.type==='snowcottage'
          ? 0x716b65
          : 0x302b32;


  const wallMat =
    mat(frontColor,.94);


  const sideWidth =
    ROOM_W/2-DOOR_HALF;


  /* left/right pieces along local Z */

  addTo(
    g,
    new THREE.BoxGeometry(
      .16,
      ROOM_HEIGHT,
      sideWidth
    ),
    wallMat,
    -cfg.side*ROOM_W/2,
    ROOM_HEIGHT/2,
    -(
      DOOR_HALF+
      sideWidth/2
    )
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      .16,
      ROOM_HEIGHT,
      sideWidth
    ),
    wallMat,
    -cfg.side*ROOM_W/2,
    ROOM_HEIGHT/2,
    DOOR_HALF+
    sideWidth/2
  );


  /* wall above doorway */

  addTo(
    g,
    new THREE.BoxGeometry(
      .16,
      ROOM_HEIGHT-2.65,
      DOOR_HALF*2
    ),
    wallMat,
    -cfg.side*ROOM_W/2,
    2.65+
    (ROOM_HEIGHT-2.65)/2,
    0
  );


  /* interior crown moulding */

  addTo(
    g,
    new THREE.BoxGeometry(
      ROOM_W,
      .13,
      .16
    ),
    mat(0x80654a,.7),
    0,
    ROOM_HEIGHT-.1,
    -ROOM_D/2+.12
  );


  /* light */

  const lightColor =
    cfg.type==='playroom'
      ? 0xffd1a0
      : cfg.type==='farmhouse'
        ? 0xffbd7d
        : cfg.type==='snowcottage'
          ? 0xffc68e
          : cfg.type==='night'
            ? 0xaabce4
            : 0xff846b;


  const light =
    new THREE.PointLight(
      lightColor,
      cfg.type==='eerie'
        ? .65
        : 1.15,
      14
    );

  light.position.set(
    0,
    3.35,
    0
  );

  light.castShadow=true;

  light.shadow.mapSize.width=512;
  light.shadow.mapSize.height=512;

  g.add(light);


  if(
    cfg.type==='farmhouse' ||
    cfg.type==='snowcottage'
  ){

    flickerLights.push({
      light,
      base:1.15,
      mode:'warm'
    });

  }


  if(cfg.type==='playroom')
    buildPlayroom(g,cfg);

  if(cfg.type==='farmhouse')
    buildFarmhouse(g,cfg);

  if(cfg.type==='snowcottage')
    buildSnowCottage(g,cfg);

  if(cfg.type==='night')
    buildNightRoom(g,cfg);

  if(cfg.type==='eerie')
    buildEerieRoom(g,cfg);

}


/* ================================================================
   PAINTING
================================================================ */

function placeholderArt(
  label,
  hue
){

  return canvasTexture(
    (ctx,w,h)=>{

      const gradient =
        ctx.createLinearGradient(
          0,0,w,h
        );

      gradient.addColorStop(
        0,
        `hsl(${hue},22%,25%)`
      );

      gradient.addColorStop(
        1,
        `hsl(${hue+24},18%,8%)`
      );

      ctx.fillStyle=gradient;
      ctx.fillRect(0,0,w,h);


      /* horizon */

      ctx.fillStyle=
        'rgba(12,16,18,.82)';

      ctx.fillRect(
        0,
        h*.57,
        w,
        h*.43
      );


      /* distant trees */

      for(let i=0;i<8;i++){

        const x=i*w/7;

        ctx.fillStyle=
          'rgba(10,14,15,.65)';

        ctx.beginPath();

        ctx.moveTo(
          x,
          h*.38
        );

        ctx.lineTo(
          x-45,
          h*.58
        );

        ctx.lineTo(
          x+45,
          h*.58
        );

        ctx.closePath();

        ctx.fill();

      }


      /* house */

      ctx.fillStyle=
        'rgba(9,11,12,.94)';

      ctx.fillRect(
        w*.40,
        h*.38,
        w*.21,
        h*.28
      );


      ctx.beginPath();

      ctx.moveTo(
        w*.34,
        h*.38
      );

      ctx.lineTo(
        w*.505,
        h*.23
      );

      ctx.lineTo(
        w*.67,
        h*.38
      );

      ctx.closePath();

      ctx.fill();


      /* warm window */

      ctx.fillStyle=
        'rgba(238,181,101,.8)';

      ctx.fillRect(
        w*.495,
        h*.45,
        w*.045,
        h*.07
      );


      ctx.strokeStyle=
        'rgba(210,184,145,.55)';

      ctx.lineWidth=9;

      ctx.strokeRect(
        10,
        10,
        w-20,
        h-20
      );


      ctx.fillStyle=
        'rgba(255,255,255,.7)';

      ctx.font='20px Georgia';
      ctx.textAlign='center';

      ctx.fillText(
        label,
        w/2,
        h-28
      );

    },
    512,
    384
  );

}


function createPainting(
  g,
  cfg
){

  const w=1.65;
  const h=1.12;


  const art =
    placeholderArt(
      cfg.label,
      cfg.hue||210
    );


  const paintingMat =
    new THREE.MeshStandardMaterial({
      map:art,
      roughness:.78
    });


  const frameMat =

      .62
    );


  /*
     Frame
  */

  addTo(
    g,
    new THREE.BoxGeometry(
      w+.22,
      h+.22,
      .12
    ),
    frameMat,
    cfg.x,
    cfg.y,
    cfg.z,
    0,
    cfg.ry
  );


  /*
     Slight inner dark border
  */

  addTo(
    g,
    new THREE.BoxGeometry(

      h+.04,
      .14
    ),
    mat(0x241914,.72),
    cfg.x,
    cfg.y,
    cfg.z,
    0,
    cfg.ry
  );


  const artMesh =
    addTo(

        .035
      ),
      paintingMat,
      cfg.x,
      cfg.y,

    );


  artMesh.userData=cfg;

  clickable.push(

  if(cfg.img){

    new THREE.TextureLoader()

        tex=>{
          paintingMat.map=tex;

        }
      );

}


/* ================================================================
   ROUND / SOFT OBJECT HELPER
================================================================ */

function roundedBox(
  g,
  x,y,z,
  sx,sy,sz,
  color,
  radius=.12
){

  /*
     Bevelled-looking furniture made from
     a central body plus rounded edge pieces.
     This avoids the harsh game-cube appearance.
  */

  const body =
    addTo(
      g,
      new THREE.BoxGeometry(
        sx-radius*1.2,
        sy,
        sz
      ),
      mat(color,.88),
      x,y,z
    );


  addTo(
    g,
    new THREE.BoxGeometry(
      sx,
      sy-radius*.8,
      sz
    ),
    mat(color,.88),
    x,
    y,
    z
  );


  return body;

}

function buildFireplace(
  g,

  */

  addTo(

  addTo(

      1.38,

  /*

  for(let row=0;row<3;row++){

    for(let col=0;col<5;col++){

      const stoneWidth =
        .48+
        Math.random()*.15;

      const stoneHeight =
        .28+

      const sx =
        x-
        1.42+

      const sy =
        .45+

      const sz =
        z-.32;


      addTo(
        g,
        new THREE.BoxGeometry(
          stoneWidth,
          stoneHeight,
          .07
        ),
        mat(
          [
            0x615650,
            0x71645d,
            0x554b46,
            0x685c56
          ][
            Math.floor(Math.random()*4)
          ],
          .98
        ),
        sx,
        sy,
        sz
      );

    }

  }


  /*
     Logs.
  */

  for(let i=0;i<3;i++){

    addTo(
      g,
      new THREE.CylinderGeometry(
        .12,
        .13,
        1.15,
        14
      ),
      mat(
        i===1
          ? 0x4a2b1b
          : 0x603a22,
        .96
      ),
      x-.18+i*.18,
      .38+
      i*.06,
      z-.42,
      0,
      0,
      i%2
        ? .12
        : -.12
    );

  }


  /*
     Ember bed.
  */

  const emberMat =
    new THREE.MeshStandardMaterial({
      color:0x641e12,
      emissive:0xa82b10,
      emissiveIntensity:.9,
      roughness:1
    });


  addTo(
    g,
    new THREE.SphereGeometry(
      .35,
      16,
      8
    ),
    emberMat,
    x,
    .45,
    z-.5
  );


  /*
     Flame layers.
  */

  const flames=[];


  for(let i=0;i<7;i++){

    const flame =
      addTo(
        g,
        new THREE.SphereGeometry(
          .16+
          Math.random()*.1,
          16,
          12
        ),
        new THREE.MeshBasicMaterial({
          color:
            i%3===0
              ? 0xffc13b
              : i%2
                ? 0xff7926
                : 0xffa52d,
          transparent:true,
          opacity:.55+
            Math.random()*.18
        }),
        x-.48+
        Math.random()*.96,
        .63+
        Math.random()*.3,
        z-.52
      );


    flame.scale.set(
      .65+
      Math.random()*.4,
      1.5+
      Math.random()*.8,
      .55+
      Math.random()*.3
    );


    flames.push(flame);

  }


  animatedObjects.push({
    type:'fire',
    flames
  });


  const fireLight =
    new THREE.PointLight(
      0xff6f2b,
      2.2,
      6.5
    );

  fireLight.position.set(
    x,
    1.0,
    z-.8
  );

  fireLight.castShadow=true;

  g.add(fireLight);


  flickerLights.push({
    light:fireLight,
    base:2.2,
    mode:'fire'
  });

}


/* ================================================================
   SNOW WINDOW
================================================================ */

function buildSnowWindow(
  g,
  x,
  y,
  z,
  w,
  h
){

  const frame =
    mat(0x49382d,.74);


  /*
     Exterior landscape.
  */

  const outsideTex =
    canvasTexture(
      (ctx,W,H)=>{

        const grd =
          ctx.createLinearGradient(
            0,0,0,H
          );

        grd.addColorStop(
          0,
          '#1e3044'
        );

        grd.addColorStop(
          .58,
          '#61778a'
        );

        grd.addColorStop(
          1,
          '#dce3e7'
        );

        ctx.fillStyle=grd;
        ctx.fillRect(0,0,W,H);


        /*
           Distant snowy hills.
        */

        ctx.fillStyle='#dfe5e8';

        ctx.beginPath();

        ctx.moveTo(0,H*.68);

        for(let i=0;i<=10;i++){

          ctx.lineTo(
            i*W/10,
            H*.58+
            Math.sin(i*1.7)*H*.07
          );

        }

        ctx.lineTo(W,H);
        ctx.lineTo(0,H);

        ctx.closePath();

        ctx.fill();


        /*
           Pine trees.
        */

        for(let i=0;i<13;i++){

          const tx =
            i*W/12+
            (Math.random()-.5)*35;

          const base =
            H*.73+
            Math.random()*H*.16;

          const treeH =
            H*.28+
            Math.random()*H*.22;

          ctx.fillStyle=
            'rgba(26,43,48,.82)';

          ctx.beginPath();

          ctx.moveTo(
            tx,
            base-treeH
          );

          ctx.lineTo(
            tx-38,
            base
          );

          ctx.lineTo(
            tx+38,
            base
          );

          ctx.closePath();

          ctx.fill();

        }


        /*
           Snow-covered ground.
        */

        ctx.fillStyle='#edf1f2';

        ctx.fillRect(
          0,
          H*.78,
          W,
          H*.22
        );


        /*
           Tiny distant farmhouse lights.
        */

        for(let i=0;i<4;i++){

          ctx.fillStyle=
            '#d4a15e';

          ctx.fillRect(
            45+i*105,
            H*.68,
            24,
            17
          );

        }

      },
      512,
      320
    );


  const glassMat =
    new THREE.MeshBasicMaterial({
      map:outsideTex
    });


  addTo(
    g,
    new THREE.BoxGeometry(
      w,
      h,
      .045
    ),
    glassMat,
    x,y,z
  );


  /*
     Frosted inner glass layer.
  */

  addTo(
    g,
    new THREE.PlaneGeometry(
      w-.12,
      h-.12
    ),
    new THREE.MeshBasicMaterial({
      color:0xcfd9dd,
      transparent:true,
      opacity:.10
    }),
    x,
    y,
    z-.04
  );


  /*
     Frame.
  */

  addTo(
    g,
    new THREE.BoxGeometry(
      .13,
      h+.18,
      .18
    ),
    frame,
    x-w/2,
    y,
    z-.07
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      .13,
      h+.18,
      .18
    ),
    frame,
    x+w/2,
    y,
    z-.07
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      w+.18,
      .13,
      .18
    ),
    frame,
    x,
    y+h/2,
    z-.07
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      w+.18,
      .13,
      .18
    ),
    frame,
    x,
    y-h/2,
    z-.07
  );


  /* cross mullion */

  addTo(
    g,
    new THREE.BoxGeometry(
      .08,
      h,
      .19
    ),
    frame,
    x,
    y,
    z-.08
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      w,
      .08,
      .19
    ),
    frame,
    x,
    y,
    z-.08
  );


  /*
     Snow piled against sill.
  */

  addTo(
    g,
    new THREE.SphereGeometry(
      .48,
      20,
      10
    ),
    mat(0xe5eaec,.99),
    x-.35,
    y-h/2-.05,
    z-.12
  );


  /*
     Curtains.
  */

  const curtainMat =
    mat(0x685b52,.96);


  addTo(
    g,
    new THREE.PlaneGeometry(
      .55,
      h+.1
    ),
    curtainMat,
    x-w/2+.25,
    y,
    z-.16
  );


  addTo(
    g,
    new THREE.PlaneGeometry(
      .55,
      h+.1
    ),
    curtainMat,
    x+w/2-.25,
    y,
    z-.16
  );

}

function buildRainWindow(
  g,x,y,z,w,h
){

  const tex =
    canvasTexture(
      (ctx,W,H)=>{

        const grd =
          ctx.createLinearGradient(
            0,0,0,H
          );

        grd.addColorStop(
          0,
          '#101923'
        );

        grd.addColorStop(
          1,
          '#3a4750'
        );

        ctx.fillStyle=grd;
        ctx.fillRect(0,0,W,H);


        /*
           Wet street.
        */

        ctx.fillStyle='#111518';

        ctx.fillRect(
          0,
          H*.7,
          W,
          H*.3
        );


        /*
           distant house lights.
        */

        for(let i=0;i<7;i++){

          ctx.fillStyle=
            'rgba(218,163,88,.62)';

          ctx.fillRect(
            25+i*75,
            H*.58+
            Math.random()*25,
            15,
            10
          );

        }

      },
      512,
      320
    );


  addTo(
    g,
    new THREE.BoxGeometry(
      w,
      h,
      .05
    ),
    new THREE.MeshBasicMaterial({
      map:tex
    }),
    x,y,z
  );


  const frame =
    mat(0x45362e,.72);


  addTo(
    g,
    new THREE.BoxGeometry(
      .14,
      h+.18,
      .18
    ),
    frame,
    x-w/2,
    y,
    z-.06
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      .14,
      h+.18,
      .18
    ),
    frame,
    x+w/2,
    y,
    z-.06
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      w+.18,
      .14,
      .18
    ),
    frame,
    x,
    y+h/2,
    z-.06
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      w+.18,
      .14,
      .18
    ),
    frame,
    x,
    y-h/2,
    z-.06
  );


  /* rain particles */

  const count=120;

  const positions =
    new Float32Array(
      count*3
    );

  for(let i=0;i<count;i++){

    positions[i*3]=
      x-w/2+
      Math.random()*w;

    positions[i*3+1]=
      y-h/2+
      Math.random()*h;

    positions[i*3+2]=
      z-.10;

  }


  const geo =
    new THREE.BufferGeometry();

  geo.setAttribute(
    'position',
    new THREE.BufferAttribute(
      positions,
      3
    )
  );


  const particles =
    new THREE.Points(
      geo,
      new THREE.PointsMaterial({
        color:0xb7c5d0,
        size:.018,
        transparent:true,
        opacity:.55
      })
    );


  g.add(particles);

  snowSystems.push({
    type:'rain',
    particles,
    speed:.12
  });

}

================================================================ */

function buildHallwayDecor(){

  /*
     Antique runner.
  */

  const carpetTex =
    carpetTexture();

  carpetTex.repeat.set(
    1,
    1
  );


  mesh(
    new THREE.PlaneGeometry(
      1.65,
      HALL_LENGTH-1
    ),
    new THREE.MeshStandardMaterial({
      map:carpetTex,
      roughness:1
    }),
    0,
    .025,
    HALL_LENGTH/2,
    -Math.PI/2
  );


  /*
     Wall lamps.
  */

  for(
    let z=6;
    z<HALL_LENGTH-3;
    z+=8
  ){

    const leftDoor =
      ROOM_CONFIGS.some(
        r=>
          r.side===-1 &&
          Math.abs(r.z-z)<2.0
      );


    const rightDoor =
      ROOM_CONFIGS.some(
        r=>
          r.side===1 &&
          Math.abs(r.z-z)<2.0
      );


    if(!leftDoor)
      buildSconce(
        -1.88,
        2.55,
        z
      );


    if(!rightDoor)
      buildSconce(
        1.88,
        2.55,
        z+3.6
      );

  }


  /*
     Framed paintings opposite doors.
  */

  for(let z=7;z<HALL_LENGTH-4;z+=8.8){

    if(
      ROOM_CONFIGS.some(
        r=>Math.abs(r.z-z)<2.1
      )
    )
      continue;


    buildHallPortrait(
      -1.91,
      2.45,
      z,
      z
    );

  }


  for(let z=11.3;z<HALL_LENGTH-4;z+=8.8){

    if(
      ROOM_CONFIGS.some(
        r=>Math.abs(r.z-z)<2.1
      )
    )
      continue;


    buildHallPortrait(
      1.91,
      2.45,
      z,
      z+1
    );

  }


  /*
     Small console near rear.
  */

  buildConsole(
    1.67,
    109
  );

}

/* ================================================================
   COLLISION
================================================================ */

function roomBounds(r){

  const cx =
    roomWorldX(r);


  return {
    minX:
      cx-ROOM_W/2+
      PLAYER_RADIUS,

    maxX:
      cx+ROOM_W/2-
      PLAYER_RADIUS,

    minZ:
      r.z-ROOM_D/2+
      PLAYER_RADIUS,

    maxZ:
      r.z+ROOM_D/2-
      PLAYER_RADIUS
  };

}


function pointInRoom(
  x,z
){

  for(const r of ROOM_CONFIGS){

    const b =
      roomBounds(r);

    if(
      x>b.minX &&
      x<b.maxX &&
      z>b.minZ &&
      z<b.maxZ
    ){

      return r;

    }

  }

  return null;

}


function resolvePlayer(
  nextX,
  nextZ
){

  nextZ =
    Math.max(
      PLAYER_RADIUS,
      Math.min(
        HALL_LENGTH-PLAYER_RADIUS,
        nextZ
      )
    );


  const current =
    pointInRoom(
      camera.position.x,
      camera.position.z
    );


  /*
     -------------------------------------------------------------
     PLAYER IS CURRENTLY INSIDE A ROOM
     -------------------------------------------------------------
  */

  if(current){

    const b =
      roomBounds(current);


    let x=nextX;
    let z=nextZ;


    z =
      Math.max(
        b.minZ,
        Math.min(
          b.maxZ,
          z
        )
      );


    const innerBoundary =
      current.side<0
        ? b.maxX
        : b.minX;


    /*
       Moving through doorway toward hallway.
    */

    if(current.side<0){

      if(x>innerBoundary){

        if(
          Math.abs(z-current.z)
          >
          DOOR_HALF-
          .08
        ){

          x=innerBoundary;

        }

      }

    }else{

      if(x<innerBoundary){

        if(
          Math.abs(z-current.z)
          >
          DOOR_HALF-
          .08
        ){

          x=innerBoundary;

        }

      }

    }


    /*
       Outer wall.
    */

    x =
      Math.max(
        b.minX,
        Math.min(
          b.maxX,
          x
        )
      );


    /*
       If the proposed position crossed into hallway,
       allow it only at the doorway.
    */

    if(current.side<0){

      if(
        nextX>innerBoundary &&
        Math.abs(z-current.z)<=DOOR_HALF
      ){

        x =
          Math.min(
            nextX,
            HALL_HALF-PLAYER_RADIUS
          );

      }

    }else{

      if(
        nextX<innerBoundary &&
        Math.abs(z-current.z)<=DOOR_HALF
      ){

        x =
          Math.max(
            nextX,
            -HALL_HALF+PLAYER_RADIUS
          );

      }

    }


    return {x,z};

  }


  /*
     -------------------------------------------------------------
     PLAYER IS IN HALLWAY
     -------------------------------------------------------------
  */

  let x=nextX;
  const z=nextZ;


  const hallMin =
    -HALL_HALF+
    PLAYER_RADIUS;

  const hallMax =
    HALL_HALF-
    PLAYER_RADIUS;


  /*
     left boundary
  */

  if(x<hallMin){

    const doorway =
      ROOM_CONFIGS.some(
        r=>
          r.side===-1 &&
          Math.abs(
            r.z-z
          )<=DOOR_HALF
      );


    if(!doorway)
      x=hallMin;

  }


  /*
     right boundary
  */

  if(x>hallMax){

    const doorway =
      ROOM_CONFIGS.some(
        r=>
          r.side===1 &&
          Math.abs(
            r.z-z
          )<=DOOR_HALF
      );


    if(!doorway)
      x=hallMax;

  }


  /*
     If we entered a room this frame,
     keep us inside its actual boundaries.
  */

  for(const r of ROOM_CONFIGS){

    const b =
      roomBounds(r);


    if(
      z>b.minZ &&
      z<b.maxZ
    ){

      if(
        r.side===-1 &&
        x<b.maxX &&
        x< -HALL_HALF
      ){

        x =
          Math.max(
            b.minX,
            Math.min(
              b.maxX,
              x
            )
          );

      }


      if(
        r.side===1 &&
        x>b.minX &&
        x>HALL_HALF
      ){

        x =
          Math.max(
            b.minX,
            Math.min(
              b.maxX,
              x
            )
          );

      }

    }

  }


  return {
    x,
    z
  };

}


/* ================================================================
   CONTROLS
================================================================ */

function setupControls(){

  document.addEventListener(
    'keydown',
    e=>{
      keys[e.code]=true;
    }
  );


  document.addEventListener(
    'keyup',
    e=>{
      keys[e.code]=false;
    }
  );


  dom.addEventListener(
    'click',
    ()=>{

      if(
        gameStarted &&
        document.pointerLockElement!==dom
      ){

        dom.requestPointerLock();

      }

    }
  );


  document.addEventListener(
    'mousemove',
    e=>{

      if(
        document.pointerLockElement!==dom
      )
        return;


      yaw -=
        e.movementX*.0022;

      pitch -=
        e.movementY*.0022;


      pitch =
        Math.max(
          -1.2,
          Math.min(
            1.2,
            pitch
          )
        );

    }
  );


  dom.addEventListener(
    'mousedown',
    ()=>{

      if(
        !gameStarted ||
        document.pointerLockElement!==dom
      )
        return;


      const ray =
        new THREE.Raycaster();


      ray.setFromCamera(
        {
          x:0,
          y:0
        },
        camera
      );


      const hits =
        ray.intersectObjects(
          clickable
        );


      if(hits.length){

        openNote(
          hits[0].object.userData
        );

      }

    }
  );

}


/* ================================================================
   MOVEMENT
================================================================ */

function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    'YXZ'
  );


  const speed =
    3.0*dt;


  const fwd =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );


  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  const movement =
    new THREE.Vector3();


  if(keys['KeyW'])
    movement.add(fwd);

  if(keys['KeyS'])
    movement.sub(fwd);

  if(keys['KeyD'])
    movement.add(right);

  if(keys['KeyA'])
    movement.sub(right);


  if(movement.length()>0){

    movement.normalize();

    movement.multiplyScalar(
      speed
    );


    const result =
      resolvePlayer(
        camera.position.x+
        movement.x,
        camera.position.z+
        movement.z
      );


    camera.position.x=
      result.x;

    camera.position.z=
      result.z;

  }


  updateRoomLabel();

}


/* ================================================================
   ROOM LABEL
================================================================ */

function updateRoomLabel(){

  const lbl =
    $('roomLabel');


  const room =
    pointInRoom(
      camera.position.x,
      camera.position.z
    );


  if(room){

    lbl.style.opacity=1;
    lbl.textContent=room.tag;
    return;

  }


  const nearest =
    ROOM_CONFIGS.reduce(
      (a,r)=>
        Math.abs(
          r.z-camera.position.z
        )
        <
        Math.abs(
          a.z-camera.position.z
        )
          ?r
          :a,
      ROOM_CONFIGS[0]
    );


  if(
    Math.abs(
      nearest.z-camera.position.z
    )<4
  ){

    lbl.style.opacity=1;
    lbl.textContent=nearest.tag;

  }else{

    lbl.style.opacity=0;

  }

}


/* ================================================================
   ENVIRONMENT ANIMATION
================================================================ */

function animateEnvironment(t){

  flickerLights.forEach(
    f=>{

      if(f.mode==='fire'){

        f.light.intensity =
          f.base*
          (
            .78+
            Math.random()*.30+
            Math.sin(t*8)*.07
          );

      }


      else if(f.mode==='warm'){

        f.light.intensity =
          f.base*
          (
            .95+
            Math.sin(t*1.6)*.025+
            Math.random()*.025
          );

      }


      else if(f.mode==='lamp'){

        f.light.intensity =
          f.base*
          (
            .98+
            Math.sin(t*1.1)*.025
          );

      }


      else if(f.mode==='sconce'){

        f.light.intensity =
          f.base*
          (
            .97+
            Math.sin(
              t*.65+
              f.light.position.z
            )*.018
          );

      }


      else if(f.mode==='uneasy'){

        f.light.intensity =
          f.base*
          (
            .78+
            Math.random()*.24
          );

      }

    }
  );


  /*
     Balloons.
  */

  animatedObjects.forEach(
    o=>{

      if(o.object){

        o.object.rotation.z =
          Math.sin(
            t*o.speed+
            o.baseRot
          )*.025;

        o.object.rotation.x =
          Math.cos(
            t*o.speed*.75+
            o.baseRot
          )*.018;

      }


      /*
         Fireplace.
      */

      if(o.type==='fire'){

        o.flames.forEach(
          (flame,i)=>{

            flame.scale.y =
              1.3+
              Math.sin(
                t*(5.5+i*.7)+i
              )*.28+
              Math.random()*.14;


            flame.scale.x =
              .65+
              Math.sin(
                t*(4+i*.4)
              )*.12;


            flame.position.x +=
              Math.sin(
                t*2.7+i
              )*.0005;

          }
        );

      }

    }
  );


  /*
     Rain.
  */

  snowSystems.forEach(
    system=>{

      if(system.type!=='rain')
        return;


      const positions =
        system.particles.geometry
          .attributes.position;


      for(
        let i=0;
        i<positions.count;
        i++
      ){

        positions.array[
          i*3+1
        ] -=
          .012;


        if(
          positions.array[i*3+1]
          <
          1.35
        ){

          positions.array[
            i*3+1
          ] =
            3.5;

        }

      }


      positions.needsUpdate=true;

    }
  );

}


/* ================================================================
   RENDER LOOP
================================================================ */

const clock =
  new THREE.Clock();


function loop(){

  requestAnimationFrame(
    loop
  );


  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );


  if(gameStarted)
    updateMovement(dt);


  animateEnvironment(
    clock.elapsedTime
  );


  renderer.render(
    scene,
    camera
  );

}
