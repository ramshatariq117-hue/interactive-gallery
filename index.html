<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
  :root{ --neon:#5ef2ff; --paper:#e8dcc0; }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:'Georgia',serif;
  }

  #app{
    position:relative;
    width:100%;
    height:100%;
  }

  canvas{ display:block; }

  #welcome{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 40%,#0a0a14 0%,#000 80%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:50;
    color:#cbd6e6;
  }

  #welcome h1{
    font-size:2.2em;
    letter-spacing:2px;
    color:var(--neon);
    text-shadow:0 0 12px var(--neon),0 0 30px var(--neon);
    margin-bottom:8px;
  }

  #welcome p{
    opacity:.7;
    margin-bottom:22px;
  }

  #nameInput{
    padding:12px 16px;
    font-size:1.1em;
    border-radius:6px;
    border:1px solid #345;
    background:#0e1420;
    color:#e8f0ff;
    width:280px;
    text-align:center;
    margin-bottom:16px;
  }

  #enterBtn{
    padding:12px 28px;
    font-size:1.05em;
    letter-spacing:1px;
    cursor:pointer;
    border-radius:6px;
    border:1px solid var(--neon);
    background:transparent;
    color:var(--neon);
    text-shadow:0 0 8px var(--neon);
    transition:all .25s;
  }

  #enterBtn:hover{
    background:var(--neon);
    color:#001;
    box-shadow:0 0 20px var(--neon);
  }

  #welcomeMsg{
    font-size:1.3em;
    color:#fff;
    text-align:center;
    max-width:520px;
    line-height:1.5;
  }

  #crosshair{
    position:absolute;
    top:50%;
    left:50%;
    width:6px;
    height:6px;
    margin:-3px 0 0 -3px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    z-index:20;
    pointer-events:none;
  }

  #hint{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    color:#d5c8bd;
    font-size:.85em;
    background:rgba(25,10,8,.62);
    padding:7px 15px;
    border-radius:20px;
    z-index:20;
    pointer-events:none;
    border:1px solid rgba(220,170,130,.18);
  }

  #muteBtn{
    position:absolute;
    top:16px;
    right:16px;
    z-index:30;
    background:rgba(25,10,8,.62);
    color:#eadbd2;
    border:1px solid #76544a;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    font-size:.9em;
  }

  #roomLabel{
    position:absolute;
    top:16px;
    left:16px;
    z-index:20;
    color:var(--neon);
    text-shadow:0 0 8px var(--neon);
    font-size:1em;
    letter-spacing:2px;
    opacity:0;
    transition:opacity .6s;
  }

  .modalOverlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(2px);
  }

  .note{
    width:340px;
    max-width:80vw;
    background:var(--paper);
    color:#3a2f22;
    padding:26px 24px;
    border-radius:2px;
    box-shadow:0 0 40px rgba(0,0,0,.7),inset 0 0 40px rgba(120,90,50,.25);
    transform:rotate(-1.2deg);
    font-family:'Georgia',serif;
    position:relative;
  }

  .note::before{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      0deg,
      transparent,
      transparent 24px,
      rgba(0,0,0,.03) 25px
    );
    pointer-events:none;
  }

  .note h3{
    font-size:1.15em;
    margin-bottom:10px;
    border-bottom:1px solid rgba(0,0,0,.2);
    padding-bottom:6px;
  }

  .note p{
    line-height:1.5;
    font-size:.95em;
  }

  .note button{
    margin-top:16px;
    padding:8px 16px;
    border:1px solid #3a2f22;
    background:transparent;
    cursor:pointer;
    color:#3a2f22;
  }

  .win{
    background:#111;
    color:#ffd27a;
    border:2px solid #ffd27a;
    box-shadow:0 0 40px #ffb84a;
    transform:rotate(0);
    text-align:center;
  }

  .win h3{
    color:#ffd27a;
    border-color:#553;
  }

  .win button{
    border-color:#ffd27a;
    color:#ffd27a;
  }

  #loading{
    position:absolute;
    inset:0;
    background:#000;
    color:#5ef2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    font-size:1.1em;
    letter-spacing:2px;
  }
</style>
</head>

<body>

<div id="app">

  <div id="loading">LOADING GALLERY…</div>

  <div id="welcome">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of cozy &amp; eerie things</p>

    <div id="stepEnterName">
      <input id="nameInput" placeholder="Enter your name" maxlength="20">
      <br>
      <button id="enterBtn">ENTER GALLERY</button>
    </div>

    <div id="welcomeMsg" style="display:none;"></div>
  </div>

  <div id="roomLabel"></div>
  <div id="crosshair" style="display:none;"></div>
  <div id="hint" style="display:none;">WASD to move · mouse to look · click a painting</div>
  <button id="muteBtn" style="display:none;">🔊 Sound</button>

  <div class="modalOverlay" id="noteOverlay">
    <div class="note" id="noteBox">
      <h3 id="noteTitle">Untitled</h3>
      <p id="noteBody">...</p>
      <button id="noteClose">close</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   BASIC UI
============================================================ */

const $ = id => document.getElementById(id);

let gameStarted = false;
let galleryReady = false;
let dom = null;

function showFatalError(msg){
  const lbl = $('roomLabel');
  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';
  lbl.textContent = '⚠ ' + msg;
  console.error(msg);
}

$('enterBtn').onclick = () => {

  const name = $('nameInput').value.trim() || 'friend';

  $('stepEnterName').style.display = 'none';

  const wm = $('welcomeMsg');
  wm.style.display = 'block';
  wm.textContent =
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn('Audio failed to start:',e);
  }

  setTimeout(() => {

    $('welcome').style.display = 'none';
    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';

    gameStarted = true;

    if(!galleryReady){
      showFatalError(
        '3D engine did not start — open the browser console (F12) for details.'
      );
    }else if(dom){
      dom.requestPointerLock();
    }

  },2200);
};

$('muteBtn').onclick = () => {

  muted = !muted;

  if(master){
    master.gain.value = muted ? 0 : 0.25;
  }

  $('muteBtn').textContent =
    muted ? '🔇 Sound' : '🔊 Sound';
};

$('noteClose').onclick = () => {
  $('noteOverlay').style.display = 'none';
};

function openNote(d){

  if(dom){
    document.exitPointerLock();
  }

  const box = $('noteBox');

  box.classList.toggle('win',!!d.winner);

  $('noteTitle').textContent =
    d.winner ? '🎉 You found a free print!' : d.label;

  $('noteBody').textContent = d.story;

  $('noteOverlay').style.display = 'flex';
}


/* ============================================================
   AUDIO
============================================================ */

let audioCtx,
    master,
    noiseSrc,
    droneOsc,
    muted = false,
    footstepTimer = 0;

function footstepTick(dt){

  if(!audioCtx || muted) return;

  footstepTimer -= dt;

  if(footstepTimer > 0) return;

  footstepTimer = .38;

  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();

  o.type = 'triangle';
  o.frequency.value = 90 + Math.random()*25;

  g.gain.value = 0;

  o.connect(g).connect(master);

  const now = audioCtx.currentTime;

  g.gain.linearRampToValueAtTime(
    .035,
    now + .015
  );

  g.gain.exponentialRampToValueAtTime(
    .001,
    now + .09
  );

  o.start(now);
  o.stop(now + .1);
}

function startAudio(){

  if(audioCtx) return;

  audioCtx =
    new (window.AudioContext || window.webkitAudioContext)();

  master = audioCtx.createGain();

  master.gain.value = 0.25;

  master.connect(audioCtx.destination);

  droneOsc = audioCtx.createOscillator();

  droneOsc.type = 'sine';
  droneOsc.frequency.value = 55;

  const droneGain = audioCtx.createGain();

  droneGain.gain.value = .15;

  droneOsc
    .connect(droneGain)
    .connect(master);

  droneOsc.start();

  const bufSize =
    2 * audioCtx.sampleRate;

  const buf =
    audioCtx.createBuffer(
      1,
      bufSize,
      audioCtx.sampleRate
    );

  const data =
    buf.getChannelData(0);

  for(let i=0;i<bufSize;i++){
    data[i] = Math.random()*2-1;
  }

  noiseSrc =
    audioCtx.createBufferSource();

  noiseSrc.buffer = buf;
  noiseSrc.loop = true;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type = 'lowpass';
  filter.frequency.value = 500;

  const noiseGain =
    audioCtx.createGain();

  noiseGain.gain.value = .035;

  noiseSrc
    .connect(filter)
    .connect(noiseGain)
    .connect(master);

  noiseSrc.start();

  setInterval(() => {

    if(muted || !gameStarted || !galleryReady)
      return;

    const near = currentRoom();

    const o =
      audioCtx.createOscillator();

    const g =
      audioCtx.createGain();

    const spooky =
      near && near.tag === 'LOBBY 5';

    o.type =
      spooky ? 'sawtooth' : 'sine';

    o.frequency.value =
      spooky
        ? 120 + Math.random()*200
        : 300 + Math.random()*200;

    g.gain.value = 0;

    o.connect(g).connect(master);

    o.start();

    g.gain.linearRampToValueAtTime(
      spooky ? .06 : .025,
      audioCtx.currentTime + .3
    );

    g.gain.linearRampToValueAtTime(
      0,
      audioCtx.currentTime + 1.4
    );

    o.stop(
      audioCtx.currentTime + 1.5
    );

  },5000);
}

function currentRoom(){

  if(!window._rooms || !window._camera)
    return null;

  return window._rooms.reduce(
    (a,r) =>
      Math.abs(r.z-window._camera.position.z)
      <
      Math.abs(a.z-window._camera.position.z)
        ? r
        : a,
    window._rooms[0]
  );
}


/* ============================================================
   THREE.JS SETUP
============================================================ */

let scene,
    camera,
    renderer,
    clock;

try{

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x050407);

  scene.fog =
    new THREE.FogExp2(
      0x070608,
      .012
    );

  camera =
    new THREE.PerspectiveCamera(
      72,
      innerWidth / innerHeight,
      .1,
      220
    );

  camera.position.set(
    0,
    1.7,
    5
  );

  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

  renderer.outputEncoding =
    THREE.sRGBEncoding;

  document
    .getElementById('app')
    .prepend(renderer.domElement);

  dom = renderer.domElement;

  $('loading').style.display = 'none';

  clock = new THREE.Clock();

  galleryReady = true;

}catch(err){

  console.error(err);

  showFatalError(
    '3D engine failed to initialise.'
  );
}


/* ============================================================
   LIGHTING
============================================================ */

const ambient =
  new THREE.AmbientLight(
    0x352b2a,
    1.15
  );

scene.add(ambient);


/* ============================================================
   MATERIAL / GEOMETRY HELPERS
============================================================ */

function M(color,opts={}){

  return new THREE.MeshStandardMaterial({
    color:color,
    roughness:
      opts.roughness !== undefined
        ? opts.roughness
        : .82,
    metalness:
      opts.metalness !== undefined
        ? opts.metalness
        : 0,
    emissive:
      opts.emissive !== undefined
        ? opts.emissive
        : 0x000000,
    emissiveIntensity:
      opts.emissiveIntensity !== undefined
        ? opts.emissiveIntensity
        : 0,
    transparent:
      opts.transparent || false,
    opacity:
      opts.opacity !== undefined
        ? opts.opacity
        : 1,
    side:
      opts.side !== undefined
        ? opts.side
        : THREE.FrontSide
  });

}

function addMesh(
  parent,
  geometry,
  material,
  x=0,
  y=0,
  z=0,
  rx=0,
  ry=0,
  rz=0
){

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,y,z
  );

  mesh.rotation.set(
    rx,ry,rz
  );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  parent.add(mesh);

  return mesh;
}

function box(
  parent,
  w,h,d,
  color,
  x,y,z,
  ry=0,
  opts={}
){

  return addMesh(
    parent,
    new THREE.BoxGeometry(
      w,h,d
    ),
    M(color,opts),
    x,y,z,
    0,ry,0
  );
}

function sphere(
  parent,
  radius,
  color,
  x,y,z,
  scale=[1,1,1],
  opts={}
){

  const m =
    addMesh(
      parent,
      new THREE.SphereGeometry(
        radius,
        18,
        12
      ),
      M(color,opts),
      x,y,z
    );

  m.scale.set(
    scale[0],
    scale[1],
    scale[2]
  );

  return m;
}

function cyl(
  parent,
  r1,r2,h,
  color,
  x,y,z,
  segments=16,
  ry=0,
  opts={}
){

  return addMesh(
    parent,
    new THREE.CylinderGeometry(
      r1,r2,h,segments
    ),
    M(color,opts),
    x,y,z,
    0,ry,0
  );
}

function torus(
  parent,
  radius,
  tube,
  color,
  x,y,z,
  rx=0,
  ry=0,
  rz=0,
  opts={}
){

  return addMesh(
    parent,
    new THREE.TorusGeometry(
      radius,
      tube,
      10,
      24
    ),
    M(color,opts),
    x,y,z,
    rx,ry,rz
  );
}

function tubeBetween(
  parent,
  a,
  b,
  radius,
  color,
  opts={}
){

  const dir =
    new THREE.Vector3()
      .subVectors(b,a);

  const len = dir.length();

  const mesh =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        len,
        8
      ),
      M(color,opts)
    );

  mesh.position
    .copy(a)
    .add(b)
    .multiplyScalar(.5);

  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    dir.normalize()
  );

  mesh.castShadow = true;

  parent.add(mesh);

  return mesh;
}


/* ============================================================
   CANVAS TEXTURES
============================================================ */

function canvasTexture(draw,w=512,h=384){

  const c =
    document.createElement('canvas');

  c.width = w;
  c.height = h;

  const ctx =
    c.getContext('2d');

  draw(ctx,w,h);

  const texture =
    new THREE.CanvasTexture(c);

  texture.wrapS =
    THREE.ClampToEdgeWrapping;

  texture.wrapT =
    THREE.ClampToEdgeWrapping;

  texture.encoding =
    THREE.sRGBEncoding;

  return texture;
}

function placeholderArt(label,hue=210){

  return canvasTexture(
    (ctx,w,h) => {

      const grad =
        ctx.createLinearGradient(
          0,0,w,h
        );

      grad.addColorStop(
        0,
        `hsl(${hue},30%,24%)`
      );

      grad.addColorStop(
        .55,
        `hsl(${hue},22%,10%)`
      );

      grad.addColorStop(
        1,
        '#050508'
      );

      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,h);

      ctx.fillStyle =
        `hsla(${hue},70%,75%,.15)`;

      ctx.beginPath();
      ctx.arc(
        w*.68,
        h*.30,
        h*.16,
        0,
        Math.PI*2
      );
      ctx.fill();

      ctx.strokeStyle =
        `hsla(${hue},60%,80%,.22)`;

      ctx.lineWidth = 4;

      ctx.beginPath();
      ctx.moveTo(
        w*.08,
        h*.72
      );
      ctx.quadraticCurveTo(
        w*.42,
        h*.50,
        w*.92,
        h*.76
      );
      ctx.stroke();

      ctx.fillStyle =
        'rgba(255,255,255,.82)';

      ctx.font =
        'bold 27px Georgia';

      ctx.textAlign = 'center';

      ctx.fillText(
        label,
        w/2,
        h*.88
      );

    },
    640,
    450
  );
}

function neonSignTexture(text,color){

  return canvasTexture(
    (ctx,w,h) => {

      ctx.fillStyle='#120c0b';
      ctx.fillRect(0,0,w,h);

      ctx.strokeStyle=color;
      ctx.lineWidth=8;
      ctx.strokeRect(
        14,14,w-28,h-28
      );

      ctx.shadowColor=color;
      ctx.shadowBlur=22;

      ctx.fillStyle=color;

      ctx.font=
        'bold 55px Georgia';

      ctx.textAlign='center';
      ctx.textBaseline='middle';

      ctx.fillText(
        text,
        w/2,
        h/2
      );

      ctx.shadowBlur=0;
    },
    700,
    180
  );
}

function woodTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle='#351d16';
      ctx.fillRect(0,0,w,h);

      for(let y=0;y<h;y+=34){

        ctx.fillStyle =
          y%68===0
            ? '#4b291f'
            : '#291612';

        ctx.fillRect(
          0,y,w,26
        );

        ctx.strokeStyle=
          'rgba(180,105,65,.13)';

        ctx.beginPath();
        ctx.moveTo(0,y+10);
        ctx.bezierCurveTo(
          w*.3,y+3,
          w*.65,y+20,
          w,y+7
        );
        ctx.stroke();
      }

    },
    512,
    512
  );
}

function wallpaperTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle='#4a171b';
      ctx.fillRect(0,0,w,h);

      for(let x=15;x<w;x+=46){

        ctx.strokeStyle=
          'rgba(210,125,115,.16)';

        ctx.lineWidth=2;

        ctx.beginPath();

        for(let y=-20;y<h+20;y+=26){

          ctx.moveTo(x,y);

          ctx.quadraticCurveTo(
            x+22,
            y+13,
            x,
            y+26
          );
        }

        ctx.stroke();

      }

      for(let x=23;x<w;x+=92){
        for(let y=18;y<h;y+=52){

          ctx.fillStyle=
            'rgba(238,170,140,.12)';

          ctx.beginPath();

          ctx.arc(
            x,y,3,0,Math.PI*2
          );

          ctx.fill();
        }
      }

    },
    512,
    512
  );
}


/* ============================================================
   PAINTINGS
============================================================ */

const clickable = [];

function createPainting(cfg,parent){

  const w =
    cfg.w || 1.55;

  const h =
    cfg.h || 1.08;

  const artMat =
    new THREE.MeshStandardMaterial({
      map:
        cfg.texture ||
        placeholderArt(
          cfg.label,
          cfg.hue || 210
        ),
      roughness:.78
    });

  const art =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        w,h
      ),
      artMat
    );

  art.position.set(
    cfg.x,
    cfg.y,
    cfg.z
  );

  art.rotation.y =
    cfg.ry || 0;

  art.castShadow = false;

  const frameMat =
    M(
      cfg.frameColor || 0x24150f,
      {
        roughness:.48
      }
    );

  const frame =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w+.16,
        h+.16,
        .075
      ),
      frameMat
    );

  frame.position.copy(
    art.position
  );

  frame.rotation.copy(
    art.rotation
  );

  frame.translateZ(-.045);

  parent.add(
    frame,
    art
  );

  art.userData = cfg;

  clickable.push(art);

  if(cfg.img){

    new THREE.TextureLoader()
      .load(
        cfg.img,
        tex => {

          tex.encoding =
            THREE.sRGBEncoding;

          artMat.map = tex;
          artMat.needsUpdate = true;

        },
        undefined,
        ()=>{}
      );
  }

  return art;
}


/* ============================================================
   GALLERY ARCHITECTURE
============================================================ */

/*
   IMPORTANT ARCHITECTURE

   The gallery has ONE central hallway.

   Hall width = 2.8
   Hall walls = x ±1.4

   Each lobby branches through ONE doorway.
   No second corridor.
   No hidden extra room.

   Lobbies are intentionally much larger because
   they need to accommodate many paintings.
*/

const HALL_HALF = 1.4;
const HALL_LENGTH = 132;

const ROOM_W = 15;
const ROOM_D = 24;
const ROOM_H = 4.8;

const DOOR_HALF = 1.65;

const rooms = [];

const flickerLights = [];
const fireMeshes = [];
const snowParticles = [];
const rainParticles = [];
const pendulums = [];

/* ============================================================
   HALLWAY WALLS WITH REAL DOOR GAPS
============================================================ */

const lobbyCenters =
  [18,43,68,93,118];

function buildHallWall(side){

  const x =
    side * HALL_HALF;

  let start = 1;

  for(const zc of lobbyCenters){

    const gapStart =
      zc - DOOR_HALF - .25;

    const len =
      gapStart - start;

    if(len > .1){

      box(
        scene,
        .18,
        ROOM_H,
        len,
        0x48171b,
        x,
        ROOM_H/2,
        (start+gapStart)/2
      );

    }

    start =
      zc + DOOR_HALF + .25;
  }

  if(start < HALL_LENGTH){

    box(
      scene,
      .18,
      ROOM_H,
      HALL_LENGTH-start,
      0x48171b,
      x,
      ROOM_H/2,
      (start+HALL_LENGTH)/2
    );

  }

  /* wallpaper panels over structural wall */

  let s = 1;

  for(const zc of lobbyCenters){

    const gs =
      zc-DOOR_HALF-.25;

    if(gs>s){

      const panel =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            ROOM_H-0.35,
            gs-s
          ),
          new THREE.MeshStandardMaterial({
            map:wallpaperTexture(),
            roughness:1
          })
        );

      panel.rotation.y =
        side < 0
          ? Math.PI/2
          : -Math.PI/2;

      panel.position.set(
        x-side*.095,
        ROOM_H/2,
        (s+gs)/2
      );

      scene.add(panel);
    }

    s =
      zc+DOOR_HALF+.25;
  }

}

/* ============================================================
   ROOM CREATION
============================================================ */

function createRoom(cfg){

  const group =
    new THREE.Group();

  group.position.set(
    cfg.side*(HALL_HALF + ROOM_W/2),
    0,
    cfg.z
  );

  scene.add(group);

  rooms.push({
    z:cfg.z,
    tag:`LOBBY ${cfg.number}`,
    side:cfg.side,
    group
  });

  /* floor */

  const floorMat =
    new THREE.MeshStandardMaterial({
      color:cfg.floor,
      roughness:.93
    });

  const floor =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_D
      ),
      floorMat
    );

  floor.rotation.x=-Math.PI/2;

  floor.position.y=.01;

  floor.receiveShadow=true;

  group.add(floor);


  /* outer wall */

  box(
    group,
    .18,
    ROOM_H,
    ROOM_D,
    cfg.wall,
    cfg.side*ROOM_W/2,
    ROOM_H/2,
    0
  );


  /* side walls */

  box(
    group,
    ROOM_W,
    ROOM_H,
    .18,
    cfg.wall,
    0,
    ROOM_H/2,
    -ROOM_D/2
  );

  box(
    group,
    ROOM_W,
    ROOM_H,
    .18,
    cfg.wall,
    0,
    ROOM_H/2,
    ROOM_D/2
  );


  /* ceiling */

  box(
    group,
    ROOM_W,
    .16,
    ROOM_D,
    cfg.ceiling || 0x150d0e,
    0,
    ROOM_H,
    0
  );


  /* wallpaper on visible interior surfaces */

  if(cfg.wallpaper){

    const tex =
      wallpaperTexture();

    tex.wrapS =
      tex.wrapT =
        THREE.RepeatWrapping;

    tex.repeat.set(
      2,
      3
    );

    const wallMat =
      new THREE.MeshStandardMaterial({
        map:tex,
        roughness:1
      });

    const back =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          ROOM_W-.25,
          ROOM_H-.3
        ),
        wallMat
      );

    back.position.set(
      cfg.side*ROOM_W/2-.095*cfg.side,
      ROOM_H/2,
      0
    );

    back.rotation.y =
      cfg.side<0
        ? Math.PI/2
        : -Math.PI/2;

    group.add(back);

  }


  /* room illumination */

  const roomLight =
    new THREE.PointLight(
      cfg.light,
      cfg.intensity,
      22
    );

  roomLight.position.set(
    cfg.side*2.0,
    3.55,
    0
  );

  roomLight.castShadow=true;

  roomLight.shadow.mapSize.width=512;
  roomLight.shadow.mapSize.height=512;

  group.add(roomLight);

  flickerLights.push({
    light:roomLight,
    base:cfg.intensity,
    mode:cfg.flicker || 'soft'
  });


  /* paintings */

  (cfg.paintings || []).forEach(
    p => createPainting(p,group)
  );


  /* doorway is on hallway-facing edge */

  makeDoorway(
    cfg.side,
    cfg.z,
    cfg.number,
    cfg.title,
    cfg.neon
  );

  return group;
}

/* ============================================================
   MOVEMENT
============================================================ */

window._rooms = rooms;
window._camera = camera;

let yaw = Math.PI;
let pitch = 0;

const keys = {};

document.addEventListener(
  'keydown',
  e => {
    keys[e.code]=true;
  }
);

document.addEventListener(
  'keyup',
  e => {
    keys[e.code]=false;
  }
);

dom.addEventListener(
  'click',
  () => {

    if(
      gameStarted &&
      document.pointerLockElement !== dom
    ){
      dom.requestPointerLock();
    }

  }
);

document.addEventListener(
  'mousemove',
  e => {

    if(
      document.pointerLockElement !== dom
    ) return;

    yaw -=
      e.movementX*.0022;

    pitch -=
      e.movementY*.0022;

    pitch =
      Math.max(
        -1.2,
        Math.min(
          1.2,
          pitch
        )
      );
  }
);


/*
   Keep the broad x boundary so players can enter
   the rooms, while the hallway itself remains physically
   narrow because of its walls.
*/

const LIMIT={
  xMin:-(HALL_HALF+ROOM_W-.35),
  xMax:HALL_HALF+ROOM_W-.35,
  zMin:1,
  zMax:HALL_LENGTH-1
};

function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    'YXZ'
  );

  const speed =
    3.2*dt;

  const fwd =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  let mv =
    new THREE.Vector3();

  if(keys['KeyW'])
    mv.add(fwd);

  if(keys['KeyS'])
    mv.sub(fwd);

  if(keys['KeyD'])
    mv.add(right);

  if(keys['KeyA'])
    mv.sub(right);

  if(mv.length()>0){

    mv
      .normalize()
      .multiplyScalar(speed);

    camera.position.x =
      Math.max(
        LIMIT.xMin,
        Math.min(
          LIMIT.xMax,
          camera.position.x+mv.x
        )
      );

    camera.position.z =
      Math.max(
        LIMIT.zMin,
        Math.min(
          LIMIT.zMax,
          camera.position.z+mv.z
        )
      );

    footstepTick(dt);
  }

  const near =
    rooms.reduce(
      (a,r)=>
        Math.abs(
          r.z-camera.position.z
        )
        <
        Math.abs(
          a.z-camera.position.z
        )
          ? r
          : a,
      rooms[0]
    );

  const lbl =
    document.getElementById(
      'roomLabel'
    );

  if(
    Math.abs(
      near.z-camera.position.z
    ) < 8
  ){

    lbl.style.opacity=1;
    lbl.textContent=near.tag;

  }else{

    lbl.style.opacity=0;

  }
}


/* ============================================================
   ANIMATION
============================================================ */

function animateWorld(t){

  const time=t*.001;


  /* warm lamp variation */

  flickerLights.forEach(
    item => {

      const l=item.light;

      if(item.mode==='flicker'){

        l.intensity =
          item.base *
          (
            .78+
            Math.random()*.32
          );

      }else if(item.mode==='ember'){

        l.intensity =
          item.base *
          (
            .83+
            Math.sin(
              time*7.0
            )*.08+
            Math.random()*.08
          );

      }else if(item.mode==='lamp'){

        l.intensity =
          item.base *
          (
            .94+
            Math.sin(
              time*1.7
            )*.04
          );

      }else if(item.mode==='strobe'){

        l.intensity =
          item.base *
          (
            Math.random()>.97
              ? .18
              : .92
          );

      }else{

        l.intensity =
          item.base *
          (
            .97+
            Math.sin(time*1.3)*.025
          );
      }

    }
  );


  /* snow */

  snowParticles.forEach(
    p => {

      p.position.y -= .009;

      p.position.x +=
        Math.sin(
          time*1.3+
          p.position.z
        )*.0007;

      if(p.position.y<.05){

        p.position.y=4.75;
      }
    }
  );


  /* rain */

  rainParticles.forEach(
    p => {

      p.position.y -= .06;

      if(p.position.y<.05){

        p.position.y=4.6;
      }
    }
  );


  /* fireplace */

  fireMeshes.forEach(
    f => {

      f.scale.y =
        1.35+
        Math.sin(time*8)*.12+
        Math.sin(time*13)*.08;

      f.rotation.z =
        Math.sin(time*5)*.08;
    }
  );


  /* clock pendulum */

  pendulums.forEach(
    p => {

      p.rotation.z =
        Math.sin(time*1.7)*.18;

    }
  );


  /* projector beam */

  movingLights.forEach(
    item => {

      if(item.type==='beam'){

        item.object.material.opacity =
          .028+
          Math.sin(time*2.2)*.008;

      }

      if(item.type==='carLight'){

        item.object.intensity =
          item.base+
          Math.sin(time*2)*.03;

      }

    }
  );

}


/* ============================================================
   PAINTING CLICK
============================================================ */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

dom.addEventListener(
  'mousedown',
  e => {

    if(!gameStarted) return;

    /*
       Only the centre of the screen counts,
       matching the crosshair interaction.
    */

    mouse.x=0;
    mouse.y=0;

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits =
      raycaster.intersectObjects(
        clickable,
        false
      );

    if(hits.length){

      const d =
        hits[0].object.userData;

      openNote(d);
    }

  }
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* ============================================================
   MAIN LOOP
============================================================ */

function animate(t){

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  if(gameStarted){

    updateMovement(dt);

  }

  animateWorld(t);

  renderer.render(
    scene,
    camera
  );
}

animate(0);
