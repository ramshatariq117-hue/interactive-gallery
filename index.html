<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>
<style>
  :root{ --neon:#5ef2ff; --paper:#e8dcc0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; font-family:'Georgia',serif; }
  #app{ position:relative; width:100%; height:100%; }
  canvas{ display:block; }

  /* ---------- Welcome screen ---------- */
  #welcome{
    position:absolute; inset:0; background:radial-gradient(circle at 50% 40%,#0a0a14 0%,#000 80%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; color:#cbd6e6;
  }
  #welcome h1{ font-size:2.2em; letter-spacing:2px; color:var(--neon); text-shadow:0 0 12px var(--neon),0 0 30px var(--neon); margin-bottom:8px; }
  #welcome p{ opacity:.7; margin-bottom:22px; }
  #nameInput{
    padding:12px 16px; font-size:1.1em; border-radius:6px; border:1px solid #345; background:#0e1420; color:#e8f0ff;
    width:280px; text-align:center; margin-bottom:16px;
  }
  #enterBtn{
    padding:12px 28px; font-size:1.05em; letter-spacing:1px; cursor:pointer; border-radius:6px; border:1px solid var(--neon);
    background:transparent; color:var(--neon); text-shadow:0 0 8px var(--neon); transition:all .25s;
  }
  #enterBtn:hover{ background:var(--neon); color:#001; box-shadow:0 0 20px var(--neon); }
  #welcomeMsg{ font-size:1.3em; color:#fff; text-align:center; max-width:520px; line-height:1.5; }

  /* ---------- HUD ---------- */
  #crosshair{
    position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; background:rgba(255,255,255,.7); z-index:20; pointer-events:none;
  }
  #hint{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%); color:#9fb3c8; font-size:.85em;
    background:rgba(0,0,0,.4); padding:6px 14px; border-radius:20px; z-index:20; pointer-events:none;
  }
  #muteBtn{
    position:absolute; top:16px; right:16px; z-index:30; background:rgba(0,0,0,.5); color:#cde; border:1px solid #456;
    border-radius:6px; padding:8px 12px; cursor:pointer; font-size:.9em;
  }
  #roomLabel{
    position:absolute; top:16px; left:16px; z-index:20; color:var(--neon); text-shadow:0 0 8px var(--neon);
    font-size:1em; letter-spacing:2px; opacity:0; transition:opacity .6s;
  }

  /* ---------- Modals ---------- */
  .modalOverlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:60;
    background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
  }
  .note{
    width:340px; max-width:80vw; background:var(--paper); color:#3a2f22; padding:26px 24px; border-radius:2px;
    box-shadow:0 0 40px rgba(0,0,0,.7), inset 0 0 40px rgba(120,90,50,.25);
    transform:rotate(-1.2deg); font-family:'Georgia',serif; position:relative;
  }
  .note::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(0,0,0,.03) 25px); pointer-events:none; }
  .note h3{ font-size:1.15em; margin-bottom:10px; border-bottom:1px solid rgba(0,0,0,.2); padding-bottom:6px; }
  .note p{ line-height:1.5; font-size:.95em; }
  .note button{ margin-top:16px; padding:8px 16px; border:1px solid #3a2f22; background:transparent; cursor:pointer; color:#3a2f22; }
  .win{ background:#111; color:#ffd27a; border:2px solid #ffd27a; box-shadow:0 0 40px #ffb84a; transform:rotate(0); text-align:center; }
  .win h3{ color:#ffd27a; border-color:#553; }
  .win button{ border-color:#ffd27a; color:#ffd27a; }

  #loading{ position:absolute; inset:0; background:#000; color:#5ef2ff; display:flex; align-items:center; justify-content:center; z-index:100; font-size:1.1em; letter-spacing:2px; }
</style>
</head>
<body>
<div id="app">
  <div id="loading">LOADING GALLERY…</div>

  <div id="welcome">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of cozy &amp; eerie things</p>
    <div id="stepEnterName">
      <input id="nameInput" placeholder="Enter your name" maxlength="20">
      <br><button id="enterBtn">ENTER GALLERY</button>
    </div>
    <div id="welcomeMsg" style="display:none;"></div>
  </div>

  <div id="roomLabel"></div>
  <div id="crosshair" style="display:none;"></div>
  <div id="hint" style="display:none;">WASD to move · mouse to look · click a painting</div>
  <button id="muteBtn" style="display:none;">🔊 Sound</button>

  <div class="modalOverlay" id="noteOverlay">
    <div class="note" id="noteBox">
      <h3 id="noteTitle">Untitled</h3>
      <p id="noteBody">...</p>
      <button id="noteClose">close</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

/* =========================================================================
   RAMSHA ART STUDIO — INTERACTIVE GALLERY
   Architecture:
   - One long, narrow central hallway.
   - Five lobbies branch from alternating sides.
   - Lobbies contain themed environmental details.
   - Welcome, movement, pointer lock, paintings, notes and audio preserved.
   ========================================================================= */

const $ = id => document.getElementById(id);
let gameStarted = false;
let galleryReady = false;
let dom = null;

function showFatalError(msg){
  const lbl = $('roomLabel');
  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';
  lbl.textContent = '⚠ ' + msg;
  console.error(msg);
}

/* ---------- ENTER GALLERY ---------- */

$('enterBtn').onclick = () => {
  const name = $('nameInput').value.trim() || 'friend';
  $('stepEnterName').style.display = 'none';

  const wm = $('welcomeMsg');
  wm.style.display = 'block';
  wm.textContent = `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try { startAudio(); } catch(e){ console.warn('Audio failed to start:', e); }

  setTimeout(() => {
    $('welcome').style.display = 'none';
    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';

    gameStarted = true;

    if(!galleryReady)
      showFatalError('3D engine did not start — open the browser console (F12) for details.');
    else if(dom)
      dom.requestPointerLock();
  }, 2200);
};

$('muteBtn').onclick = () => {
  muted = !muted;
  if(master) master.gain.value = muted ? 0 : 0.25;
  $('muteBtn').textContent = muted ? '🔇 Sound' : '🔊 Sound';
};

$('noteClose').onclick = () => {
  $('noteOverlay').style.display = 'none';
};

function openNote(d){
  if(dom) document.exitPointerLock();

  const box = $('noteBox');
  box.classList.toggle('win', !!d.winner);

  $('noteTitle').textContent =
    d.winner ? '🎉 You found a free print!' : d.label;

  $('noteBody').textContent = d.story;
  $('noteOverlay').style.display = 'flex';
}

/* =========================================================================
   AUDIO
   ========================================================================= */

let audioCtx, master, noiseSrc, droneOsc, muted = false;

function footstepTick(dt){}

function startAudio(){
  if(audioCtx) return;

  audioCtx = new (window.AudioContext||window.webkitAudioContext)();

  master = audioCtx.createGain();
  master.gain.value = 0.25;
  master.connect(audioCtx.destination);

  droneOsc = audioCtx.createOscillator();
  droneOsc.type='sine';
  droneOsc.frequency.value=55;

  const droneGain = audioCtx.createGain();
  droneGain.gain.value=0.15;

  droneOsc.connect(droneGain).connect(master);
  droneOsc.start();

  const bufSize = 2*audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  const data = buf.getChannelData(0);

  for(let i=0;i<bufSize;i++)
    data[i]=Math.random()*2-1;

  noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer=buf;
  noiseSrc.loop=true;

  const filter = audioCtx.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.value=500;

  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value=0.06;

  noiseSrc.connect(filter).connect(noiseGain).connect(master);
  noiseSrc.start();

  setInterval(()=>{
    if(muted || !gameStarted || !galleryReady) return;

    const near = currentRoom();

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.type = near && near.tag==='LOBBY 5' ? 'sawtooth' : 'sine';

    o.frequency.value =
      near && near.tag==='LOBBY 5'
      ? 120+Math.random()*200
      : 300+Math.random()*200;

    g.gain.value=0;

    o.connect(g).connect(master);
    o.start();

    g.gain.linearRampToValueAtTime(
      (near && near.tag==='LOBBY 5')?0.08:0.03,
      audioCtx.currentTime+0.3
    );

    g.gain.linearRampToValueAtTime(
      0,
      audioCtx.currentTime+1.4
    );

    o.stop(audioCtx.currentTime+1.5);

  },5000);
}

function currentRoom(){
  if(!window._rooms || !window._camera) return null;

  return window._rooms.reduce(
    (a,r)=>
      Math.abs(r.z-window._camera.position.z)
      <
      Math.abs(a.z-window._camera.position.z)
      ? r : a,
    window._rooms[0]
  );
}

/* =========================================================================
   THREE.JS
   ========================================================================= */

try {
  initGallery();
  galleryReady = true;
}
catch(err){
  showFatalError('Gallery failed to load: ' + err.message);
}

function initGallery(){

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03030a);

const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth/innerHeight,
    0.1,
    200
  );

camera.position.set(0,1.7,4);

const renderer =
  new THREE.WebGLRenderer({antialias:true});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

document.getElementById('app').prepend(renderer.domElement);
document.getElementById('loading').style.display='none';

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* ---------- GLOBAL LIGHTING ---------- */

scene.add(
  new THREE.AmbientLight(0x1a1f2e,1.1)
);

const hallLight =
  new THREE.PointLight(0x2a3550,0.6,50);

hallLight.position.set(0,4,40);
scene.add(hallLight);

/* =========================================================================
   LONG CENTRAL HALLWAY
   ========================================================================= */

const HALL_HALF = 1.75;
const HALL_H = 4.2;
const LEVEL_START = 0;
const LEVEL_END = 112;

const hallwayFloorMat =
  new THREE.MeshStandardMaterial({
    color:0x101015,
    roughness:.92
  });

const hallwayFloor =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      HALL_HALF*2,
      LEVEL_END
    ),
    hallwayFloorMat
  );

hallwayFloor.rotation.x=-Math.PI/2;
hallwayFloor.position.set(
  0,
  0,
  LEVEL_END/2
);

scene.add(hallwayFloor);

/* Ceiling */

const hallwayCeiling =
  hallwayFloor.clone();

hallwayCeiling.position.y=HALL_H;
hallwayCeiling.rotation.x=Math.PI/2;

scene.add(hallwayCeiling);

/* ---------- Hall wall material ---------- */

const corridorWallMat =
  new THREE.MeshStandardMaterial({
    color:0x101118,
    roughness:1
  });

/*
  Instead of two continuous walls, the corridor walls are divided into
  sections around each lobby doorway.
*/

const DOOR_W = 2.25;
const DOOR_H = 2.8;

function hallWallSegment(side,z1,z2){

  const length=z2-z1;

  if(length<=0) return;

  const wall =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        0.18,
        HALL_H,
        length
      ),
      corridorWallMat
    );

  wall.position.set(
    side*HALL_HALF,
    HALL_H/2,
    (z1+z2)/2
  );

  scene.add(wall);
}

/* Doorway openings */

const doorZones =
  rooms.map(r=>({
    z:r.z,
    start:r.z-DOOR_W/2,
    end:r.z+DOOR_W/2
  }));

/* =========================================================================
   TEXTURES
   ========================================================================= */

function canvasTexture(draw,w=512,h=384){

  const c=document.createElement('canvas');

  c.width=w;
  c.height=h;

  draw(c.getContext('2d'),w,h);

  const t=new THREE.CanvasTexture(c);
  t.needsUpdate=true;

  return t;
}

function placeholderArt(label,hue){

  return canvasTexture((ctx,w,h)=>{

    const g=ctx.createLinearGradient(0,0,w,h);

    g.addColorStop(
      0,
      `hsl(${hue},35%,18%)`
    );

    g.addColorStop(
      1,
      `hsl(${hue+30},30%,8%)`
    );

    ctx.fillStyle=g;
    ctx.fillRect(0,0,w,h);

    ctx.strokeStyle='rgba(255,255,255,.15)';
    ctx.lineWidth=6;
    ctx.strokeRect(10,10,w-20,h-20);

    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.font='24px Georgia';
    ctx.textAlign='center';

    ctx.fillText(
      'PLACEHOLDER',
      w/2,
      h/2-10
    );

    ctx.font='18px Georgia';

    ctx.fillText(
      label,
      w/2,
      h/2+22
    );

  });
}

function neonSignTexture(text,color){

  return canvasTexture((ctx,w,h)=>{

    ctx.clearRect(0,0,w,h);

    ctx.font='bold 90px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';

    ctx.shadowColor=color;
    ctx.shadowBlur=30;

    ctx.fillStyle=color;
    ctx.fillText(text,w/2,h/2);

    ctx.fillText(text,w/2,h/2);

  },512,160);
}

/* =========================================================================
   SIMPLE OBJECT FACTORIES
   ========================================================================= */

function box(g,x,y,z,w,h,d,color){

  const m =
    new THREE.MeshStandardMaterial({
      color,
      roughness:.85
    });

  const o =
    new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      m
    );

  o.position.set(x,y,z);
  g.add(o);

  return o;
}

function cylinder(g,x,y,z,r,h,color){

  const m =
    new THREE.MeshStandardMaterial({
      color,
      roughness:.8
    });

  const o =
    new THREE.Mesh(
      new THREE.CylinderGeometry(r,r,h,12),
      m
    );

  o.position.set(x,y,z);
  g.add(o);

  return o;
}

function sphere(g,x,y,z,r,color){

  const o =
    new THREE.Mesh(
      new THREE.SphereGeometry(r,16,12),
      new THREE.MeshStandardMaterial({
        color,
        roughness:.75
      })
    );

  o.position.set(x,y,z);
  g.add(o);

  return o;
}

function createRug(g,x,z,w,d,color){

  const rug =
    new THREE.Mesh(
      new THREE.BoxGeometry(w,.035,d),
      new THREE.MeshStandardMaterial({
        color,
        roughness:1
      })
    );

  rug.position.set(x,.025,z);
  g.add(rug);

  return rug;
}

function createLamp(g,x,z,color=0xd8b878){

  cylinder(g,x,1.15,z,.035,2.3,0x171717);

  const shade =
    new THREE.Mesh(
      new THREE.ConeGeometry(.28,.28,16,1,true),
      new THREE.MeshStandardMaterial({
        color:0x40382d,
        roughness:.9
      })
    );

  shade.position.set(x,2.35,z);
  g.add(shade);

  const bulb =
    new THREE.PointLight(
      color,
      .5,
      4
    );

  bulb.position.set(x,2.22,z);
  g.add(bulb);
}

function createChair(g,x,z,color){

  box(g,x,.42,z,.85,.18,.8,color);

  box(g,x,.9,z+.28,.82,1,.16,color);

  box(g,x-.38,.22,z,.12,.45,.65,color);
  box(g,x+.38,.22,z,.12,.45,.65,color);
}

function createPlant(g,x,z){

  const pot =
    new THREE.Mesh(
      new THREE.CylinderGeometry(.22,.28,.38,12),
      new THREE.MeshStandardMaterial({
        color:0x34261d,
        roughness:1
      })
    );

  pot.position.set(x,.19,z);
  g.add(pot);

  for(let i=0;i<6;i++){

    const leaf =
      new THREE.Mesh(
        new THREE.SphereGeometry(.22,10,8),
        new THREE.MeshStandardMaterial({
          color:0x243b28,
          roughness:1
        })
      );

    leaf.scale.set(.55,1,.3);

    leaf.position.set(
      x+(Math.random()-.5)*.35,
      .55+Math.random()*.45,
      z+(Math.random()-.5)*.35
    );

    g.add(leaf);
  }
}

/* =========================================================================
   PAINTINGS
   ========================================================================= */

const clickable=[];

function createPainting(cfg,group){

  const w=1.5;
  const h=1.05;

  let mat =
    new THREE.MeshStandardMaterial({
      map:placeholderArt(
        cfg.label,
        cfg.hue||210
      ),
      roughness:.8
    });

  const mesh =
    new THREE.Mesh(
      new THREE.PlaneGeometry(w,h),
      mat
    );

  mesh.position.set(
    cfg.x,
    cfg.y,
    cfg.z
  );

  mesh.rotation.y=cfg.ry;

  const frame =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        w+.14,
        h+.14
      ),
      new THREE.MeshStandardMaterial({
        color:0x1a1410
      })
    );

  frame.position.copy(mesh.position);
  frame.rotation.y=cfg.ry;
  frame.translateZ(-.02);

  group.add(frame,mesh);

  mesh.userData=cfg;

  clickable.push(mesh);

  if(cfg.img){

    new THREE.TextureLoader().load(
      cfg.img,
      tex=>{
        mat.map=tex;
        mat.needsUpdate=true;
      },
      undefined,
      ()=>{}
    );

  }
}

/* =========================================================================
   ROOM FACTORY
   ========================================================================= */

const ROOM_W=6.5;
const ROOM_D=9;
const ROOM_H=4.2;

const flickerLights=[];

function createRoom(cfg){

  const group=new THREE.Group();

  const cx =
    cfg.side *
    (HALL_HALF+ROOM_W/2);

  group.position.set(
    cx,
    0,
    cfg.z
  );

  scene.add(group);

  const wallMat =
    new THREE.MeshStandardMaterial({
      color:cfg.wallColor,
      roughness:1
    });

  const floorMat2 =
    new THREE.MeshStandardMaterial({
      color:cfg.floorColor||cfg.wallColor,
      roughness:1
    });

  /* Back wall */

  const back =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_H
      ),
      wallMat
    );

  back.position.set(
    0,
    ROOM_H/2,
    cfg.side*ROOM_D/2
  );

  back.rotation.y =
    cfg.side>0
    ? Math.PI
    : 0;

  group.add(back);

  /* Far side wall */

  const farSide =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_D,
        ROOM_H
      ),
      wallMat
    );

  farSide.position.set(
    -cfg.side*ROOM_W/2,
    ROOM_H/2,
    0
  );

  farSide.rotation.y =
    cfg.side>0
    ? Math.PI/2
    : -Math.PI/2;

  group.add(farSide);

  /*
    Hall-facing wall is deliberately split so that the visitor
    has a genuine doorway into the room.
  */

  const hallWallX =
    cfg.side>0
    ? -ROOM_W/2
    : ROOM_W/2;

  const jambMat =
    new THREE.MeshStandardMaterial({
      color:cfg.wallColor,
      roughness:1
    });

  const jambWidth=.12;

  /* Left/right sides of doorway */

  [-1,1].forEach(s=>{

    const jamb =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          jambWidth,
          ROOM_H,
          (ROOM_D-DOOR_W)/2
        ),
        jambMat
      );

    jamb.position.set(
      hallWallX,
      ROOM_H/2,
      s*(DOOR_W/2+(ROOM_D-DOOR_W)/4)
    );

    group.add(jamb);

  });

  /* Header above door */

  const header =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        jambWidth,
        ROOM_H-DOOR_H,
        DOOR_W
      ),
      jambMat
    );

  header.position.set(
    hallWallX,
    DOOR_H+(ROOM_H-DOOR_H)/2,
    0
  );

  group.add(header);

  /* Room floor */

  const rf =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_D
      ),
      floorMat2
    );

  rf.rotation.x=-Math.PI/2;
  rf.position.y=.01;

  group.add(rf);

  /* Lighting */

  const roomLight =
    new THREE.PointLight(
      cfg.lightColor,
      cfg.lightIntensity||1,
      12
    );

  roomLight.position.set(
    0,
    2.6,
    0
  );

  group.add(roomLight);

  if(cfg.flicker)
    flickerLights.push({
      light:roomLight,
      base:cfg.lightIntensity||1,
      mode:cfg.flicker
    });

  /* Door frame */

  const doorFrameMat =
    new THREE.MeshStandardMaterial({
      color:0x17120f,
      roughness:.75
    });

  box(
    group,
    hallWallX,
    DOOR_H/2,
    -DOOR_W/2,
    .22,
    DOOR_H,
    .10,
    0x17120f
  );

  box(
    group,
    hallWallX,
    DOOR_H/2,
    DOOR_W/2,
    .22,
    DOOR_H,
    .10,
    0x17120f
  );

  box(
    group,
    hallWallX,
    DOOR_H,
    0,
    .22,
    .12,
    DOOR_W,
    0x17120f
  );

  /* Neon doorway label */

  const sign =
    new THREE.Mesh(
      new THREE.PlaneGeometry(2.2,.7),
      new THREE.MeshBasicMaterial({
        map:neonSignTexture(
          cfg.tag,
          cfg.neon
        ),
        transparent:true
      })
    );

  sign.position.set(
    cfg.side*(HALL_HALF-.02),
    3.1,
    cfg.z
  );

  sign.rotation.y =
    cfg.side>0
    ? -Math.PI/2
    : Math.PI/2;

  scene.add(sign);

  if(cfg.glowDoor){

    const glow =
      new THREE.PointLight(
        cfg.neonHex,
        1.6,
        6
      );

    glow.position.set(
      cfg.side*(HALL_HALF+.3),
      2.2,
      cfg.z
    );

    scene.add(glow);

    flickerLights.push({
      light:glow,
      base:1.6,
      mode:'pulse'
    });
  }

  (cfg.paintings||[]).forEach(
    p=>createPainting(p,group)
  );

  if(cfg.decorate)
    cfg.decorate(group);

  return group;
}

/* =========================================================================
   HALLWAY WALLS
   ========================================================================= */

function buildHallWalls(){

  const doorZones =
    rooms.map(r=>({
      start:r.z-DOOR_W/2,
      end:r.z+DOOR_W/2
    }));

  [-1,1].forEach(side=>{

    let cursor=LEVEL_START;

    doorZones.forEach(zone=>{

      hallWallSegment(
        side,
        cursor,
        zone.start
      );

      cursor=zone.end;

    });

    hallWallSegment(
      side,
      cursor,
      LEVEL_END
    );

  });

  /* Subtle ceiling lamps along corridor */

  for(let z=7;z<108;z+=8){

    const fixture =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .5,
          .08,
          .18
        ),
        new THREE.MeshStandardMaterial({
          color:0x292d35,
          roughness:.7
        })
      );

    fixture.position.set(
      0,
      HALL_H-.04,
      z
    );

    scene.add(fixture);

    const light =
      new THREE.PointLight(
        0x66758f,
        .32,
        7
      );

    light.position.set(
      0,
      HALL_H-.18,
      z
    );

    scene.add(light);
  }

}

/* =========================================================================

   ========================================================================= */

let yaw=Math.PI;
let pitch=0;

const keys={};

document.addEventListener(
  'keydown',
  e=>keys[e.code]=true
);

document.addEventListener(
  'keyup',
  e=>keys[e.code]=false
);

dom=renderer.domElement;

dom.addEventListener(
  'click',
  ()=>{
    if(
      gameStarted &&
      document.pointerLockElement!==dom
    )
      dom.requestPointerLock();
  }
);

document.addEventListener(
  'mousemove',
  e=>{

    if(document.pointerLockElement!==dom)
      return;

    yaw-=e.movementX*.0022;
    pitch-=e.movementY*.0022;

    pitch=Math.max(
      -1.2,
      Math.min(1.2,pitch)
    );

  }
);

/* ---------- movement boundaries ---------- */

const LIMIT={
  xMin:-HALL_HALF+.12,
  xMax:HALL_HALF-.12,
  zMin:1,
  zMax:112
};

function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    'YXZ'
  );

  const speed=3.2*dt;

  const fwd =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  let mv=new THREE.Vector3();

  if(keys['KeyW']) mv.add(fwd);
  if(keys['KeyS']) mv.sub(fwd);
  if(keys['KeyD']) mv.add(right);
  if(keys['KeyA']) mv.sub(right);

  if(mv.length()>0){

    mv.normalize().multiplyScalar(speed);

    /*
      The player normally remains in the hallway.
      At a doorway, the opening allows them to move into the lobby.
    */

    const proposedX=
      camera.position.x+mv.x;

    const proposedZ=
      camera.position.z+mv.z;

    let allowedX=true;

    if(
      Math.abs(proposedX)>HALL_HALF
    ){

      const nearest=
        rooms.reduce(
          (a,r)=>
            Math.abs(
              r.z-proposedZ
            )
            <
            Math.abs(
              a.z-proposedZ
            )
            ? r:a,
          rooms[0]
        );

      const inDoor=
        Math.abs(
          proposedZ-nearest.z
        )
        <
        DOOR_W/2+.15;

      if(!inDoor)
        allowedX=false;

    }

    if(allowedX){

      camera.position.x=
        Math.max(
          -HALL_HALF-ROOM_W+.4,
          Math.min(
            HALL_HALF+ROOM_W-.4,
            proposedX
          )
        );

    }

    camera.position.z=
      Math.max(
        LIMIT.zMin,
        Math.min(
          LIMIT.zMax,
          proposedZ
        )
      );

    footstepTick(dt);

  }

  const near=
    rooms.reduce(
      (a,r)=>
        Math.abs(
          r.z-camera.position.z
        )
        <
        Math.abs(
          a.z-camera.position.z
        )
        ? r:a,
      rooms[0]
    );

  const lbl=
    document.getElementById(
      'roomLabel'
    );

  if(
    Math.abs(
      near.z-camera.position.z
    )<5.5
  ){

    lbl.style.opacity=1;
    lbl.textContent=near.tag;

  }
  else{

    lbl.style.opacity=0;

  }

}

/* =========================================================================
   ANIMATION
   ========================================================================= */

let clock=new THREE.Clock();

function animateFlicker(t){

  flickerLights.forEach(f=>{

    if(f.mode==='flicker')
      f.light.intensity=
        f.base*
        (.7+Math.random()*.5);

    else if(f.mode==='ember')
      f.light.intensity=
        f.base*
        (
          .85+
          Math.sin(t*6)*.1+
          Math.random()*.1
        );

    else if(f.mode==='lamp')
      f.light.intensity=
        f.base*
        (
          Math.random()<.02
          ? .2
          : 1
        );

    else if(f.mode==='strobe')
      f.light.intensity=
        f.base*
        (
          Math.random()<.05
          ? 2.2
          : .5
        );

    else if(f.mode==='pulse')
      f.light.intensity=
        f.base*
        (
          .8+
          Math.sin(t*2)*.3
        );

  });

  scene.traverse(o=>{

    if(
      o.userData &&
      o.userData.isSnow
    ){

      const p=
        o.geometry.attributes.position;

      for(
        let i=1;
        i<p.count*3;
        i+=3
      ){

        p.array[i]-=.01;

        if(p.array[i]<0)
          p.array[i]=ROOM_H;

      }

      p.needsUpdate=true;

    }

    if(
      o.userData &&
      o.userData.isFire
    ){

      o.material.opacity=
        .8+
        Math.sin(t*10)*.2;

      o.material.transparent=true;

      o.scale.x=
        1+
        Math.sin(t*13)*.08;

      o.scale.y=
        1+
        Math.sin(t*11)*.12;

    }

  });

}

/* =========================================================================
   LOOP
   ========================================================================= */

function loop(){

  requestAnimationFrame(loop);

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  if(gameStarted)
    updateMovement(dt);

  animateFlicker(
    clock.elapsedTime
  );

  renderer.render(
    scene,
    camera
  );

}

loop();

/* =========================================================================
   PAINTING CLICK
   ========================================================================= */

const ray=new THREE.Raycaster();

dom.addEventListener(
  'mousedown',
  e=>{

    if(
      !gameStarted ||
      document.pointerLockElement!==dom
    )
      return;

    ray.setFromCamera(
      {x:0,y:0},
      camera
    );

    const hit=
      ray.intersectObjects(
        clickable
      )[0];

    if(hit)
      openNote(
        hit.object.userData
      );

  }
);

}
</script>
