/* ============================================================
   WORLD
   ============================================================ */

const scene = new THREE.Scene();

  70,
  innerWidth / innerHeight,
  .05,
  240
);

camera.position.set(0,1.68,5);
camera.rotation.order='YXZ';

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
renderer.outputEncoding=THREE.sRGBEncoding;

document.body.appendChild(renderer.domElement);


/* ============================================================
   DIMENSIONS
   ============================================================ */

const HALL_HALF=1.42;
const HALL_LENGTH=132;

const ROOM_W=15;
const ROOM_L=24;
const ROOM_H=4.8;

const DOOR_HALF=1.62;

const lobbyCenters=[
  18,
  43,
  68,
  93,
  118
];

const lobbyInfo=[
  {
    name:'LOBBY 1 · THE OLD CINEMA',
    side:-1,
    type:'cinema'
  },
  {
    name:'LOBBY 2 · THE COTTAGE',
    side:1,
    type:'cottage'
  },
  {
    name:'LOBBY 3 · SNOWFALL',
    side:-1,
    type:'snow'
  },
  {
    name:'LOBBY 4 · THE QUIET STREET',
    side:1,
    type:'street'
  },
  {
    name:'LOBBY 5 · THE EMPTY HOUSE',
    side:-1,
    type:'horror'
  }
];


/* ============================================================
   ATMOSPHERE
   ============================================================ */

scene.background=new THREE.Color(0x151316);

const hemi=new THREE.HemisphereLight(
  0xaaa0a2,
  0x241a1b,
  .50
);

scene.add(hemi);

const ambient=new THREE.AmbientLight(
  0x706267,
  .28
);

scene.add(ambient);

const moonFill=new THREE.DirectionalLight(
  0x9eabc0,
  .13
);

moonFill.position.set(
  10,
  14,
  70
);

scene.add(moonFill);


const atmos={
  hall:{
    color:0x191518,
    density:.010
  },

  cinema:{
    color:0x111820,
    density:.018
  },

  cottage:{
    color:0x211915,
    density:.009
  },

  snow:{
    color:0x65778b,
    density:.020
  },

  street:{
    color:0x182b37,
    density:.018
  },

  horror:{
    color:0x160f13,
    density:.024
  }
};

scene.fog=new THREE.FogExp2(
  atmos.hall.color,
  atmos.hall.density
);

let targetFogColor=new THREE.Color(atmos.hall.color);
let targetFogDensity=atmos.hall.density;

function setAtmosphere(type){

  const a=atmos[type] || atmos.hall;

  targetFogColor.set(a.color);
  targetFogDensity=a.density;

  scene.fog.color.lerp(
    targetFogColor,
    .025
  );

  scene.fog.density +=
    (targetFogDensity-scene.fog.density)*.025;

  scene.background.lerp(
    targetFogColor,
    .012
  );
}


/* ============================================================
   SEEDED RANDOM
   ============================================================ */

function seeded(seed){

  let t=(seed>>>0)||1;

  return function(){

    t+=0x6D2B79F5;

    let r=Math.imul(
      t^t>>>15,
      1|t
    );

    r^=r+Math.imul(
      r^r>>>7,
      61|r
    );

    return ((r^r>>>14)>>>0)/4294967296;
  };
}


/* ============================================================
   TEXTURES
   ============================================================ */

function texture(canvas,rx=1,ry=1){

  const t=new THREE.CanvasTexture(canvas);

  t.wrapS=t.wrapT=THREE.RepeatWrapping;

  t.repeat.set(rx,ry);

  t.anisotropy=Math.min(
    renderer.capabilities.getMaxAnisotropy(),
    8
  );

  t.encoding=THREE.sRGBEncoding;

  return t;
}


function canvasBase(
  seed,
  w,
  h,
  color
){

  const r=seeded(seed);

  const c=document.createElement('canvas');

  c.width=w;
  c.height=h;

  const x=c.getContext('2d');

  x.fillStyle=color;
  x.fillRect(0,0,w,h);

  return {c,x,r};
}


/* ---------------- WALLPAPER ---------------- */

function wallpaper(
  seed,
  base='#71605c'
){

  const {c,x,r}=canvasBase(
    seed,
    700,
    700,
    base
  );

  /*
     Fine vertical faded texture
  */

  for(let i=0;i<220;i++){

    const xx=r()*700;

    x.strokeStyle=
      `rgba(35,24,25,${.025+r()*.045})`;

    x.lineWidth=.5+r()*1.4;

    x.beginPath();

    x.moveTo(xx,0);
    x.lineTo(
      xx+(r()-.5)*7,
      700
    );

    x.stroke();
  }

  /*
     Very subtle old floral pattern
  */

  for(let y=30;y<700;y+=74){

    for(let xx=22;xx<700;xx+=86){

      x.strokeStyle=
        `rgba(235,218,194,${.018+r()*.028})`;

      x.lineWidth=1;

      x.beginPath();

      x.moveTo(xx,y);

      x.bezierCurveTo(
        xx+12,
        y-14,
        xx+20,
        y+14,
        xx+31,
        y
      );

      x.bezierCurveTo(
        xx+20,
        y+15,
        xx+12,
        y-15,
        xx,
        y
      );

      x.stroke();
    }
  }

  /*
     stains / age
  */

  for(let i=0;i<32;i++){

    x.fillStyle=
      `rgba(36,27,27,${.018+r()*.045})`;

    x.beginPath();

    x.ellipse(
      r()*700,
      r()*700,
      10+r()*35,
      5+r()*20,
      r()*Math.PI,
      0,
      Math.PI*2
    );

    x.fill();
  }

  return texture(c,2.1,2.1);
}


/* ---------------- WOOD ---------------- */

function wood(
  seed,
  dark=false
){

  const {c,x,r}=canvasBase(
    seed,
    700,
    500,
    dark?'#3a2720':'#684a35'
  );

  for(let i=0;i<65;i++){

    const y=i*8+r()*7;

    x.strokeStyle=
      dark
      ? `rgba(13,8,6,${.12+r()*.14})`
      : `rgba(30,18,12,${.10+r()*.12})`;

    x.lineWidth=.7+r()*1.5;

    x.beginPath();

    let xx=-30;

    x.moveTo(xx,y);

    while(xx<730){

      xx+=20+r()*42;

      x.quadraticCurveTo(
        xx-13,
        y+(r()-.5)*7,
        xx,
        y+(r()-.5)*5
      );
    }

    x.stroke();
  }

  return texture(c,2.2,4.2);
}


/* ---------------- OLD FLOOR ---------------- */

function oldFloor(seed){

  const {c,x,r}=canvasBase(
    seed,
    900,
    600,
    '#4a3329'
  );

  for(let i=0;i<36;i++){

    const y=i*17+r()*5;

    x.strokeStyle=
      `rgba(19,12,9,${.20+r()*.14})`;

    x.lineWidth=1+r()*1.2;

    x.beginPath();

    x.moveTo(0,y);

    x.lineTo(
      900,
      y+(r()-.5)*4
    );

    x.stroke();
  }

  return texture(c,1.5,3);
}


/* ---------------- RED RUNNER ---------------- */

function carpet(
  seed,
  base='#542b34'
){

  const {c,x,r}=canvasBase(
    seed,
    700,
    700,
    base
  );

  x.strokeStyle='rgba(190,147,117,.18)';
  x.lineWidth=7;

  x.strokeRect(
    25,
    25,
    650,
    650
  );

  x.strokeStyle='rgba(211,170,133,.08)';
  x.lineWidth=2;

  x.strokeRect(
    45,
    45,
    610,
    610
  );

  for(let i=0;i<22;i++){

    const m=58+i*12;

    x.strokeStyle=
      `rgba(220,173,132,${.025+r()*.035})`;

    x.strokeRect(
      m,
      m,
      700-m*2,
      700-m*2
    );
  }

  return texture(c,1,2.8);
}


/* ---------------- FABRIC ---------------- */

function fabric(
  seed,
  base
){

  const {c,x,r}=canvasBase(
    seed,
    400,
    400,
    base
  );

  for(let i=0;i<3500;i++){

    x.fillStyle=
      `rgba(255,245,230,${.006+r()*.025})`;

    x.fillRect(
      r()*400,
      r()*400,
      1,
      1
    );
  }

  return texture(c,3,3);
}


/* ---------------- BRICK ---------------- */

function brick(seed){

  const {c,x,r}=canvasBase(
    seed,
    700,
    500,
    '#654840'
  );

  for(let y=0;y<500;y+=34){

    const offset=
      (Math.floor(y/34)%2)*45;

    for(let xx=-90;xx<760;xx+=90){

      x.strokeStyle='rgba(35,22,19,.42)';
      x.lineWidth=3;

      x.strokeRect(
        xx-offset,
        y,
        90,
        34
      );

      x.fillStyle=
        `rgba(230,192,157,${.01+r()*.035})`;

      x.fillRect(
        xx-offset+4,
        y+4,
        82,
        25
      );
    }
  }

  return texture(c,1.5,1.5);
}


/* ============================================================

const M={

function cmat(
  color,
  rough=.8,
  emissive=0,
  intensity=0
){

  return new THREE.MeshStandardMaterial({
    color,
    roughness:rough,
    emissive,

/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */

function box(
  x,y,z,
  sx,sy,sz,
  material,
  parent=scene,
  cast=true,
  receive=true
){

  const m=new THREE.Mesh(
    new THREE.BoxGeometry(
      sx,sy,sz
    ),
    material
  );

  m.position.set(
    x,y,z
  );

  m.castShadow=cast;
  m.receiveShadow=receive;

  parent.add(m);

  return m;
}


function cyl(
  x,y,z,
  r,h,
  material,
  segments=20,
  parent=scene,
  rotation=null
){

  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(
      r,r,h,segments
    ),
    material
  );

  m.position.set(
    x,y,z
  );

  if(rotation){

    m.rotation.set(
      rotation.x||0,
      rotation.y||0,
      rotation.z||0
    );
  }

  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}


function sphere(
  x,y,z,
  r,
  material,
  parent=scene
){

  const m=new THREE.Mesh(
    new THREE.SphereGeometry(
      r,
      20,
      14
    ),
    material
  );

  m.position.set(
    x,y,z
  );

  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}


function lineBetween(
  a,
  b,
  radius,
  material,
  parent=scene
){

  const d=new THREE.Vector3(
    b.x-a.x,
    b.y-a.y,
    b.z-a.z
  );

  const len=d.length();

  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius,
      len,
      8
    ),
    material
  );

  m.position.set(
    (a.x+b.x)/2,
    (a.y+b.y)/2,
    (a.z+b.z)/2
  );

  m.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    d.normalize()
  );

  m.castShadow=true;

  parent.add(m);

  return m;
}


/* ============================================================
   HALLWAY
   ============================================================ */

const colliders=[];

function addCollider(
  x1,x2,z1,z2
){

  colliders.push({
    minX:Math.min(x1,x2),
    maxX:Math.max(x1,x2),
    minZ:Math.min(z1,z2),
    maxZ:Math.max(z1,z2)
  });
}


function hit(
  x,z,r,b
){

  return (
    x+r>b.minX &&
    x-r<b.maxX &&
    z+r>b.minZ &&
    z-r<b.maxZ
  );
}


function canMove(x,z){

  if(
    x<-(HALL_HALF+ROOM_W-.38) ||
    x>(HALL_HALF+ROOM_W-.38) ||
    z<.7 ||
    z>HALL_LENGTH-.7
  ){
    return false;
  }

  for(const b of colliders){

    if(hit(x,z,.27,b)){
      return false;
    }
  }

  return true;
}

function hallwayWall(side){

  const x=side*HALL_HALF;

  const openings=lobbyCenters.filter(
    (z,i)=>lobbyInfo[i].side===side
  );

  let cursor=0;

  for(const z of openings){

    const a=z-DOOR_HALF;
    const b=z+DOOR_HALF;

    if(a>cursor){

      box(
        x,
        ROOM_H/2,
        (cursor+a)/2,
        .16,
        ROOM_H,
        a-cursor,
        M.wall,
        scene,
        false,
        true
      );

      addCollider(
        x-.08,
        x+.08,
        cursor,
        a
      );
    }

    doorFrame(side,z);

    cursor=b;
  }

  if(cursor<HALL_LENGTH){

    box(
      x,
      ROOM_H/2,
      (cursor+HALL_LENGTH)/2,
      .16,
      ROOM_H,
      HALL_LENGTH-cursor,
      M.wall,
      scene,
      false,
      true
    );

    addCollider(
      x-.08,
      x+.08,
      cursor,
      HALL_LENGTH
    );
  }
}

const paintingTextureCache=new Map();


function paintingCanvas(seed){

  const key=Math.abs(seed)%18;

  if(paintingTextureCache.has(key)){
    return paintingTextureCache.get(key);
  }

  const r=seeded(
    key*7919+17
  );

  const c=document.createElement('canvas');

  c.width=480;
  c.height=610;

  const x=c.getContext('2d');

  const p=
    artPalettes[
      key%artPalettes.length
    ];

  const gradient=
    x.createLinearGradient(
      0,0,0,610
    );

  gradient.addColorStop(
    0,
    p[0]
  );

  gradient.addColorStop(
    .62,
    p[1]
  );

  gradient.addColorStop(
    1,
    p[2]
  );

  x.fillStyle=gradient;
  x.fillRect(0,0,480,610);

  /*
     More painterly horizontal / vertical
     atmospheric marks instead of simple
     geometric houses.
  */

  for(let i=0;i<70;i++){

    x.strokeStyle=
      `rgba(255,255,255,${.012+r()*.035})`;

    x.lineWidth=
      2+r()*8;

    x.beginPath();

    x.moveTo(
      r()*480,
      r()*610
    );

    x.lineTo(
      r()*480,
      r()*610
    );

    x.stroke();
  }

  /*
     dark foreground
  */

  x.fillStyle='rgba(6,9,11,.70)';

  x.fillRect(
    0,
    414,
    480,
    196
  );

  /*
     warm distant lights
  */

  for(let i=0;i<4;i++){

    const px=
      65+r()*350;

    const py=
      280+r()*110;

    x.fillStyle=
      'rgba(231,178,105,.52)';

    x.fillRect(
      px,
      py,
      8+r()*15,
      12+r()*22
    );
  }

  /*
     mist
  */

  const mist=
    x.createLinearGradient(
      0,
      310,
      0,
      470
    );

  mist.addColorStop(
    0,
    'rgba(210,220,218,0)'
  );

  mist.addColorStop(
    .5,
    'rgba(210,220,218,.07)'
  );

  mist.addColorStop(
    1,
    'rgba(210,220,218,0)'
  );

  x.fillStyle=mist;

  x.fillRect(
    0,
    300,
    480,
    180
  );

  /*
     canvas grain
  */

  for(let i=0;i<1300;i++){

    x.fillStyle=
      `rgba(255,255,255,${.006+r()*.018})`;

    x.fillRect(
      r()*480,
      r()*610,
      1,
      1
    );
  }

  const t=new THREE.CanvasTexture(c);

  t.encoding=THREE.sRGBEncoding;

  t.anisotropy=
    Math.min(
      renderer.capabilities.getMaxAnisotropy(),
      4
    );

  paintingTextureCache.set(
    key,
    t
  );

  return t;
}


function addPainting(
  group,
  x,
  y,
  z,
  rotationY,
  seed,
  scale=1,
  note='A quiet little piece from the gallery.'
){

  const w=1.02*scale;
  const h=1.30*scale;
  const t=.055*scale;

  const art=new THREE.Mesh(
    new THREE.PlaneGeometry(
      w,
      h
    ),
    new THREE.MeshStandardMaterial({
      map:paintingCanvas(seed),
      roughness:.80,
      emissive:0x211613,
      emissiveIntensity:.18,
      side:THREE.DoubleSide
    })
  );

  art.position.set(
    x,y,z
  );

  art.rotation.y=rotationY;

  group.add(art);


  /*
     real wooden frame
  */

  const sideWall=
    Math.abs(
      Math.abs(rotationY)-Math.PI/2
    )<.25;

  if(sideWall){

    box(
      x,
      y+h/2+.035,
      z,
      t,
      .065,
      w+.12,
      M.darkWood,
      group
    );

    box(
      x,
      y-h/2-.035,
      z,
      t,
      .065,
      w+.12,
      M.darkWood,
      group
    );

    box(
      x,
      y,
      z-w/2-.035,
      .065,
      h+.12,
      t,
      M.darkWood,
      group
    );

    box(
      x,
      y,
      z+w/2+.035,
      .065,
      h+.12,
      t,
      M.darkWood,
      group
    );

  }else{

    box(
      x,
      y+h/2+.035,
      z,
      w+.12,
      .065,
      t,
      M.darkWood,
      group
    );

    box(
      x,
      y-h/2-.035,
      z,
      w+.12,
      .065,
      t,
      M.darkWood,
      group
    );

    box(
      x-w/2-.035,
      y,
      z,
      .065,
      h+.12,
      t,
      M.darkWood,
      group
    );

    box(
      x+w/2+.035,
      y,
      z,
      .065,
      h+.12,
      t,
      M.darkWood,
      group
    );
  }


  art.userData.title=
    artNames[
      Math.abs(seed-1)%artNames.length
    ];

  art.userData.note=note;

  art.userData.painting=true;

  clickable.push(art);

  return art;
}

  scene.add(g);

  const inner=
    side*HALL_HALF;

  const outer=
    side*(HALL_HALF+ROOM_W);

  const cx=
    side*(HALL_HALF+ROOM_W/2);

  const a=
    center-ROOM_L/2;

  const b=
    center+ROOM_L/2;


  /*
     wooden floor
  */

  box(
    cx,
    -.07,
    center,
    ROOM_W,
    .14,
    ROOM_L,
    M.floor,
    g,
    false,
    true
  );


  /*
     ceiling
  */

  box(
    cx,
    ROOM_H+.02,
    center,
    ROOM_W,
    .16,
    ROOM_L,
    M.darkWood,
    g,
    false,
    true
  );


  /*
     outside wall
  */

  box(
    outer,
    ROOM_H/2,
    center,
    .18,
    ROOM_H,
    ROOM_L,
    wallMaterial,
    g,
    false,
    true
  );


  /*
     far walls
  */

  box(
    cx,
    ROOM_H/2,
    a,
    ROOM_W,
    ROOM_H,
    .18,
    wallMaterial,
    g,
    false,
    true
  );

  box(
    cx,
    ROOM_H/2,
    b,
    ROOM_W,
    ROOM_H,
    .18,
    wallMaterial,
    g,
    false,
    true
  );


  /*
     trim
  */

  box(
    outer-side*.11,
    .56,
    center,
    .10,
    .12,
    ROOM_L,
    M.darkWood,
    g,
    false,
    true
  );

  box(
    outer-side*.11,
    4.43,
    center,
    .11,
    .17,
    ROOM_L,
    M.wood,
    g,
    false,
    true
  );


  return {
    g,
    center,
    side,
    inner,
    outer,
    cx,
    a,
    b,
    ceiling:g.children[1]
  };
}

  q.position.set(x,0,z); q.rotation.y=rotation; g.add(q);
  const wall=new THREE.MeshStandardMaterial({map:wood(seed,false),roughness:.96});

  // proper gabled roof: two sloping planes
  for(const side of[-1,1]){
    const roof=new THREE.Mesh(new THREE.BoxGeometry(2.25*scale,.24*scale,4.25*scale),M.darkWood);
    roof.position.set(side*1.02*scale,2.38*scale,0);
    roof.rotation.z=side<0?.56:-.56;
    roof.castShadow=true; q.add(roof);
  }
  // front-facing facade on local -x
  box(-1.86*scale,.82*scale,0,.07,1.45*scale,.72*scale,M.darkWood,q);
  for(const zz of[-1.08,1.08]){
    box(-1.89*scale,1.36*scale,zz*scale,.06,.78*scale,.72*scale,
      cmat(warm?0xd39b5b:0x202b31,.30,warm?0x8a5422:0,warm?.75:0),q,false,true);
    box(-1.93*scale,1.36*scale,zz*scale,.08,.86*scale,.08,M.darkWood,q);

function movieScreenTexture(){
  const c=document.createElement('canvas');
  c.width=900; c.height=520;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,520);
  g.addColorStop(0,'#07121d'); g.addColorStop(.55,'#173b4d'); g.addColorStop(1,'#050709');
  x.fillStyle=g; x.fillRect(0,0,900,520);
  // cinematic night scene / movie still
  x.fillStyle='#081016'; x.fillRect(0,300,900,220);
  x.fillStyle='#203946';
  x.beginPath(); x.moveTo(0,360); x.lineTo(190,250); x.lineTo(350,335); x.lineTo(500,235); x.lineTo(690,330); x.lineTo(900,245); x.lineTo(900,520); x.lineTo(0,520); x.closePath(); x.fill();
  x.fillStyle='#101b20'; x.fillRect(370,265,145,150);
  x.fillStyle='#d6a45e'; x.fillRect(395,300,32,55); x.fillRect(450,300,32,55);
  x.fillStyle='#c9e5ef'; x.beginPath(); x.arc(705,125,55,0,Math.PI*2); x.fill();
  x.fillStyle='rgba(210,235,245,.22)';
  for(let i=0;i<14;i++){ x.fillRect(35+i*65,70+(i%5)*35,2,2); }
  x.fillStyle='rgba(230,240,245,.78)'; x.font='bold 28px Georgia'; x.textAlign='center'; x.fillText('THE NIGHT',450,475);
  return new THREE.CanvasTexture(c);
}

function galleryPainting(group,x,y,z,rotationY,seed,scale,note,wallSide){
  const art=addPainting(group,x,y,z,rotationY,seed,scale,note);
  art.material.emissive= new THREE.Color(0x34302b);
  art.material.emissiveIntensity=.30;
  const s=wallSide;
  const inwardX = Math.abs(Math.abs(rotationY)-Math.PI/2)<.25 ? x - s*.34 : x;
  const light=new THREE.PointLight(0xffd9a0,.22,3.8,2);
  light.position.set(inwardX,y+.12,z);
  group.add(light);
  return art;
}

function buildCinema(r){
  const g=r.g, s=r.side;
  const floor=new THREE.MeshStandardMaterial({map:carpet(41,'#302329'),roughness:1});
  box(r.cx,.012,r.center,ROOM_W-.20,.035,ROOM_L-.20,floor,g,false,true);

  const screenX=r.outer-s*.20;
  box(screenX,2.62,r.center,.18,3.12,5.55,M.darkWood,g);
  const movie=new THREE.Mesh(new THREE.PlaneGeometry(4.95,2.62),new THREE.MeshStandardMaterial({map:movieScreenTexture(),roughness:.82,emissive:0x182a31,emissiveIntensity:.32,side:THREE.DoubleSide}));
  movie.position.set(screenX-s*.13,2.63,r.center); movie.rotation.y=s>0?Math.PI/2:-Math.PI/2; g.add(movie);
  for(const zside of[-1,1]){

  // Seats face the projector/screen, not the hallway.
  for(let row=0;row<4;row++){
    const x=r.inner+s*(2.25+row*1.55);
    for(let col=-2;col<=2;col++) theaterSeat(g,x,r.center+col*1.05,s*Math.PI/2);
  }

  // Clear, recognizable 35mm projector at the rear, aimed at the screen.
  const boothX=r.outer-s*5.45;

  for(let i=0;i<5;i++) galleryPainting(g,screenX-s*.13,1.62,r.a+2.0+i*4.35,-s*Math.PI/2,2000+i,.40,'A framed work hanging in the old cinema.',s);

  // Extra believable cinema clutter: aisle lamps, ticket stand, bins and stacked film cans.
  for(const z of[r.a+5.0,r.a+9.2,r.a+13.4,r.a+17.6]){
    cyl(r.inner+s*1.15,.72,z,.035,1.30,M.brass,10,g);
    sphere(r.inner+s*1.15,1.42,z,.10,cmat(0x9db9c4,.3,0x4c7180,1.0),g);
  }
  box(r.inner+s*1.25,.85,r.b-2.0,.95,.12,1.25,M.darkWood,g);
  for(let i=0;i<5;i++){
    cyl(r.inner+s*1.25,.99,r.b-2.45+i*.23,.16,.08,M.oldMetal,20,g);
  }
  for(let i=0;i<4;i++){

function addBluePainting(group,x,y,z,rotationY,scale,note){
  const c=document.createElement('canvas'); c.width=260; c.height=330;
  const ctx=c.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,260,330);
  grad.addColorStop(0,'#0b2742');
  grad.addColorStop(.45,'#155c7d');
  grad.addColorStop(1,'#76b5ce');
  ctx.fillStyle=grad; ctx.fillRect(0,0,260,330);
  for(let i=0;i<9;i++){
    ctx.strokeStyle=`rgba(190,225,238,${.12+i*.008})`;
    ctx.lineWidth=2+i%2;
    ctx.beginPath(); ctx.moveTo(20+i*27,300); ctx.lineTo(100+i*11,70+i*12); ctx.lineTo(230-i*16,250); ctx.stroke();
  }
  const art=new THREE.Mesh(new THREE.PlaneGeometry(1.02*scale,1.30*scale),new THREE.MeshStandardMaterial({map:texture(c,1,1),roughness:.84,side:THREE.DoubleSide}));
  art.position.set(x,y,z); art.rotation.y=rotationY; group.add(art);
  const w=1.02*scale,h=1.30*scale,t=.055*scale;
  if(Math.abs(Math.abs(rotationY)-Math.PI/2)<.25){
    box(x,y+h/2+.035,z,t,.065,w+.12,M.darkWood,group);
    box(x,y-h/2-.035,z,t,.065,w+.12,M.darkWood,group);
    box(x,y,z-w/2-.035,.065,h+.12,t,M.darkWood,group);
    box(x,y,z+w/2+.035,.065,h+.12,t,M.darkWood,group);
  } else {
    box(x,y+h/2+.035,z,w+.12,.065,t,M.darkWood,group);
    box(x,y-h/2-.035,z,w+.12,.065,t,M.darkWood,group);
    box(x-w/2-.035,y,z,.065,h+.12,t,M.darkWood,group);
    box(x+w/2+.035,y,z,.065,h+.12,t,M.darkWood,group);
  }
  art.userData.title=artNames[Math.abs(scale*100+z)%artNames.length];
  art.userData.note=note; art.userData.painting=true; clickable.push(art); return art;
}

function buildSnow(r){
  const g=r.g, s=r.side;
  r.ceiling.visible=false;

  // BLUE-ONLY palette: Prussian, phthalo, cerulean and pale blue values.
  const blue={
    deep:makeBlueMaterial(0x071a31,1),
    prussian:makeBlueMaterial(0x102d4a,.98),
    phthalo:makeBlueMaterial(0x075b78,.96),
    cerulean:makeBlueMaterial(0x3d88aa,.94),
    light:makeBlueMaterial(0x9ccfe1,.88),
    snow:makeBlueMaterial(0x78b5ce,.96),
    dark:makeBlueMaterial(0x0b223b,.99)
  };

  box(r.cx,.012,r.center,ROOM_W-.05,.035,ROOM_L-.05,blue.prussian,g,false,true);

  // Paint every room wall blue as well — no neutral shell remains visible.
  // Blue inner wall, but preserve the actual hallway doorway opening.
  const doorA=r.center-DOOR_HALF, doorB=r.center+DOOR_HALF;
  box(r.inner+s*.07,2.30,(r.a+doorA)/2,.07,4.35,doorA-r.a,blue.deep,g,false,true);
  box(r.inner+s*.07,2.30,(doorB+r.b)/2,.07,4.35,r.b-doorB,blue.deep,g,false,true);
  box(r.outer-s*.07,2.30,r.center,.07,4.35,ROOM_L-.20,blue.prussian,g,false,true);
  box(r.cx,2.30,r.a+.07,ROOM_W-.20,4.35,.07,blue.deep,g,false,true);
  box(r.cx,2.30,r.b-.07,ROOM_W-.20,4.35,.07,blue.prussian,g,false,true);
  // Vertical blue timber strips break up the flat wall planes.
  for(const zz of[r.a+1.5,r.a+5.5,r.a+9.5,r.a+13.5,r.a+17.5,r.a+21.5]){
    box(r.outer-s*.13,2.25,zz,.10,4.15,.10,blue.phthalo,g);
  }
  // raised snow banks instead of a z-fighting snow sheet
  for(let i=0;i<13;i++){
    const z=r.a+.9+i*1.82;
    const bank=sphere(r.cx+s*(i%2?2.5:4.5),.13,z,.72,blue.snow,g);
    bank.scale.set(1.8,.30,1.25);
  }
  // blue path through the snow
  box(r.inner+s*3.2,.035,r.center,1.8,.06,23.0,blue.deep,g,false,true);

  // Cozy Christmas cabin, still entirely blue.
  const q=new THREE.Group(); q.position.set(r.outer-s*3.55,0,r.center-1.2); q.rotation.y=s<0?Math.PI/2:-Math.PI/2; g.add(q);
  box(0,1.10,0,5.4,2.2,6.0,blue.prussian,q);
  // Gabled roof made from sloped planes, with a triangular-looking front rather than a flat block.
  for(const side of[-1,1]){
    const roof=new THREE.Mesh(new THREE.BoxGeometry(3.25,.22,6.35),blue.deep); roof.position.set(side*1.34,2.55,0); roof.rotation.z=side<0?.57:-.57; q.add(roof);
    const snow=new THREE.Mesh(new THREE.BoxGeometry(3.38,.12,6.48),blue.cerulean); snow.position.set(side*1.34,2.70,0); snow.rotation.z=side<0?.57:-.57; q.add(snow);
  }
  // Front facade, door, porch and windows give it a readable rural Christmas-house silhouette.
  box(-2.73,1.02,0,.10,1.78,1.05,blue.dark,q);
  box(-2.80,.12,0,.85,.16,2.10,blue.dark,q);
  for(const zz of[-1.62,1.62]){
    box(-2.78,1.40,zz,.08,.95,1.15,blue.phthalo,q,false,true);
    box(-2.83,1.40,zz,.10,1.02,.08,blue.dark,q);
    box(-2.83,1.40,zz,.10,.08,1.12,blue.dark,q);
  }
  for(const zz of[-1.65,1.65]){
    box(-2.94,1.45,zz,.055,1.08,1.18,cmat(0x5fb1cf,.25,0x173e5c,1.0),q,false,true);
    box(-2.98,1.45,zz,.08,1.18,.08,blue.dark,q);
  }
  box(-3.45,.32,0,.90,.18,7.1,blue.dark,q);
  for(const zz of[-2.75,2.75]) cyl(-3.52,1.25,zz,.07,2.1,blue.dark,12,q);
  const doorGlow=new THREE.PointLight(0x4da7cf,.65,5.5,2); doorGlow.position.set(-3.62,2.15,0); q.add(doorGlow);

  // Christmas trees with blue-only ornaments and lights.
  const treeX=r.outer-s*5.25;
  const treePositions=[[-1.9,.72],[0,.88],[2.0,.70],[3.65,.62]];
  for(const [dz,sc] of treePositions) blueChristmasTree(g,treeX+s*(dz%2?.45:0),r.center+dz,sc,blue);
  // Blue garlands along the cabin porch.
  for(let i=0;i<11;i++){
    sphere(r.outer-s*3.52,2.22,r.a+1+i*2.0,.045,blue.light,g);
    if(i<10) lineBetween(new THREE.Vector3(r.outer-s*3.52,2.18,r.a+1+i*2),new THREE.Vector3(r.outer-s*3.52,2.18,r.a+3+i*2),.018,blue.cerulean,g);
  }
  // Blue gift boxes for an unmistakable Christmas atmosphere.
  for(let i=0;i<5;i++){
    const bx=r.outer-s*(2.35+(i%2)*.5), bz=r.center-2.1+(i-2)*.72;
    box(bx,.22,bz,.48,.42,.55,[blue.phthalo,blue.cerulean,blue.prussian][i%3],g);
    box(bx,.44,bz,.07,.035,.58,blue.light,g);
    box(bx,.44,bz,.50,.035,.07,blue.light,g);
  }

  // Sparse blue falling snow, kept well above the floor to avoid flicker.
  const arr=new Float32Array(190*3), rr=seeded(900+r.center);
  for(let i=0;i<190;i++){ arr[i*3]=r.cx+(rr()-.5)*13; arr[i*3+1]=.75+rr()*3.6; arr[i*3+2]=r.center+(rr()-.5)*21; }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({color:0x8fcbe0,size:.022,transparent:true,opacity:.62,depthWrite:false})); g.add(pts);

  for(let i=0;i<4;i++) galleryPainting(g,r.outer-s*.13,1.62,r.a+2.2+i*4.7,-s*Math.PI/2,2600+i,.40,'A winter painting inside the blue quiet of the snowfall.',s);
}

  const geo=new THREE.ExtrudeGeometry(shape,{depth:.18,bevelEnabled:true,bevelSegments:2,bevelSize:.035,bevelThickness:.035});

  // unmistakable cross-shaped lid hardware
  box(0,1.34,0,.09,.05,.72,M.brass,q,false,true);
  box(0,1.34,0,.52,.05,.09,M.brass,q,false,true);
  return q;
}

function hangingChain(g,x,z){
  for(let i=0;i<9;i++){
    const link=new THREE.Mesh(new THREE.TorusGeometry(.09,.025,8,14),M.oldMetal);
    link.position.set(x,.72+i*.28,z);
    link.rotation.x=i%2?Math.PI/2:0;
    g.add(link);
  }
}

function buildHorror(r){
  const g=r.g, s=r.side;
  box(r.cx,.012,r.center,ROOM_W-.1,.035,ROOM_L-.1,new THREE.MeshStandardMaterial({map:wood(77,true),roughness:1}),g,false,true);
  // Dark red-brown haunted-house wallpaper.
  const horrorWall=new THREE.MeshStandardMaterial({map:wallpaper(180,'#38242b'),roughness:.98});
  for(const side of[-1,1]){
    box(r.cx+side*7.42,2.35,r.center,.08,4.55,23.2,horrorWall,g,false,true);
  }

  const fx=r.outer-s*.16;
  realFireplace(g,fx,r.center,s,false);
  const rug=new THREE.Mesh(new THREE.CircleGeometry(2.75,48),new THREE.MeshStandardMaterial({map:carpet(79,'#24151d'),roughness:1}));
  rug.rotation.x=-Math.PI/2; rug.position.set(r.cx-s*2.8,.035,r.center); g.add(rug);

  // Furniture deliberately arranged toward the fireplace, but old and unsettling.
  sofa(g,r.outer-s*4.75,r.center-1.65,M.creamFabric,s*Math.PI/2);
  armchair(g,r.outer-s*5.55,r.center+2.35,M.olive,s*Math.PI/2);
  roundTable(g,r.outer-s*3.85,r.center-1.45);
  grandClock(g,r.outer-s*2.25,r.center-4.7);
  box(r.outer-s*.30,1.50,r.center+4.3,.55,2.95,2.20,M.darkWood,g);
  for(let i=0;i<4;i++) box(r.outer-s*.59,.78+i*.53,r.center+4.3,.05,.06,1.85,M.brass,g,false,true);

  // Boarded window + moonlight.
  const wx=r.outer-s*.14;
  box(wx,2.35,r.center+6.2,.05,2.55,2.85,cmat(0x11161c,.48),g,false,true);
  for(const zz of[r.center+4.82,r.center+6.2,r.center+7.58]) box(wx-s*.04,2.35,zz,.09,2.70,.12,M.darkWood,g);
  for(const yy of[1.55,2.15,2.75]) lineBetween(new THREE.Vector3(wx-s*.07,yy,r.center+4.95),new THREE.Vector3(wx-s*.07,yy,r.center+7.45),.035,M.darkWood,g);
  const moon=new THREE.PointLight(0x627b96,.24,6,2); moon.position.set(wx-s*.8,2.4,r.center+6.2); g.add(moon);

  // Explicit horror cues: portraits, chandelier, candles, cracked-looking marks and a coffin-like chest.
  horrorPortrait(g,r.inner+s*.10,r.a+2.2,s,301);
  horrorPortrait(g,r.outer-s*.13,r.center-1.0,-s,302);
  horrorPortrait(g,r.outer-s*.13,r.center+2.9,-s,303);
  hangingChandelier(g,r.cx,r.center-1.2);
  // A large, unmistakable coffin makes the horror theme immediately readable.
  horrorCoffin(g,r.outer-s*4.0,r.center+2.8,s*Math.PI/2);
  hangingChain(g,r.outer-s*.62,r.center-3.7);
  hangingChain(g,r.outer-s*.62,r.center+4.2);
  // Boarded window and coffin are reinforced with a few old warning placards.
  box(r.cx-s*5.1,2.72,r.center+4.85,.06,.58,1.30,cmat(0x22151b,.9),g,false,true);
  for(const [x,z] of[[r.cx-s*3.0,r.center-5.2],[r.cx-s*5.2,r.center+1.0],[r.cx-s*4.4,r.b-2.2]]){
    cyl(x,.92,z,.035,.35,M.paper,12,g);
    sphere(x,1.14,z,.045,cmat(0xffb45e,.2,0xff7020,2),g);
    const l=new THREE.PointLight(0xff9852,.25,3.5,2); l.position.set(x,1.12,z); g.add(l);
  }
  // Creeping dark red streaks on the floor/wall as atmosphere, not gore.
  for(let i=0;i<7;i++){
    lineBetween(new THREE.Vector3(r.cx-s*(4.9+(i%2)*.5),.045,r.a+2+i*2.4),new THREE.Vector3(r.cx-s*(4.3+(i%2)*.4),.05,r.a+2.4+i*2.4),.018,cmat(0x3c151f,.95),g);
  }
  for(let i=0;i<4;i++) galleryPainting(g,r.outer-s*.13,1.62,r.a+2.2+i*4.7,-s*Math.PI/2,2500+i,.40,'An unsettling portrait displayed in the haunted house.',s);
  for(let i=0;i<3;i++) galleryPainting(g,r.inner+s*.08,1.62,r.a+3.0+i*5.2,s*Math.PI/2,2550+i,.40,'An unsettling portrait displayed along the interior wall.',-s);
  addParticles(g,r,'dust',120,0xb9a9aa,.012,.14);
}



/* ============================================================
   PARTICLES
   ============================================================ */

function addParticles(
  g,
  r,
  type,
  count,
  color,
  size,
  opacity
){

  const arr=
    new Float32Array(
      count*3
    );

  const rr=
    seeded(
      500+r.center
    );

  for(let i=0;i<count;i++){

    arr[i*3]=
      r.cx+
      (rr()-.5)*13;

    arr[i*3+1]=
      .2+
      rr()*4.1;

    arr[i*3+2]=
      r.center+
      (rr()-.5)*21;
  }


  const geo=
    new THREE.BufferGeometry();

  geo.setAttribute(
    'position',
    new THREE.BufferAttribute(
      arr,
      3
    )
  );


  const points=
    new THREE.Points(
      geo,
      new THREE.PointsMaterial({
        color,
        size,
        transparent:true,
        opacity,
        depthWrite:false
      })
    );


  points.userData.particleType=type;

  g.add(points);
}


/* ============================================================
   BUILD FIVE ROOMS
   ============================================================ */

const rooms=[];

for(
  let i=0;
  i<lobbyInfo.length;
  i++
){

  const info=lobbyInfo[i];

  const r=roomShell(
    lobbyCenters[i],
    info.side,
    info.type==='horror'
      ?M.wallDark
      :M.wall
  );

  rooms.push(r);

  if(info.type==='cinema')
    buildCinema(r);

  if(info.type==='cottage')
    buildCottage(r);

  if(info.type==='snow')
    buildSnow(r);

  if(info.type==='street')
    buildStreet(r);

  if(info.type==='horror')
    buildHorror(r);
}


/* ============================================================
   ROOM LIGHTING
   ============================================================ */

function roomLighting(
  room,
  type
){

  const colors={
    cinema:0x9fc7d9,
    cottage:0xffbd78,
    snow:0x5f9fc1,
    street:0x7c9eb3,
    horror:0x9d7562
  };

  const color=
    colors[type]||0xffd5ae;


  /*
     intentionally subdued.
     Most illumination should come
     from objects, not a giant ambient light.
  */

  const l1=
    new THREE.PointLight(
      color,
      type==='horror'?.20:(type==='cinema'?.55:.38),
      10,
      2
    );

  l1.position.set(
    room.cx,
    3.8,
    room.center-3
  );

  room.g.add(l1);


  const l2=
    new THREE.PointLight(
      color,
      type==='horror'?.14:(type==='cinema'?.34:.24),
      8,
      2
    );

  l2.position.set(
    room.cx,
    2.7,
    room.center+5
  );

  room.g.add(l2);
}


for(let i=0;i<rooms.length;i++){

  roomLighting(
    rooms[i],
    lobbyInfo[i].type
  );
}


/* ============================================================
   MOVEMENT
   ============================================================ */

const keys={};

let yaw=Math.PI;
let pitch=0;

let controlsEnabled=false;
let pointerLocked=false;

let vx=0;
let vz=0;

let footTimer=0;


document.addEventListener(
  'keydown',
  e=>keys[e.code]=true
);

document.addEventListener(
  'keyup',
  e=>keys[e.code]=false
);


renderer.domElement.addEventListener(
  'click',
  ()=>{
    if(!controlsEnabled)return;

    if(
      document.pointerLockElement!==
      renderer.domElement
    ){

      renderer.domElement.requestPointerLock?.();

    }else{

      clickPainting();
    }
  }
);


document.addEventListener(
  'pointerlockchange',
  ()=>{
    pointerLocked=
      document.pointerLockElement===
      renderer.domElement;
  }
);


document.addEventListener(
  'mousemove',
  e=>{

    if(!pointerLocked)return;

    yaw-=e.movementX*.00225;

    pitch-=
      e.movementY*.00185;

    pitch=
      Math.max(
        -Math.PI/2+.08,
        Math.min(
          Math.PI/2-.08,
          pitch
        )
      );
  }
);


function move(dt){

  if(!controlsEnabled)return;

  let ax=0;
  let az=0;

  if(keys.KeyA)ax--;
  if(keys.KeyD)ax++;
  if(keys.KeyW)az--;
  if(keys.KeyS)az++;


  if(ax||az){

    const len=
      Math.hypot(
        ax,
        az
      );

    ax/=len;
    az/=len;


    const speed=2.75;

    const fx=-Math.sin(yaw);
    const fz=-Math.cos(yaw);

    const rx=Math.cos(yaw);
    const rz=-Math.sin(yaw);


    const tx=
      (rx*ax+fx*az)*speed;

    const tz=
      (rz*ax+fz*az)*speed;


    vx+=
      (tx-vx)*
      Math.min(
        1,
        dt*12
      );

    vz+=
      (tz-vz)*
      Math.min(
        1,
        dt*12
      );


    footTimer+=dt;

    if(footTimer>.43){

      footstep();

      footTimer=0;
    }

  }else{

    vx*=
      Math.pow(
        .001,
        dt
      );

    vz*=
      Math.pow(
        .001,
        dt
      );
  }


  const nx=
    camera.position.x+
    vx*dt;

  const nz=
    camera.position.z+
    vz*dt;


  if(
    canMove(
      nx,
      camera.position.z
    )
  ){

    camera.position.x=nx;

  }else{

    vx=0;
  }


  if(
    canMove(
      camera.position.x,
      nz
    )
  ){

    camera.position.z=nz;

  }else{

    vz=0;
  }


  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}


/* ============================================================
   PAINTING INTERACTION
   ============================================================ */

const raycaster=
  new THREE.Raycaster();


function clickPainting(){

  raycaster.setFromCamera(
    {
      x:0,
      y:0
    },
    camera
  );


  const hits=
    raycaster.intersectObjects(
      clickable,
      false
    );


  if(!hits.length)return;


  const p=
    hits[0].object;


  document.getElementById(
    'noteTitle'
  ).textContent=
    p.userData.title;


  document.getElementById(
    'noteText'
  ).textContent=
    p.userData.note;


  document.getElementById(
    'noteModal'
  ).style.display='flex';


  document.exitPointerLock?.();
}


document.getElementById(
  'noteClose'
).onclick=()=>{

  document.getElementById(
    'noteModal'
  ).style.display='none';
};


document.getElementById(
  'noteModal'
).onclick=e=>{

  if(
    e.target.id==='noteModal'
  ){

    e.target.style.display='none';
  }
};


/* ============================================================
   AUDIO
   ============================================================ */

let audioCtx=null;
let masterGain=null;
let audioOn=true;


function setupAudio(){

  try{

    audioCtx=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

    masterGain=
      audioCtx.createGain();

    masterGain.gain.value=.28;

    masterGain.connect(
      audioCtx.destination
    );


    /*
       extremely low gallery hum
    */

    const osc=
      audioCtx.createOscillator();

    const gain=
      audioCtx.createGain();

    const filter=
      audioCtx.createBiquadFilter();

    osc.type='sine';

    osc.frequency.value=49;

    gain.gain.value=.035;

    filter.type='lowpass';

    filter.frequency.value=140;

    osc.connect(filter);

    filter.connect(gain);

    gain.connect(masterGain);

    osc.start();

  }catch(e){

    console.warn(e);
  }
}


function footstep(){

  if(
    !audioCtx||
    !audioOn
  )return;

  const o=
    audioCtx.createOscillator();

  const g=
    audioCtx.createGain();

  const t=
    audioCtx.currentTime;

  o.type='triangle';

  o.frequency.setValueAtTime(
    82+Math.random()*13,
    t
  );

  o.frequency.exponentialRampToValueAtTime(
    42,
    t+.11
  );

  g.gain.setValueAtTime(
    .0001,
    t
  );

  g.gain.exponentialRampToValueAtTime(
    .032,
    t+.014
  );

  g.gain.exponentialRampToValueAtTime(
    .0001,
    t+.11
  );

  o.connect(g);

  g.connect(masterGain);

  o.start(t);

  o.stop(t+.12);
}


function roomTone(type){

  if(
    !audioCtx||
    !audioOn
  )return;

  const frequencies={
    cinema:82,
    cottage:68,
    snow:124,
    street:91,
    horror:57
  };

  const f=
    frequencies[type]||65;


  const o=
    audioCtx.createOscillator();

  const g=
    audioCtx.createGain();

  const t=
    audioCtx.currentTime;


  o.type=
    type==='horror'
    ?'triangle'
    :'sine';

  o.frequency.setValueAtTime(
    f,
    t
  );

  o.frequency.exponentialRampToValueAtTime(
    f*.55,
    t+1.5
  );


  g.gain.setValueAtTime(
    .0001,
    t
  );

  g.gain.exponentialRampToValueAtTime(
    .014,
    t+.18
  );

  g.gain.exponentialRampToValueAtTime(
    .0001,
    t+1.55
  );


  o.connect(g);

  g.connect(masterGain);

  o.start(t);

  o.stop(t+1.6);
}


document.getElementById(
  'mute'
).onclick=()=>{

  audioOn=!audioOn;

  if(
    masterGain &&
    audioCtx
  ){

    masterGain.gain.setTargetAtTime(
      audioOn?.28:0,
      audioCtx.currentTime,
      .04
    );
  }

  document.getElementById(
    'mute'
  ).textContent=
    audioOn
    ?'SOUND ON'
    :'SOUND OFF';
};


/* ============================================================
   ROOM DETECTION
   ============================================================ */

let currentArea='hall';
let lastArea='hall';
let toneCooldown=0;


function detectRoom(){

  let area='hall';
  let idx=-1;


  for(
    let i=0;
    i<rooms.length;
    i++
  ){

    const r=rooms[i];

    const insideZ=
      camera.position.z>=r.a &&
      camera.position.z<=r.b;

    const beyond=
      r.side<0
      ?camera.position.x<-(HALL_HALF+.16)
      :camera.position.x>(HALL_HALF+.16);


    if(
      insideZ &&
      beyond
    ){

      area=
        lobbyInfo[i].type;

      idx=i;

      break;
    }
  }


  if(area!==lastArea){

    currentArea=area;
    lastArea=area;
    toneCooldown=0;

    roomTone(area);
  }


  document.getElementById(
    'roomLabel'
  ).textContent=
    idx>=0
    ?lobbyInfo[idx].name
    :'HALLWAY';
}


/* ============================================================
   ANIMATION
   ============================================================ */

let elapsed=0;


function animateWorld(dt){

  elapsed+=dt;


  /*
     old hallway lights gently flicker
  */

  for(
    const h of hallLights
  ){

    h.light.intensity=
      Math.max(
        .42,
        h.base+
        .025*
        Math.sin(
          elapsed*1.35+
          h.phase
        )+
        .012*
        Math.sin(
          elapsed*5.2+
          h.phase*1.6
        )
      );
  }


  /*
     particles
  */

  scene.traverse(
    o=>{

      const type=
        o.userData?.particleType;

      if(!type)return;


      const a=
        o.geometry
        .attributes
        .position
        .array;


      for(
        let i=0;
        i<a.length;
        i+=3
      ){

        if(type==='snow'){

          a[i+1]-=
            dt*.42;

          a[i]+=
            Math.sin(
              elapsed*.45+i
            )*
            dt*.004;

          if(a[i+1]<.2)
            a[i+1]=4.2;

        }

        else if(type==='rain'){

          a[i+1]-=
            dt*3.1;

          if(a[i+1]<.2)
            a[i+1]=4.2;

        }

        else{

          a[i+1]+=
            dt*.014;

          if(a[i+1]>4.3)
            a[i+1]=.25;
        }
      }


      o.geometry
        .attributes
        .position
        .needsUpdate=true;
    }
  );


  toneCooldown+=dt;

  if(
    currentArea!=='hall' &&
    toneCooldown>18
  ){

    roomTone(currentArea);

    toneCooldown=0;
  }
}


/* ============================================================
   WELCOME
   ============================================================ */

const welcome=
  document.getElementById(
    'welcome'
  );

const input=
  document.getElementById(
    'nameInput'
  );

const enter=
  document.getElementById(
    'enterBtn'
  );

const message=
  document.getElementById(
    'welcomeMessage'
  );


function escapeHTML(s){

  return s.replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[c])
  );
}


function enterGallery(){

  const name=
    input.value.trim()||
    'Guest';


  message.innerHTML=
    'Welcome, '+
    escapeHTML(name)+
    '. Your artwork is waiting for you in Lobby 1.';

  message.style.display='block';

  enter.style.display='none';

  input.style.display='none';


  setupAudio();


  if(
    audioCtx?.state==='suspended'
  ){

    audioCtx.resume();
  }


  setTimeout(
    ()=>{

      welcome.style.opacity='0';

      setTimeout(
        ()=>{

          welcome.style.display='none';

          controlsEnabled=true;

          renderer.domElement
            .requestPointerLock?.();

        },
        650
      );

    },
    850
  );
}


enter.onclick=enterGallery;

input.onkeydown=e=>{

  if(e.key==='Enter')
    enterGallery();
};


if(
  location.hash==='#preview'
){

  welcome.style.display='none';

  controlsEnabled=true;
}


setTimeout(
  ()=>{
    document
      .getElementById('loading')
      .classList
      .add('hide');
  },
  1400
);


/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener(
  'resize',
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* ============================================================
   LOOP
   ============================================================ */

let prev=
  performance.now();


function loop(){

  requestAnimationFrame(loop);


  const now=
    performance.now();

  const dt=
    Math.min(
      .05,
      (now-prev)/1000
    );

  prev=now;


  move(dt);

  detectRoom();

  setAtmosphere(
    currentArea
  );

  animateWorld(dt);

  renderer.render(
    scene,
    camera
  );
}


loop();
