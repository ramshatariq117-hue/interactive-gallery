<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ramsha Art Studio — Private Gallery</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07111b;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

#welcome{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 42%,rgba(35,86,126,.32),transparent 42%),
        linear-gradient(145deg,#081d31,#0b314d 55%,#071522);
    color:white;
}

.welcome-box{
    width:min(560px,90vw);
    text-align:center;
    padding:48px 38px 44px;
}

.welcome-box h1{
    margin:0 0 8px;
    font-family:Georgia,serif;
    font-size:clamp(34px,6vw,62px);
    font-weight:400;
    letter-spacing:.03em;
}

.welcome-box p{
    margin:0 auto 30px;
    max-width:430px;
    color:rgba(255,255,255,.72);
    line-height:1.7;
    font-size:14px;
}

#name{
    width:100%;
    max-width:320px;
    padding:14px 17px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:4px;
    background:rgba(255,255,255,.08);
    color:white;
    outline:none;
    font-size:15px;
    text-align:center;
}

#name::placeholder{
    color:rgba(255,255,255,.45);
}

#enter{
    display:block;
    margin:16px auto 0;
    padding:13px 28px;
    border:1px solid rgba(255,255,255,.25);
    border-radius:4px;
    background:rgba(255,255,255,.12);
    color:white;
    cursor:pointer;
    letter-spacing:.08em;
    font-size:12px;
    transition:.25s;
}

#enter:hover{
    background:rgba(255,255,255,.2);
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
    color:white;
    display:none;
}

#roomLabel{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    padding:9px 16px;
    background:rgba(20,15,12,.58);
    border:1px solid rgba(220,190,130,.28);
    color:#ead7ad;
    font-family:Georgia,serif;
    letter-spacing:.14em;
    font-size:11px;
    backdrop-filter:blur(4px);
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:7px;
    height:7px;
    margin:-3px 0 0 -3px;
    border:1px solid rgba(255,255,255,.75);
    border-radius:50%;
}

#hint{
    position:absolute;
    left:50%;
    bottom:32px;
    transform:translateX(-50%);
    padding:9px 15px;
    background:rgba(15,11,9,.7);
    border:1px solid rgba(255,255,255,.1);
    font-size:11px;
    color:rgba(255,255,255,.72);
}

#mute{
    position:absolute;
    right:22px;
    bottom:20px;
    pointer-events:auto;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(20,15,12,.65);
    color:#eee;
    border-radius:3px;
    padding:9px 12px;
    cursor:pointer;
    font-size:11px;
}

#note{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(3,5,7,.68);
    backdrop-filter:blur(5px);
}

.note-box{
    width:min(460px,88vw);
    background:#181411;
    border:1px solid rgba(210,175,115,.35);
    padding:34px;
    color:#eee5d4;
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.note-box h2{
    font-family:Georgia,serif;
    font-weight:400;
    margin:0 0 12px;
}

.note-box p{
    color:#bdb3a3;
    line-height:1.65;
    font-size:14px;
}

#closeNote{
    margin-top:14px;
    background:none;
    border:1px solid rgba(255,255,255,.18);
    color:#eee;
    padding:9px 14px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="welcome">
    <div class="welcome-box">
        <h1>Ramsha Art Studio</h1>
        <p>
            A quiet private gallery hidden inside an old house.
            Take your time. Wander through the rooms.
        </p>

        <input id="name" placeholder="Your name" maxlength="28">
        <button id="enter">ENTER GALLERY</button>
    </div>
</div>

<div id="hud">
    <div id="roomLabel">PRIVATE GALLERY</div>
    <div id="crosshair"></div>
    <div id="hint">WASD to walk · Mouse to look · Click a painting</div>
    <button id="mute">SOUND ON</button>
</div>

<div id="note">
    <div class="note-box">
        <h2 id="noteTitle"></h2>
        <p id="noteText"></p>
        <button id="closeNote">CLOSE</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   BASIC SETUP
============================================================ */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x10131a);
scene.fog = new THREE.FogExp2(0x10131a,0.012);

const camera = new THREE.PerspectiveCamera(
    68,
    innerWidth/innerHeight,
    0.05,
    220
);

camera.position.set(0,1.62,5);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.92;

document.body.appendChild(renderer.domElement);


/* ============================================================
   CONSTANTS
============================================================ */

const HALL_W = 3.2;
const HALL_HALF = HALL_W/2;

const HALL_LENGTH = 132;
const WALL_H = 4.8;

const ROOM_W = 15;
const ROOM_D = 24;
const ROOM_H = 4.8;

const DOOR_W = 2.35;
const DOOR_H = 3.55;

const ROOM_DATA = [
    {
        id:1,
        name:"Lobby I · The Playroom",
        z:18,
        side:-1,
        theme:"play"
    },
    {
        id:2,
        name:"Lobby II · Winter House",
        z:43,
        side:1,
        theme:"winter"
    },
    {
        id:3,
        name:"Lobby III · The Cottage",
        z:68,
        side:-1,
        theme:"cottage"
    },
    {
        id:4,
        name:"Lobby IV · The Street",
        z:93,
        side:1,
        theme:"street"
    },
    {
        id:5,
        name:"Lobby V · The Old Sitting Room",
        z:118,
        side:-1,
        theme:"abandoned"
    }
];


/* ============================================================
   MATERIAL / TEXTURE HELPERS
============================================================ */

function canvasTexture(draw,w=512,h=512){

    const c=document.createElement("canvas");
    c.width=w;
    c.height=h;

    const ctx=c.getContext("2d");
    draw(ctx,w,h);

    const t=new THREE.CanvasTexture(c);
    t.wrapS=THREE.RepeatWrapping;
    t.wrapT=THREE.RepeatWrapping;
    t.anisotropy=renderer.capabilities.getMaxAnisotropy();

    return t;
}


/* old burgundy wallpaper */

const wallpaperTex=canvasTexture((ctx,w,h)=>{

    ctx.fillStyle="#4a3032";
    ctx.fillRect(0,0,w,h);

    for(let x=0;x<w;x+=42){

        ctx.fillStyle=x%84===0
            ? "rgba(218,183,137,.035)"
            : "rgba(20,13,14,.04)";

        ctx.fillRect(x,0,18,h);
    }

    for(let i=0;i<500;i++){

        const x=Math.random()*w;
        const y=Math.random()*h;
        const a=.015+Math.random()*.055;

        ctx.fillStyle=`rgba(235,205,164,${a})`;
        ctx.fillRect(x,y,1+Math.random()*5,1+Math.random()*3);
    }

    for(let i=0;i<65;i++){

        const x=Math.random()*w;
        const y=Math.random()*h;

        ctx.fillStyle="rgba(18,12,12,.32)";
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x+8+Math.random()*20,y-2+Math.random()*8);
        ctx.lineTo(x+2+Math.random()*12,y+7+Math.random()*10);
        ctx.closePath();
        ctx.fill();
    }

    ctx.strokeStyle="rgba(205,169,116,.055)";
    ctx.lineWidth=2;

    for(let y=20;y<h;y+=55){

        ctx.beginPath();
        for(let x=0;x<w;x+=15){
            ctx.lineTo(x,y+Math.sin(x*.05)*2);
        }
        ctx.stroke();
    }

},512,512);

wallpaperTex.repeat.set(7,2);


/* wood */

const walnutTex=canvasTexture((ctx,w,h)=>{

    ctx.fillStyle="#34231d";
    ctx.fillRect(0,0,w,h);

    for(let i=0;i<80;i++){

        const y=Math.random()*h;

        ctx.strokeStyle=`rgba(170,113,72,${.04+Math.random()*.07})`;
        ctx.lineWidth=.6+Math.random()*1.2;

        ctx.beginPath();

        for(let x=0;x<w;x+=18){
            ctx.lineTo(x,y+Math.sin(x*.015+i)*2);
        }

        ctx.stroke();
    }

},512,512);

walnutTex.repeat.set(8,1);


/* floorboards */

const floorTex=canvasTexture((ctx,w,h)=>{

    ctx.fillStyle="#5a4334";
    ctx.fillRect(0,0,w,h);

    const plankH=52;

    for(let y=0;y<h;y+=plankH){

        ctx.fillStyle="rgba(20,13,9,.35)";
        ctx.fillRect(0,y,w,2);

        const offset=(Math.floor(y/plankH)%2)*95;

        for(let x=-offset;x<w;x+=190){

            ctx.strokeStyle="rgba(205,161,111,.10)";
            ctx.lineWidth=1;

            ctx.strokeRect(x+2,y+4,185,plankH-8);

            for(let k=0;k<7;k++){

                ctx.strokeStyle="rgba(25,15,10,.10)";
                ctx.beginPath();
                ctx.moveTo(x+8,y+9+k*6);
                ctx.bezierCurveTo(
                    x+55,y+5+k*7,
                    x+120,y+13+k*4,
                    x+178,y+7+k*6
                );
                ctx.stroke();
            }
        }
    }

},768,768);

floorTex.repeat.set(4,8);


/* carpet */

const carpetTex=canvasTexture((ctx,w,h)=>{

    ctx.fillStyle="#40272b";
    ctx.fillRect(0,0,w,h);

    ctx.strokeStyle="#9b7444";
    ctx.lineWidth=13;
    ctx.strokeRect(15,15,w-30,h-30);

    ctx.strokeStyle="rgba(218,183,116,.4)";
    ctx.lineWidth=3;
    ctx.strokeRect(28,28,w-56,h-56);

    for(let y=65;y<h-40;y+=90){

        for(let x=55;x<w-40;x+=100){

            ctx.strokeStyle="rgba(207,174,116,.17)";
            ctx.lineWidth=3;

            ctx.beginPath();
            ctx.moveTo(x,y-16);
            ctx.lineTo(x+16,y);
            ctx.lineTo(x,y+16);
            ctx.lineTo(x-16,y);
            ctx.closePath();
            ctx.stroke();
        }
    }

},512,1024);

carpetTex.repeat.set(1,7);


/* wood planks for winter room */

const cabinWallTex=canvasTexture((ctx,w,h)=>{

    ctx.fillStyle="#4d3b2d";
    ctx.fillRect(0,0,w,h);

    const plank=62;

    for(let y=0;y<h;y+=plank){

        ctx.fillStyle="rgba(18,12,8,.28)";
        ctx.fillRect(0,y,w,3);

        for(let i=0;i<15;i++){

            const yy=y+8+Math.random()*45;

            ctx.strokeStyle=`rgba(190,151,103,${.035+Math.random()*.07})`;
            ctx.beginPath();
            ctx.moveTo(0,yy);

            for(let x=0;x<w;x+=35){
                ctx.lineTo(x,yy+Math.sin(x*.025+i)*2);
            }

            ctx.stroke();
        }
    }

},512,512);

cabinWallTex.repeat.set(6,3);


/* faded plaster */

const plasterTex=canvasTexture((ctx,w,h)=>{

    ctx.fillStyle="#b6aa96";
    ctx.fillRect(0,0,w,h);

    for(let i=0;i<700;i++){

        const x=Math.random()*w;
        const y=Math.random()*h;

        ctx.fillStyle=`rgba(70,57,46,${.025+Math.random()*.07})`;
        ctx.fillRect(x,y,1+Math.random()*7,1+Math.random()*4);
    }

    for(let i=0;i<35;i++){

        const x=Math.random()*w;
        const y=Math.random()*h;

        ctx.strokeStyle="rgba(80,65,53,.16)";
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x+10+Math.random()*25,y+Math.random()*15);
        ctx.stroke();
    }

},512,512);

plasterTex.repeat.set(5,3);


/* ============================================================
   MATERIALS
============================================================ */

function mat(color,rough=.82,metal=0){

    return new THREE.MeshStandardMaterial({
        color,
        roughness:rough,
        metalness:metal
    });
}

const MAT={
    wallpaper:new THREE.MeshStandardMaterial({
        map:wallpaperTex,
        roughness:.95,
        metalness:0,
        side:THREE.DoubleSide
    }),

    walnut:new THREE.MeshStandardMaterial({
        map:walnutTex,
        roughness:.9,
        side:THREE.DoubleSide
    }),

    floor:new THREE.MeshStandardMaterial({
        map:floorTex,
        roughness:.92
    }),

    carpet:new THREE.MeshStandardMaterial({
        map:carpetTex,
        roughness:1
    }),

    brass:mat(0x80653e,.42,.72),

    oldGold:mat(0x876f4a,.55,.52),

    darkWood:mat(0x241914,.88),

    door:mat(0x3a2420,.88),

    cream:mat(0xc1b59d,.9),

    plaster:new THREE.MeshStandardMaterial({
        map:plasterTex,
        roughness:1
    }),

    cabinWall:new THREE.MeshStandardMaterial({
        map:cabinWallTex,
        roughness:.94
    }),

    black:mat(0x090706,1),

    glass:mat(0x6e91a4,.3,.05),

    stone:mat(0x625c52,1),

    stoneDark:mat(0x292724,1),

    brassLight:mat(0xa88b56,.35,.7),

    leather:mat(0x4a2924,.86),

    fadedBlue:mat(0x566c78,.9),

    fabric:mat(0x65514a,.95),

    dustyRed:mat(0x6d3c3d,.94)
};


/* ============================================================
   GEOMETRY HELPERS
============================================================ */

function box(parent,x,y,z,sx,sy,sz,material,rotY=0){

    const m=new THREE.Mesh(
        new THREE.BoxGeometry(sx,sy,sz),
        material
    );

    m.position.set(x,y,z);
    m.rotation.y=rotY;

    m.castShadow=true;
    m.receiveShadow=true;

    parent.add(m);

    return m;
}


function cylinder(parent,x,y,z,r,h,material,segments=16,rotX=0,rotZ=0){

    const m=new THREE.Mesh(
        new THREE.CylinderGeometry(r,r,h,segments),
        material
    );

    m.position.set(x,y,z);
    m.rotation.x=rotX;
    m.rotation.z=rotZ;

    m.castShadow=true;
    m.receiveShadow=true;

    parent.add(m);

    return m;
}


/* ============================================================
   WALL WITH REAL DOOR HOLES
============================================================ */

function wallShape(length,height,holes=[]){

    const shape=new THREE.Shape();

    shape.moveTo(-length/2,0);
    shape.lineTo(length/2,0);
    shape.lineTo(length/2,height);
    shape.lineTo(-length/2,height);
    shape.closePath();

    holes.forEach(center=>{

        const local=center;

        const a=local-DOOR_W/2-.035;
        const b=local+DOOR_W/2+.035;

        const p=new THREE.Path();

        /*
          Tiny floor sill is intentional so the geometry remains
          robust while still reading as a real doorway.
        */

        p.moveTo(a,.045);
        p.lineTo(b,.045);
        p.lineTo(b,DOOR_H+.035);
        p.lineTo(a,DOOR_H+.035);
        p.closePath();

        shape.holes.push(p);
    });

    return shape;
}


function makeWallWithDoors(parent,side,x,length,height,centers,material){

    const localCenters=centers.map(z=>{
        return side*(z);
    });

    const shape=wallShape(length,height,localCenters);

    const geo=new THREE.ShapeGeometry(shape);

    const mesh=new THREE.Mesh(geo,material);

    mesh.rotation.y=side<0
        ? -Math.PI/2
        : Math.PI/2;

    mesh.position.set(x,0,0);

    mesh.receiveShadow=true;

    parent.add(mesh);

    return mesh;
}


/* ============================================================
   HALLWAY
============================================================ */

const gallery=new THREE.Group();
scene.add(gallery);


/* continuous hallway walls */

makeWallWithDoors(
    gallery,
    -1,
    -HALL_HALF,
    HALL_LENGTH,
    WALL_H,
    ROOM_DATA.filter(r=>r.side===-1).map(r=>r.z-HALL_LENGTH/2),
    MAT.wallpaper
);

makeWallWithDoors(
    gallery,
    1,
    HALL_HALF,
    HALL_LENGTH,
    WALL_H,
    ROOM_DATA.filter(r=>r.side===1).map(r=>r.z-HALL_LENGTH/2),
    MAT.wallpaper
);


/*
  The previous implementation had visible gaps because wall
  pieces were individually assembled. Here the wall itself is
  one continuous architectural surface.
*/


/* wainscot layers */

function addWainscot(side){

    const centers=ROOM_DATA
        .filter(r=>r.side===side)
        .map(r=>r.z-HALL_LENGTH/2);

    const shape=wallShape( HALL_LENGTH,1.08,
        centers.map(z=>side*z)
    );

    const geo=new THREE.ShapeGeometry(shape);

    const mesh=new THREE.Mesh(geo,MAT.walnut);

    mesh.rotation.y=side<0
        ? -Math.PI/2
        : Math.PI/2;

    mesh.position.x=
        side<0
        ? -HALL_HALF+.012
        : HALL_HALF-.012;

    mesh.receiveShadow=true;

    gallery.add(mesh);

    /* chair rail */

    const allDoors=ROOM_DATA
        .filter(r=>r.side===side)
        .map(r=>r.z);

    let previous=1;

    allDoors.forEach(z=>{

        addTrim(
            side,
            previous,
            z-DOOR_W/2-.12,
            1.08,
            .055,
            MAT.oldGold
        );

        addTrim(
            side,
            z+DOOR_W/2+.12,
            HALL_LENGTH-1,
            1.08,
            .055,
            MAT.oldGold
        );

        previous=z+DOOR_W/2+.12;
    });
}


function addTrim(side,z1,z2,y,height,material){

    const length=z2-z1;

    if(length<=0)return;

    const z=(z1+z2)/2;

    box(
        gallery,
        side<0
            ? -HALL_HALF-.025
            : HALL_HALF+.025,
        y,
        z,
        .075,
        height,
        length,
        material
    );
}

addWainscot(-1);
addWainscot(1);


/* baseboard strips */

function baseboard(side){

    ROOM_DATA
        .filter(r=>r.side===side)
        .forEach(()=>{});

    let previous=0;

    ROOM_DATA
        .filter(r=>r.side===side)
        .sort((a,b)=>a.z-b.z)
        .forEach(r=>{

            addTrim(
                side,
                previous,
                r.z-DOOR_W/2-.12,
                .18,
                .25,
                MAT.darkWood
            );

            addTrim(
                side,
                r.z+DOOR_W/2+.12,
                HALL_LENGTH,
                .18,
                .25,
                MAT.darkWood
            );

            previous=r.z+DOOR_W/2+.12;
        });
}

baseboard(-1);
baseboard(1);


/* ceiling */

box(
    gallery,
    0,
    WALL_H+.10,
    HALL_LENGTH/2,
    HALL_W+1,
    .20,
    HALL_LENGTH,
    mat(0x777063,.95)
);


/* ceiling moulding */

[-1,1].forEach(side=>{

    box(
        gallery,
        side*(HALL_HALF-.035),
        WALL_H-.10,
        HALL_LENGTH/2,
        .16,
        .18,
        HALL_LENGTH,
        MAT.cream
    );
});


/* hallway carpet runner */

box(
    gallery,
    0,
    .035,
    HALL_LENGTH/2,
    2.55,
    .055,
    HALL_LENGTH-1.8,
    MAT.carpet
);


/* darker floor strips beneath carpet edges */

box(
    gallery,
    -1.36,
    .025,
    HALL_LENGTH/2,
    .07,
    .035,
    HALL_LENGTH-1,
    MAT.oldGold
);

box(
    gallery,
    1.36,
    .025,
    HALL_LENGTH/2,
    .07,
    .035,
    HALL_LENGTH-1,
    MAT.oldGold
);


/* ============================================================
   ANTIQUE WALL LAMPS
============================================================ */

function antiqueSconce(side,z,y=3.0){

    const g=new THREE.Group();

    g.position.set(
        side*(HALL_HALF-.075),
        y,
        z
    );

    gallery.add(g);

    /* wall plate */

    cylinder(
        g,
        0,0,0,
        .115,.07,
        MAT.brass,
        18,
        0,
        Math.PI/2
    );

    /* arm */

    box(
        g,
        -side*.09,
        -.02,
        0,
        .22,
        .035,
        .035,
        MAT.brass,
        0
    );

    /* shade */

    const shade=new THREE.Mesh(
        new THREE.CylinderGeometry(.16,.23,.28,18,1,true),
        mat(0x927c5d,.95)
    );

    shade.position.set(
        -side*.18,
        -.18,
        0
    );

    g.add(shade);

    /* small bulb */

    const bulb=new THREE.Mesh(
        new THREE.SphereGeometry(.055,12,12),
        new THREE.MeshStandardMaterial({
            color:0xffd9a0,
            emissive:0xffb45b,
            emissiveIntensity:.18,
            roughness:.5
        })
    );

    bulb.position.set(
        -side*.18,
        -.06,
        0
    );

    g.add(bulb);

    const light=new THREE.PointLight(
        0xffc985,
        .48,
        6.2,
        2
    );

    light.position.set(
        -side*.18,
        -.08,
        0
    );

    light.castShadow=true;
    light.shadow.mapSize.width=512;
    light.shadow.mapSize.height=512;

function frameTexture(title){

    return canvasTexture((ctx,w,h)=>{

        ctx.fillStyle="#d8c8a9";
        ctx.fillRect(0,0,w,h);

        ctx.fillStyle="#202326";

        ctx.fillRect(42,42,w-84,h-84);

        const grad=ctx.createLinearGradient(0,0,w,h);
        grad.addColorStop(0,"#263745");
        grad.addColorStop(.5,"#4b5960");
        grad.addColorStop(1,"#181b20");

        ctx.fillStyle=grad;
        ctx.fillRect(58,58,w-116,h-116);

        ctx.fillStyle="rgba(222,191,137,.18)";
        ctx.fillRect(70,h*.67,w-140,h*.16);

        ctx.fillStyle="rgba(235,220,190,.12)";
        ctx.beginPath();
        ctx.arc(w*.58,h*.38,48,0,Math.PI*2);
        ctx.fill();

    },512,512);
}

function createDoor(parent,side){

    const doorGroup=new THREE.Group();

    const wallX=
        side<0
        ? ROOM_W/2
        : -ROOM_W/2;

    /*
      six-panel wooden door
    */

    const slab=box(
        doorGroup,
        0,
        DOOR_H/2,
        0,
        .16,
        DOOR_H,
        DOOR_W,
        MAT.door
    );

    /* raised rails */

    const railsMat=MAT.darkWood;

    /* top / bottom / central rails */

    [
        [0,3.28,.09,DOOR_W-.12,.10],
        [0,.30,.09,DOOR_W-.12,.10],
        [0,1.38,.09,DOOR_W-.12,.085],
        [0,2.47,.09,DOOR_W-.12,.085]
    ].forEach(v=>{

        box(
            doorGroup,
            side<0?.086:-.086,
            v[1],
            0,
            .035,
            v[4],
            v[3],
            railsMat
        );
    });

    /* vertical stiles */

    [-.83,.83].forEach(z=>{

        box(
            doorGroup,
            side<0?.086:-.086,
            1.84,
            z,
            .035,
            2.95,
            .09,
            railsMat
        );
    });


    /* six recessed panels */

    const panelMat=mat(0x2a1a17,.95);

    const panelYs=[.82,1.83,2.84];

    panelYs.forEach(y=>{

        [-.48,.48].forEach(z=>{

            box(
                doorGroup,
                side<0?.085:-.085,
                y,
                z,
                .025,
                .72,
                .62,
                panelMat
            );
        });
    });


    /* brass knob */

    const knob=new THREE.Mesh(
        new THREE.SphereGeometry(.075,16,16),
        MAT.brassLight
    );

    knob.position.set(
        side<0 ? -.115 : .115,
        1.72,
        .78
    );

    doorGroup.add(knob);


    /* knob back plate */

    cylinder(
        doorGroup,
        side<0 ? -.12 : .12,
        1.72,
        .78,
        .085,
        .025,
        MAT.brass,
        18,
        0,
        Math.PI/2
    );


    /* hinges */

    [-1.05,0,1.05].forEach(y=>{

            DOOR_H/2+y,
            -.92,
            .025,
            .17,
            .07,
            MAT.brass
        );
    });


    doorGroup.position.set(
        wallX,
        0,
        0
    );

    parent.add(doorGroup);

    return doorGroup;
}

function createRoomShell(cfg){

    const g=new THREE.Group();

    g.position.set(
        cfg.side*(HALL_HALF+ROOM_W/2),
        0,
        cfg.z
    );

    scene.add(g);


    /* floor */

    box(
        g,
        0,.02,0,
        ROOM_W,
        .08,
        ROOM_D,
        MAT.floor
    );


    /* ceiling */

    box(
        g,
        0,
        ROOM_H,
        0,
        ROOM_W,
        .15,
        ROOM_D,
        mat(0x857c6d,.98)
    );


    /*
      Hall-facing wall has a real doorway cut out.
    */

    const frontWallX=-cfg.side*ROOM_W/2;

    const shape=wallShape(
        ROOM_D,
        ROOM_H,
        [0]
    );

    const geo=new THREE.ShapeGeometry(shape);

    const front=new THREE.Mesh(
        geo,
        cfg.theme==="winter"
            ? MAT.cabinWall
            : cfg.theme==="street"
                ? MAT.plaster
                : cfg.theme==="play"
                    ? MAT.plaster
                    : cfg.theme==="abandoned"
                        ? MAT.wallpaper
                        : MAT.plaster
    );

    front.rotation.y=cfg.side<0
        ? -Math.PI/2
        : Math.PI/2;

    front.position.x=frontWallX;
    front.receiveShadow=true;

    g.add(front);


    /* opposite wall */

    const backX=cfg.side*ROOM_W/2;

    box(
        g,
        backX,
        ROOM_H/2,
        0,
        .18,
        ROOM_H,
        ROOM_D,
        cfg.theme==="winter"
            ? MAT.cabinWall
            : cfg.theme==="abandoned"
                ? MAT.wallpaper
                : MAT.plaster
    );


    /* end walls */

    box(
        g,
        0,
        ROOM_H/2,
        -ROOM_D/2,
        ROOM_W,
        ROOM_H,
        .18,
        cfg.theme==="winter"
            ? MAT.cabinWall
            : cfg.theme==="abandoned"
                ? MAT.wallpaper
                : MAT.plaster
    );

    box(
        g,
        0,
        ROOM_H/2,
        ROOM_D/2,
        ROOM_W,
        ROOM_H,
        .18,
        cfg.theme==="winter"
            ? MAT.cabinWall
            : cfg.theme==="abandoned"
                ? MAT.wallpaper
                : MAT.plaster
    );


    /* proper door */

    createDoor(g,cfg.side);


    /* door casing */

    const casing=MAT.oldGold;

    box(
        g,
        frontWallX-cfg.side*.11,
        DOOR_H/2,
        -DOOR_W/2-.10,
        .18,
        DOOR_H+.20,
        .13,
        casing
    );

    box(
        g,
        frontWallX-cfg.side*.11,
        DOOR_H/2,
        DOOR_W/2+.10,
        .18,
        DOOR_H+.20,
        .13,
        casing
    );

    box(
        g,
        frontWallX-cfg.side*.11,
        DOOR_H+.10,
        0,
        .18,
        .14,
        DOOR_W+.32,
        casing
    );


    return g;
}

function hallwayPaintingInRoom(parent,x,y,z,w,h){

    const frame=box(
        parent,
        x,
        y,
        z,
        .10,
        h+.20,
        w+.20,
        MAT.oldGold
    );

    const art=new THREE.Mesh(
        new THREE.PlaneGeometry(w,h),
        new THREE.MeshStandardMaterial({
            map:frameTexture(),
            roughness:.92
        })
    );

    art.position.set(
        x+(x<0?.055:-.055),
        y,
        z
    );

    art.rotation.y=x<0
        ? Math.PI/2
        : -Math.PI/2;

    parent.add(art);
}

============================================================ */

function plaqueTexture(text){

    return canvasTexture((ctx,w,h)=>{

        ctx.fillStyle="#30251d";
        ctx.fillRect(0,0,w,h);

        ctx.strokeStyle="#9a794a";
        ctx.lineWidth=8;
        ctx.strokeRect(12,12,w-24,h-24);

        ctx.fillStyle="#d3bb8d";
        ctx.font="bold 38px Georgia";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText(text,w/2,h/2+2);
    },512,180);
}


function addRoomPlaque(cfg){

    const g=createRoomShellPlaque(cfg);

    scene.add(g);
}


function createRoomShellPlaque(cfg){

    const g=new THREE.Group();

    const roomX=
        cfg.side*(HALL_HALF+ROOM_W/2);

    const wallX=
        roomX-cfg.side*ROOM_W/2;

    const plaque=new THREE.Mesh(
        new THREE.PlaneGeometry(1.35,.47),
        new THREE.MeshStandardMaterial({
            map:plaqueTexture(

        cfg.z
    );

    plaque.rotation.y=cfg.side<0
        ? -Math.PI/2
        : Math.PI/2;

    g.add(plaque);

    return g;
}

/* ============================================================
   PLAYER
============================================================ */

let yaw=0;
let pitch=0;

const velocity=new THREE.Vector3();

const keys={};

let pointerLocked=false;

document.addEventListener("keydown",e=>{
    keys[e.code]=true;
});

document.addEventListener("keyup",e=>{
    keys[e.code]=false;
});


renderer.domElement.addEventListener("click",()=>{

    if(!pointerLocked){

        renderer.domElement.requestPointerLock();

    }else{

        checkPainting();
    }
});


document.addEventListener("pointerlockchange",()=>{

    pointerLocked=
        document.pointerLockElement===renderer.domElement;
});


document.addEventListener("mousemove",e=>{

    if(!pointerLocked)return;

    yaw-=e.movementX*.0022;

    pitch-=e.movementY*.0020;

    pitch=Math.max(
        -Math.PI/2+.08,
        Math.min(Math.PI/2-.08,pitch)
    );
});


/* ============================================================
   COLLISION / MAP BOUNDARIES
============================================================ */

function roomBounds(){

    return ROOM_DATA.map(cfg=>{

        const centerX=
            cfg.side*(HALL_HALF+ROOM_W/2);

        return {
            minX:centerX-ROOM_W/2+.22,
            maxX:centerX+ROOM_W/2-.22,
            minZ:cfg.z-ROOM_D/2+.22,
            maxZ:cfg.z+ROOM_D/2-.22,
            side:cfg.side,
            doorZ:cfg.z
        };
    });
}

const bounds=roomBounds();


function canWalk(nx,nz){

    const radius=.23;

    /*
      Hallway boundaries.
    */

    if(nx>-HALL_HALF+radius && nx<HALL_HALF-radius){

        if(nz>0.2 && nz<HALL_LENGTH-.2){

            return true;
        }

        return false;
    }


    /*
      Rooms.
    */

    for(const b of bounds){

        if(
            nx>b.minX &&
            nx<b.maxX &&
            nz>b.minZ &&
            nz<b.maxZ
        ){

            /*
              Allow entry only through the doorway region.
              Once inside, the room is fully bounded.
            */

            const doorway=Math.abs(nz-b.doorZ)<DOOR_W/2+.18;

            if(
                (b.side<0 && nx>-HALL_HALF-.25 && !doorway)
                ||
                (b.side>0 && nx<HALL_HALF+.25 && !doorway)
            ){
                return false;
            }

            return true;
        }
    }

    return false;
}


/* ============================================================
   ROOM DETECTION
============================================================ */

function currentRoom(){

    for(const b of bounds){

        if(
            camera.position.x>b.minX &&
            camera.position.x<b.maxX &&
            camera.position.z>b.minZ &&
            camera.position.z<b.maxZ
        ){
            return ROOM_DATA.find(
                r=>r.z===b.doorZ
            );
        }
    }

    return null;
}


/* ============================================================

const paintings=[];

function createPainting(parent,side,x,y,z,w,h,title){

    const g=new THREE.Group();

    g.position.set(x,y,z);

    g.rotation.y=side<0
        ? -Math.PI/2
        : Math.PI/2;

    parent.add(g);

    const frame=box(
        g,
        0,0,0,
        .12,
        h+.26,
        w+.26,
        MAT.oldGold
    );

    const art=new THREE.Mesh(
        new THREE.PlaneGeometry(w,h),
        new THREE.MeshStandardMaterial({
            map:frameTexture(),
            roughness:.9
        })
    );

    art.position.z=side<0?.07:-.07;

    g.add(art);

    paintings.push({
        mesh:art,
        title:title||"A quiet painting",
        group:g
    });

    return g;
}

function checkPainting(){

    const ray=new THREE.Raycaster();

    ray.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const hits=ray.intersectObjects(
        paintings.map(p=>p.mesh),
        true
    );

    if(!hits.length)return;

    const item=paintings.find(
        p=>p.mesh===hits[0].object
    );

    if(!item)return;

    document.getElementById("noteTitle").textContent=
        item.title;

    document.getElementById("noteText").textContent=
        "This painting belongs to the quiet collection of Ramsha Art Studio.";

    document.getElementById("note").style.display="flex";

    document.exitPointerLock();
}


/* ============================================================
   AUDIO
============================================================ */

let audioCtx=null;
let master=null;
let muted=false;

function startAudio(){

    if(audioCtx)return;

    audioCtx=new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    master=audioCtx.createGain();
    master.gain.value=.055;
    master.connect(audioCtx.destination);

    const osc=audioCtx.createOscillator();

    osc.type="sine";
    osc.frequency.value=47;

    const gain=audioCtx.createGain();
    gain.gain.value=.35;

    osc.connect(gain);
    gain.connect(master);

    osc.start();
}


document.getElementById("mute").onclick=()=>{

    if(!master)return;

    muted=!muted;

    master.gain.value=
        muted
        ? 0
        : .055;

    document.getElementById("mute").textContent=
        muted
        ? "SOUND OFF"
        : "SOUND ON";
};

/* ============================================================
   ANIMATION
============================================================ */

const clock=new THREE.Clock();

let lastRoom=null;

function animate(){

    requestAnimationFrame(animate);

    const dt=Math.min(clock.getDelta(),.05);

    /* movement */

    const speed=
        keys.ShiftLeft ||
        keys.ShiftRight
        ? 4.2
        : 2.5;

    let forward=0;
    let strafe=0;

    if(keys.KeyW)forward+=1;
    if(keys.KeyS)forward-=1;
    if(keys.KeyD)strafe+=1;
    if(keys.KeyA)strafe-=1;

    const move=new THREE.Vector3();

    move.z=forward;
    move.x=strafe;

    if(move.lengthSq()>0){

        move.normalize();

        const sin=Math.sin(yaw);
        const cos=Math.cos(yaw);

        const dx=
            move.x*cos+
            move.z*sin;

        const dz=
            move.z*cos-
            move.x*sin;

        const nx=
            camera.position.x+
            dx*speed*dt;

        const nz=
            camera.position.z+
            dz*speed*dt;

        if(canWalk(nx,camera.position.z)){
            camera.position.x=nx;
        }

        if(canWalk(camera.position.x,nz)){
            camera.position.z=nz;
        }
    }


    camera.rotation.order="YXZ";

    camera.rotation.y=yaw;
    camera.rotation.x=pitch;


    /* subtle snow motion */

    snowGroup.position.y=
        Math.sin(clock.elapsedTime*.16)*.10;

    snowGroup.rotation.y=
        clock.elapsedTime*.006;


    /* fire flicker */

    scene.traverse(obj=>{

        if(
            obj.type==="PointLight" &&
            obj.color &&
            obj.color.r>.8 &&
            obj.color.g<.7
        ){

            obj.intensity+=
                Math.sin(clock.elapsedTime*7.2+obj.id)*.018;
        }
    });


    /* update room label */

    const r=currentRoom();

    if(r!==lastRoom){

        lastRoom=r;

        document.getElementById("roomLabel").textContent=
            r
            ? r.name
            : "PRIVATE GALLERY";
    }


    renderer.render(scene,camera);
}

animate();
