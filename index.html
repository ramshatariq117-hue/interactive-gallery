<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05070a;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

/* CROSSHAIR */
#crosshair {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 14px;
  height: 14px;
  transform: translate(-50%, -50%);
  z-index: 20;
  pointer-events: none;
}

#crosshair:before,
#crosshair:after {
  content: "";
  position: absolute;
  background: rgba(255,255,255,.85);
}

#crosshair:before {
  width: 14px;
  height: 1px;
  left: 0;
  top: 7px;
}

#crosshair:after {
  height: 14px;
  width: 1px;
  left: 7px;
  top: 0;
}

/* HUD */
#hud {
  position: fixed;
  left: 18px;
  bottom: 18px;
  color: rgba(255,255,255,.72);
  font-size: 12px;
  letter-spacing: .5px;
  z-index: 10;
  pointer-events: none;
  text-shadow: 0 2px 8px #000;
}

#roomLabel {
  position: fixed;
  right: 18px;
  top: 18px;
  color: rgba(255,255,255,.72);
  font-size: 12px;
  letter-spacing: 2px;
  z-index: 10;
  text-shadow: 0 2px 8px #000;
}

/* MUTE */
#mute {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 20;
  background: rgba(10,12,16,.72);
  border: 1px solid rgba(255,255,255,.18);
  color: #ddd;
  padding: 8px 12px;
  border-radius: 20px;
  cursor: pointer;
}

/* WELCOME */
#welcome {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(
      circle at 50% 42%,
      #222a32 0,
      #0b0e12 48%,
      #030405 100%
    );
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  color: #eee;
}

.welcomeBox {
  width: min(520px, 90vw);
  text-align: center;
  padding: 50px 30px;
}

.welcomeBox h1 {
  font-family: Georgia, serif;
  font-weight: 400;
  letter-spacing: 8px;
  font-size: 34px;
  margin: 0 0 12px;
}

.welcomeBox p {
  color: #aeb4ba;
  letter-spacing: 1px;
  font-size: 13px;
  margin: 0 0 35px;
}

#welcomeName {
  width: 100%;
  max-width: 330px;
  padding: 14px 16px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  outline: none;
  text-align: center;
  font-size: 16px;
}

#enterBtn {
  display: block;
  margin: 15px auto 0;
  padding: 12px 30px;
  background: #ddd;
  color: #111;
  border: 0;
  cursor: pointer;
  letter-spacing: 2px;
}

#welcomeMsg {
  min-height: 20px;
  color: #aaa;
  font-size: 13px;
  margin-top: 20px;
}

/* MODALS */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 90;
}

.paper {
  background: #e8dfc9;
  color: #29251f;
  width: min(540px,88vw);
  padding: 34px;
  box-shadow: 0 20px 70px #000;
  transform: rotate(-.5deg);
}

.paper h2 {
  font-family: Georgia, serif;
  font-weight: 400;
  margin: 0 0 15px;
}

.paper p {
  line-height: 1.7;
  font-size: 14px;
}

.close {
  margin-top: 20px;
  border: 0;
  background: #28241f;
  color: #eee;
  padding: 9px 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- =========================
     WELCOME
========================= -->

<div id="welcome">

  <div class="welcomeBox">

    <h1>RAMSHA ART STUDIO</h1>

    <p>
      an interactive gallery of cozy &amp; eerie things
    </p>

    <input
      id="welcomeName"
      placeholder="your name"
      autocomplete="off"
    >

    <button id="enterBtn">
      ENTER
    </button>

    <div id="welcomeMsg"></div>

  </div>

</div>


<!-- HUD -->

<div id="crosshair"></div>

<div id="hud">
  WASD to move · mouse to look · click a painting
</div>

<div id="roomLabel"></div>

<button id="mute">
  Sound: On
</button>


<!-- =========================
     STORY MODAL
========================= -->

<div id="storyModal" class="modal">

  <div class="paper">

    <h2 id="storyTitle"></h2>

    <p id="storyText"></p>

    <button class="close" id="storyClose">
      close
    </button>

  </div>

</div>


<!-- =========================
     WINNER MODAL
========================= -->

<div id="winnerModal" class="modal">

  <div class="paper">

    <h2>
      A little something for you
    </h2>

    <p id="winnerText"></p>

    <button class="close" id="winnerClose">
      close
    </button>

  </div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>


<script>

/* =========================================================
   WELCOME
========================================================= */

const welcome =
  document.getElementById("welcome");

const nameInput =
  document.getElementById("welcomeName");

const enterBtn =
  document.getElementById("enterBtn");

const welcomeMsg =
  document.getElementById("welcomeMsg");


enterBtn.onclick = () => {

  const name =
    (nameInput.value || "").trim() || "friend";

  welcomeMsg.textContent =
    "Welcome, " +
    name +
    ". Your artwork is waiting for you in Lobby 1.";

  setTimeout(() => {

    welcome.style.display = "none";

    document.body.requestPointerLock?.();

    startAudio();

  }, 900);

};


nameInput.addEventListener(
  "keydown",
  e => {

    if (e.key === "Enter") {
      enterBtn.click();
    }

  }
);


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;
let master = null;
let muted = false;


function startAudio() {

  if (audioCtx) return;

  audioCtx =
    new (window.AudioContext ||
         window.webkitAudioContext)();

  master =
    audioCtx.createGain();

  master.gain.value = .055;

  master.connect(
    audioCtx.destination
  );


  /* LOW DRONE */

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = "sine";

  osc.frequency.value = 48;

  gain.gain.value = .35;

  osc.connect(gain);

  gain.connect(master);

  osc.start();


  /* AMBIENT NOISE */

  const buffer =
    audioCtx.createBuffer(
      1,
      audioCtx.sampleRate * 2,
      audioCtx.sampleRate
    );

  const data =
    buffer.getChannelData(0);

  for (
    let i = 0;
    i < data.length;
    i++
  ) {

    data[i] =
      (Math.random() * 2 - 1) * .18;

  }


  const noise =
    audioCtx.createBufferSource();

  noise.buffer = buffer;
  noise.loop = true;


  const noiseGain =
    audioCtx.createGain();

  noiseGain.gain.value = .08;


  noise.connect(noiseGain);

  noiseGain.connect(master);

  noise.start();


  /* RANDOM DISTANT SOUNDS */

  setInterval(() => {

    if (!audioCtx || muted) return;

    const o =
      audioCtx.createOscillator();

    const g =
      audioCtx.createGain();

    o.type =
      Math.random() < .5
        ? "sine"
        : "triangle";

    o.frequency.value =
      100 + Math.random() * 250;


    g.gain.setValueAtTime(
      0,
      audioCtx.currentTime
    );

    g.gain.linearRampToValueAtTime(
      .035,
      audioCtx.currentTime + .02
    );

    g.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime + .7
    );


    o.connect(g);

    g.connect(master);

    o.start();

    o.stop(
      audioCtx.currentTime + .75
    );

  },7000);


  audioCtx.resume();

}


document.getElementById("mute").onclick = () => {

  muted = !muted;

  if (master) {

    master.gain.value =
      muted ? 0 : .055;

  }

  document.getElementById("mute").textContent =
    muted
      ? "Sound: Off"
      : "Sound: On";

};


/* =========================================================
   THREE.JS WORLD
========================================================= */

const scene =
  new THREE.Scene();


scene.background =
  new THREE.Color(0x05070a);


scene.fog =
  new THREE.FogExp2(
    0x05070a,
    .012
  );


/* CAMERA */

const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    .05,
    300
  );


camera.position.set(
  0,
  1.7,
  4
);


camera.rotation.order =
  "YXZ";


/* RENDERER */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });


renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);


renderer.setSize(
  innerWidth,
  innerHeight
);


renderer.shadowMap.enabled =
  true;


renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;


document.body.appendChild(
  renderer.domElement
);


/* LIGHTING */

const ambient =
  new THREE.HemisphereLight(
    0x75808c,
    0x090909,
    .38
  );


scene.add(ambient);


/* =========================================================
   GALLERY DIMENSIONS
========================================================= */

const ROOM_W = 10;
const ROOM_D = 12;
const ROOM_H = 4.5;

const HALL_HALF = 2.0;

const HALL_START = 0;
const HALL_END = 116;


/*
IMPORTANT:
Paintings is declared BEFORE any room
is created because createPainting()
uses it.
*/

const paintings = [];


const rooms = [

  {
    id: 1,
    z: 15,
    side: -1,
    name: "LOBBY 1 · THE FORGOTTEN CINEMA",
    color: 0x4b2630
  },

  {
    id: 2,
    z: 36,
    side: 1,
    name: "LOBBY 2 · WINTER COUNTRY",
    color: 0x34495b
  },

  {
    id: 3,
    z: 57,
    side: -1,
    name: "LOBBY 3 · THE RAINY COTTAGE",
    color: 0x5a3029
  },

  {
    id: 4,
    z: 78,
    side: 1,
    name: "LOBBY 4 · THE EMPTY NIGHT ROAD",
    color: 0x273541
  },

  {
    id: 5,
    z: 99,
    side: -1,
    name: "LOBBY 5 · THE ROOM THAT REMAINS",
    color: 0x39272c
  }

];


/* =========================================================
   MATERIALS
========================================================= */

const mats = {};


function mat(
  color,
  rough = 1,
  emissive = 0x000000,
  ei = 0
) {

  return new THREE.MeshStandardMaterial({

    color,

    roughness: rough,

    emissive,

    emissiveIntensity: ei

  });

}


mats.wall =
  mat(0x181b1d);

mats.wall2 =
  mat(0x23272a);

mats.floor =
  mat(0x101214);

mats.ceiling =
  mat(0x0c0e10);

mats.wood =
  mat(0x352922);

mats.darkwood =
  mat(0x1b1513);

mats.red =
  mat(0x6d2529,.8);

mats.redDark =
  mat(0x35171b);

mats.gold =
  mat(0xb18b4b,.65);

mats.metal =
  mat(0x303438,.45);

mats.green =
  mat(0x26352b);

mats.paper =
  mat(0xcfc7b5);

mats.blue =
  mat(0x435b70);

mats.black =
  mat(0x090909);

mats.white =
  mat(0xd8d5c9);

mats.fire =
  mat(
    0xff6a28,
    .5,
    0xff3b0b,
    3
  );

mats.lamp =
  mat(
    0xffd59b,
    .35,
    0xffa34a,
    2.2
  );

mats.redGlow =
  mat(
    0xa30f18,
    .4,
    0x8b0000,
    2
  );


/* =========================================================
   BASIC OBJECT HELPERS
========================================================= */

function cube(
  w,
  h,
  d,
  material,
  x,
  y,
  z
) {

  const m =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      material
    );

  m.position.set(
    x,
    y,
    z
  );

  m.castShadow = true;
  m.receiveShadow = true;

  scene.add(m);

  return m;

}


function cyl(
  r,
  h,
  material,
  x,
  y,
  z,
  seg = 16
) {

  const m =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        r,
        r,
        h,
        seg
      ),
      material
    );

  m.position.set(
    x,
    y,
    z
  );

  m.castShadow = true;
  m.receiveShadow = true;

  scene.add(m);

  return m;

}


function sphere(
  r,
  material,
  x,
  y,
  z
) {

  const m =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        r,
        16,
        10
      ),
      material
    );

  m.position.set(
    x,
    y,
    z
  );

  m.castShadow = true;

  scene.add(m);

  return m;

}


function pointLight(
  color,
  intensity,
  distance,
  x,
  y,
  z
) {

  const l =
    new THREE.PointLight(
      color,
      intensity,
      distance
    );

  l.position.set(
    x,
    y,
    z
  );

  l.castShadow = true;

  scene.add(l);

  return l;

}


/* =========================================================
   DECORATIVE HELPERS
========================================================= */

function rug(
  w,
  d,
  color,
  x,
  y,
  z
) {

  const r =
    cube(
      w,
      .035,
      d,
      mat(color,.95),
      x,
      y,
      z
    );

  for (
    let i = 0;
    i < 3;
    i++
  ) {

    cube(
      w - .15,
      .04,
      .035,
      mats.gold,
      x,
      y + .025,
      z - d/2 + .15 + i*.08
    );

  }

  return r;

}


function plant(
  x,
  y,
  z,
  scale = 1
) {

  cyl(
    .12 * scale,
    .7 * scale,
    mats.darkwood,
    x,
    y + .35 * scale,
    z,
    10
  );

  for (
    let i = 0;
    i < 7;
    i++
  ) {

    const a =
      i / 7 * Math.PI * 2;

    sphere(
      .17 * scale,
      mats.green,
      x + Math.cos(a) * .2 * scale,
      y + .75 * scale,
      z + Math.sin(a) * .2 * scale
    );

  }

}


function chair(
  x,
  y,
  z,
  rot = 0
) {

  const g =
    new THREE.Group();


  const seat =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.1,
        .18,
        1
      ),
      mats.red
    );

  seat.position.y = .75;

  g.add(seat);


  const back =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.1,
        1.35,
        .18
      ),
      mats.redDark
    );

  back.position.set(
    0,
    1.35,
    -.4
  );

  g.add(back);


  for (
    const sx of [-.42,.42]
  ) {

    for (
      const sz of [-.35,.35]
    ) {

      const leg =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .1,
            .75,
            .1
          ),
          mats.darkwood
        );

      leg.position.set(
        sx,
        .38,
        sz
      );

      g.add(leg);

    }

  }


  g.position.set(
    x,
    y,
    z
  );

  g.rotation.y =
    rot;

  scene.add(g);

  return g;

}


function lamp(
  x,
  y,
  z,
  red = false
) {

  cyl(
    .055,
    .8,
    mats.metal,
    x,
    y + .4,
    z,
    10
  );

  sphere(
    .22,
    red ? mats.redGlow : mats.lamp,
    x,
    y + .85,
    z
  );

}


function frame(
  x,
  y,
  z,
  rot = 0,
  w = 1.2,
  h = 1.5
) {

  const outer =
    cube(
      w,
      h,
      .12,
      mats.darkwood,
      x,
      y,
      z
    );

  outer.rotation.y =
    rot;


  const inner =
    cube(
      w - .18,
      h - .18,
      .13,
      mats.paper,
      x,
      y,
      z + .07
    );

  inner.rotation.y =
    rot;


  return inner;

}


/* =========================================================
   PAINTING CREATOR
========================================================= */

function createPainting(
  x,
  y,
  z,
  rot,
  title,
  story,
  w = 1.6,
  h = 1.25
) {

  const outer =
    cube(
      w + .18,
      h + .18,
      .12,
      mats.gold,
      x,
      y,
      z
    );

  outer.rotation.y =
    rot;


  const art =
    cube(
      w,
      h,
      .1,
      mat(0x242a2e,.8),
      x,
      y,
      z + .07
    );

  art.rotation.y =
    rot;


  art.userData = {
    title,
    story
  };


  art.castShadow =
    false;


  paintings.push(art);


  return art;

}


/* =========================================================
   MAIN HALLWAY
========================================================= */

/*
Narrow central hallway.
This is the main architectural spine.
*/

cube(
  HALL_HALF * 2,
  .12,
  HALL_END - HALL_START,
  mats.floor,
  0,
  .03,
  58
);


cube(
  HALL_HALF * 2,
  .08,
  HALL_END - HALL_START,
  mats.ceiling,
  0,
  4.35,
  58
);


/* SUBTLE FLOOR EDGE DETAILS */

for (
  let z = 0;
  z <= 116;
  z += 7
) {

  cube(
    .08,
    .03,
    .22,
    mats.gold,
    -HALL_HALF + .1,
    .08,
    z
  );

  cube(
    .08,
    .03,
    .22,
    mats.gold,
    HALL_HALF - .1,
    .08,
    z
  );

}


/* WALL SEGMENT */

function wallSegment(
  x,
  z,
  d
) {

  cube(
    .25,
    4.35,
    d,
    mats.wall,
    x,
    2.18,
    z
  );

}


/* DOORWAY */

function doorwayWall(
  side,
  z
) {

  const x =
    side * HALL_HALF;

  const roomX =
    side *
    (HALL_HALF + ROOM_W / 2);


  /*
  Wall pieces before and after
  the actual doorway.
  */

  wallSegment(
    x,
    z - ROOM_D / 2,
    ROOM_D / 2 - 1.35
  );


  wallSegment(
    x,
    z + ROOM_D / 2,
    ROOM_D / 2 - 1.35
  );


  /*
  Header above doorway.
  */

  cube(
    .25,
    1.45,
    2.7,
    mats.wall,
    x,
    3.63,
    z
  );


  /*
  Door frame.
  */

  cube(
    .38,
    4.35,
    .22,
    mats.darkwood,
    x - side * .05,
    2.18,
    z - 1.35
  );


  cube(
    .38,
    4.35,
    .22,
    mats.darkwood,
    x - side * .05,
    2.18,
    z + 1.35
  );


  cube(
    .42,
    .22,
    2.92,
    mats.gold,
    x - side * .08,
    4.22,
    z
  );


  /*
  Warm doorway light.
  */

  const light =
    pointLight(
      0xffb46b,
      .45,
      7,
      roomX,
      2.7,
      z
    );

  light.castShadow =
    false;

}


/*
Build continuous hallway walls
around the five lobby entrances.
*/

for (
  let z = 0;
  z <= 116;
  z += 10.5
) {

  cube(
    .25,
    4.35,
    9.6,
    mats.wall,
    -HALL_HALF,
    2.18,
    z + 5.25
  );


  cube(
    .25,
    4.35,
    9.6,
    mats.wall,
    HALL_HALF,
    2.18,
    z + 5.25
  );

}


/*
Replace the wall sections at each lobby
with a proper doorway.
*/

rooms.forEach(
  r => doorwayWall(
    r.side,
    r.z
  )
);


/* HALLWAY CEILING LIGHTS */

for (
  let z = 7;
  z < 114;
  z += 10.5
) {

  const l =
    pointLight(
      0xd5c3a5,
      .28,
      8,
      0,
      3.85,
      z
    );

  l.castShadow =
    false;


  const fixture =
    cyl(
      .12,
      .08,
      mats.lamp,
      0,
      4.25,
      z,
      12
    );

  fixture.rotation.x =
    Math.PI / 2;

}


/* =========================================================
   ROOM BASE
========================================================= */

function roomBase(r) {

  const cx =
    r.side *
    (HALL_HALF + ROOM_W / 2);

  const z =
    r.z;


  /* FLOOR */

  cube(
    ROOM_W,
    .12,
    ROOM_D,
    mats.floor,
    cx,
    .02,
    z
  );


  /* CEILING */

  cube(
    ROOM_W,
    .12,
    ROOM_D,
    mats.ceiling,
    cx,
    ROOM_H,
    z
  );


  /* BACK WALL */

  cube(
    ROOM_W,
    .25,
    .25,
    mats.wall,
    cx,
    2.2,

/* =========================================================
   PAINTING INTERACTION
========================================================= */

const raycaster =
  new THREE.Raycaster();


renderer.domElement.addEventListener(
  "click",
  () => {

    /*
    If pointer isn't locked,
    clicking locks it.
    */

    if (
      document.pointerLockElement !==
      renderer.domElement
    ) {

      document.body.requestPointerLock?.();

      return;

    }


    /*
    Shoot ray straight through
    the crosshair.
    */

    raycaster.setFromCamera(
      new THREE.Vector2(0,0),
      camera
    );


    const hit =
      raycaster.intersectObjects(
        paintings,
        false
      )[0];


    if (
      hit &&
      hit.distance < 7
    ) {

      document.getElementById(
        "storyTitle"
      ).textContent =
        hit.object.userData.title;


      document.getElementById(
        "storyText"
      ).textContent =
        hit.object.userData.story;


      document.getElementById(
        "storyModal"
      ).style.display =
        "flex";


      document.exitPointerLock?.();

    }

  }
);

/* =========================================================
   MOVEMENT
========================================================= */

const keys = {};


addEventListener(
  "keydown",
  e => {
    keys[e.code] = true;
  }
);


addEventListener(
  "keyup",
  e => {
    keys[e.code] = false;
  }
);


let yaw = Math.PI;
let pitch = 0;


/* MOUSE LOOK */

document.addEventListener(
  "mousemove",
  e => {

    if (
      document.pointerLockElement !==
      renderer.domElement
    ) return;


    yaw -=
      e.movementX * .0022;


    pitch -=
      e.movementY * .0022;


    pitch =
      Math.max(
        -1.35,
        Math.min(
          1.35,
          pitch
        )
      );


    camera.rotation.set(
      pitch,
      yaw,
      0
    );

  }
);


/* =========================================================
   MOVEMENT UPDATE
========================================================= */

const clock =
  new THREE.Clock();


function updateMovement(dt) {

  const speed = 4.2;


  const forward =
    new THREE.Vector3(
      Math.sin(yaw),
      0,
      Math.cos(yaw)
    );


  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  const dir =
    new THREE.Vector3();


  if (keys.KeyW)
    dir.add(forward);

  if (keys.KeyS)
    dir.sub(forward);

  if (keys.KeyD)
    dir.add(right);

  if (keys.KeyA)
    dir.sub(right);


  if (dir.lengthSq()) {

    dir
      .normalize()
      .multiplyScalar(
        speed * dt
      );

  }


  camera.position.x +=
    dir.x;

  camera.position.z +=
    dir.z;


  /*
  Keep player inside gallery.
  */

  camera.position.x =
    Math.max(
      -HALL_HALF - ROOM_W - .5,
      Math.min(
        HALL_HALF + ROOM_W + .5,
        camera.position.x
      )
    );


  camera.position.z =
    Math.max(
      1,
      Math.min(
        HALL_END - 1,
        camera.position.z
      )
    );


  camera.position.y =
    1.7;

}


/* =========================================================
   ROOM LABEL
========================================================= */

function updateRoomLabel() {

  const z =
    camera.position.z;

  let current =
    "MAIN HALLWAY";


  for (
    const r of rooms
  ) {

    if (
      Math.abs(
        z - r.z
      ) < ROOM_D / 2
      &&
      Math.abs(
        camera.position.x
      ) > HALL_HALF
    ) {

      current =
        r.name;

      break;

    }

  }


  document.getElementById(
    "roomLabel"
  ).textContent =
    current;

}


/* =========================================================
   ATMOSPHERIC ANIMATION
========================================================= */

let t = 0;


function animate() {

  requestAnimationFrame(
    animate
  );


  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );


  t += dt;


  updateMovement(dt);

  updateRoomLabel();


  /*
  Gentle light variation.
  */

  scene.traverse(
    o => {

      if (
        o.isPointLight &&
        o.distance > 0 &&
        o.distance < 9
      ) {

        o.intensity *=
          .997 +
          Math.random() * .006;

      }

    }
  );


  renderer.render(
    scene,
    camera
  );

}


animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);
