<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
:root{
  --neon:#5ef2ff;
  --paper:#e8dcc0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'Georgia',serif;
}

#app{
  position:relative;
  width:100%;
  height:100%;
}

canvas{
  display:block;
}

/* ---------- ORIGINAL WELCOME SCREEN ---------- */

#welcome{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 40%,#0a0a14 0%,#000 80%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:50;
  color:#cbd6e6;
}

#welcome h1{
  font-size:2.2em;
  letter-spacing:2px;
  color:var(--neon);
  text-shadow:0 0 12px var(--neon),0 0 30px var(--neon);
  margin-bottom:8px;
}

#welcome p{
  opacity:.7;
  margin-bottom:22px;
}

#nameInput{
  padding:12px 16px;
  font-size:1.1em;
  border-radius:6px;
  border:1px solid #345;
  background:#0e1420;
  color:#e8f0ff;
  width:280px;
  text-align:center;
  margin-bottom:16px;
}

#enterBtn{
  padding:12px 28px;
  font-size:1.05em;
  letter-spacing:1px;
  cursor:pointer;
  border-radius:6px;
  border:1px solid var(--neon);
  background:transparent;
  color:var(--neon);
  text-shadow:0 0 8px var(--neon);
  transition:all .25s;
}

#enterBtn:hover{
  background:var(--neon);
  color:#001;
  box-shadow:0 0 20px var(--neon);
}

#welcomeMsg{
  font-size:1.3em;
  color:#fff;
  text-align:center;
  max-width:520px;
  line-height:1.5;
}

/* ---------- HUD ---------- */

#crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:6px;
  height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  background:rgba(255,255,255,.7);
  z-index:20;
  pointer-events:none;
}

#hint{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:#c5c0b4;
  font-size:.85em;
  background:rgba(20,15,12,.62);
  padding:7px 15px;
  border-radius:20px;
  z-index:20;
  pointer-events:none;
  border:1px solid rgba(255,255,255,.08);
}

#muteBtn{
  position:absolute;
  top:16px;
  right:16px;
  z-index:30;
  background:rgba(20,15,12,.7);
  color:#ddd;
  border:1px solid #66594b;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-size:.9em;
}

#roomLabel{
  position:absolute;
  top:16px;
  left:16px;
  z-index:20;
  color:#d5b97b;
  text-shadow:0 1px 8px #000;
  font-size:.9em;
  letter-spacing:2px;
  opacity:0;
  transition:opacity .6s;
}

/* ---------- MODAL ---------- */

.modalOverlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(2px);
}

.note{
  width:340px;
  max-width:80vw;
  background:var(--paper);
  color:#3a2f22;
  padding:26px 24px;
  border-radius:2px;
  box-shadow:
    0 0 40px rgba(0,0,0,.7),
    inset 0 0 40px rgba(120,90,50,.25);
  transform:rotate(-1.2deg);
  font-family:'Georgia',serif;
  position:relative;
}

.note::before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 24px,
    rgba(0,0,0,.03) 25px
  );
  pointer-events:none;
}

.note h3{
  font-size:1.15em;
  margin-bottom:10px;
  border-bottom:1px solid rgba(0,0,0,.2);
  padding-bottom:6px;
}

.note p{
  line-height:1.5;
  font-size:.95em;
}

.note button{
  margin-top:16px;
  padding:8px 16px;
  border:1px solid #3a2f22;
  background:transparent;
  cursor:pointer;
  color:#3a2f22;
}

.win{
  background:#111;
  color:#ffd27a;
  border:2px solid #ffd27a;
  box-shadow:0 0 40px #ffb84a;
  transform:rotate(0);
  text-align:center;
}

.win h3{
  color:#ffd27a;
  border-color:#553;
}

.win button{
  border-color:#ffd27a;
  color:#ffd27a;
}

#loading{
  position:absolute;
  inset:0;
  background:#000;
  color:#5ef2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  font-size:1.1em;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div id="app">

<div id="loading">LOADING GALLERY…</div>

<!-- THIS IS YOUR ORIGINAL WELCOME SCREEN -->
<div id="welcome">

  <h1>RAMSHA ART STUDIO</h1>

  <p>an interactive gallery of cozy &amp; eerie things</p>

  <div id="stepEnterName">
    <input id="nameInput"
           placeholder="Enter your name"
           maxlength="20">

    <br>

    <button id="enterBtn">
      ENTER GALLERY
    </button>
  </div>

  <div id="welcomeMsg" style="display:none;"></div>

</div>

<div id="roomLabel"></div>

<div id="crosshair" style="display:none;"></div>

<div id="hint" style="display:none;">
  WASD to move · mouse to look · click a painting
</div>

<button id="muteBtn" style="display:none;">
  🔊 Sound
</button>

<div class="modalOverlay" id="noteOverlay">

  <div class="note" id="noteBox">

    <h3 id="noteTitle">Untitled</h3>

    <p id="noteBody">...</p>

    <button id="noteClose">
      close
    </button>

  </div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ================================================================
   RAMSHA ART STUDIO
   LIFELIKE PRIVATE GALLERY

   The architecture is intentionally simple but physically coherent.

   Hallway:
       long narrow old-house corridor

   Rooms:
       1 — children's playroom
       2 — snowy farmhouse
       3 — snowy cottage
       4 — quiet night room
       5 — eerie final room

   Important:
       The welcome screen is intentionally unchanged.
================================================================ */


/* ================================================================
   BASIC STATE
================================================================ */

const $ = id => document.getElementById(id);

let gameStarted = false;
let galleryReady = false;
let dom = null;

let audioCtx = null;
let master = null;
let muted = false;

let camera;
let scene;
let renderer;

let yaw = Math.PI;
let pitch = 0;

const keys = {};

const clickable = [];

const flickerLights = [];

const animatedObjects = [];

const collisionRects = [];


/* ================================================================
   ORIGINAL WELCOME BEHAVIOUR
================================================================ */

function showFatalError(msg){

  const lbl = $('roomLabel');

  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';

  lbl.textContent = '⚠ ' + msg;

  console.error(msg);
}


$('enterBtn').onclick = () => {

  const name =
    $('nameInput').value.trim() || 'friend';

  $('stepEnterName').style.display = 'none';

  const wm = $('welcomeMsg');

  wm.style.display = 'block';

  wm.textContent =
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn('Audio failed:',e);
  }

  setTimeout(()=>{

    $('welcome').style.display = 'none';

    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';

    gameStarted = true;

    if(!galleryReady){

      showFatalError(
        '3D engine did not start — open the browser console (F12) for details.'
      );

    }else if(dom){

      dom.requestPointerLock();

    }

  },2200);

};


$('muteBtn').onclick = ()=>{

  muted = !muted;

  if(master){

    master.gain.value =
      muted ? 0 : 0.25;

  }

  $('muteBtn').textContent =
    muted ? '🔇 Sound' : '🔊 Sound';

};


$('noteClose').onclick = ()=>{

  $('noteOverlay').style.display = 'none';

};


function openNote(d){

  if(dom){

    document.exitPointerLock();

  }

  const box = $('noteBox');

  box.classList.toggle(
    'win',
    !!d.winner
  );

  $('noteTitle').textContent =
    d.winner
      ? '🎉 You found a free print!'
      : d.label;

  $('noteBody').textContent =
    d.story;

  $('noteOverlay').style.display =
    'flex';

}


/* ================================================================
   AUDIO
================================================================ */

function startAudio(){

  if(audioCtx)
    return;

  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  master =
    audioCtx.createGain();

  master.gain.value =
    0.25;

  master.connect(
    audioCtx.destination
  );


  const drone =
    audioCtx.createOscillator();

  drone.type =
    'sine';

  drone.frequency.value =
    46;

  const dg =
    audioCtx.createGain();

  dg.gain.value =
    0.055;

  drone
    .connect(dg)
    .connect(master);

  drone.start();


  const bufSize =
    2 * audioCtx.sampleRate;

  const buf =
    audioCtx.createBuffer(
      1,
      bufSize,
      audioCtx.sampleRate
    );

  const data =
    buf.getChannelData(0);

  for(let i=0;i<bufSize;i++){

    data[i] =
      Math.random()*2-1;

  }


  const noise =
    audioCtx.createBufferSource();

  noise.buffer =
    buf;

  noise.loop =
    true;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type =
    'lowpass';

  filter.frequency.value =
    420;

  const ng =
    audioCtx.createGain();

  ng.gain.value =
    0.025;

  noise
    .connect(filter)
    .connect(ng)
    .connect(master);

  noise.start();

}


/* ================================================================
   THREE INITIALISATION
================================================================ */

try{

  initGallery();

  galleryReady = true;

}catch(err){

  showFatalError(
    'Gallery failed to load: ' +
    err.message
  );

}


/* ================================================================
   INIT
================================================================ */

function initGallery(){

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(0x191514);

  scene.fog =
    new THREE.Fog(
      0x191514,
      38,
      118
    );


  camera =
    new THREE.PerspectiveCamera(
      72,
      innerWidth/innerHeight,
      .05,
      180
    );

  camera.position.set(
    0,
    1.65,
    4
  );


  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.shadowMap.enabled =
    true;

  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

  renderer.outputEncoding =
    THREE.sRGBEncoding;

  renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

  renderer.toneMappingExposure =
    .88;


  $('app').prepend(
    renderer.domElement
  );

  dom =
    renderer.domElement;

  $('loading').style.display =
    'none';


  window.addEventListener(
    'resize',
    resize
  );


  buildArchitecture();

  buildHallwayDecor();

  buildRooms();

  setupControls();

  loop();

}


/* ================================================================
   RESIZE
================================================================ */

function resize(){

  camera.aspect =
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

}


/* ================================================================
   MATERIAL HELPERS
================================================================ */

function mat(
  color,
  roughness=.8,
  metalness=0
){

  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });

}


function mesh(
  geometry,
  material,
  x=0,
  y=0,
  z=0,
  rx=0,
  ry=0,
  rz=0
){

  const m =
    new THREE.Mesh(
      geometry,
      material
    );

  m.position.set(
    x,y,z
  );

  m.rotation.set(
    rx,ry,rz
  );

  m.castShadow =
    true;

  m.receiveShadow =
    true;

  scene.add(m);

  return m;

}


function addTo(
  parent,
  geometry,
  material,
  x=0,
  y=0,
  z=0,
  rx=0,
  ry=0,
  rz=0
){

  const m =
    new THREE.Mesh(
      geometry,
      material
    );

  m.position.set(
    x,y,z
  );

  m.rotation.set(
    rx,ry,rz
  );

  m.castShadow =
    true;

  m.receiveShadow =
    true;

  parent.add(m);

  return m;

}


/* ================================================================
   PROCEDURAL TEXTURES
================================================================ */

function canvasTexture(
  draw,
  w=512,
  h=512
){

  const c =
    document.createElement(
      'canvas'
    );

  c.width =
    w;

  c.height =
    h;

  const ctx =
    c.getContext('2d');

  draw(
    ctx,
    w,
    h
  );

  const t =
    new THREE.CanvasTexture(c);

  t.encoding =
    THREE.sRGBEncoding;

  t.wrapS =
    THREE.RepeatWrapping;

  t.wrapT =
    THREE.RepeatWrapping;

  return t;

}


/* OLD WALLPAPER */

function wallpaperTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle =
        '#54252d';

      ctx.fillRect(
        0,0,w,h
      );


      for(let x=0;x<w;x+=36){

        ctx.fillStyle =
          x%72===0
            ? 'rgba(105,53,57,.25)'
            : 'rgba(28,12,17,.18)';

        ctx.fillRect(
          x,
          0,
          18,
          h
        );

      }


      for(let i=0;i<150;i++){

        const x =
          Math.random()*w;

        const y =
          Math.random()*h;

        const s =
          1+Math.random()*8;

        ctx.fillStyle =
          Math.random()>.45
            ? 'rgba(218,190,151,.13)'
            : 'rgba(15,7,10,.22)';

        ctx.fillRect(
          x,y,s,
          Math.random()*3+1
        );

      }

    }
  );

}


/* OLD WOOD */

function woodTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle =
        '#34241c';

      ctx.fillRect(
        0,0,w,h
      );


      for(let i=0;i<70;i++){

        const y =
          Math.random()*h;

        ctx.strokeStyle =
          `rgba(8,5,3,${.12+Math.random()*.2})`;

        ctx.lineWidth =
          1+Math.random()*3;

        ctx.beginPath();

        ctx.moveTo(
          0,y
        );

        for(
          let x=0;
          x<=w;
          x+=30
        ){

          ctx.lineTo(
            x,
            y+
            Math.sin(x*.04+i)*3
          );

        }

        ctx.stroke();

      }

    }
  );

}


/* OLD CARPET */

function carpetTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle =
        '#493039';

      ctx.fillRect(
        0,0,w,h
      );


      ctx.strokeStyle =
        'rgba(190,155,105,.38)';

      ctx.lineWidth =
        10;

      ctx.strokeRect(
        14,14,w-28,h-28
      );


      ctx.lineWidth =
        2;

      ctx.strokeStyle =
        'rgba(190,155,105,.25)';

      ctx.strokeRect(
        29,29,w-58,h-58
      );


      for(let i=0;i<90;i++){

        const x =
          Math.random()*w;

        const y =
          Math.random()*h;

        ctx.fillStyle =
          Math.random()>.5
            ? 'rgba(15,8,10,.25)'
            : 'rgba(220,190,140,.16)';

        ctx.fillRect(
          x,y,
          2+Math.random()*5,
          2+Math.random()*2
        );

      }

    },
    256,
    1024
  );

}


/* ================================================================
   ARCHITECTURE
================================================================ */

const HALL_HALF =
  1.65;

const HALL_LENGTH =
  118;

const HALL_HEIGHT =
  4.4;

const ROOM_W =
  8.6;

const ROOM_D =
  13.5;

const ROOM_HEIGHT =
  4.4;

const DOOR_HALF =
  1.15;


/* FLOOR */

function buildArchitecture(){

  const floorTex =
    canvasTexture(
      (ctx,w,h)=>{

        ctx.fillStyle =
          '#211b18';

        ctx.fillRect(
          0,0,w,h
        );

        for(let i=0;i<500;i++){

          ctx.fillStyle =
            `rgba(255,255,255,${Math.random()*.035})`;

          ctx.fillRect(
            Math.random()*w,
            Math.random()*h,
            1,
            1
          );

        }

      }
    );

  floorTex.repeat.set(
    2,
    20
  );


  const floorMat =
    new THREE.MeshStandardMaterial({
      map:floorTex,
      roughness:.94
    });


  mesh(
    new THREE.PlaneGeometry(
      3.3,
      HALL_LENGTH
    ),
    floorMat,
    0,
    0,
    HALL_LENGTH/2,
    -Math.PI/2
  );


  /* CEILING */

  const ceilingMat =
    mat(
      0x211c19,
      1
    );

  mesh(
    new THREE.PlaneGeometry(
      3.3,
      HALL_LENGTH
    ),
    ceilingMat,
    0,
    HALL_HEIGHT,
    HALL_LENGTH/2,
    Math.PI/2
  );


  /* WALLS */

  buildHallWall(-1);

  buildHallWall(1);


  /* END WALLS */

  wallPanel(
    0,
    2.2,
    HALL_LENGTH,
    3.3,
    HALL_HEIGHT,
    '#452b2b'
  );


  /* BASEBOARDS */

  [-1,1].forEach(side=>{

    mesh(
      new THREE.BoxGeometry(
        .08,
        .28,
        HALL_LENGTH
      ),
      mat(0x251913,.72),
      side*1.59,
      .18,
      HALL_LENGTH/2
    );

  });


  /* CEILING MOULDING */

  [-1,1].forEach(side=>{

    mesh(
      new THREE.BoxGeometry(
        .14,
        .14,
        HALL_LENGTH
      ),
      mat(0x7a6347,.7),
      side*1.54,
      HALL_HEIGHT-.1,
      HALL_LENGTH/2
    );

  });


  /* WARM GLOBAL LIGHT */

  const ambient =
    new THREE.HemisphereLight(
      0x62585a,
      0x18110e,
      .62
    );

  scene.add(
    ambient
  );


  const front =
    new THREE.PointLight(
      0x8d725c,
      .5,
      22
    );

  front.position.set(
    0,
    3.5,
    7
  );

  scene.add(
    front
  );

}


/* ================================================================
   HALL WALL WITH ACTUAL DOOR OPENINGS
================================================================ */

function buildHallWall(side){

  const tex =
    wallpaperTexture();

  tex.repeat.set(
    2,
    1
  );


  const wallpaperMat =
    new THREE.MeshStandardMaterial({
      map:tex,
      roughness:1,
      side:THREE.DoubleSide
    });


  const woodMat =
    mat(
      0x35251d,
      .9
    );


  const rooms =
    ROOM_CONFIGS.filter(
      r => r.side===side
    );


  let cursor =
    0;


  rooms.forEach(room=>{

    const gapStart =
      room.z - DOOR_HALF - .08;

    if(gapStart>cursor){

      createWallSegment(
        side,
        cursor,
        gapStart,
        wallpaperMat
      );

    }

    cursor =
      room.z +
      DOOR_HALF +
      .08;

  });


  if(cursor<HALL_LENGTH){

    createWallSegment(
      side,
      cursor,
      HALL_LENGTH,
      wallpaperMat
    );

  }


  /* WAINSCOT */

  rooms.forEach(room=>{

    const gapStart =
      room.z - DOOR_HALF - .08;

    createWainscotSegment(
      side,
      0,
      gapStart,
      woodMat
    );

    /* after each doorway */

  });


  /* simpler continuous lower wood panels */

  let c=0;

  rooms.forEach(room=>{

    const a =
      room.z-DOOR_HALF-.08;

    if(a>c){

      createWainscotSegment(
        side,
        c,
        a,
        woodMat
      );

    }

    c =
      room.z+DOOR_HALF+.08;

  });

  if(c<HALL_LENGTH){

    createWainscotSegment(
      side,
      c,
      HALL_LENGTH,
      woodMat
    );

  }


  /* DOOR CASINGS */

  rooms.forEach(room=>{

    const x =
      side*1.60;

    const z =
      room.z;


    const casing =
      mat(
        0x6b4c32,
        .68
      );


    addDoorCasing(
      x,
      z,
      casing
    );

  });

}


/* ================================================================
   WALL SEGMENTS
================================================================ */

function createWallSegment(
  side,
  start,
  end,
  material
){

  const length =
    end-start;

  if(length<=0)
    return;

  mesh(
    new THREE.BoxGeometry(
      .16,
      HALL_HEIGHT-1.0,
      length
    ),
    material,
    side*1.64,
    2.9,
    start+length/2
  );

}


function createWainscotSegment(
  side,
  start,
  end,
  material
){

  const length =
    end-start;

  if(length<=0)
    return;

  mesh(
    new THREE.BoxGeometry(
      .18,
      1.08,
      length
    ),
    material,
    side*1.58,
    .55,
    start+length/2
  );


  /* individual panel divisions */

  for(
    let z=start+1.1;
    z<end-0.2;
    z+=1.45
  ){

    mesh(
      new THREE.BoxGeometry(
        .035,
        .82,
        .045
      ),
      mat(0x51382a,.8),
      side*1.49,
      .57,
      z
    );

  }

}


/* ================================================================

  const postH =

  mesh(
    new THREE.BoxGeometry(
      depth,

      .13
    ),

    ),
    material,

function roomWorldX(
  cfg
){

  return cfg.side *
    (HALL_HALF + ROOM_W/2);

}


function createRoom(
  cfg
){

  const g =
    new THREE.Group();

  g.position.set(
    roomWorldX(cfg),
    0,
    cfg.z
  );

  scene.add(g);


  /* FLOOR */

  const floorColor =
    cfg.type==='playroom'
      ? 0x61584e
      : cfg.type==='farmhouse'
        ? 0x50382b
        : cfg.type==='snowcottage'
          ? 0x4b4038
          : cfg.type==='night'
            ? 0x292934
            : 0x171313;


  addTo(
    g,
    new THREE.PlaneGeometry(
      ROOM_W,
      ROOM_D
    ),
    mat(
      floorColor,
      .92
    ),
    0,
    .015,
    0,
    -Math.PI/2
  );


  /* CEILING */

  addTo(
    g,
    new THREE.PlaneGeometry(
      ROOM_W,
      ROOM_D
    ),
    mat(
      0x282321,
      1
    ),
    0,
    ROOM_HEIGHT,
    0,
    Math.PI/2
  );


  /* OUTER WALL */

  addTo(
    g,
    new THREE.BoxGeometry(
      .14,
      ROOM_HEIGHT,
      ROOM_D
    ),
    mat(
      cfg.type==='playroom'
        ? 0xb8a994
        : cfg.type==='farmhouse'
          ? 0x756354
          : cfg.type==='snowcottage'
            ? 0x6d6660
            : 0x2e2b35,
      .9
    ),
    cfg.side*ROOM_W/2,
    ROOM_HEIGHT/2,
    0
  );


  /* BACK WALL */

  addTo(
    g,
    new THREE.BoxGeometry(
      ROOM_W,
      ROOM_HEIGHT,
      .14
    ),
    mat(
      cfg.type==='playroom'
        ? 0xc3b8a8
        : cfg.type==='farmhouse'
          ? 0x715848
          : cfg.type==='snowcottage'
            ? 0x66625e
            : 0x2b2730,
      .92
    ),
    0,
    ROOM_HEIGHT/2,
    ROOM_D/2
  );


  /* FRONT WALL */

  addTo(
    g,
    new THREE.BoxGeometry(
      ROOM_W,
      ROOM_HEIGHT,
      .14
    ),
    mat(
      0x3d302b,
      .92
    ),
    0,
    ROOM_HEIGHT/2,
    -ROOM_D/2
  );


  /* TWO INTERIOR SIDE RETURNS */

  addTo(
    g,
    new THREE.BoxGeometry(
      .14,
      ROOM_HEIGHT,
      ROOM_D
    ),
    mat(
      cfg.type==='playroom'
        ? 0xb8a994
        : cfg.type==='farmhouse'
          ? 0x70594a
          : cfg.type==='snowcottage'
            ? 0x66615d
            : 0x302c35,
      .92
    ),
    -ROOM_W/2,
    ROOM_HEIGHT/2,
    0
  );


  /* doorway opening is on hallway side:
     therefore that side is not covered continuously */

  /* baseboard */

  addTo(
    g,
    new THREE.BoxGeometry(
      ROOM_W,
      .22,
      .12
    ),
    mat(0x36251c,.85),
    0,
    .13,
    ROOM_D/2-.1
  );


  /* LIGHT */

  const color =
    cfg.type==='playroom'
      ? 0xffd6a0
      : cfg.type==='farmhouse'
        ? 0xffbd7b
        : cfg.type==='snowcottage'
          ? 0xffc88d
          : cfg.type==='night'
            ? 0xa9b9e6
            : 0xff6554;


  const light =
    new THREE.PointLight(
      color,
      cfg.type==='eerie'
        ? .7
        : 1.15,
      12
    );

  light.position.set(
    -cfg.side*1.1,
    3.3,
    -1
  );

  light.castShadow =
    true;

  light.shadow.mapSize.width =
    512;

  light.shadow.mapSize.height =
    512;

  g.add(light);


  if(
    cfg.type==='farmhouse' ||
    cfg.type==='snowcottage'
  ){

    flickerLights.push({
      light,
      base:1.15,
      mode:'warm'
    });

  }


  if(cfg.type==='playroom')
    buildPlayroom(g,cfg);

  if(cfg.type==='farmhouse')
    buildFarmhouse(g,cfg);

  if(cfg.type==='snowcottage')
    buildSnowCottage(g,cfg);

  if(cfg.type==='night')
    buildNightRoom(g,cfg);

  if(cfg.type==='eerie')
    buildEerieRoom(g,cfg);


  return g;

}

/* ================================================================
   SLIDE
================================================================ */

function buildSlide(
  g,
  x,
  y,
  z
){

  const railMat =
    mat(0x7c6b64,.65);


  /* platform */

  addTo(
    g,
    new THREE.BoxGeometry(
      1.05,
      .75,
      .9
    ),
    mat(0x8e7267,.82),
    x,
    .4,
    z
  );


  /* curved-looking slide made from segments */

  for(let i=0;i<7;i++){

    const t=i/6;

    const px =
      x+
      t*1.8;

    const py =
      .85-
      t*.65;

    const pz =
      z+
      Math.sin(t*Math.PI)*.35;


    const segment =
      addTo(
        g,
        new THREE.CylinderGeometry(
          .46,
          .46,
          .42,
          20,
          1,
          true
        ),
        mat(0x7d8790,.72),
        px,
        py,
        pz,
        0,
        0,
        Math.PI/2
      );

  }


  /* support legs */

  [-.32,.32].forEach(dx=>{

    addTo(
      g,
      new THREE.CylinderGeometry(
        .055,
        .065,
        .8,
        12
      ),
      railMat,
      x+dx,
      .4,
      z
    );

  });

}

/* ================================================================
   SNOW WINDOW
================================================================ */

function buildSnowWindow(
  g,
  x,
  y,
  z,
  w,
  h
){

  const frame =
    mat(0x4b372a,.72);


  /* cool exterior */

  const outsideTex =
    canvasTexture(
      (ctx,W,H)=>{

        const grd =
          ctx.createLinearGradient(
            0,0,0,H
          );

        grd.addColorStop(
          0,
          '#23354a'
        );

        grd.addColorStop(
          1,
          '#aab9c5'
        );

        ctx.fillStyle =
          grd;

        ctx.fillRect(
          0,0,W,H
        );


        /* trees */

        for(let i=0;i<9;i++){

          const tx =
            i*W/8;

          ctx.fillStyle =
            'rgba(35,53,60,.75)';

          ctx.beginPath();

          ctx.moveTo(
            tx,
            H*.25
          );

          ctx.lineTo(
            tx-35,
            H
          );

          ctx.lineTo(
            tx+35,
            H
          );

          ctx.closePath();

          ctx.fill();

        }


        /* snow field */

        ctx.fillStyle =
          '#e8edf0';

        ctx.fillRect(
          0,
          H*.68,
          W,
          H*.32
        );


        /* house lights */

        for(let i=0;i<4;i++){

          ctx.fillStyle =
            '#d5a45f';

          ctx.fillRect(
            30+i*110,
            H*.53,
            28,
            18
          );

        }

      },
      512,
      320
    );


  const glass =
    new THREE.MeshBasicMaterial({
      map:outsideTex
    });


  addTo(
    g,
    new THREE.BoxGeometry(
      w,
      h,
      .06
    ),
    glass,
    x,
    y,
    z
  );


  /* frame sides */

  addTo(
    g,
    new THREE.BoxGeometry(
      .13,
      h+.15,
      .16
    ),
    frame,
    x-w/2,
    y,
    z-.06
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      .13,
      h+.15,
      .16
    ),
    frame,
    x+w/2,
    y,
    z-.06
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      w+.15,
      .13,
      .16
    ),
    frame,
    x,
    y+h/2,
    z-.06
  );


  addTo(
    g,
    new THREE.BoxGeometry(
      w+.15,
      .13,
      .16
    ),
    frame,
    x,
    y-h/2,
    z-.06
  );


  /* central mullion */

  addTo(
    g,
    new THREE.BoxGeometry(
      .08,
      h,
      .17
    ),
    frame,
    x,
    y,
    z-.07
  );


  /* snow accumulation */

  addTo(
    g,
    new THREE.BoxGeometry(
      w+.3,
      .12,
      .18
    ),
    mat(0xe3e7e9,.98),
    x,
    y-h/2-.02,
    z-.09
  );

}

/* ================================================================
   PAINTINGS
================================================================ */

function placeholderArt(
  label,
  hue
){

  return canvasTexture(
    (ctx,w,h)=>{

      const g =
        ctx.createLinearGradient(
          0,0,w,h
        );

      g.addColorStop(
        0,
        `hsl(${hue},25%,22%)`
      );

      g.addColorStop(
        1,
        `hsl(${hue+25},22%,8%)`
      );

      ctx.fillStyle =
        g;

      ctx.fillRect(
        0,0,w,h
      );


      /* atmospheric horizon */

      ctx.fillStyle =
        'rgba(20,25,28,.7)';

      ctx.fillRect(
        0,
        h*.58,
        w,
        h*.42
      );


      /* house */

      ctx.fillStyle =
        'rgba(10,12,13,.9)';

      ctx.fillRect(
        w*.42,
        h*.38,
        w*.18,
        h*.28
      );


      ctx.beginPath();

      ctx.moveTo(
        w*.37,
        h*.38
      );

      ctx.lineTo(
        w*.51,
        h*.25
      );

      ctx.lineTo(
        w*.65,
        h*.38
      );

      ctx.closePath();

      ctx.fill();


      /* window */

      ctx.fillStyle =
        'rgba(236,178,99,.7)';

      ctx.fillRect(
        w*.49,
        h*.45,
        w*.045,
        h*.065
      );


      /* border */

      ctx.strokeStyle =
        'rgba(208,185,145,.55)';

      ctx.lineWidth =
        10;

      ctx.strokeRect(
        10,
        10,
        w-20,
        h-20
      );


      ctx.fillStyle =
        'rgba(255,255,255,.62)';

      ctx.font =
        '20px Georgia';

      ctx.textAlign =
        'center';

      ctx.fillText(
        label,
        w/2,
        h-28
      );

    },
    512,
    384
  );

}

        w+.20,

        .10
      ),

      cfg.x,
      cfg.y,
      cfg.z,

  const carpetTex =

      map:carpetTex,

  mesh(

      HALL_LENGTH-1
    ),

    0,

    HALL_LENGTH/2,
    -Math.PI/2
  );


  /* antique sconces */

  for(let z=6;z<HALL_LENGTH-4;z+=7.5){

    buildSconce(
      -1.52,
      2.5,
      z
    );

    buildSconce(
      1.52,
      2.5,
      z+3.75
    );

  }


  /* opposite-wall artwork */

  const portraitPositions = [];


  for(
    let z=7;

    z+=8.5

    const nearDoor =
      ROOM_CONFIGS.some(
        r =>
          Math.abs(r.z-z)<2

    if(!nearDoor){

      portraitPositions.push(
        z

    }

  portraitPositions.forEach(
    (z,i)=>{

      buildHallPortrait(
        -1.54,
        2.45,
        z,
        i
      );

    }
  );


  for(
    let z=10.5;

    z+=8.5

    const nearDoor =
      ROOM_CONFIGS.some(
        r =>
          Math.abs(r.z-z)<2
      );


    if(!nearDoor){

      buildHallPortrait(
        1.54,
        2.45,
        z,
        z
      );

    }

  }


  /* little console near far end */

  buildConsole(
    1.35,

  );

/* ================================================================
   CONTROLS
================================================================ */

function setupControls(){

  document.addEventListener(
    'keydown',
    e=>{
      keys[e.code]=true;
    }
  );


  document.addEventListener(
    'keyup',
    e=>{
      keys[e.code]=false;
    }
  );


  dom.addEventListener(
    'click',
    ()=>{
      if(
        gameStarted &&
        document.pointerLockElement!==dom
      ){
        dom.requestPointerLock();
      }
    }
  );


  document.addEventListener(
    'mousemove',
    e=>{

      if(
        document.pointerLockElement!==dom
      )
        return;


      yaw -=
        e.movementX*.0022;

      pitch -=
        e.movementY*.0022;

      pitch =
        Math.max(
          -1.2,
          Math.min(
            1.2,
            pitch
          )
        );

    }
  );


  dom.addEventListener(
    'mousedown',
    e=>{

      if(
        !gameStarted ||
        document.pointerLockElement!==dom
      )
        return;


      const ray =
        new THREE.Raycaster();


      ray.setFromCamera(
        {
          x:0,
          y:0
        },
        camera
      );


      const hits =
        ray.intersectObjects(
          clickable
        );


      if(hits.length){

        openNote(
          hits[0].object.userData
        );

      }

    }
  );

}


/* ================================================================
   PHYSICAL MAP COLLISION
================================================================ */

/*
   This is deliberately NOT just a giant bounding box.

   The player can enter a room only through its actual doorway.

   Outside:
       hallway width is enforced.

   Inside:
       room width/depth are enforced.

   Door:
       the only opening through the hallway wall.
*/

const PLAYER_RADIUS =
  .32;


function roomBounds(
  r
){

  const cx =
    roomWorldX(r);

  return {
    minX:
      cx-ROOM_W/2+
      PLAYER_RADIUS,

    maxX:
      cx+ROOM_W/2-
      PLAYER_RADIUS,

    minZ:
      r.z-ROOM_D/2+
      PLAYER_RADIUS,

    maxZ:
      r.z+ROOM_D/2-
      PLAYER_RADIUS
  };

}


function resolvePlayer(
  nextX,
  nextZ
){

  nextZ =
    Math.max(
      1.0,
      Math.min(
        HALL_LENGTH-1,
        nextZ
      )
    );


  /* Is the player already inside a room? */

  let inside =
    null;


  for(
    const r of ROOM_CONFIGS
  ){

    const b =
      roomBounds(r);


    if(
      camera.position.x>b.minX &&
      camera.position.x<b.maxX &&
      camera.position.z>b.minZ &&
      camera.position.z<b.maxZ
    ){

      inside=r;
      break;

    }

  }


  /* ------------------------------------------------------------
     ROOM COLLISION
  ------------------------------------------------------------ */

  if(inside){

    const b =
      roomBounds(inside);

    const innerWall =
      inside.side*
      HALL_HALF;


    let x =
      nextX;

    let z =
      nextZ;


    /* back/side room boundaries */

    z =
      Math.max(
        b.minZ,
        Math.min(
          b.maxZ,
          z
        )
      );


    /*
       hallway-facing wall.

       Only pass if the player's z is
       inside the doorway.
    */

    if(inside.side===-1){

      if(
        x >
        -HALL_HALF+
        PLAYER_RADIUS
      ){

        if(
          Math.abs(
            z-inside.z
          ) >
          DOOR_HALF-
          PLAYER_RADIUS*.2
        ){

          x =
            -HALL_HALF+
            PLAYER_RADIUS;

        }

      }

      x =
        Math.max(
          b.minX,
          Math.min(
            b.maxX,
            x
          )
        );

    }else{

      if(
        x <
        HALL_HALF-
        PLAYER_RADIUS
      ){

        if(
          Math.abs(
            z-inside.z
          ) >
          DOOR_HALF-
          PLAYER_RADIUS*.2
        ){

          x =
            HALL_HALF-
            PLAYER_RADIUS;

        }

      }

      x =
        Math.max(
          b.minX,
          Math.min(
            b.maxX,
            x
          )
        );

    }


    return {
      x,
      z
    };

  }


  /* ------------------------------------------------------------
     HALLWAY COLLISION
  ------------------------------------------------------------ */

  let x =
    nextX;


  const hallMin =
    -HALL_HALF+
    PLAYER_RADIUS;

  const hallMax =
    HALL_HALF-
    PLAYER_RADIUS;


  /*
     Leaving hallway on left:
     only legal if there is a left room
     doorway at this z.
  */

  if(
    x<hallMin
  ){

    const doorway =
      ROOM_CONFIGS.some(
        r =>
          r.side===-1 &&
          Math.abs(
            r.z-nextZ
          )<
          DOOR_HALF-
          PLAYER_RADIUS*.15
      );


    if(!doorway){

      x=
        hallMin;

    }

  }


  /*
     Leaving hallway on right.
  */

  if(
    x>hallMax
  ){

    const doorway =
      ROOM_CONFIGS.some(
        r =>
          r.side===1 &&
          Math.abs(
            r.z-nextZ
          )<
          DOOR_HALF-
          PLAYER_RADIUS*.15
      );


    if(!doorway){

      x=
        hallMax;

    }

  }


  return {
    x,
    z:nextZ
  };

}


/* ================================================================
   MOVEMENT
================================================================ */

function updateMovement(
  dt
){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    'YXZ'
  );


  const speed =
    3.15*dt;


  const fwd =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );


  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  const mv =
    new THREE.Vector3();


  if(keys['KeyW'])
    mv.add(fwd);

  if(keys['KeyS'])
    mv.sub(fwd);

  if(keys['KeyD'])
    mv.add(right);

  if(keys['KeyA'])
    mv.sub(right);


  if(mv.length()>0){

    mv.normalize();

    mv.multiplyScalar(
      speed
    );


    const result =
      resolvePlayer(
        camera.position.x+
        mv.x,
        camera.position.z+
        mv.z
      );


    camera.position.x =
      result.x;

    camera.position.z =
      result.z;

  }


  updateRoomLabel();

}


/* ================================================================
   ROOM LABEL
================================================================ */

function updateRoomLabel(){

  const nearest =
    ROOM_CONFIGS.reduce(
      (a,r)=>
        Math.abs(
          r.z-
          camera.position.z
        )
        <
        Math.abs(
          a.z-
          camera.position.z
        )
          ?r
          :a,
      ROOM_CONFIGS[0]
    );


  const lbl =
    $('roomLabel');


  if(
    Math.abs(
      nearest.z-
      camera.position.z
    )<5.5
  ){

    lbl.style.opacity=1;

    lbl.textContent =
      nearest.tag;

  }else{

    lbl.style.opacity=0;

  }

}


/* ================================================================
   ANIMATION
================================================================ */

const clock =
  new THREE.Clock();


function animateEnvironment(
  t
){

  flickerLights.forEach(
    f=>{

      if(f.mode==='fire'){

        f.light.intensity =
          f.base *
          (
            .84+
            Math.random()*.28+
            Math.sin(t*9)*.06
          );

      }

      else if(
        f.mode==='warm'
      ){

        f.light.intensity =
          f.base*
          (
            .94+
            Math.sin(t*1.7)*.035+
            Math.random()*.04
          );

      }

      else if(
        f.mode==='sconce'
      ){

        f.light.intensity =
          f.base*
          (
            .95+
            Math.sin(
              t*.8+
              f.light.position.z
            )*.025
          );

      }

      else if(
        f.mode==='uneasy'
      ){

        f.light.intensity =
          f.base*
          (
            .75+
            Math.random()*.3
          );

      }

    }
  );


  animatedObjects.forEach(
    o=>{

      if(o.object){

        o.object.rotation.z =
          Math.sin(
            t*o.speed+
            o.baseRot
          )*.025;

        o.object.rotation.x =
          Math.cos(
            t*o.speed*.7+
            o.baseRot
          )*.018;

      }


      if(
        o.type==='fire'
      ){

        o.flames.forEach(
          (flame,i)=>{

            flame.scale.y =
              .78+
              Math.sin(
                t*(6+i*.8)+i
              )*.18;

            flame.rotation.z =
              Math.sin(
                t*(4+i)+i
              )*.12;

            flame.position.x =
              flame.position.x+
              Math.sin(
                t*3+i
              )*.0006;

          }
        );

      }

    }
  );

}


/* ================================================================
   RENDER LOOP
================================================================ */

function loop(){

  requestAnimationFrame(
    loop
  );


  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );


  if(gameStarted){

    updateMovement(
      dt
    );

  }


  animateEnvironment(
    clock.elapsedTime
  );


  renderer.render(
    scene,
    camera
  );

}

</script>
