<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   UI
========================================================= */

const $=id=>document.getElementById(id);

let gameStarted=false;
let galleryReady=false;
let dom=null;

$("enterBtn").onclick=()=>{

  const name=
    $("nameInput").value.trim() ||
    "friend";

  $("stepEnterName").style.display="none";

  $("welcomeMsg").style.display="block";

  $("welcomeMsg").textContent=
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn(e);
  }

  setTimeout(()=>{

    $("welcome").style.display="none";
    $("crosshair").style.display="block";
    $("hint").style.display="block";
    $("muteBtn").style.display="block";

    gameStarted=true;

    if(galleryReady){
      dom.requestPointerLock();
    }

  },2200);
};

$("muteBtn").onclick=()=>{

  muted=!muted;

  if(master)
    master.gain.value=
      muted ? 0 : .24;

  $("muteBtn").textContent=
    muted ? "🔇 Sound" : "🔊 Sound";
};

$("noteClose").onclick=()=>{
  $("noteOverlay").style.display="none";
};


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let master=null;
let muted=false;
let footstepTimer=0;

function startAudio(){

  if(audioCtx)return;

  audioCtx=
    new(window.AudioContext||window.webkitAudioContext)();

  master=audioCtx.createGain();
  master.gain.value=.24;
  master.connect(audioCtx.destination);

  const drone=
    audioCtx.createOscillator();

  drone.type="sine";
  drone.frequency.value=48;

  const dg=
    audioCtx.createGain();

  dg.gain.value=.09;

  drone.connect(dg).connect(master);
  drone.start();

  const length=
    2*audioCtx.sampleRate;

  const buffer=
    audioCtx.createBuffer(
      1,
      length,
      audioCtx.sampleRate
    );

  const data=
    buffer.getChannelData(0);

  for(let i=0;i<length;i++)
    data[i]=Math.random()*2-1;

  const noise=
    audioCtx.createBufferSource();

  noise.buffer=buffer;
  noise.loop=true;

  const filter=
    audioCtx.createBiquadFilter();

  filter.type="lowpass";
  filter.frequency.value=380;

  const ng=
    audioCtx.createGain();

  ng.gain.value=.012;

  noise
    .connect(filter)
    .connect(ng)
    .connect(master);

  noise.start();
}

function footstepTick(dt){

  if(!audioCtx||muted)return;

  footstepTimer-=dt;

  if(footstepTimer>0)return;

  footstepTimer=.38;

  const o=
    audioCtx.createOscillator();

  const g=
    audioCtx.createGain();

  o.type="triangle";
  o.frequency.value=78+Math.random()*18;

  g.gain.value=0;

  o.connect(g).connect(master);

  const now=audioCtx.currentTime;

  g.gain.linearRampToValueAtTime(
    .022,
    now+.015
  );

  g.gain.exponentialRampToValueAtTime(
    .001,
    now+.09
  );

  o.start(now);
  o.stop(now+.1);
}


/* =========================================================
   THREE
========================================================= */

let scene,camera,renderer,clock;

try{

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x070607);

  scene.fog=
    new THREE.FogExp2(
      0x090708,
      .0105
    );

  camera=
    new THREE.PerspectiveCamera(
      72,
      innerWidth/innerHeight,
      .1,
      220
    );

  camera.position.set(
    0,
    1.68,
    5
  );

  renderer=
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.shadowMap.enabled=true;

  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  renderer.outputEncoding=
    THREE.sRGBEncoding;

  renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

  renderer.toneMappingExposure=.82;

  dom=renderer.domElement;

  $("app").prepend(dom);

  clock=new THREE.Clock();

  galleryReady=true;

  $("loading").style.display="none";

}catch(e){

  console.error(e);

}


/* =========================================================
   GLOBAL LIGHT
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0x243142,
    0x170d0c,
    .55
  )
);

scene.add(
  new THREE.AmbientLight(
    0x191416,
    .48
  )
);


/* =========================================================
   MATERIALS
========================================================= */

function mat(color,opts={}){

  return new THREE.MeshStandardMaterial({

    color,

    roughness:
      opts.roughness!==undefined
      ?opts.roughness
      :.86,

    metalness:
      opts.metalness!==undefined
      ?opts.metalness
      :0,

    emissive:
      opts.emissive||0x000000,

    emissiveIntensity:
      opts.emissiveIntensity||0,

    transparent:
      opts.transparent||false,

    opacity:
      opts.opacity!==undefined
      ?opts.opacity
      :1,

    side:
      opts.side!==undefined
      ?opts.side
      :THREE.FrontSide
  });
}

function add(
  parent,
  geometry,
  material,
  x=0,y=0,z=0,
  rx=0,ry=0,rz=0
){

  const m=
    new THREE.Mesh(
      geometry,
      material
    );

  m.position.set(x,y,z);
  m.rotation.set(rx,ry,rz);

  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}

function box(
  parent,
  w,h,d,
  color,
  x,y,z,
  ry=0,
  opts={}
){

  return add(
    parent,
    new THREE.BoxGeometry(w,h,d),
    mat(color,opts),
    x,y,z,
    0,ry,0
  );
}

function sphere(
  parent,
  r,
  color,
  x,y,z,
  scale=[1,1,1],
  opts={}
){

  const s=
    add(
      parent,
      new THREE.SphereGeometry(
        r,
        20,
        14
      ),
      mat(color,opts),
      x,y,z
    );

  s.scale.set(
    scale[0],
    scale[1],
    scale[2]
  );

  return s;
}

function cylinder(
  parent,
  r1,r2,h,
  color,
  x,y,z,
  segments=16,
  rx=0,
  ry=0,
  rz=0,
  opts={}
){

  return add(
    parent,
    new THREE.CylinderGeometry(
      r1,r2,h,segments
    ),
    mat(color,opts),
    x,y,z,
    rx,ry,rz
  );
}

function lineBetween(
  parent,
  a,b,
  radius,
  color,
  opts={}
){

  const d=
    new THREE.Vector3()
      .subVectors(b,a);

  const length=d.length();

  const m=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        length,
        8
      ),
      mat(color,opts)
    );

  m.position
    .copy(a)
    .add(b)
    .multiplyScalar(.5);

  m.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    d.normalize()
  );

  m.castShadow=true;

  parent.add(m);

  return m;
}


/* =========================================================
   TEXTURES
========================================================= */

function canvasTexture(draw,w,h){

  const c=
    document.createElement("canvas");

  c.width=w;
  c.height=h;

  const ctx=
    c.getContext("2d");

  draw(ctx,w,h);

  const texture=
    new THREE.CanvasTexture(c);

  texture.encoding=
    THREE.sRGBEncoding;

  return texture;
}


/*
   OLD CHAPPED WALLPAPER
*/

function oldWallpaper(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle="#432329";
      ctx.fillRect(0,0,w,h);

      /*
        Faded vertical fabric pattern.
      */

      for(let x=0;x<w;x+=58){

        ctx.strokeStyle=
          "rgba(210,173,142,.11)";

        ctx.lineWidth=2;

        ctx.beginPath();

        for(
          let y=-30;
          y<h+40;
          y+=30
        ){

          ctx.moveTo(x,y);

          ctx.quadraticCurveTo(
            x+25,
            y+15,
            x,
            y+30
          );
        }

        ctx.stroke();
      }

      /*
        Old stains.
      */

      for(let i=0;i<32;i++){

        const x=
          Math.random()*w;

        const y=
          Math.random()*h;

        const r=
          3+Math.random()*13;

        ctx.fillStyle=
          `rgba(30,15,17,${.035+Math.random()*.07})`;

        ctx.beginPath();

        ctx.ellipse(
          x,y,r,r*.55,
          Math.random(),
          0,
          Math.PI*2
        );

        ctx.fill();
      }

      /*
        Chips / worn areas.
      */

      for(let i=0;i<20;i++){

        const x=
          Math.random()*w;

        const y=
          Math.random()*h;

        ctx.fillStyle=
          "rgba(222,199,170,.09)";

        ctx.fillRect(
          x,
          y,
          3+Math.random()*12,
          1+Math.random()*4
        );
      }

    },
    512,
    512
  );
}


/*
   OLD CARPET
*/

function carpetTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle="#29171d";
      ctx.fillRect(0,0,w,h);

      ctx.fillStyle="#392029";

      ctx.fillRect(
        w*.12,
        0,
        w*.76,
        h
      );

      ctx.strokeStyle=
        "rgba(172,126,87,.32)";

      ctx.lineWidth=5;

      ctx.strokeRect(
        w*.18,
        0,
        w*.64,
        h
      );

      ctx.strokeStyle=
        "rgba(202,160,117,.13)";

      ctx.lineWidth=2;

      for(let y=20;y<h;y+=58){

        ctx.beginPath();

        ctx.moveTo(
          w*.20,
          y
        );

        ctx.lineTo(
          w*.80,
          y
        );

        ctx.stroke();
      }

      /*
        Irregular faded areas.
      */

      for(let i=0;i<35;i++){

        ctx.fillStyle=
          `rgba(210,177,143,${.015+Math.random()*.025})`;

        ctx.beginPath();

        ctx.ellipse(
          Math.random()*w,
          Math.random()*h,
          8+Math.random()*25,
          4+Math.random()*16,
          Math.random(),
          0,
          Math.PI*2
        );

        ctx.fill();
      }

    },
    256,
    1024
  );
}


/*
   OLD WOOD
*/

function woodTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle="#2d1a14";
      ctx.fillRect(0,0,w,h);

      for(let y=0;y<h;y+=30){

        ctx.fillStyle=
          y%60===0
          ?"#3c231a"
          :"#291711";

        ctx.fillRect(
          0,
          y,
          w,
          24
        );

        ctx.strokeStyle=
          "rgba(180,116,72,.11)";

        ctx.beginPath();

        ctx.moveTo(0,y+8);

        ctx.bezierCurveTo(
          w*.25,y,
          w*.62,y+18,
          w,y+7
        );

        ctx.stroke();
      }

    },
    512,
    512
  );
}


/*
   PAINTING PLACEHOLDER
*/

function paintingTexture(
  label,
  hue=210
){

  return canvasTexture(
    (ctx,w,h)=>{

      const g=
        ctx.createLinearGradient(
          0,0,w,h
        );

      g.addColorStop(
        0,
        `hsl(${hue},22%,27%)`
      );

      g.addColorStop(
        .55,
        `hsl(${hue},24%,12%)`
      );

      g.addColorStop(
        1,
        "#050507"
      );

      ctx.fillStyle=g;
      ctx.fillRect(0,0,w,h);

      ctx.fillStyle=
        `hsla(${hue},60%,80%,.13)`;

      ctx.beginPath();

      ctx.arc(
        w*.68,
        h*.3,
        h*.17,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle=
        `hsla(${hue},55%,85%,.22)`;

      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.moveTo(
        w*.06,
        h*.77
      );

      ctx.quadraticCurveTo(
        w*.42,
        h*.48,
        w*.94,
        h*.75
      );

      ctx.stroke();

      if(label){

        ctx.fillStyle=
          "rgba(255,255,255,.7)";

        ctx.font=
          "23px Georgia";

        ctx.textAlign="center";

        ctx.fillText(
          label,
          w/2,
          h*.9
        );
      }

    },
    640,
    450
  );
}


/* =========================================================
   PAINTING SYSTEM
========================================================= */

const clickable=[];

function painting(cfg,parent){

  const w=cfg.w||1.25;
  const h=cfg.h||.92;

  const artMat=
    new THREE.MeshStandardMaterial({
      map:
        cfg.texture||
        paintingTexture(
          cfg.label||"",
          cfg.hue||210
        ),
      roughness:.9
    });

  const art=
    new THREE.Mesh(
      new THREE.PlaneGeometry(w,h),
      artMat
    );

  art.position.set(
    cfg.x,
    cfg.y,
    cfg.z
  );

  art.rotation.y=
    cfg.ry||0;

  art.castShadow=false;

  const frame=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w+.14,
        h+.14,
        .07
      ),
      mat(
        cfg.frame||0x332018,
        {roughness:.45}
      )
    );

  frame.position.copy(
    art.position
  );

  frame.rotation.copy(
    art.rotation
  );

  frame.translateZ(-.045);

  parent.add(
    frame,
    art
  );

  art.userData=cfg;

  clickable.push(art);

  if(cfg.img){

    new THREE.TextureLoader()
      .load(
        cfg.img,
        texture=>{

          texture.encoding=
            THREE.sRGBEncoding;

          artMat.map=texture;
          artMat.needsUpdate=true;
        },
        undefined,
        ()=>{}
      );
  }
}


/* =========================================================
   GALLERY DIMENSIONS
========================================================= */

const HALL_HALF=1.4;
const HALL_LENGTH=132;

const ROOM_W=15;
const ROOM_D=24;
const ROOM_H=4.8;

const DOOR_HALF=1.62;

const lobbyCenters=[
  18,
  43,
  68,
  93,
  118
];

const rooms=[];

const flickerLights=[];
const fireMeshes=[];
const snowParticles=[];
const rainParticles=[];
const pendulums=[];
const movingLights=[];


/* =========================================================
   HALL FLOOR
========================================================= */

const woodTex=woodTexture();

woodTex.wrapS=
  woodTex.wrapT=
  THREE.RepeatWrapping;

woodTex.repeat.set(
  2,
  18
);

const floor=
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      HALL_HALF*2,
      HALL_LENGTH
    ),
    new THREE.MeshStandardMaterial({
      map:woodTex,
      roughness:.92
    })
  );

floor.rotation.x=-Math.PI/2;

floor.position.set(
  0,
  0,
  HALL_LENGTH/2
);

floor.receiveShadow=true;

scene.add(floor);


/* =========================================================
   HALLWAY WALLS
========================================================= */

function buildHallWall(side){

  const x=side*HALL_HALF;

  const main=0x392229;
  const lower=0x261714;
  const trim=0x73503b;

  let cursor=1;

  for(const zc of lobbyCenters){

    const start=
      zc-DOOR_HALF-.06;

    const end=
      zc+DOOR_HALF+.06;

    if(start>cursor){

      const len=start-cursor;

      box(
        scene,
        .22,
        ROOM_H,
        len,
        main,
        x,
        ROOM_H/2,
        (cursor+start)/2
      );

      /*
        Heavy old wood lower wall.
      */

      box(
        scene,
        .25,
        1.02,
        len,
        lower,
        x-side*.03,
        .51,
        (cursor+start)/2
      );

      /*
        Gold/brown chair rail.
      */

      box(
        scene,
        .27,
        .085,
        len,
        trim,
        x-side*.04,
        1.05,
        (cursor+start)/2
      );
    }

    cursor=end;
  }

  if(cursor<HALL_LENGTH){

    const len=
      HALL_LENGTH-cursor;

    box(
      scene,
      .22,

/* =========================================================

function createRoom(cfg){

  const group=
    new THREE.Group();

  group.position.set(
    cfg.side*(HALL_HALF+ROOM_W/2),
    0,
    cfg.z
  );

  scene.add(group);

  rooms.push({
    z:cfg.z,
    side:cfg.side,
    tag:"LOBBY "+cfg.number,
    group
  });


  /*
    FLOOR
  */

  box(
    group,
    ROOM_W,
    .10,
    ROOM_D,
    cfg.floor,
    0,
    -.05,
    0
  );


  /*
    OUTER WALL
  */

  const outer=
    cfg.side*(ROOM_W/2);

  box(
    group,
    .22,
    ROOM_H,
    ROOM_D,
    cfg.wall,
    outer,
    ROOM_H/2,
    0
  );


  /*
    BACK WALL
  */

  box(
    group,
    ROOM_W,
    ROOM_H,
    .22,
    cfg.wall,
    0,
    ROOM_H/2,
    ROOM_D/2
  );


  /*
    HALLWAY-FACING WALL.
    Two separate pieces leave a REAL doorway.
  */

  const hallX=
    -cfg.side*(ROOM_W/2);

  const opening=
    DOOR_HALF+.12;

  const segment=
    ROOM_D/2-opening;

  box(
    group,
    .22,
    ROOM_H,
    segment,
    cfg.wall,
    hallX,
    ROOM_H/2,
    -(ROOM_D/2+opening)/2
  );

  box(
    group,
    .22,
    ROOM_H,
    segment,
    cfg.wall,
    hallX,
    ROOM_H/2,
    +(ROOM_D/2+opening)/2
  );


  /*
    CEILING
  */

  box(
    group,
    ROOM_W,
    .16,
    ROOM_D,
    cfg.ceiling,
    0,
    ROOM_H,
    0
  );


  /*
    WORN WALLPAPER ON ROOM WALLS.
  */

  const tex=oldWallpaper();

  tex.wrapS=
    tex.wrapT=
    THREE.RepeatWrapping;

  tex.repeat.set(
    2.2,
    3
  );

  const wallpaper=
    new THREE.MeshStandardMaterial({
      map:tex,
      roughness:1
    });


  const outerPaper=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_H-.38,
        ROOM_D-.25
      ),
      wallpaper
    );

  outerPaper.position.set(
    outer-cfg.side*.115,
    ROOM_H/2,
    0
  );

  outerPaper.rotation.y=
    cfg.side<0
    ?Math.PI/2
    :-Math.PI/2;

  group.add(outerPaper);


  const backPaper=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W-.28,
        ROOM_H-.38
      ),
      wallpaper
    );

  backPaper.position.set(
    0,
    ROOM_H/2,
    ROOM_D/2-.115
  );

  backPaper.rotation.y=Math.PI;

  group.add(backPaper);


  /*
    Ceiling moulding.
  */

  for(const sideX of [-1,1]){

    box(
      group,
      .12,
      .16,
      ROOM_D-.15,
      0x72503a,
      sideX*(ROOM_W/2-.09),
      ROOM_H-.10,
      0
    );
  }


  /*
    Main room light.
  */

  const light=
    new THREE.PointLight(
      cfg.light,
      cfg.intensity,
      20
    );

  light.position.set(
    cfg.side*1.5,
    3.35,
    -1
  );

  light.castShadow=true;

  light.shadow.mapSize.width=512;
  light.shadow.mapSize.height=512;

  group.add(light);

  flickerLights.push({
    light,
    base:cfg.intensity,
    mode:cfg.flicker||"soft"
  });


  /*
    DOOR IS CREATED LAST,
    directly inside this exact opening.
  */

  createDoor(
    group,
    cfg
  );

  return group;
}

/* =========================================================
   MOVEMENT
========================================================= */

window._rooms=rooms;
window._camera=camera;

let yaw=Math.PI;
let pitch=0;

const keys={};

document.addEventListener(
  "keydown",
  e=>{
    keys[e.code]=true;
  }
);

document.addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);

dom.addEventListener(
  "click",
  ()=>{
    if(
      gameStarted &&
      document.pointerLockElement!==dom &&
      $("noteOverlay").style.display!=="flex"
    ){
      dom.requestPointerLock();
    }
  }
);

document.addEventListener(
  "mousemove",
  e=>{

    if(
      document.pointerLockElement!==dom
    )return;

    yaw-=e.movementX*.0022;

    pitch-=e.movementY*.0022;

    pitch=
      Math.max(
        -1.2,
        Math.min(
          1.2,
          pitch
        )
      );
  }
);

const LIMIT={
  xMin:-(HALL_HALF+ROOM_W-.38),
  xMax:HALL_HALF+ROOM_W-.38,
  zMin:1,
  zMax:HALL_LENGTH-1
};

function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    "YXZ"
  );

  const speed=
    3.2*dt;

  const forward=
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right=
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  const movement=
    new THREE.Vector3();

  if(keys["KeyW"])
    movement.add(forward);

  if(keys["KeyS"])
    movement.sub(forward);

  if(keys["KeyD"])
    movement.add(right);

  if(keys["KeyA"])
    movement.sub(right);

  if(movement.length()>0){

    movement
      .normalize()
      .multiplyScalar(speed);

    camera.position.x=
      Math.max(
        LIMIT.xMin,
        Math.min(
          LIMIT.xMax,
          camera.position.x+movement.x
        )
      );

    camera.position.z=
      Math.max(
        LIMIT.zMin,
        Math.min(
          LIMIT.zMax,
          camera.position.z+movement.z
        )
      );

    footstepTick(dt);
  }


  if(rooms.length){

    const nearest=
      rooms.reduce(
        (a,r)=>
          Math.abs(
            r.z-camera.position.z
          ) <
          Math.abs(
            a.z-camera.position.z
          )
          ?r
          :a,
        rooms[0]
      );

    if(
      Math.abs(
        nearest.z-camera.position.z
      )<8
    ){

      $("roomLabel").style.opacity=1;
      $("roomLabel").textContent=
        nearest.tag;

    }else{

      $("roomLabel").style.opacity=0;
    }
  }
}


/* =========================================================
   PAINTING INTERACTION
========================================================= */

const raycaster=
  new THREE.Raycaster();

const mouse=
  new THREE.Vector2();

dom.addEventListener(
  "mousedown",
  ()=>{

    if(!gameStarted)return;

    mouse.x=0;
    mouse.y=0;

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits=
      raycaster.intersectObjects(
        clickable,
        false
      );

    if(hits.length){

      const d=
        hits[0].object.userData;

      document.exitPointerLock();

      $("noteBox")
        .classList
        .toggle(
          "win",
          !!d.winner
        );

      $("noteTitle").textContent=
        d.winner
        ?"🎉 You found a free print!"
        :(d.label||"Untitled");

      $("noteBody").textContent=
        d.story||
        "A quiet piece from the gallery.";

      $("noteOverlay").style.display=
        "flex";
    }
  }
);


/* =========================================================
   ANIMATION
========================================================= */

function animateWorld(t){

  const time=t*.001;


  /*
    Old lamps gently fluctuate.
  */

  flickerLights.forEach(item=>{

    if(item.mode==="flicker"){

      item.light.intensity=
        item.base*
        (
          .78+
          Math.random()*.22
        );

    }else if(item.mode==="ember"){

      item.light.intensity=
        item.base*
        (
          .87+
          Math.sin(time*8)*.07+
          Math.random()*.05
        );

    }else if(item.mode==="lamp"){

      item.light.intensity=
        item.base*
        (
          .97+
          Math.sin(time*1.6)*.025
        );

    }else{

      item.light.intensity=
        item.base*
        (
          .99+
          Math.sin(time)*.012
        );
    }
  });


  /*
    Fire.
  */

  fireMeshes.forEach(
    (f,i)=>{

      f.scale.y=
        1.25+
        Math.sin(time*8+i)*.11+
        Math.sin(time*13+i)*.06;

      f.rotation.z=
        Math.sin(time*5+i)*.045;
    }
  );


  /*
    Snow isn't used as the primary visual
    in Room 2 anymore — the window and
    farmhouse interior carry the atmosphere.
  */


  /*
    Rain.
  */

  rainParticles.forEach(
    drop=>{

      drop.position.y-=.065;

      if(drop.position.y<.1)
        drop.position.y=4.5;
    }
  );


  /*
    Clock.
  */

  pendulums.forEach(
    p=>{
      p.rotation.z=
        Math.sin(time*1.75)*.15;
    }
  );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(t){

  requestAnimationFrame(animate);

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  if(gameStarted)
    updateMovement(dt);

  animateWorld(t);

  renderer.render(
    scene,
    camera
  );
}

animate(0);
