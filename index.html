<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
  :root{ --neon:#5ef2ff; --paper:#e8dcc0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; font-family:'Georgia',serif; }
  #app{ position:relative; width:100%; height:100%; }
  canvas{ display:block; }

  #welcome{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 40%,#0a0a14 0%,#000 80%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:50; color:#cbd6e6;
  }
  #welcome h1{
    font-size:2.2em; letter-spacing:2px; color:var(--neon);
    text-shadow:0 0 12px var(--neon),0 0 30px var(--neon);
    margin-bottom:8px;
  }
  #welcome p{ opacity:.7; margin-bottom:22px; }
  #nameInput{
    padding:12px 16px; font-size:1.1em; border-radius:6px;
    border:1px solid #345; background:#0e1420; color:#e8f0ff;
    width:280px; text-align:center; margin-bottom:16px;
  }
  #enterBtn{
    padding:12px 28px; font-size:1.05em; letter-spacing:1px;
    cursor:pointer; border-radius:6px; border:1px solid var(--neon);
    background:transparent; color:var(--neon);
    text-shadow:0 0 8px var(--neon); transition:all .25s;
  }
  #enterBtn:hover{
    background:var(--neon); color:#001; box-shadow:0 0 20px var(--neon);
  }
  #welcomeMsg{
    font-size:1.3em; color:#fff; text-align:center;
    max-width:520px; line-height:1.5;
  }

  #crosshair{
    position:absolute; top:50%; left:50%; width:6px; height:6px;
    margin:-3px 0 0 -3px; border-radius:50%;
    background:rgba(255,255,255,.7); z-index:20; pointer-events:none;
  }

  #hint{
    position:absolute; bottom:18px; left:50%;
    transform:translateX(-50%); color:#9fb3c8; font-size:.85em;
    background:rgba(0,0,0,.4); padding:6px 14px;
    border-radius:20px; z-index:20; pointer-events:none;
  }

  #muteBtn{
    position:absolute; top:16px; right:16px; z-index:30;
    background:rgba(0,0,0,.5); color:#cde; border:1px solid #456;
    border-radius:6px; padding:8px 12px; cursor:pointer; font-size:.9em;
  }

  #roomLabel{
    position:absolute; top:16px; left:16px; z-index:20;
    color:var(--neon); text-shadow:0 0 8px var(--neon);
    font-size:1em; letter-spacing:2px; opacity:0; transition:opacity .6s;
  }

  .modalOverlay{
    position:absolute; inset:0; display:none; align-items:center;
    justify-content:center; z-index:60;
    background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
  }

  .note{
    width:340px; max-width:80vw; background:var(--paper);
    color:#3a2f22; padding:26px 24px; border-radius:2px;
    box-shadow:0 0 40px rgba(0,0,0,.7), inset 0 0 40px rgba(120,90,50,.25);
    transform:rotate(-1.2deg); font-family:'Georgia',serif; position:relative;
  }

  .note::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(
      0deg,transparent,transparent 24px,rgba(0,0,0,.03) 25px
    );
    pointer-events:none;
  }

  .note h3{
    font-size:1.15em; margin-bottom:10px;
    border-bottom:1px solid rgba(0,0,0,.2); padding-bottom:6px;
  }

  .note p{ line-height:1.5; font-size:.95em; }

  .note button{
    margin-top:16px; padding:8px 16px;
    border:1px solid #3a2f22; background:transparent;
    cursor:pointer; color:#3a2f22;
  }

  .win{
    background:#111; color:#ffd27a; border:2px solid #ffd27a;
    box-shadow:0 0 40px #ffb84a; transform:rotate(0); text-align:center;
  }

  .win h3{ color:#ffd27a; border-color:#553; }
  .win button{ border-color:#ffd27a; color:#ffd27a; }

  #loading{
    position:absolute; inset:0; background:#000; color:#5ef2ff;
    display:flex; align-items:center; justify-content:center;
    z-index:100; font-size:1.1em; letter-spacing:2px;
  }
</style>
</head>

<body>

<div id="app">

  <div id="loading">LOADING GALLERY…</div>

  <div id="welcome">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of cozy &amp; eerie things</p>

    <div id="stepEnterName">
      <input id="nameInput" placeholder="Enter your name" maxlength="20">
      <br>
      <button id="enterBtn">ENTER GALLERY</button>
    </div>

    <div id="welcomeMsg" style="display:none;"></div>
  </div>

  <div id="roomLabel"></div>

  <div id="crosshair" style="display:none;"></div>

  <div id="hint" style="display:none;">
    WASD to move · mouse to look · click a painting
  </div>

  <button id="muteBtn" style="display:none;">🔊 Sound</button>

  <div class="modalOverlay" id="noteOverlay">
    <div class="note" id="noteBox">
      <h3 id="noteTitle">Untitled</h3>
      <p id="noteBody">...</p>
      <button id="noteClose">close</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================================
   RAMSHA ART STUDIO — INTERACTIVE GALLERY

   ORIGINAL UI / MOVEMENT / POINTER LOCK PRESERVED.

   WORLD CHANGES:
   - one long narrow hallway
   - real left/right lobby entrances
   - themed architectural rooms
   - significantly more environmental storytelling
   - cozy, liminal and eerie objects
   ========================================================================= */

const $ = id => document.getElementById(id);

let gameStarted = false;
let galleryReady = false;
let dom = null;

function showFatalError(msg){
  const lbl = $('roomLabel');
  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';
  lbl.textContent = '⚠ ' + msg;
  console.error(msg);
}


/* =========================================================================
   ENTER GALLERY — ORIGINAL
   ========================================================================= */

$('enterBtn').onclick = () => {

  const name = $('nameInput').value.trim() || 'friend';

  $('stepEnterName').style.display = 'none';

  const wm = $('welcomeMsg');

  wm.style.display = 'block';
  wm.textContent =
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try {
    startAudio();
  } catch(e){
    console.warn('Audio failed to start:', e);
  }

  setTimeout(() => {

    $('welcome').style.display = 'none';
    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';

    gameStarted = true;

    if(!galleryReady){
      showFatalError(
        '3D engine did not start — open the browser console (F12) for details.'
      );
    }
    else if(dom){
      dom.requestPointerLock();
    }

  }, 2200);
};


$('muteBtn').onclick = () => {

  muted = !muted;

  if(master)
    master.gain.value = muted ? 0 : 0.25;

  $('muteBtn').textContent =
    muted ? '🔇 Sound' : '🔊 Sound';
};


$('noteClose').onclick = () => {
  $('noteOverlay').style.display = 'none';
};


function openNote(d){

  if(dom)
    document.exitPointerLock();

  const box = $('noteBox');

  box.classList.toggle('win', !!d.winner);

  $('noteTitle').textContent =
    d.winner ? '🎉 You found a free print!' : d.label;

  $('noteBody').textContent = d.story;

  $('noteOverlay').style.display = 'flex';
}


/* =========================================================================
   AUDIO — ORIGINAL
   ========================================================================= */

let audioCtx, master, noiseSrc, droneOsc, muted = false;

function footstepTick(dt){}

function startAudio(){

  if(audioCtx) return;

  audioCtx =
    new (window.AudioContext || window.webkitAudioContext)();

  master = audioCtx.createGain();
  master.gain.value = 0.25;
  master.connect(audioCtx.destination);

  droneOsc = audioCtx.createOscillator();
  droneOsc.type = 'sine';
  droneOsc.frequency.value = 55;

  const droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.15;

  droneOsc.connect(droneGain).connect(master);
  droneOsc.start();

  const bufSize = 2 * audioCtx.sampleRate;

  const buf =
    audioCtx.createBuffer(
      1,
      bufSize,
      audioCtx.sampleRate
    );

  const data = buf.getChannelData(0);

  for(let i=0;i<bufSize;i++)
    data[i] = Math.random()*2-1;

  noiseSrc =
    audioCtx.createBufferSource();

  noiseSrc.buffer = buf;
  noiseSrc.loop = true;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type = 'lowpass';
  filter.frequency.value = 500;

  const noiseGain =
    audioCtx.createGain();

  noiseGain.gain.value = 0.06;

  noiseSrc
    .connect(filter)
    .connect(noiseGain)
    .connect(master);

  noiseSrc.start();


  setInterval(() => {

    if(muted || !gameStarted || !galleryReady)
      return;

    const near = currentRoom();

    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();

    o.type =
      near && near.tag === 'LOBBY 5'
      ? 'sawtooth'
      : 'sine';

    o.frequency.value =
      near && near.tag === 'LOBBY 5'
      ? 120 + Math.random()*200
      : 300 + Math.random()*200;

    g.gain.value = 0;

    o.connect(g).connect(master);

    o.start();

    g.gain.linearRampToValueAtTime(
      (near && near.tag === 'LOBBY 5') ? 0.08 : 0.03,
      audioCtx.currentTime + 0.3
    );

    g.gain.linearRampToValueAtTime(
      0,
      audioCtx.currentTime + 1.4
    );

    o.stop(audioCtx.currentTime + 1.5);

  },5000);
}


function currentRoom(){

  if(!window._rooms || !window._camera)
    return null;

  return window._rooms.reduce(
    (a,r) =>
      Math.abs(r.z-window._camera.position.z)
      <
      Math.abs(a.z-window._camera.position.z)
      ? r : a,
    window._rooms[0]
  );
}


/* =========================================================================
   THREE.JS
   ========================================================================= */

try {

  initGallery();
  galleryReady = true;

}
catch(err){

  showFatalError(
    'Gallery failed to load: ' + err.message
  );

}


function initGallery(){

  /* -----------------------------------------------------------------------
     BASIC SETUP — ORIGINAL
     ----------------------------------------------------------------------- */

  const scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x03030a);

  const camera =
    new THREE.PerspectiveCamera(
      72,
      innerWidth/innerHeight,
      0.1,
      200
    );

  camera.position.set(0,1.7,4);

  const renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(innerWidth,innerHeight);

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  document
    .getElementById('app')
    .prepend(renderer.domElement);

  document
    .getElementById('loading')
    .style.display='none';


  window.addEventListener('resize',()=>{

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  });


  /* -----------------------------------------------------------------------
     BASE LIGHTING
     ----------------------------------------------------------------------- */

  scene.add(
    new THREE.AmbientLight(
      0x252a38,
      1.25
    )
  );

  const hallLight =
    new THREE.PointLight(
      0x506080,
      0.7,
      45
    );

  hallLight.position.set(
    0,
    3.4,
    16
  );

  scene.add(hallLight);


  /* -----------------------------------------------------------------------
     FLOOR / CEILING

     IMPORTANT:
     The floor is still large enough for the rooms, but the hallway itself
     remains physically narrow because of the corridor walls.
     ----------------------------------------------------------------------- */

  const floorMat =
    new THREE.MeshStandardMaterial({
      color:0x111116,
      roughness:1
    });

  const floor =
    new THREE.Mesh(
      new THREE.PlaneGeometry(30,140),
      floorMat
    );

  floor.rotation.x=-Math.PI/2;
  floor.position.set(0,0,60);

  scene.add(floor);


  const ceil = floor.clone();

  ceil.position.y=4.2;
  ceil.rotation.x=Math.PI/2;

  scene.add(ceil);


  /* -----------------------------------------------------------------------
     TEXTURE HELPERS
     ----------------------------------------------------------------------- */

  function canvasTexture(draw,w=512,h=384){

    const c=document.createElement('canvas');

    c.width=w;
    c.height=h;

    draw(
      c.getContext('2d'),
      w,
      h
    );

    const t =
      new THREE.CanvasTexture(c);

    t.needsUpdate=true;

    return t;
  }


  function placeholderArt(label,hue){

    return canvasTexture((ctx,w,h)=>{

      const g =
        ctx.createLinearGradient(
          0,0,w,h
        );

      g.addColorStop(
        0,
        `hsl(${hue},35%,18%)`
      );

      g.addColorStop(
        1,
        `hsl(${hue+30},30%,8%)`
      );

      ctx.fillStyle=g;
      ctx.fillRect(0,0,w,h);

      ctx.strokeStyle='rgba(255,255,255,.15)';
      ctx.lineWidth=6;

      ctx.strokeRect(
        10,10,w-20,h-20
      );

      ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.font='24px Georgia';
      ctx.textAlign='center';

      ctx.fillText(
        'PLACEHOLDER',
        w/2,
        h/2-10
      );

      ctx.font='18px Georgia';

      ctx.fillText(
        label,
        w/2,
        h/2+22
      );

    });
  }


  function neonSignTexture(text,color){

    return canvasTexture((ctx,w,h)=>{

      ctx.clearRect(0,0,w,h);

      ctx.font='bold 70px Arial';
      ctx.textAlign='center';
      ctx.textBaseline='middle';

      ctx.shadowColor=color;
      ctx.shadowBlur=25;

      ctx.fillStyle=color;

      ctx.fillText(
        text,
        w/2,
        h/2
      );

    },512,160);

  }


  /* -----------------------------------------------------------------------
     PAINTINGS
     ----------------------------------------------------------------------- */

  const clickable=[];

  function createPainting(cfg,group){

    const w=1.5;
    const h=1.05;

    const mat =
      new THREE.MeshStandardMaterial({
        map:placeholderArt(
          cfg.label,
          cfg.hue || 210
        ),
        roughness:.8
      });

    const mesh =
      new THREE.Mesh(
        new THREE.PlaneGeometry(w,h),
        mat
      );

    mesh.position.set(
      cfg.x,
      cfg.y,
      cfg.z
    );

    mesh.rotation.y=cfg.ry;

    const frame =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          w+.14,
          h+.14
        ),
        new THREE.MeshStandardMaterial({
          color:0x17120f
        })
      );

    frame.position.copy(mesh.position);
    frame.rotation.y=cfg.ry;
    frame.translateZ(-0.02);

    group.add(frame,mesh);

    mesh.userData=cfg;

    clickable.push(mesh);

    if(cfg.img){

      new THREE.TextureLoader().load(
        cfg.img,
        tex=>{
          mat.map=tex;
          mat.needsUpdate=true;
        },
        undefined,
        ()=>{}
      );

    }

  }


  /* -----------------------------------------------------------------------
     DECORATION HELPERS
     ----------------------------------------------------------------------- */

  function prop(
    geo,
    color,
    x,y,z,
    ry=0,
    opts={}
  ){

    const mat =
      new THREE.MeshStandardMaterial({

        color,

        roughness:
          opts.roughness ?? .85,

        metalness:
          opts.metalness ?? 0,

        emissive:
          opts.emissive || 0x000000,

        emissiveIntensity:
          opts.emissiveIntensity || 0,

        transparent:
          !!opts.transparent,

        opacity:
          opts.opacity ?? 1
      });

    const m =
      new THREE.Mesh(
        geo,
        mat
      );

    m.position.set(x,y,z);

    if(ry)
      m.rotation.y=ry;

    if(opts.rx)
      m.rotation.x=opts.rx;

    if(opts.rz)
      m.rotation.z=opts.rz;

    return m;
  }


  function box(
    g,
    w,h,d,
    color,
    x,y,z,
    ry=0
  ){

    g.add(
      prop(
        new THREE.BoxGeometry(w,h,d),
        color,
        x,y,z,
        ry
      )
    );

  }


  function cylinder(
    g,
    r1,r2,h,
    color,
    x,y,z,
    segments=12
  ){

    g.add(
      prop(
        new THREE.CylinderGeometry(
          r1,r2,h,segments
        ),
        color,
        x,y,z
      )
    );

  }


  function glowingBulb(
    g,
    color,
    x,y,z,
    intensity=1
  ){

    const bulb =
      prop(
        new THREE.SphereGeometry(
          .10,10,10
        ),
        color,
        x,y,z,
        0,
        {
          emissive:color,
          emissiveIntensity:2
        }
      );

    g.add(bulb);

    const light =
      new THREE.PointLight(
        color,
        intensity,
        5
      );

    light.position.set(
      x,y,z
    );

    g.add(light);

    flickerLights.push({
      light,
      base:intensity,
      mode:'soft'
    });

  }


  function carpet(
    g,
    w,d,
    color,
    x,z
  ){

    const m =
      prop(
        new THREE.BoxGeometry(
          w,.035,d
        ),
        color,
        x,.025,z
      );

    m.material.roughness=1;

    g.add(m);

  }


  /* =========================================================================
     ROOM FACTORY

     THIS is the main architectural correction.

     The rooms sit OUTSIDE the hallway.
     The corridor wall remains solid everywhere EXCEPT for the doorway.
     ========================================================================= */

  const ROOM_W = 8.5;
  const ROOM_D = 11;
  const ROOM_H = 4.2;

  const HALL_HALF = 1.35;
  const HALL_LENGTH = 112;

  const flickerLights=[];


  function createRoom(cfg){

    const group =
      new THREE.Group();

    const cx =
      cfg.side *
      (HALL_HALF + ROOM_W/2);

    group.position.set(
      cx,
      0,
      cfg.z
    );

    scene.add(group);


    const wallMat =
      new THREE.MeshStandardMaterial({
        color:cfg.wallColor,
        roughness:.96,
        side:THREE.DoubleSide
      });


    const roomFloorMat =
      new THREE.MeshStandardMaterial({
        color:cfg.floorColor,
        roughness:1
      });


    /* OUTER WALL */

    const far =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          ROOM_D,
          ROOM_H
        ),
        wallMat
      );

    far.position.set(
      cfg.side*ROOM_W/2,
      ROOM_H/2,
      0
    );

    far.rotation.y=Math.PI/2;

    group.add(far);


    /* ROOM SIDE WALLS */

    [-1,1].forEach(s=>{

      const wall =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            ROOM_W,
            ROOM_H
          ),
          wallMat
        );

      wall.position.set(
        0,
        ROOM_H/2,
        s*ROOM_D/2
      );

      group.add(wall);

    });


    /* ROOM FLOOR */

    const rf =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          ROOM_W,
          ROOM_D
        ),
        roomFloorMat
      );

    rf.rotation.x=-Math.PI/2;
    rf.position.y=.01;

    group.add(rf);


    /* CEILING LIGHT */

    const roomLight =
      new THREE.PointLight(
        cfg.lightColor,
        cfg.lightIntensity || 1,
        14
      );

    roomLight.position.set(
      cfg.side*1.2,
      3.25,
      0
    );

    group.add(roomLight);


    if(cfg.flicker){

      flickerLights.push({
        light:roomLight,
        base:cfg.lightIntensity || 1,
        mode:cfg.flicker
      });

    }


    /* DOORWAY GLOW */

    const sign =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          2.25,.55
        ),
        new THREE.MeshBasicMaterial({
          map:neonSignTexture(
            cfg.tag,
            cfg.neon
          ),
          transparent:true
        })
      );

    sign.position.set(
      cfg.side*(HALL_HALF-.03),
      3.15,
      cfg.z
    );

    sign.rotation.y =
      cfg.side>0
      ? -Math.PI/2
      : Math.PI/2;

    scene.add(sign);


    if(cfg.glowDoor){

      const glow =
        new THREE.PointLight(
          cfg.neonHex,
          1.5,
          7
        );

      glow.position.set(
        cfg.side*(HALL_HALF+.35),
        2.1,
        cfg.z
      );

      scene.add(glow);

      flickerLights.push({
        light:glow,
        base:1.5,
        mode:'pulse'
      });

    }


    (cfg.paintings || [])
      .forEach(p=>createPainting(p,group));


    if(cfg.decorate)
      cfg.decorate(group);

    return group;
  }


  /* =========================================================================
     LOBBIES
     ========================================================================= */

  const rooms=[

    /* -----------------------------------------------------------------------
       LOBBY 1 — ABANDONED CINEMA
       ----------------------------------------------------------------------- */

    {
      tag:'LOBBY 1',
      side:-1,
      z:16,

      wallColor:0x211e1a,
      floorColor:0x171412,

      lightColor:0xffc46a,
      lightIntensity:1.05,

      neon:'#8fffb0',
      neonHex:0x8fffb0,

      glowDoor:true,
      flicker:'flicker',

      paintings:[

        {
          x:-2.5,
          y:2,
          z:5.35,
          ry:Math.PI,
          label:'A-F 01',
          story:'A forgotten cinema painting. The theatre closed years ago, but somebody still leaves one light on.',
          hue:100
        },

        {
          x:0,
          y:2,
          z:5.35,
          ry:Math.PI,
          label:'A-F 02',
          story:'Found rolled behind an old cinema screen.',
          hue:90
        },

        {
          x:2.5,
          y:2,
          z:5.35,
          ry:Math.PI,
          label:'G-M 01',
          story:'Congratulations — you found a free digital print! Message @ramshaartstudio to claim it.',
          hue:110,
          winner:true
        },

        {
          x:-4.15,
          y:1.75,
          z:-1.5,
          ry:Math.PI/2,
          label:'G-M 02',
          story:'The seats in this room used to fold shut on their own.',
          hue:80
        }

      ],

      decorate:g=>{

        /* SCREEN */

        box(
          g,
          5.6,
          2.5,
          .12,
          0x090909,
          0,
          2.0,
          -4.95
        );

        const screenGlow =
          prop(
            new THREE.PlaneGeometry(
              5.1,2.05
            ),
            0x2c3a31,

        for(let i=0;i<3;i++){

          const frame =
            prop(
              new THREE.BoxGeometry(
                .75,.9,.06
              ),
              0x38211e,
              -3.9,
              2.2,
              -.7+i*1.5,
              Math.PI/2,
              {
                rz:(i%2 ? -.12 : .10)
              }
            );

          g.add(frame);

        }


        /* OLD RUG */

        carpet(
          g,
          5.5,
          5.5,
          0x241216,
          0,
          0
        );

      }
    }

  ];


  /* =========================================================================
     CREATE ROOMS
     ========================================================================= */

  rooms.forEach(createRoom);


  /* =========================================================================
     LONG CENTRAL CORRIDOR

     This is intentionally narrow.
     Width = 2 * HALL_HALF = 2.7 units.

     Each lobby gets a genuine opening.
     ========================================================================= */

  function buildCorridor(){

    const doorHalf=1.35;

    const wallMat =
      new THREE.MeshStandardMaterial({
        color:0x0b0c11,
        roughness:1,
        side:THREE.DoubleSide
      });

    const trimMat =
      new THREE.MeshStandardMaterial({
        color:0x050507,
        roughness:.9
      });


    [-1,1].forEach(side=>{

      const gaps =
        rooms
          .filter(r=>r.side===side)
          .map(r=>({
            start:r.z-doorHalf,
            end:r.z+doorHalf
          }))
          .sort((a,b)=>a.start-b.start);


      let cursor=0;


      gaps.forEach(g=>{

        if(g.start>cursor){

          const len=
            g.start-cursor;

          const wall =
            new THREE.Mesh(
              new THREE.PlaneGeometry(
                len,
                ROOM_H
              ),
              wallMat
            );

          wall.position.set(
            side*HALL_HALF,
            ROOM_H/2,
            cursor+len/2
          );

          wall.rotation.y=Math.PI/2;

          scene.add(wall);

        }

        cursor=g.end;

      });


      if(cursor<HALL_LENGTH){

        const len=
          HALL_LENGTH-cursor;

        const wall =
          new THREE.Mesh(
            new THREE.PlaneGeometry(
              len,
              ROOM_H
            ),
            wallMat
          );

        wall.position.set(
          side*HALL_HALF,
          ROOM_H/2,
          cursor+len/2
        );

        wall.rotation.y=Math.PI/2;

        scene.add(wall);

      }


      /* hallway sconces */

      for(
        let z=7;
        z<HALL_LENGTH;
        z+=10
      ){

        if(
          gaps.some(
            g=>z>g.start-1.5 &&
               z<g.end+1.5
          )
        )
          continue;


        const fixture =
          prop(
            new THREE.BoxGeometry(
              .18,.45,.12
            ),
            0x171a22,
            side*(HALL_HALF-.08),
            2.45,
            z
          );

        scene.add(fixture);


        const light =
          new THREE.PointLight(
            0x7385ad,
            .32,
            4.5
          );

        light.position.set(
          side*(HALL_HALF-.2),
          2.4,
          z
        );

        scene.add(light);

      }

    });


    /* doorway frames */

    rooms.forEach(r=>{

      const x=
        r.side*HALL_HALF;


      const lintel =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .18,
            .18,
            doorHalf*2+.25
          ),
          trimMat
        );

      lintel.position.set(
        x,
        ROOM_H-.12,
        r.z
      );

      scene.add(lintel);


      [r.z-doorHalf,r.z+doorHalf]
        .forEach(gz=>{

          const post =
            new THREE.Mesh(
              new THREE.BoxGeometry(
                .18,
                ROOM_H,
                .18
              ),
              trimMat
            );

          post.position.set(
            x,
            ROOM_H/2,
            gz
          );

          scene.add(post);

        });


      /* small floor threshold */

      const threshold =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .12,
            .04,
            doorHalf*2
          ),
          new THREE.MeshStandardMaterial({
            color:0x302c2a
          })
        );

      threshold.position.set(
        x,
        .025,
        r.z
      );

      scene.add(threshold);

    });


    /* -----------------------------------------------------------------------
       CEILING LIGHTS DOWN THE HALL
       ----------------------------------------------------------------------- */

    for(let z=5;z<108;z+=8){

      const fixture =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .65,.06,.18
          ),
          new THREE.MeshStandardMaterial({
            color:0x1c2029,
            emissive:0x3d465b,
            emissiveIntensity:.45
          })
        );

      fixture.position.set(
        0,
        4.05,
        z
      );

      scene.add(fixture);


      const light =
        new THREE.PointLight(
          0x596982,
          .22,
          7
        );

      light.position.set(
        0,
        3.75,
        z
      );

      scene.add(light);

    }


    /* -----------------------------------------------------------------------
       HALLWAY WALL DETAILS
       ----------------------------------------------------------------------- */

    for(let z=10;z<108;z+=16){

      [-1,1].forEach(side=>{

        const frame =
          new THREE.Mesh(
            new THREE.BoxGeometry(
              .06,
              1.15,
              .8
            ),
            new THREE.MeshStandardMaterial({
              color:0x1c1a1b
            })
          );

        frame.position.set(
          side*(HALL_HALF-.035),
          2.0,
          z
        );

        frame.rotation.y=
          side>0
          ? -Math.PI/2
          : Math.PI/2;

        scene.add(frame);

      });

    }

  }


  buildCorridor();


  /* =========================================================================
     CAMERA / MOVEMENT — ORIGINAL STYLE PRESERVED
     ========================================================================= */

  window._rooms=rooms;
  window._camera=camera;


  let yaw=Math.PI;
  let pitch=0;

  const keys={};


  document.addEventListener(
    'keydown',
    e=>keys[e.code]=true
  );

  document.addEventListener(
    'keyup',
    e=>keys[e.code]=false
  );


  dom=renderer.domElement;


  dom.addEventListener(
    'click',
    ()=>{
      if(
        gameStarted &&
        document.pointerLockElement!==dom
      )
        dom.requestPointerLock();
    }
  );


  document.addEventListener(
    'mousemove',
    e=>{

      if(
        document.pointerLockElement!==dom
      )
        return;

      yaw -= e.movementX*.0022;

      pitch -= e.movementY*.0022;

      pitch =
        Math.max(
          -1.2,
          Math.min(1.2,pitch)
        );

    }
  );


  /* ORIGINAL-STYLE LEVEL BOUNDARY */

  const LIMIT={
    xMin:-(HALL_HALF+ROOM_W-.4),
    xMax:HALL_HALF+ROOM_W-.4,
    zMin:1,
    zMax:HALL_LENGTH
  };


  function updateMovement(dt){

    camera.rotation.set(
      pitch,
      yaw,
      0,
      'YXZ'
    );


    const speed=3.2*dt;


    const fwd =
      new THREE.Vector3(
        -Math.sin(yaw),
        0,
        -Math.cos(yaw)
      );


    const right =
      new THREE.Vector3(
        Math.cos(yaw),
        0,
        -Math.sin(yaw)
      );


    let mv =
      new THREE.Vector3();


    if(keys['KeyW'])
      mv.add(fwd);

    if(keys['KeyS'])
      mv.sub(fwd);

    if(keys['KeyD'])
      mv.add(right);

    if(keys['KeyA'])
      mv.sub(right);


    if(mv.length()>0){

      mv.normalize()
        .multiplyScalar(speed);

      camera.position.x =
        Math.max(
          LIMIT.xMin,
          Math.min(
            LIMIT.xMax,
            camera.position.x+mv.x
          )
        );

      camera.position.z =
        Math.max(
          LIMIT.zMin,
          Math.min(
            LIMIT.zMax,
            camera.position.z+mv.z
          )
        );

      footstepTick(dt);

    }


    const near =
      rooms.reduce(
        (a,r)=>
          Math.abs(
            r.z-camera.position.z
          )
          <
          Math.abs(
            a.z-camera.position.z
          )
          ? r:a,
        rooms[0]
      );


    const lbl=
      document.getElementById(
        'roomLabel'
      );


    if(
      Math.abs(
        near.z-camera.position.z
      )<5.5
    ){

      lbl.style.opacity=1;
      lbl.textContent=near.tag;

    }
    else{

      lbl.style.opacity=0;

    }

  }


  /* =========================================================================
     ANIMATION
     ========================================================================= */

  const clock =
    new THREE.Clock();


  function animateFlicker(t){

    flickerLights.forEach(f=>{

      if(f.mode==='flicker'){

        f.light.intensity =
          f.base *
          (.72+Math.random()*.38);

      }

      else if(f.mode==='ember'){

        f.light.intensity =
          f.base *
          (
            .86+
            Math.sin(t*6)*.09+
            Math.random()*.08
          );

      }

      else if(f.mode==='lamp'){

        f.light.intensity =
          f.base *
          (
            Math.random()<.025
            ? .15
            : 1
          );

      }

      else if(f.mode==='strobe'){

        f.light.intensity =
          f.base *
          (
            Math.random()<.04
            ? 1.9
            : .55
          );

      }

      else if(f.mode==='pulse'){

        f.light.intensity =
          f.base *
          (
            .82+
            Math.sin(t*2)*.22
          );

      }

      else if(f.mode==='soft'){

        f.light.intensity =
          f.base *
          (
            .92+
            Math.sin(t*1.5)*.05
          );

      }

    });


    scene.traverse(o=>{

      if(
        o.userData &&
        o.userData.isSnow
      ){

        const p=
          o.geometry.attributes.position;

        for(
          let i=1;
          i<p.count*3;
          i+=3
        ){

          p.array[i]-=.01;

          if(p.array[i]<0)
            p.array[i]=ROOM_H;

        }

        p.needsUpdate=true;

      }


      if(
        o.userData &&
        o.userData.isFire
      ){

        o.material.opacity =
          .8+
          Math.sin(t*10)*.2;

        o.material.transparent=true;

      }

    });

  }


  function loop(){

    requestAnimationFrame(loop);

    const dt=
      Math.min(
        clock.getDelta(),
        .05
      );

    if(gameStarted)
      updateMovement(dt);

    animateFlicker(
      clock.elapsedTime
    );

    renderer.render(
      scene,
      camera
    );

  }


  loop();


  /* =========================================================================
     PAINTING CLICK
     ========================================================================= */

  const ray =
    new THREE.Raycaster();


  dom.addEventListener(
    'mousedown',
    e=>{

      if(
        !gameStarted ||
        document.pointerLockElement!==dom
      )
        return;

      ray.setFromCamera(
        {x:0,y:0},
        camera
      );

      const hit =
        ray.intersectObjects(
          clickable
        )[0];

      if(hit)
        openNote(
          hit.object.userData
        );

    }
  );

}

</script>

</body>
