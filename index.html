<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>
<style>
  :root{ --neon:#5ef2ff; --paper:#e8dcc0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; font-family:'Georgia',serif; }
  #app{ position:relative; width:100%; height:100%; }
  canvas{ display:block; }

  /* ---------- Welcome screen ---------- */
  #welcome{
    position:absolute; inset:0; background:radial-gradient(circle at 50% 40%,#0a0a14 0%,#000 80%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; color:#cbd6e6;
  }
  #welcome h1{ font-size:2.2em; letter-spacing:2px; color:var(--neon); text-shadow:0 0 12px var(--neon),0 0 30px var(--neon); margin-bottom:8px; }
  #welcome p{ opacity:.7; margin-bottom:22px; }
  #nameInput{
    padding:12px 16px; font-size:1.1em; border-radius:6px; border:1px solid #345; background:#0e1420; color:#e8f0ff;
    width:280px; text-align:center; margin-bottom:16px;
  }
  #enterBtn{
    padding:12px 28px; font-size:1.05em; letter-spacing:1px; cursor:pointer; border-radius:6px; border:1px solid var(--neon);
    background:transparent; color:var(--neon); text-shadow:0 0 8px var(--neon); transition:all .25s;
  }
  #enterBtn:hover{ background:var(--neon); color:#001; box-shadow:0 0 20px var(--neon); }
  #welcomeMsg{ font-size:1.3em; color:#fff; text-align:center; max-width:520px; line-height:1.5; }

  /* ---------- HUD ---------- */
  #crosshair{
    position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; background:rgba(255,255,255,.7); z-index:20; pointer-events:none;
  }
  #hint{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%); color:#9fb3c8; font-size:.85em;
    background:rgba(0,0,0,.4); padding:6px 14px; border-radius:20px; z-index:20; pointer-events:none;
  }
  #muteBtn{
    position:absolute; top:16px; right:16px; z-index:30; background:rgba(0,0,0,.5); color:#cde; border:1px solid #456;
    border-radius:6px; padding:8px 12px; cursor:pointer; font-size:.9em;
  }
  #roomLabel{
    position:absolute; top:16px; left:16px; z-index:20; color:var(--neon); text-shadow:0 0 8px var(--neon);
    font-size:1em; letter-spacing:2px; opacity:0; transition:opacity .6s;
  }

  /* ---------- Modals ---------- */
  .modalOverlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:60;
    background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
  }
  .note{
    width:340px; max-width:80vw; background:var(--paper); color:#3a2f22; padding:26px 24px; border-radius:2px;
    box-shadow:0 0 40px rgba(0,0,0,.7), inset 0 0 40px rgba(120,90,50,.25);
    transform:rotate(-1.2deg); font-family:'Georgia',serif; position:relative;
  }
  .note::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(0,0,0,.03) 25px); pointer-events:none; }
  .note h3{ font-size:1.15em; margin-bottom:10px; border-bottom:1px solid rgba(0,0,0,.2); padding-bottom:6px; }
  .note p{ line-height:1.5; font-size:.95em; }
  .note button{ margin-top:16px; padding:8px 16px; border:1px solid #3a2f22; background:transparent; cursor:pointer; color:#3a2f22; }
  .win{ background:#111; color:#ffd27a; border:2px solid #ffd27a; box-shadow:0 0 40px #ffb84a; transform:rotate(0); text-align:center; }
  .win h3{ color:#ffd27a; border-color:#553; }
  .win button{ border-color:#ffd27a; color:#ffd27a; }

  #loading{
    position:absolute; inset:0; background:#000; color:#5ef2ff; display:flex;
    align-items:center; justify-content:center; z-index:100; font-size:1.1em; letter-spacing:2px;
  }
</style>
</head>

<body>
<div id="app">

  <div id="loading">LOADING GALLERY…</div>

  <!-- ORIGINAL WELCOME PAGE — PRESERVED -->
  <div id="welcome">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of cozy &amp; eerie things</p>
    <div id="stepEnterName">
      <input id="nameInput" placeholder="Enter your name" maxlength="20">
      <br><button id="enterBtn">ENTER GALLERY</button>
    </div>
    <div id="welcomeMsg" style="display:none;"></div>
  </div>

  <div id="roomLabel"></div>
  <div id="crosshair" style="display:none;"></div>
  <div id="hint" style="display:none;">WASD to move · mouse to look · click a painting</div>
  <button id="muteBtn" style="display:none;">🔊 Sound</button>

  <div class="modalOverlay" id="noteOverlay">
    <div class="note" id="noteBox">
      <h3 id="noteTitle">Untitled</h3>
      <p id="noteBody">...</p>
      <button id="noteClose">close</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =========================================================================
   RAMSHA ART STUDIO
   Rebuilt gallery world.

   IMPORTANT:
   - Welcome screen is preserved from the original.
   - No external textures or models are required.
   - Everything is generated procedurally.
   - Rooms are actual architectural spaces.
   - Player is constrained by the map walls.
   ========================================================================= */

const $ = id => document.getElementById(id);

let gameStarted = false;
let galleryReady = false;
let dom = null;

function showFatalError(msg){
  const lbl = $('roomLabel');
  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';
  lbl.textContent = '⚠ ' + msg;
  console.error(msg);
}

/* ============================================================
   ORIGINAL ENTRY LOGIC
   ============================================================ */

$('enterBtn').onclick = () => {

  const name = $('nameInput').value.trim() || 'friend';

  $('stepEnterName').style.display = 'none';

  const wm = $('welcomeMsg');
  wm.style.display = 'block';
  wm.textContent =
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn('Audio failed:',e);
  }

  setTimeout(() => {

    $('welcome').style.display = 'none';
    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';

    gameStarted = true;

    if(!galleryReady){
      showFatalError(
        '3D engine did not start — open the browser console (F12) for details.'
      );
    }else if(dom){
      dom.requestPointerLock();
    }

  },2200);
};

$('muteBtn').onclick = () => {

  muted = !muted;

  if(master){
    master.gain.value = muted ? 0 : 0.25;
  }

  $('muteBtn').textContent =
    muted ? '🔇 Sound' : '🔊 Sound';
};

$('noteClose').onclick = () => {
  $('noteOverlay').style.display = 'none';
};

function openNote(d){

  if(dom){
    document.exitPointerLock();
  }

  const box = $('noteBox');

  box.classList.toggle('win',!!d.winner);

  $('noteTitle').textContent =
    d.winner ? '🎉 You found a free print!' : d.label;

  $('noteBody').textContent = d.story;

  $('noteOverlay').style.display = 'flex';
}


/* ============================================================
   AUDIO
   ============================================================ */

let audioCtx,
    master,
    noiseSrc,
    droneOsc,
    muted = false;

let lastStep = 0;

function footstepTick(dt){

  if(!audioCtx || muted) return;

  lastStep += dt;

  if(lastStep < 0.42) return;

  lastStep = 0;

  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();

  o.type = 'sine';
  o.frequency.value = 72 + Math.random()*18;

  g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(
    0.025,
    audioCtx.currentTime+0.015
  );
  g.gain.exponentialRampToValueAtTime(
    0.0001,
    audioCtx.currentTime+0.12
  );

  o.connect(g).connect(master);
  o.start();
  o.stop(audioCtx.currentTime+0.14);
}

function startAudio(){

  if(audioCtx) return;

  audioCtx =
    new (window.AudioContext || window.webkitAudioContext)();

  master = audioCtx.createGain();
  master.gain.value = 0.25;
  master.connect(audioCtx.destination);

  /* low room tone */
  droneOsc = audioCtx.createOscillator();
  droneOsc.type = 'sine';
  droneOsc.frequency.value = 48;

  const droneGain = audioCtx.createGain();
  droneGain.gain.value = 0.12;

  droneOsc
    .connect(droneGain)
    .connect(master);

  droneOsc.start();

  /* filtered air noise */
  const bufSize = 2 * audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(
    1,
    bufSize,
    audioCtx.sampleRate
  );

  const data = buf.getChannelData(0);

  for(let i=0;i<bufSize;i++){
    data[i] = Math.random()*2-1;
  }

  noiseSrc = audioCtx.createBufferSource();
  noiseSrc.buffer = buf;
  noiseSrc.loop = true;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type = 'lowpass';
  filter.frequency.value = 420;

  const noiseGain =
    audioCtx.createGain();

  noiseGain.gain.value = 0.045;

  noiseSrc
    .connect(filter)
    .connect(noiseGain)
    .connect(master);

  noiseSrc.start();

  setInterval(()=>{

    if(
      muted ||
      !gameStarted ||
      !galleryReady
    ) return;

    const near = currentRoom();

    const o =
      audioCtx.createOscillator();

    const g =
      audioCtx.createGain();

    o.type =
      near && near.tag === 'LOBBY 5'
        ? 'sawtooth'
        : 'sine';

    o.frequency.value =
      near && near.tag === 'LOBBY 5'
        ? 90 + Math.random()*150
        : 240 + Math.random()*180;

    g.gain.value = 0;

    o.connect(g).connect(master);

    o.start();

    g.gain.linearRampToValueAtTime(
      near && near.tag === 'LOBBY 5'
        ? 0.045
        : 0.018,
      audioCtx.currentTime+0.3
    );

    g.gain.linearRampToValueAtTime(
      0,
      audioCtx.currentTime+1.2
    );

    o.stop(audioCtx.currentTime+1.3);

  },5000);
}

function currentRoom(){

  if(!window._rooms || !window._camera)
    return null;

  return window._rooms.reduce(
    (a,r) =>
      Math.abs(r.z-window._camera.position.z)
      <
      Math.abs(a.z-window._camera.position.z)
        ? r
        : a,
    window._rooms[0]
  );
}


/* ============================================================
   THREE.JS
   ============================================================ */

try{

  initGallery();
  galleryReady = true;

}catch(err){

  showFatalError(
    'Gallery failed to load: ' + err.message
  );

}


function initGallery(){

/* ============================================================
   SCENE
   ============================================================ */

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x171316);

scene.fog =
  new THREE.Fog(
    0x171316,
    35,
    125
  );


/* ============================================================
   CAMERA
   ============================================================ */

const camera =
  new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    0.08,
    180
  );

camera.position.set(
  0,
  1.65,
  5
);


/* ============================================================
   RENDERER
   ============================================================ */

const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:'high-performance'
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.75)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

renderer.outputEncoding =
  THREE.sRGBEncoding;

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
  0.92;

dom = renderer.domElement;

document.getElementById('app')
  .prepend(dom);

$('loading').style.display = 'none';


/* ============================================================
   RESIZE
   ============================================================ */

window.addEventListener('resize',()=>{

  camera.aspect =
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});


/* ============================================================
   LIGHTING
   ============================================================ */

scene.add(
  new THREE.HemisphereLight(
    0x5a5960,
    0x17100e,
    0.52
  )
);

const ambient =
  new THREE.AmbientLight(
    0x665d58,
    0.25
  );

scene.add(ambient);


/* ============================================================
   TEXTURE HELPERS
   ============================================================ */

function textureCanvas(
  draw,
  w=512,
  h=512
){

  const c =
    document.createElement('canvas');

  c.width = w;
  c.height = h;

  const ctx = c.getContext('2d');

  draw(ctx,w,h);

  const t =
    new THREE.CanvasTexture(c);

  t.wrapS =
    THREE.RepeatWrapping;

  t.wrapT =
    THREE.RepeatWrapping;

  t.anisotropy =
    renderer.capabilities.getMaxAnisotropy();

  t.encoding =
    THREE.sRGBEncoding;

  t.needsUpdate = true;

  return t;
}


/* ============================================================
   OLD WALLPAPER
   ============================================================ */

const wallpaperTexture =
textureCanvas((ctx,w,h)=>{

  ctx.fillStyle = '#49252b';
  ctx.fillRect(0,0,w,h);

  /* faded vertical fabric stripes */
  for(let x=0;x<w;x+=34){

    ctx.fillStyle =
      x%68===0
        ? 'rgba(24,10,13,.17)'
        : 'rgba(180,126,116,.08)';

    ctx.fillRect(x,0,13,h);
  }

  /* tiny aged floral/gold pattern */
  for(let y=24;y<h;y+=62){

    for(let x=18;x<w;x+=72){

      ctx.strokeStyle =
        'rgba(184,151,93,.18)';

      ctx.lineWidth = 2;

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        5,
        0,
        Math.PI*2
      );

      ctx.stroke();

      ctx.beginPath();

      ctx.moveTo(x-7,y);
      ctx.lineTo(x+7,y);

      ctx.moveTo(x,y-7);
      ctx.lineTo(x,y+7);

      ctx.stroke();
    }
  }

  /* scratches / old patches */
  for(let i=0;i<110;i++){

    const x=Math.random()*w;
    const y=Math.random()*h;

    ctx.fillStyle =
      Math.random()<.55
        ? 'rgba(20,8,10,.20)'
        : 'rgba(225,194,165,.09)';

    ctx.fillRect(
      x,
      y,
      2+Math.random()*12,
      1+Math.random()*4
    );
  }

},512,512);

wallpaperTexture.repeat.set(2.4,2.2);


/* ============================================================
   WOOD TEXTURE
   ============================================================ */

const woodTexture =
textureCanvas((ctx,w,h)=>{

  ctx.fillStyle='#39251b';
  ctx.fillRect(0,0,w,h);

  for(let i=0;i<80;i++){

    ctx.strokeStyle =
      `rgba(${45+Math.random()*40},${25+Math.random()*30},${15+Math.random()*20},.55)`;

    ctx.lineWidth =
      1+Math.random()*3;

    ctx.beginPath();

    let y=Math.random()*h;

    ctx.moveTo(0,y);

    for(let x=0;x<w;x+=20){

      y += (Math.random()-.5)*7;

      ctx.lineTo(x,y);
    }

    ctx.stroke();
  }

},512,256);

woodTexture.repeat.set(2.2,1);


/* ============================================================
   CARPET
   ============================================================ */

const carpetTexture =
textureCanvas((ctx,w,h)=>{

  ctx.fillStyle='#321c22';
  ctx.fillRect(0,0,w,h);

  /* worn runner border */
  ctx.strokeStyle='#8d6740';
  ctx.lineWidth=18;
  ctx.strokeRect(
    10,10,w-20,h-20
  );

  ctx.strokeStyle='#5c4030';
  ctx.lineWidth=5;
  ctx.strokeRect(
    27,27,w-54,h-54
  );

  for(let y=45;y<h;y+=48){

    for(let x=35;x<w;x+=48){

      ctx.fillStyle =
        'rgba(188,145,105,.13)';

      ctx.beginPath();

      ctx.moveTo(x,y-8);
      ctx.lineTo(x+8,y);
      ctx.lineTo(x,y+8);
      ctx.lineTo(x-8,y);
      ctx.closePath();

      ctx.fill();
    }
  }

  /* worn marks */
  for(let i=0;i<180;i++){

    ctx.fillStyle =
      `rgba(210,185,160,${Math.random()*.08})`;

    ctx.fillRect(
      Math.random()*w,
      Math.random()*h,
      2+Math.random()*8,
      1+Math.random()*3
    );
  }

},512,512);

carpetTexture.repeat.set(1,7);


/* ============================================================
   MATERIAL HELPERS
   ============================================================ */

function mat(
  color,
  roughness=.8,
  metalness=0
){

  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });

}

function texturedMat(
  texture,
  roughness=.95
){

  return new THREE.MeshStandardMaterial({
    map:texture,
    roughness
  });

}


/* ============================================================
   BASIC GEOMETRY HELPERS
   ============================================================ */

function box(
  w,h,d,
  material,
  x,y,z,
  ry=0
){

  const m =
    new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      material
    );

  m.position.set(x,y,z);
  m.rotation.y=ry;

  m.castShadow=true;
  m.receiveShadow=true;

  scene.add(m);

  return m;
}

function addTo(
  parent,
  geo,
  material,
  x,y,z,
  rx=0,
  ry=0,
  rz=0
){

  const m =
    new THREE.Mesh(
      geo,
      material
    );

  m.position.set(x,y,z);
  m.rotation.set(rx,ry,rz);

  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}


/* ============================================================
   FLOOR / CEILING
   ============================================================ */

const HALL_HALF = 1.65;
const HALL_LENGTH = 118;

const ROOM_W = 9.5;
const ROOM_D = 13.5;
const ROOM_H = 4.4;

const DOOR_HALF = 1.25;

const floorMaterial =
  texturedMat(carpetTexture,.98);

const hallFloor =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      HALL_HALF*2,
      HALL_LENGTH
    ),
    floorMaterial
  );

hallFloor.rotation.x =
  -Math.PI/2;

hallFloor.position.set(
  0,
  0,
  HALL_LENGTH/2
);

hallFloor.receiveShadow=true;

scene.add(hallFloor);


/* ceiling */
const ceilingMat =
  mat(0x261d1d,.95);

const ceiling =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      HALL_HALF*2,
      HALL_LENGTH
    ),
    ceilingMat
  );

ceiling.rotation.x =
  Math.PI/2;

ceiling.position.set(
  0,
  4.4,
  HALL_LENGTH/2
);

scene.add(ceiling);


/* ============================================================
   HALLWAY WALLS
   ============================================================ */

function makeWallSection(
  side,
  zStart,
  zEnd
){

  if(zEnd-zStart < .05)
    return;

  const length =
    zEnd-zStart;

  const wall =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        length,
        4.4
      ),
      texturedMat(
        wallpaperTexture,
        .96
      )
    );

  wall.position.set(
    side*HALL_HALF,
    2.2,
    (zStart+zEnd)/2
  );

  wall.rotation.y =
    side>0
      ? Math.PI/2
      : -Math.PI/2;

  wall.receiveShadow=true;

  scene.add(wall);

  /* dark wood wainscot */
  const wood =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        length,
        1.12
      ),
      texturedMat(
        woodTexture,
        .94
      )
    );

  wood.position.set(
    side*(HALL_HALF+.006),
    .56,
    (zStart+zEnd)/2
  );

  wood.rotation.y =
    side>0
      ? Math.PI/2
      : -Math.PI/2;

  scene.add(wood);

  /* gold divider */
  const gold =
    mat(0x86653a,.72,.15);

  const trim =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .045,
        .075,
        length
      ),
      gold
    );

  trim.position.set(
    side*(HALL_HALF+.035),
    1.14,
    (zStart+zEnd)/2
  );

  scene.add(trim);

}


/* doorway gaps are cut into the corridor visually */
const doorsBySide = {
  '-1': [],
  '1': []
};

const rooms = [
  {
    tag:'LOBBY 1',
    side:-1,
    z:16,
    type:'play'
  },
  {
    tag:'LOBBY 2',
    side:1,
    z:38,
    type:'farmhouse'
  },
  {
    tag:'LOBBY 3',
    side:-1,
    z:60,
    type:'snow'
  },
  {
    tag:'LOBBY 4',
    side:1,
    z:82,
    type:'night'
  },
  {
    tag:'LOBBY 5',
    side:-1,
    z:104,
    type:'eerie'
  }
];

rooms.forEach(r=>{
  doorsBySide[r.side].push({
    start:r.z-DOOR_HALF,
    end:r.z+DOOR_HALF
  });
});


[-1,1].forEach(side=>{

  const gaps =
    doorsBySide[side]
      .sort((a,b)=>a.start-b.start);

  let cursor=0;

  gaps.forEach(g=>{

    makeWallSection(
      side,
      cursor,
      g.start
    );

    cursor=g.end;
  });

  makeWallSection(
    side,
    cursor,
    HALL_LENGTH
  );

});


/* ============================================================
   HALLWAY ARCHITECTURAL TRIM
   ============================================================ */

function addHallTrim(){

  const darkWood =
    mat(0x291712,.82);

  const gold =
    mat(0x80603a,.7,.2);

  /* ceiling cornices */
  [-1,1].forEach(side=>{

    const cornice =
      box(
        .13,
        .18,
        HALL_LENGTH,
        darkWood,
        side*(HALL_HALF-.02),
        4.16,
        HALL_LENGTH/2
      );

  });

  /* vertical panel divisions */
  [-1,1].forEach(side=>{

    for(let z=3;z<HALL_LENGTH;z+=5.5){

      let tooClose=false;

      rooms.forEach(r=>{
        if(
          r.side===side &&
          Math.abs(z-r.z)<1.9
        ){
          tooClose=true;
        }
      });

const clickable=[];

function placeholderArt(
  label,
  hue=30
){

  return textureCanvas(
    (ctx,w,h)=>{

      const gradient =
        ctx.createLinearGradient(
          0,0,w,h
        );

      gradient.addColorStop(
        0,
        `hsl(${hue},24%,25%)`
      );

      gradient.addColorStop(
        .5,
        `hsl(${hue+15},22%,14%)`
      );

      gradient.addColorStop(
        1,
        `hsl(${hue+30},20%,7%)`
      );

      ctx.fillStyle=gradient;
      ctx.fillRect(0,0,w,h);

      /* atmospheric road/house */
      ctx.fillStyle='rgba(255,220,160,.18)';
      ctx.fillRect(
        w*.48,
        h*.36,
        w*.035,
        h*.26
      );

      ctx.fillStyle='rgba(0,0,0,.38)';
      ctx.beginPath();
      ctx.moveTo(w*.15,h);
      ctx.lineTo(w*.43,h*.48);
      ctx.lineTo(w*.58,h*.48);
      ctx.lineTo(w*.88,h);
      ctx.fill();

      ctx.fillStyle='rgba(255,230,190,.38)';
      ctx.beginPath();
      ctx.arc(
        w*.5,
        h*.41,
        10,
        0,
        Math.PI*2
      );
      ctx.fill();

      ctx.fillStyle='rgba(255,255,255,.75)';
      ctx.font='22px Georgia';
      ctx.textAlign='center';
      ctx.fillText(
        label,
        w/2,
        h*.9
      );

    },
    512,
    384
  );

}

/* helper for grouped furniture */
function boxInGroup(
  g,w,h,d,material,
  x,y,z,
  ry=0
){

  const m =
    new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      material
    );

  m.position.set(x,y,z);
  m.rotation.y=ry;

  m.castShadow=true;
  m.receiveShadow=true;

  g.add(m);

  return m;
}


function addRoomSpot(
  g,x,y,z,color,intensity
){

  const l =
    new THREE.PointLight(
      color,
      intensity,
      6,
      2
    );

  l.position.set(x,y,z);

  g.add(l);

  flickerLights.push({
    light:l,
    base:intensity,
    mode:'normal'
  });

}

      ctx.fillStyle='#8a6a3c';

      ctx.strokeStyle='#d2b477';
      ctx.lineWidth=5;
      ctx.strokeRect(
        7,7,w-14,h-14
      );

      ctx.fillStyle='#241812';
      ctx.font='bold 40px Georgia';
      ctx.textAlign='center';
      ctx.textBaseline='middle';

      ctx.fillText(
        r.tag,
        w/2,
        h/2
      );

    },
    420,
    110
  );

  const plaque =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1.65,

/* ============================================================
   COLLISION / MAP BOUNDARIES
   ============================================================ */

/*
   The old version only used one giant rectangular LIMIT.

   This version understands:
   - hallway width
   - room width
   - room depth
   - doorway openings

   So the player can enter rooms, but cannot walk through the
   solid walls or leave the building.
*/

const PLAYER_RADIUS=.34;

function roomBounds(r){

  const inner =
    r.side*HALL_HALF;

  const outer =
    r.side*(HALL_HALF+ROOM_W);

  return {
    xMin:Math.min(inner,outer),
    xMax:Math.max(inner,outer),
    zMin:r.z-ROOM_D/2,
    zMax:r.z+ROOM_D/2
  };

}


function insideRoom(r,x,z){

  const b=roomBounds(r);

  return (
    x>b.xMin &&
    x<b.xMax &&
    z>b.zMin &&
    z<b.zMax
  );

}


function doorwayFor(
  x,z
){

  for(const r of rooms){

    if(
      Math.abs(
        z-r.z
      ) <= DOOR_HALF
    ){

      const boundary =
        r.side*HALL_HALF;

      if(
        r.side<0 &&
        x < boundary
      )
        return r;

      if(
        r.side>0 &&
        x > boundary
      )
        return r;

    }

  }

  return null;

}


function resolvePosition(
  current,
  proposed
){

  let x=proposed.x;
  let z=proposed.z;

  /* absolute north/south building boundary */
  z=Math.max(
    1.0,
    Math.min(
      HALL_LENGTH-.45,
      z
    )
  );


  /* determine whether the proposed position is in a room */
  let activeRoom=null;

  for(const r of rooms){

    if(
      insideRoom(
        r,
        x,
        z
      )
    ){

      activeRoom=r;
      break;

    }

  }


  /* ----------------------------------------------------------
     ROOM COLLISION
     ---------------------------------------------------------- */

  if(activeRoom){

    const r=activeRoom;
    const b=roomBounds(r);

    /* outer wall */
    if(r.side<0){

      x=Math.max(
        b.xMin+PLAYER_RADIUS,
        x
      );

    }else{

      x=Math.min(
        b.xMax-PLAYER_RADIUS,
        x
      );

    }

    /* front/back room walls */
    z=Math.max(
      b.zMin+PLAYER_RADIUS,
      Math.min(
        b.zMax-PLAYER_RADIUS,
        z
      )
    );

    /*
       doorway is the only place through the inner wall.
    */
    const doorOpen =
      Math.abs(z-r.z)<=
      DOOR_HALF-PLAYER_RADIUS*.15;

    if(!doorOpen){

      if(r.side<0){

        x=Math.min(
          x,
          -HALL_HALF-PLAYER_RADIUS
        );

      }else{

        x=Math.max(
          x,
          HALL_HALF+PLAYER_RADIUS
        );

      }

    }

    return {
      x,
      z
    };

  }


  /* ----------------------------------------------------------
     HALLWAY COLLISION
     ---------------------------------------------------------- */

  const hallwayMin=
    -HALL_HALF+PLAYER_RADIUS;

  const hallwayMax=
    HALL_HALF-PLAYER_RADIUS;

  /*
     If the player is trying to cross a hallway wall,
     allow it only if the crossing is at a doorway.
  */

  if(
    x < hallwayMin
  ){

    let allowed=false;

    for(const r of rooms){

      if(
        r.side<0 &&
        Math.abs(z-r.z)
        <=DOOR_HALF-PLAYER_RADIUS*.15
      ){

        allowed=true;
        break;
      }

    }

    if(!allowed){

      x=hallwayMin;

    }else{

      /* keep within a legitimate left room */
      const r=rooms.find(
        r =>
          r.side<0 &&
          Math.abs(z-r.z)
          <=DOOR_HALF
      );

      if(r){

        const b=roomBounds(r);

        x=Math.max(
          b.xMin+PLAYER_RADIUS,
          x
        );

      }

    }

  }


  if(
    x > hallwayMax
  ){

    let allowed=false;

    for(const r of rooms){

      if(
        r.side>0 &&
        Math.abs(z-r.z)
        <=DOOR_HALF-PLAYER_RADIUS*.15
      ){

        allowed=true;
        break;

      }

    }

    if(!allowed){

      x=hallwayMax;

    }else{

      const r=rooms.find(
        r =>
          r.side>0 &&
          Math.abs(z-r.z)
          <=DOOR_HALF
      );

      if(r){

        const b=roomBounds(r);

        x=Math.min(
          b.xMax-PLAYER_RADIUS,
          x
        );

      }

    }

  }


  return {
    x,
    z
  };

}


/* ============================================================
   MOVEMENT
   ============================================================ */

let yaw=Math.PI;
let pitch=0;

const keys={};

document.addEventListener(
  'keydown',
  e=>{
    keys[e.code]=true;
  }
);

document.addEventListener(
  'keyup',
  e=>{
    keys[e.code]=false;
  }
);


dom.addEventListener(
  'click',
  ()=>{
    if(
      gameStarted &&
      document.pointerLockElement!==dom
    ){
      dom.requestPointerLock();
    }
  }
);


document.addEventListener(
  'mousemove',
  e=>{

    if(
      document.pointerLockElement!==dom
    ) return;

    yaw -=
      e.movementX*.0022;

    pitch -=
      e.movementY*.0022;

    pitch =
      Math.max(
        -1.2,
        Math.min(
          1.2,
          pitch
        )
      );

  }
);


function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    'YXZ'
  );

  const speed =
    3.15*dt;

  const fwd =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  const mv =
    new THREE.Vector3();

  if(keys['KeyW'])
    mv.add(fwd);

  if(keys['KeyS'])
    mv.sub(fwd);

  if(keys['KeyD'])
    mv.add(right);

  if(keys['KeyA'])
    mv.sub(right);

  if(
    mv.length()>0
  ){

    mv.normalize()
      .multiplyScalar(speed);

    const current =
      camera.position.clone();

    const proposed={
      x:
        camera.position.x+mv.x,
      z:
        camera.position.z+mv.z
    };

    const resolved =
      resolvePosition(
        current,
        proposed
      );

    camera.position.x=
      resolved.x;

    camera.position.z=
      resolved.z;

    footstepTick(dt);

  }


  /* room label */
  const near =
    rooms.reduce(
      (a,r)=>
        Math.abs(
          r.z-camera.position.z
        )
        <
        Math.abs(
          a.z-camera.position.z
        )
          ? r
          : a,
      rooms[0]
    );

  const lbl=$('roomLabel');

  if(
    Math.abs(
      near.z-camera.position.z
    )<6
  ){

    lbl.style.opacity=1;
    lbl.textContent=near.tag;

  }else{

    lbl.style.opacity=0;

  }

}


/* ============================================================
   ANIMATION
   ============================================================ */

const clock =
  new THREE.Clock();

function animateFlicker(t){

  flickerLights.forEach(f=>{

    if(f.mode==='lamp'){

      f.light.intensity =
        f.base *
        (
          .94+
          Math.sin(
            t*2.3
          )*.025+
          (Math.random()-.5)*.04
        );

    }

    else if(f.mode==='fire'){

      f.light.intensity =
        f.base *
        (
          .82+
          Math.sin(t*7.1)*.08+
          Math.sin(t*13.7)*.045+
          Math.random()*.08
        );

    }

    else{

      f.light.intensity =
        f.base *
        (
          .97+
          Math.sin(t*1.8)*.025
        );

    }

  });


  /* fire animation */
  scene.traverse(o=>{

    if(
      o.userData &&
      o.userData.fire
    ){

      const s =
        1+
        Math.sin(
          t*9+
          o.userData.phase
        )*.12;

      o.scale.x=s;
      o.scale.y=
        1+
        Math.sin(
          t*11+
          o.userData.phase
        )*.14;

      o.rotation.z =
        Math.sin(
          t*7+
          o.userData.phase
        )*.08;

    }


    /* balloons gently moving */
    if(
      o.userData &&
      o.userData.balloon
    ){

      o.rotation.z =
        Math.sin(
          t*1.1+
          o.userData.phase
        )*.035;

      o.rotation.x =
        Math.sin(
          t*.8+
          o.userData.phase
        )*.025;

    }


    /* snow outside */
    if(
      o.userData &&
      o.userData.snowOutside
    ){

      const p =
        o.geometry.attributes.position;

      for(
        let i=1;
        i<p.count*3;
        i+=3
      ){

        p.array[i]-=.006;

        if(
          p.array[i]<0
        ){

          p.array[i]=3.8;

        }

      }

      p.needsUpdate=true;

    }

  });

}


/* ============================================================
   RENDER LOOP
   ============================================================ */

function loop(){

  requestAnimationFrame(loop);

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  if(gameStarted)
    updateMovement(dt);

  animateFlicker(
    clock.elapsedTime
  );

  renderer.render(
    scene,
    camera
  );

}

loop();


/* ============================================================
   PAINTING CLICK
   ============================================================ */

const ray =
  new THREE.Raycaster();

dom.addEventListener(
  'mousedown',
  e=>{

    if(
      !gameStarted ||
      document.pointerLockElement!==dom
    )
      return;

    ray.setFromCamera(
      {
        x:0,
        y:0
      },
      camera
    );

    const hit =
      ray.intersectObjects(
        clickable,
        false
      )[0];

    if(hit)
      openNote(
        hit.object.userData
      );

  }
);


window._rooms=rooms;
window._camera=camera;

} /* end initGallery */
