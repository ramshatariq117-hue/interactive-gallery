<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
:root{
  --blue:#5ef2ff;
  --blue2:#9adfff;
  --paper:#e8dcc0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Georgia,serif;
}

#app{
  position:relative;
  width:100%;
  height:100%;
}

canvas{
  display:block;
}

/* =========================================================
   WELCOME
========================================================= */

#welcome{
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 50% 40%,
      #0b1528 0%,
      #050a14 38%,
      #000 82%
    );
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:50;
  color:#cbd6e6;
}

#welcome h1{
  font-size:2.2em;
  letter-spacing:2px;
  color:var(--blue);
  text-shadow:
    0 0 12px var(--blue),
    0 0 30px #174d70;
  margin-bottom:8px;
}

#welcome p{
  opacity:.7;
  margin-bottom:22px;
}

#nameInput{
  padding:12px 16px;
  font-size:1.1em;
  border-radius:6px;
  border:1px solid #345;
  background:#0e1420;
  color:#e8f0ff;
  width:280px;
  text-align:center;
  margin-bottom:16px;
}

#enterBtn{
  padding:12px 28px;
  font-size:1.05em;
  letter-spacing:1px;
  cursor:pointer;
  border-radius:6px;
  border:1px solid var(--blue);
  background:transparent;
  color:var(--blue);
  text-shadow:0 0 8px var(--blue);
  transition:all .25s;
}

#enterBtn:hover{
  background:var(--blue);
  color:#001;
  box-shadow:0 0 20px var(--blue);
}

#welcomeMsg{
  font-size:1.3em;
  color:#fff;
  text-align:center;
  max-width:520px;
  line-height:1.5;
}

/* =========================================================
   HUD
========================================================= */

#crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:6px;
  height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  z-index:20;
  pointer-events:none;
}

#hint{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:#d5c8bd;
  font-size:.85em;
  background:rgba(25,10,8,.62);
  padding:7px 15px;
  border-radius:20px;
  z-index:20;
  pointer-events:none;
  border:1px solid rgba(220,170,130,.18);
}

#muteBtn{
  position:absolute;
  top:16px;
  right:16px;
  z-index:30;
  background:rgba(25,10,8,.62);
  color:#eadbd2;
  border:1px solid #76544a;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-size:.9em;
}

#roomLabel{
  position:absolute;
  top:16px;
  left:16px;
  z-index:20;
  color:var(--blue);
  text-shadow:0 0 8px var(--blue);
  font-size:1em;
  letter-spacing:2px;
  opacity:0;
  transition:opacity .6s;
}

/* =========================================================
   MODAL
========================================================= */

.modalOverlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(2px);
}

.note{
  width:340px;
  max-width:80vw;
  background:var(--paper);
  color:#3a2f22;
  padding:26px 24px;
  border-radius:2px;
  box-shadow:
    0 0 40px rgba(0,0,0,.7),
    inset 0 0 40px rgba(120,90,50,.25);
  transform:rotate(-1.2deg);
  font-family:Georgia,serif;
  position:relative;
}

.note::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent,
      transparent 24px,
      rgba(0,0,0,.03) 25px
    );
  pointer-events:none;
}

.note h3{
  font-size:1.15em;
  margin-bottom:10px;
  border-bottom:1px solid rgba(0,0,0,.2);
  padding-bottom:6px;
}

.note p{
  line-height:1.5;
  font-size:.95em;
}

.note button{
  margin-top:16px;
  padding:8px 16px;
  border:1px solid #3a2f22;
  background:transparent;
  cursor:pointer;
  color:#3a2f22;
}

.win{
  background:#111;
  color:#ffd27a;
  border:2px solid #ffd27a;
  box-shadow:0 0 40px #ffb84a;
  transform:rotate(0);
  text-align:center;
}

.win h3{
  color:#ffd27a;
  border-color:#553;
}

.win button{
  border-color:#ffd27a;
  color:#ffd27a;
}

#loading{
  position:absolute;
  inset:0;
  background:#000;
  color:#5ef2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  font-size:1.1em;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div id="app">

  <div id="loading">LOADING GALLERY…</div>

  <div id="welcome">

    <h1>RAMSHA ART STUDIO</h1>

    <p>
      an interactive gallery of cozy &amp; eerie things
    </p>

    <div id="stepEnterName">

      <input
        id="nameInput"
        placeholder="Enter your name"
        maxlength="20"
      >

      <br>

      <button id="enterBtn">
        ENTER GALLERY
      </button>

    </div>

    <div
      id="welcomeMsg"
      style="display:none;"
    ></div>

  </div>

  <div id="roomLabel"></div>

  <div
    id="crosshair"
    style="display:none;"
  ></div>

  <div
    id="hint"
    style="display:none;"
  >
    WASD to move · mouse to look · click a painting
  </div>

  <button
    id="muteBtn"
    style="display:none;"
  >
    🔊 Sound
  </button>

  <div
    class="modalOverlay"
    id="noteOverlay"
  >
    <div
      class="note"
      id="noteBox"
    >

      <h3 id="noteTitle">
        Untitled
      </h3>

      <p id="noteBody">
        ...
      </p>

      <button id="noteClose">
        close
      </button>

    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   UI
============================================================ */

const $ = id => document.getElementById(id);

let gameStarted = false;
let galleryReady = false;
let dom = null;

function showFatalError(msg){

  const lbl = $('roomLabel');

  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';
  lbl.textContent = '⚠ ' + msg;

  console.error(msg);
}

$('enterBtn').onclick = () => {

  const name =
    $('nameInput').value.trim() || 'friend';

  $('stepEnterName').style.display = 'none';

  const wm = $('welcomeMsg');

  wm.style.display = 'block';

  wm.textContent =
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn('Audio failed:',e);
  }

  setTimeout(() => {

    $('welcome').style.display = 'none';

    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';

    gameStarted = true;

    if(!galleryReady){

      showFatalError(
        '3D engine did not start — open the browser console (F12) for details.'
      );

    }else if(dom){

      dom.requestPointerLock();
    }

  },2200);
};

$('muteBtn').onclick = () => {

  muted = !muted;

  if(master){
    master.gain.value =
      muted ? 0 : .25;
  }

  $('muteBtn').textContent =
    muted
      ? '🔇 Sound'
      : '🔊 Sound';
};

$('noteClose').onclick = () => {

  $('noteOverlay').style.display = 'none';
};

function openNote(d){

  if(dom)
    document.exitPointerLock();

  const box = $('noteBox');

  box.classList.toggle(
    'win',
    !!d.winner
  );

  $('noteTitle').textContent =
    d.winner
      ? '🎉 You found a free print!'
      : d.label;

  $('noteBody').textContent =
    d.story;

  $('noteOverlay').style.display =
    'flex';
}


/* ============================================================
   AUDIO
============================================================ */

let audioCtx;
let master;
let noiseSrc;
let droneOsc;
let muted = false;
let footstepTimer = 0;

function footstepTick(dt){

  if(!audioCtx || muted)
    return;

  footstepTimer -= dt;

  if(footstepTimer > 0)
    return;

  footstepTimer = .38;

  const o =
    audioCtx.createOscillator();

  const g =
    audioCtx.createGain();

  o.type = 'triangle';

  o.frequency.value =
    82 + Math.random()*25;

  g.gain.value = 0;

  o.connect(g).connect(master);

  const now =
    audioCtx.currentTime;

  g.gain.linearRampToValueAtTime(
    .035,
    now+.015
  );

  g.gain.exponentialRampToValueAtTime(
    .001,
    now+.09
  );

  o.start(now);
  o.stop(now+.1);
}

function startAudio(){

  if(audioCtx)
    return;

  audioCtx =
    new(
      window.AudioContext ||
      window.webkitAudioContext
    )();

  master =
    audioCtx.createGain();

  master.gain.value = .25;

  master.connect(
    audioCtx.destination
  );

  droneOsc =
    audioCtx.createOscillator();

  droneOsc.type = 'sine';
  droneOsc.frequency.value = 55;

  const droneGain =
    audioCtx.createGain();

  droneGain.gain.value = .11;

  droneOsc
    .connect(droneGain)
    .connect(master);

  droneOsc.start();

  const bufSize =
    2 * audioCtx.sampleRate;

  const buf =
    audioCtx.createBuffer(
      1,
      bufSize,
      audioCtx.sampleRate
    );

  const data =
    buf.getChannelData(0);

  for(let i=0;i<bufSize;i++){

    data[i] =
      Math.random()*2-1;
  }

  noiseSrc =
    audioCtx.createBufferSource();

  noiseSrc.buffer = buf;
  noiseSrc.loop = true;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type = 'lowpass';
  filter.frequency.value = 450;

  const noiseGain =
    audioCtx.createGain();

  noiseGain.gain.value = .025;

  noiseSrc
    .connect(filter)
    .connect(noiseGain)
    .connect(master);

  noiseSrc.start();

  setInterval(() => {

    if(
      muted ||
      !gameStarted ||
      !galleryReady
    )
      return;

    const near =
      currentRoom();

    const o =
      audioCtx.createOscillator();

    const g =
      audioCtx.createGain();

    const spooky =
      near &&
      near.tag === 'LOBBY 5';

    o.type =
      spooky
        ? 'sawtooth'
        : 'sine';

    o.frequency.value =
      spooky
        ? 120+Math.random()*200
        : 300+Math.random()*200;

    g.gain.value = 0;

    o.connect(g).connect(master);

    o.start();

    g.gain.linearRampToValueAtTime(
      spooky ? .055 : .022,
      audioCtx.currentTime+.3
    );

    g.gain.linearRampToValueAtTime(
      0,
      audioCtx.currentTime+1.4
    );

    o.stop(
      audioCtx.currentTime+1.5
    );

  },5000);
}

function currentRoom(){

  if(
    !window._rooms ||
    !window._camera
  )
    return null;

  return window._rooms.reduce(
    (a,r) =>
      Math.abs(
        r.z-window._camera.position.z
      )
      <
      Math.abs(
        a.z-window._camera.position.z
      )
        ? r
        : a,
    window._rooms[0]
  );
}


/* ============================================================
   THREE SETUP
============================================================ */

let scene;
let camera;
let renderer;
let clock;

try{

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(
      0x070607
    );

  scene.fog =
    new THREE.FogExp2(
      0x090708,
      .010
    );

  camera =
    new THREE.PerspectiveCamera(
      72,
      innerWidth/innerHeight,
      .1,
      240
    );

  camera.position.set(
    0,
    1.7,
    5
  );

  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );

  renderer.shadowMap.enabled = true;

  renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

  renderer.outputEncoding =
    THREE.sRGBEncoding;

  document
    .getElementById('app')
    .prepend(
      renderer.domElement
    );

  dom =
    renderer.domElement;

  clock =
    new THREE.Clock();

  $('loading').style.display =
    'none';

  galleryReady = true;

}catch(err){

  console.error(err);

  showFatalError(
    '3D engine failed to initialise.'
  );
}


/* ============================================================
   LIGHTING
============================================================ */

const ambient =
  new THREE.AmbientLight(
    0x392d2d,
    1.0
  );

scene.add(ambient);


/* ============================================================
   MATERIAL HELPERS
============================================================ */

function M(color,opts={}){

  return new THREE.MeshStandardMaterial({

    color:color,

    roughness:
      opts.roughness !== undefined
        ? opts.roughness
        : .82,

    metalness:
      opts.metalness !== undefined
        ? opts.metalness
        : 0,

    emissive:
      opts.emissive !== undefined
        ? opts.emissive
        : 0x000000,

    emissiveIntensity:
      opts.emissiveIntensity !== undefined
        ? opts.emissiveIntensity
        : 0,

    transparent:
      opts.transparent || false,

    opacity:
      opts.opacity !== undefined
        ? opts.opacity
        : 1,

    side:
      opts.side !== undefined
        ? opts.side
        : THREE.FrontSide
  });
}

function addMesh(
  parent,
  geometry,
  material,
  x=0,
  y=0,
  z=0,
  rx=0,
  ry=0,
  rz=0
){

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    x,y,z
  );

  mesh.rotation.set(
    rx,ry,rz
  );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  parent.add(mesh);

  return mesh;
}

function box(
  parent,
  w,h,d,
  color,
  x,y,z,
  ry=0,
  opts={}
){

  return addMesh(
    parent,
    new THREE.BoxGeometry(
      w,h,d
    ),
    M(color,opts),
    x,y,z,
    0,ry,0
  );
}

function sphere(
  parent,
  radius,
  color,
  x,y,z,
  scale=[1,1,1],
  opts={}
){

  const mesh =
    addMesh(
      parent,
      new THREE.SphereGeometry(
        radius,
        18,
        12
      ),
      M(color,opts),
      x,y,z
    );

  mesh.scale.set(
    scale[0],
    scale[1],
    scale[2]
  );

  return mesh;
}

function cyl(
  parent,
  r1,r2,h,
  color,
  x,y,z,
  segments=16,
  ry=0,
  opts={}
){

  return addMesh(
    parent,
    new THREE.CylinderGeometry(
      r1,r2,h,segments
    ),
    M(color,opts),
    x,y,z,
    0,ry,0
  );
}

function torus(
  parent,
  radius,
  tube,
  color,
  x,y,z,
  rx=0,
  ry=0,
  rz=0,
  opts={}
){

  return addMesh(
    parent,
    new THREE.TorusGeometry(
      radius,
      tube,
      10,
      24
    ),
    M(color,opts),
    x,y,z,
    rx,ry,rz
  );
}

function tubeBetween(
  parent,
  a,
  b,
  radius,
  color,
  opts={}
){

  const dir =
    new THREE.Vector3()
      .subVectors(a,b);

  const realDir =
    new THREE.Vector3()
      .subVectors(b,a);

  const len =
    realDir.length();

  const mesh =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        len,
        8
      ),
      M(color,opts)
    );

  mesh.position
    .copy(a)
    .add(b)
    .multiplyScalar(.5);

  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    realDir.normalize()
  );

  mesh.castShadow = true;

  parent.add(mesh);

  return mesh;
}


/* ============================================================
   TEXTURES
============================================================ */

function canvasTexture(
  draw,
  w=512,
  h=384
){

  const c =
    document.createElement(
      'canvas'
    );

  c.width=w;
  c.height=h;

  const ctx =
    c.getContext('2d');

  draw(ctx,w,h);

  const texture =
    new THREE.CanvasTexture(c);

  texture.wrapS =
    THREE.ClampToEdgeWrapping;

  texture.wrapT =
    THREE.ClampToEdgeWrapping;

  texture.encoding =
    THREE.sRGBEncoding;

  return texture;
}

function wallpaperTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle =
        '#4b171d';

      ctx.fillRect(
        0,0,w,h
      );

      for(
        let x=0;
        x<w;
        x+=54
      ){

        ctx.strokeStyle =
          'rgba(226,151,125,.15)';

        ctx.lineWidth=2;

        ctx.beginPath();

        for(
          let y=-20;
          y<h+30;
          y+=29
        ){

          ctx.moveTo(
            x,y
          );

          ctx.quadraticCurveTo(
            x+27,
            y+14,
            x,
            y+29
          );
        }

        ctx.stroke();
      }

      for(
        let x=27;
        x<w;
        x+=108
      ){

        for(
          let y=24;
          y<h;
          y+=57
        ){

          ctx.fillStyle =
            'rgba(244,181,145,.12)';

          ctx.beginPath();

          ctx.arc(
            x,y,3,
            0,
            Math.PI*2
          );

          ctx.fill();
        }
      }
    },
    512,
    512
  );
}

function woodTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle =
        '#382017';

      ctx.fillRect(
        0,0,w,h
      );

      for(
        let y=0;
        y<h;
        y+=38
      ){

        ctx.fillStyle =
          y%76===0
            ? '#4b2a20'
            : '#291612';

        ctx.fillRect(
          0,
          y,
          w,
          30
        );

        ctx.strokeStyle =
          'rgba(190,115,72,.14)';

        ctx.beginPath();

        ctx.moveTo(
          0,
          y+11
        );

        ctx.bezierCurveTo(
          w*.25,
          y+2,
          w*.65,
          y+20,
          w,
          y+9
        );

        ctx.stroke();
      }
    },
    512,
    512
  );
}

function runnerTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle =
        '#321619';

      ctx.fillRect(
        0,0,w,h
      );

      for(
        let y=0;
        y<h;
        y+=70
      ){

        ctx.strokeStyle =
          'rgba(198,129,91,.12)';

        ctx.lineWidth=3;

        ctx.strokeRect(
          8,
          y+8,
          w-16,
          54
        );
      }

      for(
        let y=20;
        y<h;
        y+=70
      ){

        ctx.fillStyle =
          'rgba(220,155,108,.12)';

        ctx.beginPath();

        ctx.arc(
          w/2,
          y,
          7,
          0,
          Math.PI*2
        );

        ctx.fill();
      }
    },
    256,
    1024
  );
}

function placeholderArt(
  label,
  hue=210
){

  return canvasTexture(
    (ctx,w,h)=>{

      const grad =
        ctx.createLinearGradient(
          0,0,w,h
        );

      grad.addColorStop(
        0,
        `hsl(${hue},30%,27%)`
      );

      grad.addColorStop(
        .55,
        `hsl(${hue},23%,11%)`
      );

      grad.addColorStop(
        1,
        '#050508'
      );

      ctx.fillStyle=grad;

      ctx.fillRect(
        0,0,w,h
      );

      ctx.fillStyle =
        `hsla(${hue},70%,75%,.15)`;

      ctx.beginPath();

      ctx.arc(
        w*.68,
        h*.3,
        h*.16,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle =
        `hsla(${hue},60%,80%,.23)`;

      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.moveTo(
        w*.08,
        h*.72
      );

      ctx.quadraticCurveTo(
        w*.42,
        h*.50,
        w*.92,
        h*.76
      );

      ctx.stroke();

      if(label){

        ctx.fillStyle =
          'rgba(255,255,255,.82)';

        ctx.font =
          'bold 25px Georgia';

        ctx.textAlign =
          'center';

        ctx.fillText(
          label,
          w/2,
          h*.89
        );
      }
    },
    640,
    450
  );
}

function signTexture(
  text,
  color
){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle =
        '#160d10';

      ctx.fillRect(
        0,0,w,h
      );

      ctx.strokeStyle =
        color;

      ctx.lineWidth=7;

      ctx.strokeRect(
        12,
        12,
        w-24,
        h-24
      );

      ctx.shadowColor =
        color;

      ctx.shadowBlur=20;

      ctx.fillStyle =
        color;

      ctx.font =
        'bold 48px Georgia';

      ctx.textAlign =
        'center';

      ctx.textBaseline =
        'middle';

function buildHallWall(side){

  const x =
    side*HALL_HALF;

  let start=1;

  for(
    const zc of lobbyCenters
  ){

    const gapStart =
      zc-DOOR_HALF-.2;

    if(
      gapStart>start
    ){

      box(
        scene,
        .18,
        ROOM_H,
        gapStart-start,
        0x47171c,
        x,
        ROOM_H/2,
        (start+gapStart)/2
      );
    }

    start =
      zc+DOOR_HALF+.2;
  }

  if(start<HALL_LENGTH){

    box(
      scene,
      .18,
      ROOM_H,
      HALL_LENGTH-start,
      0x47171c,
      x,
      ROOM_H/2,
      (start+HALL_LENGTH)/2
    );
  }


  /* wallpaper */

  const tex =
    wallpaperTexture();

  tex.wrapS =
  tex.wrapT =
    THREE.RepeatWrapping;

  tex.repeat.set(
    1.4,
    3
  );

  let pStart=1;

  for(
    const zc of lobbyCenters
  ){

    const gapStart =
      zc-DOOR_HALF-.2;

    if(gapStart>pStart){

      const panel =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            ROOM_H-.3,
            gapStart-pStart
          ),
          new THREE.MeshStandardMaterial({
            map:tex,
            roughness:1
          })
        );

      panel.rotation.y =
        side<0
          ? Math.PI/2
          : -Math.PI/2;

      panel.position.set(
        x-side*.096,
        ROOM_H/2,
        (pStart+gapStart)/2
      );

      scene.add(panel);
    }

    pStart =
      zc+DOOR_HALF+.2;
  }

  if(pStart<HALL_LENGTH){

    const panel =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          ROOM_H-.3,
          HALL_LENGTH-pStart
        ),
        new THREE.MeshStandardMaterial({
          map:tex,
          roughness:1
        })
      );

    panel.rotation.y =
      side<0
        ? Math.PI/2
        : -Math.PI/2;

    panel.position.set(
      x-side*.096,
      ROOM_H/2,
      (pStart+HALL_LENGTH)/2
    );

    scene.add(panel);
  }
}

/* ============================================================
   ROOM CREATOR
============================================================ */

function createRoom(cfg){

  const group =
    new THREE.Group();

  group.position.set(
    cfg.side*
      (HALL_HALF+ROOM_W/2),
    0,
    cfg.z
  );

  scene.add(group);

  rooms.push({
    z:cfg.z,
    tag:`LOBBY ${cfg.number}`,
    side:cfg.side,
    group
  });


  /* floor */

  const floor =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_D
      ),
      M(
        cfg.floor,
        {
          roughness:.94
        }
      )
    );

  floor.rotation.x =
    -Math.PI/2;

  floor.position.y=.01;

  floor.receiveShadow=true;

  group.add(floor);


  /* ceiling */

  box(
    group,
    ROOM_W,
    .16,
    ROOM_D,
    cfg.ceiling,
    0,
    ROOM_H,
    0
  );


  /* outer wall */

  box(
    group,
    .18,
    ROOM_H,
    ROOM_D,
    cfg.wall,
    cfg.side*ROOM_W/2,
    ROOM_H/2,
    0
  );


  /* rear end wall */

  box(
    group,
    ROOM_W,
    ROOM_H,
    .18,
    cfg.wall,
    0,
    ROOM_H/2,
    -ROOM_D/2
  );

  /* front end wall */

  box(
    group,
    ROOM_W,
    ROOM_H,
    .18,
    cfg.wall,
    0,
    ROOM_H/2,
    ROOM_D/2
  );


  /*
     HALLWAY-FACING WALL.

     THIS IS THE SECOND CRITICAL FIX.

     The wall is split into two pieces,
     leaving an actual opening for the door.

     Local room coordinates:

       LEFT ROOM:
         hall wall = +7.5

       RIGHT ROOM:
         hall wall = -7.5
  */

  const hallWallX =
    -cfg.side*ROOM_W/2;

  const segmentLength =
    ROOM_D/2-DOOR_HALF;


  /* first wall section */

  box(
    group,
    .18,
    ROOM_H,
    segmentLength,
    cfg.wall,
    hallWallX,
    ROOM_H/2,
    -(
      ROOM_D/4+
      DOOR_HALF/2
    )
  );


  /* second wall section */

  box(
    group,
    .18,
    ROOM_H,
    segmentLength,
    cfg.wall,
    hallWallX,
    ROOM_H/2,
    (
      ROOM_D/4+
      DOOR_HALF/2
    )
  );


  /* wallpaper on outer walls */

  if(cfg.wallpaper){

    const tex =
      wallpaperTexture();

    tex.wrapS =
    tex.wrapT =
      THREE.RepeatWrapping;

    tex.repeat.set(
      2,
      3
    );

    const mat =
      new THREE.MeshStandardMaterial({
        map:tex,
        roughness:1
      });


    /* hallway-facing split wallpaper */

    for(
      const s of [-1,1]
    ){

      const panel =
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            ROOM_H-.3,
            segmentLength
          ),
          mat
        );

      panel.position.set(
        hallWallX+
          cfg.side*.095,
        ROOM_H/2,
        s*
          (
            ROOM_D/4+
            DOOR_HALF/2
          )
      );

      panel.rotation.y =
        cfg.side<0
          ? -Math.PI/2
          : Math.PI/2;

      group.add(panel);
    }
  }


  /* room light */

  const roomLight =
    new THREE.PointLight(
      cfg.light,
      cfg.intensity,
      25
    );

  roomLight.position.set(
    cfg.side*2,
    3.5,
    0
  );

  roomLight.castShadow=true;

  roomLight.shadow.mapSize.width=512;
  roomLight.shadow.mapSize.height=512;

  group.add(roomLight);

  flickerLights.push({
    light:roomLight,
    base:cfg.intensity,
    mode:cfg.flicker||'soft'
  });


  /* paintings */

  (cfg.paintings||[])
    .forEach(
      p =>
        createPainting(
          p,
          group
        )
    );


  /*
     Actual doorway aligned with
     actual room wall.
  */

  makeDoorway(
    cfg.side,
    cfg.z,
    cfg.number,
    cfg.neon
  );

  return group;
}

      return;

    yaw -=
      e.movementX*.0022;

    pitch -=
      e.movementY*.0022;

    pitch =
      Math.max(
        -1.2,
        Math.min(
          1.2,
          pitch
        )
      );
  }
);

const LIMIT={
  xMin:
    -(HALL_HALF+ROOM_W-.35),

  xMax:
    HALL_HALF+ROOM_W-.35,

  zMin:1,

  zMax:
    HALL_LENGTH-1
};

function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    'YXZ'
  );

  const speed =
    3.2*dt;

  const fwd =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  let mv =
    new THREE.Vector3();

  if(keys['KeyW'])
    mv.add(fwd);

  if(keys['KeyS'])
    mv.sub(fwd);

  if(keys['KeyD'])
    mv.add(right);

  if(keys['KeyA'])
    mv.sub(right);

  if(mv.length()>0){

    mv
      .normalize()
      .multiplyScalar(speed);

    camera.position.x =
      Math.max(
        LIMIT.xMin,
        Math.min(
          LIMIT.xMax,
          camera.position.x+mv.x
        )
      );

    camera.position.z =
      Math.max(
        LIMIT.zMin,
        Math.min(
          LIMIT.zMax,
          camera.position.z+mv.z
        )
      );

    footstepTick(dt);
  }

  const near =
    rooms.reduce(
      (a,r)=>
        Math.abs(
          r.z-camera.position.z
        )
        <
        Math.abs(
          a.z-camera.position.z
        )
          ? r
          : a,
      rooms[0]
    );

  const lbl =
    $('roomLabel');

  if(
    Math.abs(
      near.z-camera.position.z
    )<8
  ){

    lbl.style.opacity=1;

    lbl.textContent =
      near.tag;

  }else{

    lbl.style.opacity=0;
  }
}


/* ============================================================
   ANIMATION
============================================================ */

function animateWorld(t){

  const time =
    t*.001;


  /* lights */

  flickerLights.forEach(
    item=>{

      const l =
        item.light;

      if(
        item.mode==='flicker'
      ){

        l.intensity =
          item.base*
          (
            .78+
            Math.random()*.28
          );

      }else if(
        item.mode==='ember'
      ){

        l.intensity =
          item.base*
          (
            .84+
            Math.sin(time*7)*.07+
            Math.random()*.07
          );

      }else if(
        item.mode==='lamp'
      ){

        l.intensity =
          item.base*
          (
            .96+
            Math.sin(time*1.6)*.035
          );

      }else if(
        item.mode==='strobe'
      ){

        l.intensity =
          item.base*
          (
            Math.random()>.97
              ? .18
              : .92
          );

      }else{

        l.intensity =
          item.base*
          (
            .98+
            Math.sin(time*1.2)*.02
          );
      }
    }
  );


  /* snow */

  snowParticles.forEach(
    p=>{

      p.position.y -= .009;

      p.position.x +=
        Math.sin(
          time*1.2+
          p.position.z
        )*.0007;

      if(
        p.position.y<.04
      )
        p.position.y=4.75;
    }
  );


  /* rain */

  rainParticles.forEach(
    p=>{

      p.position.y -= .06;

      if(
        p.position.y<.04
      )
        p.position.y=4.65;
    }
  );


  /* fire */

  fireMeshes.forEach(
    f=>{

      f.scale.y =
        1.35+
        Math.sin(time*8)*.12+
        Math.sin(time*13)*.08;

      f.rotation.z =
        Math.sin(time*5)*.08;
    }
  );


  /* pendulum */

  pendulums.forEach(
    p=>{

      p.rotation.z =
        Math.sin(time*1.7)*.18;
    }
  );


  /* beam */

  animatedObjects.forEach(
    item=>{

      if(
        item.type==='beam'
      ){

        item.object.material.opacity =
          .025+
          Math.sin(time*2.2)*.007;
      }

      if(
        item.type==='carLight'
      ){

        item.object.intensity =
          item.base+
          Math.sin(time*2)*.025;
      }

      /*
         Door remains physically open,
         with an extremely subtle movement
         rather than disappearing.
      */

      if(
        item.type==='door'
      ){

        item.object.rotation.y =
          item.base+
          Math.sin(time*.45)*.008;
      }
    }
  );
}


/* ============================================================
   PAINTING CLICK
============================================================ */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

dom.addEventListener(
  'mousedown',
  e=>{

    if(!gameStarted)
      return;

    mouse.x=0;
    mouse.y=0;

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits =
      raycaster.intersectObjects(
        clickable,
        false
      );

    if(hits.length){

      openNote(
        hits[0].object.userData
      );
    }
  }
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
  'resize',
  ()=>{

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* ============================================================
   MAIN LOOP
============================================================ */

function animate(t){

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  if(gameStarted)
    updateMovement(dt);

  animateWorld(t);

  renderer.render(
    scene,
    camera
  );
}

animate(0);

</script>
