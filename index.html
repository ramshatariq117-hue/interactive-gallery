<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ramsha Art Studio — Interactive Gallery</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090b;color:#eee;font-family:"DM Sans",Arial,sans-serif}
  body{touch-action:none}
  #welcome{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 45%,#1c2730 0%,#0d1419 38%,#050709 100%);}
  .welcome-inner{width:min(620px,90vw);padding:48px 32px}
  #welcome h1{margin:0 0 14px;font-family:Georgia,"Times New Roman",serif;letter-spacing:.19em;font-size:clamp(30px,6vw,58px);font-weight:400;color:#e8f8fa;text-shadow:0 0 24px rgba(75,235,255,.22)}
  #welcome .sub{margin:0 0 32px;color:#a9bdc4;font-size:14px;letter-spacing:.08em}
  #name{width:min(360px,80vw);padding:14px 16px;border:1px solid rgba(110,221,236,.35);background:rgba(4,10,13,.65);color:#eefcff;border-radius:7px;outline:none;text-align:center;font-size:16px}
  #enter{display:block;width:min(360px,80vw);margin:14px auto 0;padding:14px 18px;border:1px solid rgba(97,229,245,.5);background:rgba(12,33,39,.78);color:#dffbff;border-radius:7px;letter-spacing:.15em;font-size:12px;cursor:pointer;transition:.2s}
  #enter:hover{background:rgba(24,60,68,.9);box-shadow:0 0 25px rgba(62,221,239,.14)}
  #welcomeMessage{min-height:24px;margin-top:22px;color:#9db5bd;font-size:13px}
  #loading{position:fixed;inset:0;z-index:19;display:none;align-items:center;justify-content:center;background:#08090b;color:#b8d9df;font-size:13px;letter-spacing:.12em}
  #hud{position:fixed;left:18px;top:16px;z-index:10;display:none;padding:10px 12px;border:1px solid rgba(255,255,255,.09);background:rgba(5,7,8,.42);backdrop-filter:blur(5px);font-size:11px;color:#b7c3c6;letter-spacing:.06em}
  #mute{position:fixed;right:18px;top:16px;z-index:10;display:none;border:1px solid rgba(255,255,255,.13);background:rgba(5,7,8,.48);color:#cbd5d7;padding:9px 11px;border-radius:5px;cursor:pointer}
  #crosshair{position:fixed;left:50%;top:50%;width:7px;height:7px;margin:-3px 0 0 -3px;border:1px solid rgba(255,255,255,.4);border-radius:50%;z-index:9;display:none}
  #note{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(2,4,5,.55);backdrop-filter:blur(4px)}
  .note-card{width:min(580px,88vw);padding:30px 30px 26px;background:#eee8db;color:#302a25;box-shadow:0 25px 70px rgba(0,0,0,.6);border:1px solid #c8bda8;position:relative}
  .note-card h2{font-family:Georgia,serif;font-weight:400;margin:0 0 10px;font-size:26px}
  .note-card p{line-height:1.65;margin:0;color:#51483f}
  .note-close{margin-top:20px;border:1px solid #988d7d;background:#e1d8c7;padding:9px 15px;cursor:pointer;color:#39322c}
  canvas{display:block}
</style>
</head>
<body>
<div id="welcome">
  <div class="welcome-inner">
    <h1>RAMSHA ART STUDIO</h1>
    <p class="sub">an interactive gallery of cozy &amp; eerie things</p>
    <input id="name" autocomplete="off" placeholder="Your name" />
    <button id="enter">ENTER GALLERY</button>
    <div id="welcomeMessage"></div>
  </div>
</div>
<div id="loading">PREPARING THE GALLERY…</div>
<div id="hud">WASD · MOUSE LOOK · CLICK A PAINTING</div>
<button id="mute">SOUND ON</button>
<div id="crosshair"></div>
<div id="note"><div class="note-card"><h2 id="noteTitle"></h2><p id="noteText"></p><button class="note-close" id="noteClose">Close</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/* ============================================================
   RAMSHA ART STUDIO — REALISTIC PRIVATE GALLERY
   ------------------------------------------------------------
   IMPORTANT FOR YOUR PAINTINGS:
   Each gallery painting is data-driven. Replace the `img` value
   with your own image path later. You do NOT have to hand-code
   130+ individual painting objects.

   Example:
     { title:'Anemoia', img:'images/anemoia.jpg', size:'large', ... }

   If img is empty, a tasteful temporary canvas is generated.
   ============================================================ */

const THREE = window.THREE;
const $ = id => document.getElementById(id);

/* ---------- WORLD SCALE ---------- */
const HALL_HALF = 2.25;
const HALL_LEN = 118;
const ROOM_W = 11.4;
const ROOM_D = 15.4;
const ROOM_H = 4.15;
const DOOR_W = 2.15;
const DOOR_H = 2.65;
const PLAYER_H = 1.68;
const PLAYER_R = 0.34;
const ROOM_CENTERS = [15, 37, 59, 81, 103];
const ROOM_SIDES = [-1, 1, -1, 1, -1];

const ROOM_CONFIGS = [
  {id:1,name:'The Playroom', side:-1, centerZ:15, theme:'play'},
  {id:2,name:'The Farmhouse', side:1, centerZ:37, theme:'farmhouse'},
  {id:3,name:'The Snow Cottage', side:-1, centerZ:59, theme:'cottage'},
  {id:4,name:'The Neighborhood', side:1, centerZ:81, theme:'neighborhood'},
  {id:5,name:'The Private Gallery', side:-1, centerZ:103, theme:'eerie'}
];

/* ---------- PAINTING DATA ---------- */
function makePlaceholderPaintingData(count, prefix){
  const sizes=['medium','small','medium','small','large','medium','small','medium'];
  const orientations=['landscape','portrait','square','landscape','portrait','landscape','square'];
  return Array.from({length:count},(_,i)=>({
    title:`${prefix} — Study ${String(i+1).padStart(2,'0')}`,
    img:'',
    size:sizes[i%sizes.length],
    orientation:orientations[i%orientations.length],
    story:`A quiet work from ${prefix.toLowerCase()}, intended to reward a slower look.`
  }));
}

// Replace entries in these arrays with your real paintings as you add them.
const LOBBY_1_PAINTINGS = makePlaceholderPaintingData(50,'Playroom Collection');
const LOBBY_2_PAINTINGS = makePlaceholderPaintingData(22,'Farmhouse Collection');
const LOBBY_3_PAINTINGS = makePlaceholderPaintingData(22,'Snow Cottage Collection');
const LOBBY_4_PAINTINGS = makePlaceholderPaintingData(22,'Night Neighborhood Collection');
const LOBBY_5_PAINTINGS = makePlaceholderPaintingData(22,'Private Gallery Collection');

/* ---------- RENDERER ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080a0b);
scene.fog = new THREE.FogExp2(0x0a0c0d,0.0105);

const camera = new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.05,180);
camera.position.set(0,PLAYER_H,2);

const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.94;
renderer.physicallyCorrectLights=true;
document.body.appendChild(renderer.domElement);

const world = new THREE.Group();
scene.add(world);
const colliders=[];
const interactive=[];
const animated=[];
const roomAmbient=[];
let activeRoom=null;

/* ---------- MATERIAL HELPERS ---------- */
function mat(color,rough=.8,metal=0){
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
function texCanvas(w,h,draw,repeatX=1,repeatY=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeatX,repeatY);
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}
function wallpaperTexture(base='#4b262b',gold='#8c7350'){
  return texCanvas(512,1024,(ctx,w,h)=>{
    ctx.fillStyle=base;ctx.fillRect(0,0,w,h);
    for(let x=0;x<w;x+=24){ctx.fillStyle='rgba(15,8,9,.08)';ctx.fillRect(x,0,2,h)}
    for(let i=0;i<75;i++){
      const x=Math.random()*w,y=Math.random()*h;
      ctx.strokeStyle=Math.random()>.65?'rgba(188,157,102,.10)':'rgba(0,0,0,.10)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+4,y+12);ctx.lineTo(x-1,y+25);ctx.stroke();
    }
    ctx.strokeStyle='rgba(211,183,129,.11)';ctx.lineWidth=1;
    for(let y=50;y<h;y+=105){
      for(let x=35;x<w;x+=70){ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.stroke()}
    }
  },2,1);
}
function woodTexture(){
  return texCanvas(512,512,(ctx,w,h)=>{
    ctx.fillStyle='#33231b';ctx.fillRect(0,0,w,h);
    for(let i=0;i<55;i++){
      ctx.strokeStyle=`rgba(${70+Math.random()*35},${42+Math.random()*25},${25+Math.random()*18},${.15+Math.random()*.25})`;
      ctx.lineWidth=1+Math.random()*2;ctx.beginPath();
      let y=Math.random()*h;ctx.moveTo(0,y);
      for(let x=0;x<w;x+=30)ctx.lineTo(x,y+Math.sin(x*.035+i)*5+Math.random()*4);
      ctx.stroke();
    }
  },2,2);
}
function carpetTexture(){
  return texCanvas(512,1024,(ctx,w,h)=>{
    ctx.fillStyle='#34302b';ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(143,114,84,.28)';ctx.fillRect(25,0,18,h);ctx.fillRect(w-43,0,18,h);
    ctx.strokeStyle='rgba(164,137,98,.18)';ctx.lineWidth=3;
    for(let y=18;y<h;y+=32){ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(w-45,y);ctx.stroke()}
    for(let i=0;i<700;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*.035})`;ctx.fillRect(Math.random()*w,Math.random()*h,1,1)}
  },1,8);
}
function rugTexture(){
  return texCanvas(512,512,(ctx,w,h)=>{
    ctx.fillStyle='#5b4537';ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(211,179,131,.25)';ctx.lineWidth=10;ctx.strokeRect(12,12,w-24,h-24);
    ctx.strokeStyle='rgba(40,28,22,.24)';ctx.lineWidth=2;
    for(let x=38;x<w-38;x+=24){ctx.beginPath();ctx.moveTo(x,40);ctx.lineTo(x+10,h-40);ctx.stroke()}
  },2,2);
}
function plasterTexture(base){
  return texCanvas(512,512,(ctx,w,h)=>{
    ctx.fillStyle=base;ctx.fillRect(0,0,w,h);
    for(let i=0;i<1300;i++){
      const a=.02+Math.random()*.08;ctx.fillStyle=`rgba(0,0,0,${a})`;
      ctx.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*3);
    }
  },2,2);
}
function metalMat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.28,metalness:.72});}

const M={
  darkWood:new THREE.MeshStandardMaterial({map:woodTexture(),roughness:.72}),
  oldWood:new THREE.MeshStandardMaterial({map:woodTexture(),roughness:.62}),
  burgundy:new THREE.MeshStandardMaterial({map:wallpaperTexture(),roughness:.94}),
  carpet:new THREE.MeshStandardMaterial({map:carpetTexture(),roughness:1}),
  brass:metalMat(0x80663d),
  darkMetal:metalMat(0x292725),
  cream:mat(0xc8bda9,.9),
  paper:mat(0xe4ddcc,1),
  plaster:mat(0xaaa79c,.95),
  glass:new THREE.MeshPhysicalMaterial({color:0x7c9090,roughness:.12,transmission:.08,transparent:true,opacity:.38}),
  snow:mat(0xdfe6e6,.94),
  black:mat(0x0e0f0e,.78),
  green:mat(0x344038,.88),
  red:mat(0x632d29,.88),
  blue:mat(0x31465a,.9)
};

function box(w,h,d,material, x=0,y=0,z=0){
  const g=new THREE.BoxGeometry(w,h,d);const m=new THREE.Mesh(g,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;world.add(m);return m;
}
function addTo(parent,mesh){parent.add(mesh);mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}
function cylinder(r1,r2,h,material,segments=24){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);m.castShadow=true;m.receiveShadow=true;return m}
function sphere(r,material){const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),material);m.castShadow=true;m.receiveShadow=true;return m}
function addCollider(x1,x2,z1,z2,y1=0,y2=4.2,tag='wall'){colliders.push({x1,x2,z1,z2,y1,y2,tag});}

/* ---------- ARCHITECTURAL HELPERS ---------- */
function addCeilingBeam(z,w=HALL_HALF*2+.18){box(w,.17,.22,M.oldWood,0,4.01,z)}
function addWallPanel(x,z,w,d,h,material=M.darkWood){return box(w,h,d,material,x,h/2,z)}
function addTrim(x,y,z,w,d,axis='x',material=M.brass){
  const t=axis==='x'?box(w,.055,d,material,x,y,z):box(d,.055,w,material,x,y,z);return t;
}
function createPictureLight(x,y,z,rotY=0){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=rotY;
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.28,10),M.brass);arm.rotation.z=Math.PI/2;arm.position.x=.14;g.add(arm);
  const shade=new THREE.Mesh(new THREE.CylinderGeometry(.045,.065,.16,12),mat(0x75654c,.8));shade.rotation.z=Math.PI/2;shade.position.x=.29;g.add(shade);
  const l=new THREE.PointLight(0xffd6a1,.55,3.8,2);l.position.x=.27;g.add(l);
  world.add(g);return {group:g,light:l};
}
function createSconce(x,y,z,rotY=0,intensity=.55){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=rotY;
  const back=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.08,16),M.brass);back.rotation.x=Math.PI/2;g.add(back);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.25,8),M.brass);stem.rotation.z=Math.PI/2;stem.position.x=.12;g.add(stem);
  const shade=new THREE.Mesh(new THREE.ConeGeometry(.10,.18,18,1,true),mat(0xb59b73,.92));shade.rotation.z=-Math.PI/2;shade.position.x=.25;g.add(shade);
  const light=new THREE.PointLight(0xffcf98,intensity,5,2);light.position.x=.27;g.add(light);
  world.add(g);animated.push({type:'flicker',light,base:intensity,phase:Math.random()*10});
  return g;
}
function addDoor(side,z,label){
  const x=side*(HALL_HALF+.025);
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=side>0?Math.PI/2:-Math.PI/2;
  const frame=mat(0x241914,.7);
  addTo(g,boxLocal(.18,3.0,.16,frame,-DOOR_W/2,1.5,0));
  addTo(g,boxLocal(.18,3.0,.16,frame,DOOR_W/2,1.5,0));
  addTo(g,boxLocal(DOOR_W+.18,.18,.16,frame,0,3.0,0));
  const door=boxLocal(DOOR_W,2.88,.09,mat(0x30221b,.86),0,1.44,.03);addTo(g,door);
  for(let i=-1;i<=1;i++)addTo(g,boxLocal(.035,2.4,.025,M.brass,i*.55,1.43,-.025));
  const plaque=boxLocal(1.28,.27,.055,M.brass,0,3.16,-.12);addTo(g,plaque);
  const text=makeTextSprite(label,0x33291e);text.scale.set(.72,.15,1);text.position.set(0,3.16,-.17);g.add(text);
  world.add(g);
  return g;
}
function boxLocal(w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;}
function makeTextSprite(text,color=0x29231d){
  const c=document.createElement('canvas');c.width=512;c.height=96;const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#000';ctx.font='38px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,c.width/2,c.height/2);
  const t=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,color}));return s;
}

/* ---------- HALLWAY ---------- */
function buildHallway(){
  const floor=box(HALL_HALF*2,.14,HALL_LEN,M.oldWood,0,-.07,HALL_LEN/2-1);
  floor.material=new THREE.MeshStandardMaterial({map:carpetTexture(),roughness:1});floor.material.map.repeat.set(1,9);floor.material.map.needsUpdate=true;
  const carpetEdgeL=box(.08,.025,HALL_LEN,M.brass,-1.92,.015,HALL_LEN/2-1);
  const carpetEdgeR=box(.08,.025,HALL_LEN,M.brass,1.92,.015,HALL_LEN/2-1);
  // ceiling
  box(HALL_HALF*2, .16, HALL_LEN, plasterTexture('#817b71'),0,4.15,HALL_LEN/2-1);
  // wainscoting and wallpaper, segmented so room doors interrupt naturally
  const wallMat=new THREE.MeshStandardMaterial({map:wallpaperTexture(),roughness:.97});
  for(const side of [-1,1]){
    box(.14,1.32,HALL_LEN, M.darkWood, side*(HALL_HALF-.07),.66,HALL_LEN/2-1);
    box(.05,2.63,HALL_LEN, wallMat, side*(HALL_HALF-.025),2.0,HALL_LEN/2-1);
    box(.14,.10,HALL_LEN, M.oldWood, side*(HALL_HALF-.08),1.36,HALL_LEN/2-1);
    box(.14,.10,HALL_LEN, M.brass, side*(HALL_HALF-.08),3.63,HALL_LEN/2-1);
    // vertical architectural rhythm
    for(let z=4;z<HALL_LEN-2;z+=8){box(.09,2.25,.09,M.oldWood,side*(HALL_HALF-.11),2.2,z)}
  }
  // block the ends physically
  box(.14,4.1,HALL_HALF*2+.3,M.darkWood,-HALL_HALF-.07,2.05,-1);
  box(.14,4.1,HALL_HALF*2+.3,M.darkWood,HALL_HALF+.07,2.05,-1);
  addCollider(-HALL_HALF-.1,-HALL_HALF+.08,-1.3,0);
  addCollider(HALL_HALF-.08,HALL_HALF+.1,-1.3,0);
  addCollider(-HALL_HALF-.1,HALL_HALF+.1,HALL_LEN-1,HALL_LEN+1);

  for(let z=5;z<HALL_LEN-5;z+=7){
    addCeilingBeam(z);
    const s1=createSconce(-HALL_HALF+.12,2.75,z,Math.PI/2,.48);
    const s2=createSconce(HALL_HALF-.12,2.75,z+3.5,-Math.PI/2,.48);
    // opposite wall artwork prevents the corridor feeling empty
    if(Math.floor(z/7)%2===0){
      createHallPainting(-1,z+1.6);
    }else createHallPainting(1,z+1.6);
  }
  for(const cfg of ROOM_CONFIGS)addDoor(cfg.side,cfg.centerZ,cfg.name);
}
function createHallPainting(side,z){
  const p={title:'Hallway Study',img:'',size:'small',orientation:'portrait',story:'A quiet transitional work in the old corridor.'};
  const g=new THREE.Group();g.position.set(side*(HALL_HALF-.075),2.38,z);g.rotation.y=side>0?-Math.PI/2:Math.PI/2;
  const art=createPaintingMesh(p,.54,.78);g.add(art);world.add(g);interactive.push(art.userData.root);
}

/* ---------- ROOM SHELLS ---------- */
function roomCenterX(cfg){return cfg.side*(HALL_HALF+ROOM_W/2)}
function buildRoomShell(cfg){
  const cx=roomCenterX(cfg), cz=cfg.centerZ, side=cfg.side;
  const floorMat = cfg.theme==='neighborhood'?mat(0x302d28,.92):M.oldWood;
  box(ROOM_W,.14,ROOM_D,floorMat,cx,.0,cz);
  box(ROOM_W,.15,ROOM_D,plasterTexture('#7c7971'),cx,ROOM_H+.02,cz);
  // Outer side, back and segmented hallway wall.
  const innerSideX=cx+side*(ROOM_W/2-.07);
  const outerSideX=cx-side*(ROOM_W/2-.07);
  box(.14,ROOM_H,ROOM_D,M.darkWood,outerSideX,ROOM_H/2,cz);
  box(.14,ROOM_H,ROOM_D,M.darkWood,innerSideX,ROOM_H/2,cz);
  box(ROOM_W,.14,ROOM_H, M.darkWood,cx,ROOM_H/2,cz+ROOM_D/2-.07);
  // ceiling/wall finish
  box(ROOM_W,.12,ROOM_D,plasterTexture('#77746e'),cx,ROOM_H+.02,cz);
  // hallway-facing wall strips leave real doorway
  const wallX=cx-side*(ROOM_W/2-.07);
  const stripLen=(ROOM_D-DOOR_W)/2;
  box(.14,ROOM_H,stripLen,M.darkWood,wallX,ROOM_H/2,cz-(DOOR_W+stripLen)/2);
  box(.14,ROOM_H,stripLen,M.darkWood,wallX,ROOM_H/2,cz+(DOOR_W+stripLen)/2);
  box(.14,ROOM_H-DOOR_H,DOOR_W,M.darkWood,wallX,DOOR_H+(ROOM_H-DOOR_H)/2,cz);
  // plaster/paper interior panels immediately inside the structural wood.
  const innerWallMat = cfg.theme==='eerie'?new THREE.MeshStandardMaterial({map:wallpaperTexture('#3e272b'),roughness:.98}):
    cfg.theme==='play'?plasterTexture('#d0c5ae'):cfg.theme==='neighborhood'?plasterTexture('#b5afa2'):plasterTexture('#a79b89');
  // wall-facing surfaces as thin panels
  box(.025,2.55,stripLen,innerWallMat,wallX+side*.075,2.02,cz-(DOOR_W+stripLen)/2);
  box(.025,2.55,stripLen,innerWallMat,wallX+side*.075,2.02,cz+(DOOR_W+stripLen)/2);
  // side wall interior panel
  box(.025,2.55,ROOM_D,innerWallMat,innerSideX-side*.075,2.02,cz);
  box(ROOM_W,.025,.025,innerWallMat,cx,2.02,cz+ROOM_D/2-.15);
  // baseboards / crown
  for(const sx of [-1,1]){
    box(.09,.17,ROOM_D,M.oldWood,cx+sx*(ROOM_W/2-.15),.12,cz);
    box(.09,.17,ROOM_D,M.oldWood,cx+sx*(ROOM_W/2-.15),3.88,cz);
  }
  box(ROOM_W,.17,.10,M.oldWood,cx,3.88,cz+ROOM_D/2-.15);
  // Collision walls: outer side + back, and front segmented
  addCollider(outerSideX-.08,outerSideX+.08,cz-ROOM_D/2,cz+ROOM_D/2);
  addCollider(innerSideX-.08,innerSideX+.08,cz-ROOM_D/2,cz+ROOM_D/2);
  addCollider(cx-ROOM_W/2,cx+ROOM_W/2,cz+ROOM_D/2-.08,cz+ROOM_D/2+.08);
  addCollider(wallX-.08,wallX+.08,cz-ROOM_D/2,cz-(DOOR_W/2));
  addCollider(wallX-.08,wallX+.08,cz+(DOOR_W/2),cz+ROOM_D/2);
  // header over doorway
  addCollider(wallX-.08,wallX+.08,cz-DOOR_W/2,cz+DOOR_W/2,DOOR_H,ROOM_H+.2,'doorHeader');
}

/* ---------- PAINTING SYSTEM ---------- */
function artCanvasTexture(palette, title){
  return texCanvas(700,520,(ctx,w,h)=>{
    ctx.fillStyle=palette[0];ctx.fillRect(0,0,w,h);
    // painterly abstract placeholder, deliberately muted and non-game-like
    for(let i=0;i<16;i++){
      ctx.fillStyle=palette[1+i%Math.max(1,palette.length-1)];
      ctx.globalAlpha=.25+Math.random()*.35;
      ctx.beginPath();ctx.ellipse(Math.random()*w,Math.random()*h,40+Math.random()*180,25+Math.random()*120,Math.random()*Math.PI,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=.65;ctx.strokeStyle=palette[palette.length-1];ctx.lineWidth=8;
    for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(Math.random()*w,Math.random()*h);ctx.bezierCurveTo(Math.random()*w,Math.random()*h,Math.random()*w,Math.random()*h,Math.random()*w,Math.random()*h);ctx.stroke()}
    ctx.globalAlpha=.7;ctx.fillStyle='rgba(245,235,216,.5)';ctx.font='20px Georgia';ctx.fillText(title.slice(0,28),22,h-25);
    ctx.globalAlpha=1;
  },1,1);
}
function createPaintingMesh(p,w,h){
  let W=w,H=h;
  if(p.orientation==='portrait')H=w*1.34;
  if(p.orientation==='square'){H=w}
  if(p.orientation==='landscape')H=w*.70;
  if(p.size==='large'){W*=1.35;H*=1.35}
  if(p.size==='small'){W*=.72;H*=.72}
  const g=new THREE.Group();
  const frameDepth=.10;
  const frameMat=M.oldWood;
  const frame=new THREE.Mesh(new THREE.BoxGeometry(W+.15,H+.15,frameDepth),frameMat);frame.castShadow=true;g.add(frame);
  const artMat=p.img?new THREE.MeshStandardMaterial({color:0xffffff,roughness:.84}):new THREE.MeshStandardMaterial({map:artCanvasTexture(['#53615b','#826d57','#c1a984','#39444c','#8e5b4b'],p.title),roughness:.92});
  const art=new THREE.Mesh(new THREE.PlaneGeometry(W,H),artMat);art.position.z=.057;art.userData.imagePath=p.img||null;g.add(art);
  if(p.img){new THREE.TextureLoader().load(p.img,t=>{t.encoding=THREE.sRGBEncoding;art.material.map=t;art.material.needsUpdate=true},undefined,()=>{});}
  // inner liner
  const liner=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(W+.04,H+.04,.005)),new THREE.LineBasicMaterial({color:0xb59660,transparent:true,opacity:.52}));liner.position.z=.063;g.add(liner);
  const plaque=new THREE.Mesh(new THREE.BoxGeometry(Math.min(W*.72,.85),.13,.035),M.brass);plaque.position.set(0,-H/2-.12,.04);g.add(plaque);
  const titleSprite=makeTextSprite(p.title,0x2a241c);titleSprite.scale.set(Math.min(W*.68,.75),.11,1);titleSprite.position.set(0,-H/2-.12,.07);g.add(titleSprite);
  g.userData.root=g;g.userData.painting=p;g.userData.title=p.title;g.userData.story=p.story;
  g.traverse(o=>{o.userData.root=g});
  return g;
}
function addPaintingAt(parent,p,pos,rotY){
  const g=createPaintingMesh(p,.92,.65);g.position.copy(pos);g.rotation.y=rotY;parent.add(g);interactive.push(g);return g;
}
function layoutWallPaintings(cfg, paintings, wall, opts={}){
  // wall: {axis:'x'|'z', fixed, start, end, y, rotationY}
  // This packs a large number of real-world-sized pictures in multiple rows.
  const usableStart=wall.start, usableEnd=wall.end;
  const total=usableEnd-usableStart;
  let idx=0;
  const rows=opts.rows||2;
  const rowYs=rows===3?[1.48,2.42,3.12]:[1.48,2.43];
  for(let r=0;r<rows && idx<paintings.length;r++){
    const remaining=paintings.length-idx;
    const count=Math.ceil(remaining/(rows-r));
    const gap=opts.gap||.18;
    const baseW=total/count-gap;
    for(let j=0;j<count && idx<paintings.length;j++,idx++){
      const p=paintings[idx];
      const sizeScale=p.size==='large'?1.34:p.size==='small'?.70:1;
      const W=Math.max(.46,Math.min(1.55,baseW*sizeScale));
      const H=p.orientation==='portrait'?W*1.34:p.orientation==='square'?W:W*.70;
      const x=usableStart+(j+.5)*(total/count);
      const pos=wall.axis==='x'?new THREE.Vector3(x,rowYs[r],wall.fixed):new THREE.Vector3(wall.fixed,rowYs[r],x);
      const g=createPaintingMesh(p,W,H);
      g.position.copy(pos);g.rotation.y=wall.rotationY||0;world.add(g);interactive.push(g);
      // picture light above selected pieces, not every frame
      if(j%2===0 && rowYs[r]>2){
        const lightPos=pos.clone();
        if(wall.axis==='x')lightPos.z+=wall.rotationY?-.12:.12;else lightPos.x+=wall.rotationY?-.12:.12;
        createPictureLight(lightPos.x,rowYs[r]+H/2+.18,lightPos.z,wall.rotationY||0);
      }
    }
  }
  return idx;
}
function layoutRoomGallery(cfg, paintings, reserved=[]){
  const cx=roomCenterX(cfg),cz=cfg.centerZ,s=cfg.side;
  const innerX=cx+s*(ROOM_W/2-.16);
  const outerX=cx-s*(ROOM_W/2-.16);
  const frontX=cx-s*(ROOM_W/2-.16);
  // Use outer side, back, and remaining hallway-facing wall sections.
  let i=0;
  // Side wall: long wall, strongest salon display
  i+=layoutWallPaintings(cfg,paintings.slice(i,i+10),{axis:'z',fixed:innerX,start:cz-ROOM_D/2+1.0,end:cz+ROOM_D/2-1.0,rotationY:s>0?-Math.PI/2:Math.PI/2},{rows:2,gap:.22});
  // Opposite side wall
  if(i<paintings.length)i+=layoutWallPaintings(cfg,paintings.slice(i,i+8),{axis:'z',fixed:outerX,start:cz-ROOM_D/2+1.0,end:cz+ROOM_D/2-1.0,rotationY:s>0?Math.PI/2:-Math.PI/2},{rows:2,gap:.22});
  // Back wall
  if(i<paintings.length)i+=layoutWallPaintings(cfg,paintings.slice(i,i+8),{axis:'x',fixed:cz+ROOM_D/2-.16,start:cx-ROOM_W/2+1.0,end:cx+ROOM_W/2-1.0,rotationY:Math.PI},{rows:2,gap:.22});
  // Door wall: only side strips, deliberately split around entrance.
  const leftStart=cx-ROOM_W/2+1.0,leftEnd=cx-DOOR_W/2-.45;
  const rightStart=cx+DOOR_W/2+.45,rightEnd=cx+ROOM_W/2-1.0;
  const rem=paintings.length-i;
  if(rem>0 && leftEnd>leftStart+.8){
    const take=Math.min(4,rem);i+=layoutWallPaintings(cfg,paintings.slice(i,i+take),{axis:'x',fixed:frontX,start:leftStart,end:leftEnd,rotationY:s>0?Math.PI/2:-Math.PI/2},{rows:1,gap:.18});
  }
  if(i<paintings.length && rightEnd>rightStart+.8){
    const take=Math.min(4,paintings.length-i);i+=layoutWallPaintings(cfg,paintings.slice(i,i+take),{axis:'x',fixed:frontX,start:rightStart,end:rightEnd,rotationY:s>0?Math.PI/2:-Math.PI/2},{rows:1,gap:.18});
  }
  // If a room has many more paintings than the four-wall first pass can comfortably take,
  // use a second, slightly lower salon row on the long side walls.
  if(i<paintings.length){
    const extra=paintings.slice(i);
    const half=Math.ceil(extra.length/2);
    i+=layoutWallPaintings(cfg,extra.slice(0,half),{axis:'z',fixed:innerX,start:cz-ROOM_D/2+1.3,end:cz+ROOM_D/2-1.3,rotationY:s>0?-Math.PI/2:Math.PI/2},{rows:1,gap:.18});
    if(i<paintings.length)i+=layoutWallPaintings(cfg,paintings.slice(i),{axis:'z',fixed:outerX,start:cz-ROOM_D/2+1.3,end:cz+ROOM_D/2-1.3,rotationY:s>0?Math.PI/2:-Math.PI/2},{rows:1,gap:.18});
  }
}

  for(let i=0;i<5;i++){
    const sh=new THREE.Shape();sh.moveTo(-.18,0);sh.quadraticCurveTo(-.25,.45,-.05,.72);sh.quadraticCurveTo(.08,1.05,.22,1.42);sh.quadraticCurveTo(.40,.85,.27,.42);sh.quadraticCurveTo(.18,.15,.18,0);sh.closePath();
    const f=new THREE.Mesh(new THREE.ShapeGeometry(sh),flameMat.clone());f.position.set((i-2)*.14,.67,.10+i*.012);f.scale.set(.8+Math.random()*.45,.72+Math.random()*.4,1);g.add(f);animated.push({type:'flame',mesh:f,baseX:f.position.x,baseY:f.position.y,phase:Math.random()*8,scale:f.scale.clone()});

/* ---------- ROOM 1: PLAY AREA ---------- */
function buildPlayroom(cfg){
  const cx=roomCenterX(cfg),cz=cfg.centerZ,s=cfg.side;
  const floor=box(ROOM_W-.3,.08,ROOM_D-.3,mat(0x6b675e,.93),cx,.08,cz);

    const t=box(1.72,.035,1.72,tileMat,cx-4.3+ix*1.72,.13,cz-6.3+iz*1.72);t.material=tileMat;
  }
  // ball pit
  const pitX=cx+s*1.9,pitZ=cz+3.0;

  box(3.4,.45,.25,pitMat,pitX,.42,pitZ-1.7);box(3.4,.45,.25,pitMat,pitX,.42,pitZ+1.7);box(.25,.45,3.4,pitMat,pitX-1.7,.42,pitZ);box(.25,.45,3.4,pitMat,pitX+1.7,.42,pitZ);

  const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,.6,.34,20,false),mat(0x66777a,.72));tube.castShadow=true;tube.receiveShadow=true;world.add(tube);
  const platform=box(1.55,.25,1.35,mat(0x72614c,.86),cx-s*1.7,2.35,cz-3.9);world.add(platform);

  for(let i=0;i<4;i++){const a=i*Math.PI/2;const st=cylinder(.20,.20,.48,soft,20);st.position.set(cx-s*3.2+Math.cos(a)*1.0,.26,cz-2+Math.sin(a)*.75);world.add(st)}
  // balloons with strings, hanging in natural clusters

  for(let i=0;i<14;i++){
    const g=new THREE.Group();g.position.set(cx+(Math.random()-.5)*7.4,3.1+Math.random()*.65,cz+(Math.random()-.5)*6.6);
    const b=sphere(.18+Math.random()*.07,mat(balloonColors[i%4],.55));b.scale.set(.82,1.18,.82);g.add(b);
    const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-.20,0),new THREE.Vector3((Math.random()-.5)*.18,-1.3,0)]),new THREE.LineBasicMaterial({color:0x6e655b,transparent:true,opacity:.65}));g.add(line);world.add(g);animated.push({type:'balloon',group:g,baseY:g.position.y,phase:Math.random()*10});
  }

/* ---------- OUTDOOR WIRES BETWEEN POLES ---------- */
function addNeighborhoodWires(){
  // Poles are located in the exterior groups; add a few correctly sagging spans globally.
  // They are intentionally subtle and disappear into fog rather than looking like floating neon lines.
  const z=ROOM_CONFIGS[3].centerZ;const cfg=ROOM_CONFIGS[3];const cx=roomCenterX(cfg),rot=cfg.side>0?Math.PI/2:-Math.PI/2;
  const g=new THREE.Group();g.position.set(cx+cfg.side*5.5,1.8,z+2);g.rotation.y=rot;
  const wireMat=new THREE.LineBasicMaterial({color:0x161718,transparent:true,opacity:.75});
  const poles=[new THREE.Vector3(-7,1.1,0),new THREE.Vector3(2.5,1.1,0),new THREE.Vector3(8.7,1.1,0)];
  [[0,1],[1,2]].forEach(pair=>{
    const a=poles[pair[0]].clone();const b=poles[pair[1]].clone();a.y=4.8;b.y=4.75;
    const mid=a.clone().lerp(b,.5);mid.y-=.65;
    const c=new THREE.CatmullRomCurve3([a,mid,b]);const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(c.getPoints(20)),wireMat);g.add(line);
  });
  world.add(g);
}

/* ---------- COLLISION / PLAYER ---------- */
let controlsLocked=false;
const keys={};
let yaw=0,pitch=0;
const player=new THREE.Vector3(0,PLAYER_H,2);
function isInsideRect(x,z,c){return x>c.x1&&x<c.x2&&z>c.z1&&z<c.z2}
function pointCollides(x,z){
  // corridor envelope, with room doorway transitions
  const inHall=x>=-HALL_HALF+PLAYER_R && x<=HALL_HALF-PLAYER_R && z>=0 && z<=HALL_LEN-1;
  let inRoom=false;
  for(const cfg of ROOM_CONFIGS){
    const cx=roomCenterX(cfg),cz=cfg.centerZ,s=cfg.side;
    const minX=cx-ROOM_W/2+PLAYER_R,maxX=cx+ROOM_W/2-PLAYER_R;
    const minZ=cz-ROOM_D/2+PLAYER_R,maxZ=cz+ROOM_D/2-PLAYER_R;
    if(x>minX&&x<maxX&&z>minZ&&z<maxZ)inRoom=true;
    // prevent crossing side wall except doorway: movement can enter the room only in doorway interval.
    const wallX=cx-s*ROOM_W/2;
    if(Math.abs(x-wallX)<PLAYER_R+.08 && Math.abs(z-cz)>DOOR_W/2+.06 && z>minZ&&z<maxZ)return true;
  }
  if(!inHall&&!inRoom)return true;
  for(const c of colliders){if(isInsideRect(x,z,c))return true}
  // Room objects that should be solid are approximated selectively by colliders below.
  return false;
}
function resolveMove(dx,dz){
  let nx=player.x+dx,nz=player.z+dz;
  if(!pointCollides(nx,player.z))player.x=nx;
  if(!pointCollides(player.x,nz))player.z=nz;
}
function updatePlayer(dt){
  if(!controlsLocked)return;
  const speed=2.35;
  let f=0,r=0;if(keys.KeyW)f+=1;if(keys.KeyS)f-=1;if(keys.KeyD)r+=1;if(keys.KeyA)r-=1;
  if(!f&&!r)return;
  const len=Math.hypot(f,r);f/=len;r/=len;
  const dx=(Math.sin(yaw)*f+Math.cos(yaw)*r)*speed*dt;
  const dz=(Math.cos(yaw)*f-Math.sin(yaw)*r)*speed*dt;
  resolveMove(dx,dz);
  camera.position.set(player.x,PLAYER_H,player.z);
  footstepTimer-=dt;if(footstepTimer<=0){footstep();footstepTimer=.42}
}
let footstepTimer=0;

/* ---------- AUDIO ---------- */
let audio=null,audioOn=true;
function startAudio(){
  if(audio)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ctx=new AC();audio={ctx,master:ctx.createGain(),drone:null};audio.master.gain.value=.055;audio.master.connect(ctx.destination);
  const osc=ctx.createOscillator();const gain=ctx.createGain();osc.type='sine';osc.frequency.value=47;gain.gain.value=.22;osc.connect(gain).connect(audio.master);osc.start();audio.drone=osc;
}
function noiseBurst(duration=.035,amp=.035,filterFreq=900){if(!audio||!audioOn)return;const ctx=audio.ctx,b=ctx.createBuffer(1,ctx.sampleRate*duration,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='lowpass';f.frequency.value=filterFreq;g.gain.value=amp;s.buffer=b;s.connect(f).connect(g).connect(audio.master);s.start()}
function footstep(){noiseBurst(.045,.018,750)}
function roomAmbience(){if(!audio||!audioOn)return;const z=player.z;let room='hall';for(const c of ROOM_CONFIGS){const cx=roomCenterX(c);if(player.x>cx-ROOM_W/2&&player.x<cx+ROOM_W/2&&z>c.centerZ-ROOM_D/2&&z<c.centerZ+ROOM_D/2)room=c.theme}if(room==='farmhouse'||room==='cottage')noiseBurst(.08,.012,500);else if(room==='neighborhood')noiseBurst(.09,.008,1100);else if(room==='eerie')noiseBurst(.07,.010,320);}

const raycaster=new THREE.Raycaster();const mouse=new THREE.Vector2(0,0);
function showPainting(p){$('noteTitle').textContent=p.title;$('noteText').textContent=p.story||'';$('note').style.display='flex'}
$('noteClose').onclick=()=>{$('note').style.display='none'};

  raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(interactive,true);if(hits.length){let o=hits[0].object;while(o&&!o.userData.painting)o=o.parent;if(o&&o.userData.painting)showPainting(o.userData.painting)}
});
document.addEventListener('pointerlockchange',()=>{controlsLocked=document.pointerLockElement===renderer.domElement;if(controlsLocked){$('crosshair').style.display='block';$('hud').style.display='block'}else{$('crosshair').style.display='none'}});
document.addEventListener('mousemove',e=>{if(!controlsLocked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0018;pitch=Math.max(-1.35,Math.min(1.35,pitch));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch});
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape')document.exitPointerLock()});addEventListener('keyup',e=>keys[e.code]=false);
$('mute').onclick=()=>{audioOn=!audioOn;$('mute').textContent=audioOn?'SOUND ON':'SOUND OFF';if(audio){audio.master.gain.value=audioOn?.055:0}};

/* ---------- ANIMATION ---------- */
let last=performance.now(),roomTimer=0;
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;updatePlayer(dt);roomTimer-=dt;if(roomTimer<=0){roomAmbience();roomTimer=1.4}
  const t=now*.001;
  for(const a of animated){
    if(a.type==='flicker'){a.light.intensity=a.base*(.92+Math.sin(t*8+a.phase)*.05+Math.sin(t*17+a.phase)*.025)}
    if(a.type==='firelight'){a.light.intensity=a.base*(.78+Math.sin(t*11+a.phase)*.12+Math.sin(t*23+a.phase)*.07)}
    if(a.type==='flame'){a.mesh.position.x=a.baseX+Math.sin(t*9+a.phase)*.025;a.mesh.position.y=a.baseY+Math.sin(t*7+a.phase)*.035;a.mesh.scale.y=a.scale.y*(.94+Math.sin(t*10+a.phase)*.12)}
    if(a.type==='balloon'){a.group.rotation.z=Math.sin(t*.65+a.phase)*.035;a.group.position.y=a.baseY+Math.sin(t*.8+a.phase)*.018}
    if(a.type==='snow'){a.points.position.y=a.baseY+Math.sin(t*.3+a.phase)*.04}
    if(a.type==='rain'){a.points.rotation.z=Math.sin(t*.5+a.phase)*.01}
  }
  renderer.render(scene,camera);
}

/* ---------- WELCOME / INIT ---------- */
$('enter').addEventListener('click',()=>{
  const name=($('name').value||'friend').trim();
  $('welcomeMessage').textContent=`Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;
  $('loading').style.display='flex';
  startAudio();
  setTimeout(()=>{
    $('loading').style.display='none';
    $('welcome').style.display='none';
    $('mute').style.display='block';
    renderer.domElement.requestPointerLock();
  },450);
});
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

/* ---------- BUILD ---------- */
try{buildGallery();}catch(err){console.error('Gallery build error:',err);}
animate(performance.now());
</script>
</body>
