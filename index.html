<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
'use strict';

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,220);
camera.position.set(0,1.68,5);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:'high-performance'
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const HALL_HALF=1.4;
const HALL_LENGTH=132;
const ROOM_W=15;
const ROOM_L=24;
const ROOM_H=4.8;
const DOOR_HALF=1.62;

const lobbyCenters=[18,43,68,93,118];

const lobbyInfo=[
  {name:'LOBBY 1 · ABANDONED CINEMA',side:-1,type:'cinema'},
  {name:'LOBBY 2 · COZY COTTAGE',side:1,type:'cottage'},
  {name:'LOBBY 3 · SNOWY RURAL NIGHT',side:-1,type:'snow'},
  {name:'LOBBY 4 · RESIDENTIAL STREET',side:1,type:'street'},
  {name:'LOBBY 5 · VICTORIAN ROOM',side:-1,type:'horror'}
];

/* ------------------------------------------------------------
   GLOBAL LIGHTING
   ------------------------------------------------------------ */

scene.background=new THREE.Color(0x171519);

scene.add(
  new THREE.HemisphereLight(
    0x9ba0aa,
    0x261c1d,
    .72
  )
);

scene.add(
  new THREE.AmbientLight(
    0x7a6971,
    .31
  )
);

const atmos={
  hall:{
    color:0x201a1e,
    density:.00072
  },
  cinema:{
    color:0x18202a,
    density:.00145
  },
  cottage:{
    color:0x231b18,
    density:.00052
  },
  snow:{
    color:0x536b86,
    density:.00125
  },
  street:{
    color:0x22303b,
    density:.00105
  },
  horror:{
    color:0x24191e,
    density:.00175
  }
};

scene.fog=new THREE.FogExp2(
  atmos.hall.color,
  atmos.hall.density
);

let targetFogColor=
  new THREE.Color(atmos.hall.color);

let targetFogDensity=
  atmos.hall.density;

function setAtmosphere(key){
  const a=atmos[key]||atmos.hall;

  targetFogColor.set(a.color);
  targetFogDensity=a.density;

  scene.fog.color.lerp(
    targetFogColor,
    .035
  );

  scene.fog.density+=
    (targetFogDensity-scene.fog.density)*.035;

  scene.background.lerp(
    targetFogColor,
    .02
  );
}

/* ------------------------------------------------------------
   DETERMINISTIC RANDOM
   ------------------------------------------------------------ */

function rng(seed){
  let s=(seed>>>0)||1;

  return()=>{
    s=(s*1664525+1013904223)>>>0;
    return s/4294967296;
  };
}

/* ------------------------------------------------------------
   PROCEDURAL MATERIALS
   ------------------------------------------------------------ */

function tex(c,rx=1,ry=1){
  const t=new THREE.CanvasTexture(c);

  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx,ry);
  t.anisotropy=
    Math.min(
      renderer.capabilities.getMaxAnisotropy(),
      8
    );

  t.encoding=THREE.sRGBEncoding;

  return t;
}

function noiseCanvas(
  seed,
  w,
  h,
  base
){
  const r=rng(seed);

  const c=document.createElement('canvas');
  c.width=w;
  c.height=h;

  const x=c.getContext('2d');

  x.fillStyle=base;
  x.fillRect(0,0,w,h);

  for(let i=0;i<w*h/55;i++){

    x.fillStyle=
      `rgba(255,255,255,${.006+r()*.025})`;

    x.fillRect(
      r()*w,
      r()*h,
      1+r()*2,
      1+r()*2
    );
  }

  return{c,x,r};
}

function wallpaper(
  seed,
  base='#76645c',
  accent='#4b3c3f'
){
  const {c,x,r}=noiseCanvas(
    seed,
    512,
    512,
    base
  );

  for(
    let yy=12;
    yy<512;
    yy+=60
  ){
    for(
      let xx=0;
      xx<512;
      xx+=46
    ){
      x.strokeStyle=
        'rgba(62,45,45,.12)';

      x.lineWidth=1;
      x.beginPath();

      x.moveTo(xx,yy);

      x.quadraticCurveTo(
        xx+12,
        yy+12,
        xx,
        yy+24
      );

      x.quadraticCurveTo(
        xx-12,
        yy+12,
        xx,
        yy
      );

      x.stroke();
    }
  }

  for(let i=0;i<15;i++){

    const px=r()*512;
    const py=r()*512;

    x.fillStyle=
      `rgba(52,40,40,${.018+r()*.035})`;

    x.beginPath();

    x.ellipse(
      px,
      py,
      7+r()*28,
      3+r()*13,
      r()*Math.PI,
      0,
      Math.PI*2
    );

    x.fill();
  }

  x.fillStyle=accent;
  x.globalAlpha=.025;
  x.fillRect(0,0,512,512);
  x.globalAlpha=1;

  return tex(c,2.2,2.3);
}

function wood(seed,dark=false){

  const {c,x,r}=noiseCanvas(
    seed,
    512,
    512,
    dark?'#392820':'#76553b'
  );

  for(let i=0;i<38;i++){

    const yy=i*14+r()*8;

    x.strokeStyle=
      dark
      ?'rgba(10,7,6,.22)'
      :'rgba(32,19,13,.18)';

    x.lineWidth=
      1+r()*1.5;

    x.beginPath();

    let xx=-20;

    x.moveTo(xx,yy);

    while(xx<540){

      xx+=20+r()*35;

      x.lineTo(
        xx,
        yy+Math.sin(xx*.028+i)*3
      );
    }

    x.stroke();
  }

  for(let i=0;i<10;i++){

    x.strokeStyle=
      'rgba(16,10,7,.14)';

    x.lineWidth=2;

    x.beginPath();

    x.ellipse(
      r()*512,
      r()*512,
      8+r()*17,
      2+r()*5,
      r()*Math.PI,
      0,
      Math.PI*2
    );

    x.stroke();
  }

  return tex(c,2,4);
}

function fabric(seed,base){

  const {c,x,r}=noiseCanvas(
    seed,
    256,
    256,
    base
  );

  for(let i=0;i<1500;i++){

    x.fillStyle=
      `rgba(240,232,220,${.01+r()*.025})`;

    x.fillRect(
      r()*256,
      r()*256,
      1,
      1
    );
  }

  return tex(c,3,3);
}

function rug(
  seed,
  base='#4b2d35'
){

  const {c,x,r}=noiseCanvas(
    seed,
    512,
    512,
    base
  );

  x.strokeStyle=
    'rgba(199,163,122,.24)';

  x.lineWidth=5;

  x.strokeRect(
    22,
    22,
    468,
    468
  );

  x.lineWidth=2;

  x.strokeRect(
    42,
    42,
    428,
    428
  );

  for(let i=0;i<11;i++){

    const m=58+i*13;

    x.strokeStyle=
      `rgba(214,171,125,${.04+r()*.06})`;

    x.strokeRect(
      m,
      m,
      512-m*2,
      512-m*2
    );
  }

  return tex(c,1,2);
}

function brick(seed){

  const {c,x,r}=noiseCanvas(
    seed,
    512,
    512,
    '#755649'
  );

  const bw=70;
  const bh=28;

  for(
    let yy=0;
    yy<512;
    yy+=bh
  ){

    const off=
      (yy/bh%2)*35;

    for(
      let xx=-bw;
      xx<560;
      xx+=bw
    ){

      x.strokeStyle=
        'rgba(40,25,22,.42)';

      x.lineWidth=3.5;

      x.strokeRect(
        xx-off,
        yy,
        bw,
        bh
      );

      x.fillStyle=
        `rgba(225,189,159,${.01+r()*.04})`;

      x.fillRect(
        xx-off+4,
        yy+4,
        bw-8,
        bh-8
      );
    }
  }

  return tex(c,2.2,2.3);
}

const M={

  wall:new THREE.MeshStandardMaterial({
    map:wallpaper(4),
    roughness:.95
  }),

  wall2:new THREE.MeshStandardMaterial({
    map:wallpaper(
      15,
      '#685b58',
      '#3f3639'
    ),
    roughness:.97
  }),

  wood:new THREE.MeshStandardMaterial({
    map:wood(5),
    roughness:.90
  }),

  darkWood:new THREE.MeshStandardMaterial({
    map:wood(9,true),
    roughness:.95
  }),

  brass:new THREE.MeshStandardMaterial({
    color:0x9f7a45,
    metalness:.72,
    roughness:.31
  }),

  blackMetal:new THREE.MeshStandardMaterial({
    color:0x1a1918,
    metalness:.72,
    roughness:.64
  }),

  burgundy:new THREE.MeshStandardMaterial({
    map:fabric(7,'#4b1f2a'),
    roughness:.98
  }),

  oliveFabric:new THREE.MeshStandardMaterial({
    map:fabric(18,'#5a594d'),
    roughness:.98
  }),

  leather:new THREE.MeshStandardMaterial({
    map:fabric(23,'#3d2a22'),
    roughness:.93
  }),

  rug:new THREE.MeshStandardMaterial({
    map:rug(8),
    roughness:1
  }),

  rugBlue:new THREE.MeshStandardMaterial({
    map:rug(41,'#2a3a4a'),
    roughness:1
  }),

  brick:new THREE.MeshStandardMaterial({
    map:brick(3),
    roughness:1
  }),

  stone:new THREE.MeshStandardMaterial({
    color:0x766f63,
    roughness:1
  }),

  paper:new THREE.MeshStandardMaterial({
    color:0xd9d0bf,
    roughness:.92
  }),

  glass:new THREE.MeshStandardMaterial({
    color:0x8da4ac,
    roughness:.18,
    transparent:true,
    opacity:.32
  }),

  darkGlass:new THREE.MeshStandardMaterial({
    color:0x171a20,
    roughness:.16,
    metalness:.1,
    transparent:true,
    opacity:.42
  }),

  asphalt:new THREE.MeshStandardMaterial({
    color:0x292c2f,
    roughness:.97
  }),

  concrete:new THREE.MeshStandardMaterial({
    color:0x6f6e6b,
    roughness:1
  }),

  snow:new THREE.MeshStandardMaterial({
    color:0xe6ebef,
    roughness:1
  }),

  foliage:new THREE.MeshStandardMaterial({
    color:0x2c392e,
    roughness:1
  })
};

function materialColor(
  c,
  roughness=.8,
  emissive=0,
  ei=0
){
  return new THREE.MeshStandardMaterial({
    color:c,
    roughness,
    emissive,
    emissiveIntensity:ei
  });
}

/* ------------------------------------------------------------
   GEOMETRY
   ------------------------------------------------------------ */

function box(
  x,y,z,
  sx,sy,sz,
  material,
  parent=scene,
  cast=true,
  receive=true
){
  const m=new THREE.Mesh(
    new THREE.BoxGeometry(
      sx,
      sy,
      sz
    ),
    material
  );

  m.position.set(x,y,z);
  m.castShadow=cast;
  m.receiveShadow=receive;

  parent.add(m);

  return m;
}

function cyl(
  x,y,z,
  r,h,
  material,
  segments=16,
  parent=scene,
  rot={}
){
  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(
      r,
      r,
      h,
      segments
    ),
    material
  );

  m.position.set(x,y,z);

  m.rotation.set(
    rot.x||0,
    rot.y||0,
    rot.z||0
  );

  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}

function sphere(
  x,y,z,
  r,
  material,
  parent=scene
){
  const m=new THREE.Mesh(
    new THREE.SphereGeometry(
      r,
      18,
      12
    ),
    material
  );

  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}

function line(
  a,b,
  r,
  material,
  parent=scene
){
  const dx=b.x-a.x;
  const dy=b.y-a.y;
  const dz=b.z-a.z;

  const len=
    Math.hypot(
      dx,
      dy,
      dz
    );

  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(
      r,
      r,
      len,
      7
    ),
    material
  );

  m.position.set(
    (a.x+b.x)/2,
    (a.y+b.y)/2,
    (a.z+b.z)/2
  );

  m.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(
      dx,
      dy,
      dz
    ).normalize()
  );

  m.castShadow=true;

  parent.add(m);

  return m;
}

/* ------------------------------------------------------------
   COLLISIONS
   ------------------------------------------------------------ */

const colliders=[];

function addCollider(
  x1,x2,
  z1,z2
){
  colliders.push({
    minX:Math.min(x1,x2),
    maxX:Math.max(x1,x2),
    minZ:Math.min(z1,z2),
    maxZ:Math.max(z1,z2)
  });
}

function hitCircleBox(
  x,z,r,b
){
  return(
    x+r>b.minX &&
    x-r<b.maxX &&
    z+r>b.minZ &&
    z-r<b.maxZ
  );
}

function canMove(x,z){

  const pr=.27;

  if(
    x<-(HALL_HALF+ROOM_W-.42) ||
    x>(HALL_HALF+ROOM_W-.42) ||
    z<.7 ||
    z>HALL_LENGTH-.65
  ){
    return false;
  }

  for(const c of colliders){

    if(
      hitCircleBox(
        x,
        z,
        pr,
        c
      )
    ){
      return false;
    }
  }

  return true;
}

/* ------------------------------------------------------------
   HALLWAY
   ------------------------------------------------------------ */

box(
  0,
  -.08,
  HALL_LENGTH/2,
  2*HALL_HALF,
  .16,
  HALL_LENGTH,
  M.wood,
  scene,
  false,
  true
);

box(
  0,
  .005,
  HALL_LENGTH/2,
  1.58,
  .035,
  HALL_LENGTH-.2,
  M.rug,
  scene,
  false,
  true
);

for(
  let z=.8;
  z<HALL_LENGTH;
  z+=2.8
){

  box(
    -1.03,
    .01,
    z,
    .68,
    .028,
    .045,
    M.darkWood,
    scene,
    false,
    true
  );

  box(
    1.03,
    .01,
    z+.6,
    .68,
    .028,
    .045,
    M.darkWood,
    scene,
    false,
    true
  );
}

function hallwayWall(side){

  const x=side*HALL_HALF;

  const opens=
    lobbyInfo
      .map(
        (v,i)=>
          v.side===side
            ?lobbyCenters[i]
            :null
      )
      .filter(
        v=>v!==null
      );

  let cursor=0;

  for(const z of opens){

    const a=z-DOOR_HALF;
    const b=z+DOOR_HALF;

    if(a>cursor){

      box(
        x,
        ROOM_H/2,
        (cursor+a)/2,
        .16,
        ROOM_H,
        a-cursor,
        M.wall,
        scene,
        false,
        true
      );

      addCollider(
        x-.08,
        x+.08,
        cursor,
        a
      );
    }

    doorHeader(side,z);

    cursor=b;
  }

  if(cursor<HALL_LENGTH){

    box(
      x,
      ROOM_H/2,
      (cursor+HALL_LENGTH)/2,
      .16,
      ROOM_H,
      HALL_LENGTH-cursor,
      M.wall,
      scene,
      false,
      true
    );

    addCollider(
      x-.08,
      x+.08,
      cursor,
      HALL_LENGTH
    );
  }
}

function doorHeader(
  side,
  z
){

  const x=side*HALL_HALF;

  box(
    x-side*.10,
    3.88,
    z,
    .28,
    .18,
    3.55,
    M.darkWood
  );

  box(
    x-side*.10,
    1.93,
    z-DOOR_HALF-.06,
    .28,
    3.78,
    .22,
    M.wood
  );

  box(
    x-side*.10,
    1.93,
    z+DOOR_HALF+.06,
    .28,
    3.78,
    .22,
    M.wood
  );

  box(
    x-side*.10,
    .10,
    z,
    .26,
    .11,
    3.54,
    M.darkWood
  );

  sphere(
    x+side*.015,
    1.55,
    z-1.39,
    .055,
    M.brass
  );
}

hallwayWall(-1);
hallwayWall(1);

box(
  0,
  4.72,

/* Important: wallSide controls which way the artwork faces.
   The old version rotated the paintings incorrectly, making
   many of them effectively edge-on. */

function addPainting(
  parent,
  wallSide,
  x,
  y,
  z,
  seed,
  scale=1,
  note='A quiet night scene from the collection.'
){

  const width=
    1.10*scale;

  const height=
    1.34*scale;

  const th=
    .08*scale;

  const plane=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        width,
        height
      ),
      new THREE.MeshStandardMaterial({
        map:artTexture(seed),
        roughness:.78,
        side:THREE.FrontSide
      })
    );

  plane.position.set(
    x+wallSide*.018,
    y,
    z
  );

  plane.rotation.y=
    wallSide===1
      ?Math.PI/2
      :-Math.PI/2;

  plane.castShadow=true;
  plane.receiveShadow=true;

  parent.add(plane);

  const frameMat=
    seed%4===0
      ?M.brass
      :M.darkWood;

  /* Properly dimensioned frame pieces.
     No rotation is necessary because the wall is an X plane. */

  box(
    x+wallSide*.055,
    y+height/2+.035,
    z,
    th+.10,
    .07,
    width+.12,
    frameMat,
    parent
  );

  box(
    x+wallSide*.055,
    y-height/2-.035,
    z,
    th+.10,
    .07,
    width+.12,
    frameMat,
    parent
  );

  box(
    x+wallSide*.055,
    y,
    z+width/2+.035,
    th+.10,
    height+.12,
    .07,
    frameMat,
    parent
  );

  box(
    x+wallSide*.055,
    y,
    z-width/2-.035,
    th+.10,
    height+.12,
    .07,
    frameMat,
    parent
  );

  /* tiny hanging wire */
  line(
    new THREE.Vector3(
      x+wallSide*.06,
      y+height/2+.08,
      z
    ),
    new THREE.Vector3(
      x+wallSide*.09,
      y+height/2+.30,
      z
    ),
    .009,
    M.blackMetal,
    parent
  );

  plane.userData.title=
    artTitles[
      (seed-1)%artTitles.length
    ];

  plane.userData.note=note;

  clickable.push(plane);

  return plane;
}

    cx,
    4.45,
    b-.10,
    ROOM_W,
    .17,
    .12,
    M.wood,
    g,
    false,
    true
  );

  addCollider(
    outer-side*.10,
    outer+side*.02,
    a,
    b
  );

  addCollider(
    Math.min(
      cx-ROOM_W/2,
      cx+ROOM_W/2
    ),
    Math.max(
      cx-ROOM_W/2,
      cx+ROOM_W/2
    ),
    a-.10,
    a+.10
  );

  addCollider(
    Math.min(
      cx-ROOM_W/2,
      cx+ROOM_W/2
    ),
    Math.max(
      cx-ROOM_W/2,
      cx+ROOM_W/2
    ),
    b-.10,
    b+.10
  );

  return{
    g,
    center,
    side,
    inner,
    outer,
    cx,
    a,
    b,
    ceiling
  };
}

function cinema(room){

  const g=room.g;

  const floor=

        ROOM_W-.2,

  floor.rotation.x=
    -Math.PI/2;

  floor.position.set(
    room.cx,
    .01,
    room.center
  );

  g.add(floor);

  /* foyer */

  const foyer=
    room.a+4;

  box(
    room.inner+s*.78,
    1.15,
    foyer,
    1.35,
    2.3,
    3.0,
    M.darkWood,
    g
  );

  box(
    room.inner+s*.83,
    1.85,
    foyer,
    .08,
    .75,
    2.0,
    materialColor(
      0x252126,
      .72
    ),
    g,
    false,
    true
  );

  warmWallLamp(
    g,
    room.inner+s*.72,
    foyer-.45,
    0xffbf75,
    .64,
    4.3
  );

  /* ticket posters */

  for(let i=0;i<5;i++){

    addPainting(
      g,
      s===-1?1:-1,
      room.outer-s*.12,
      2.0,
      room.a+1.8+i*1.25,
      410+i,
      .48,
      'A faded cinema poster left behind with the old theater.'
    );
  }

  /* screen */

  box(
    room.outer-s*.13,
    2.70,
    room.center,
    .18,
    2.95,
    5.3,
    M.darkWood,
    g
  );

  box(
    room.outer-s*.23,
    2.70,
    room.center,
    .035,
    2.61,
    4.86,
    materialColor(
      0x72838f,
      .72,
      0x253440,
      .45
    ),
    g,
    false,
    true
  );

  box(
    room.outer-s*.33,
    4.08,
    room.center,
    .12,
    .13,
    5.55,
    M.brass,
    g,
    false,
    true
  );

  /* curtain folds */

  for(
    const zz of[-2.9,-2.4,2.4,2.9]
  ){

    box(
      room.outer-s*.29,
      2.6,
      room.center+zz,
      .20,
      3.10,
      .43,
      M.burgundy,
      g
    );
  }

  const screenGlow=
    new THREE.PointLight(
      0x86b4d2,
      .85,
      7.5,
      2
    );

  screenGlow.position.set(
    room.outer-s*.75,
    2.85,
    room.center
  );

  g.add(screenGlow);

  /* projector */

  const px=
    room.inner+s*7.6;

  box(
    px,
    2.35,
    room.center,
    .78,
    .46,
    .62,
    M.blackMetal,
    g
  );

  cyl(
    px+s*.40,
    2.35,
    room.center,
    .18,
    .18,
    M.brass,
    18,
    g,
    {x:Math.PI/2}
  );

  const pLight=
    new THREE.SpotLight(
      0xa8c9e2,
      1.25,
      22,
      Math.PI/8,
      .65,
      1.4
    );

  pLight.position.set(
    px-s*.25,
    2.45,
    room.center
  );

  pLight.target.position.set(
    room.outer-s*.30,
    2.7,
    room.center
  );

  g.add(
    pLight,
    pLight.target
  );

  /* seats */

  for(
    let row=0;
    row<4;
    row++
  ){

    const xx=
      room.inner+
      s*(3.1+row*1.65);

    for(
      let col=-2;
      col<=2;
      col++
    ){

      if(
        (row===2&&col===2) ||
        (row===3&&col===-1)
      ){
        continue;
      }

      const q=
        seat(
          g,
          xx,
          room.center+
            col*1.06+
            (row%2?.06:-.03),
          M.burgundy,
          s<0
            ?Math.PI/2
            :-Math.PI/2
        );

      if(
        (row+col)%4===0
      ){
        q.rotation.z=.025;
      }
    }
  }

  /* aisle lights */

  for(
    let row=0;
    row<5;
    row++
  ){

    const xx=
      room.inner+
      s*(2.3+row*1.55);

    for(
      const zz of[
        room.center-2.75,
        room.center+2.75
      ]
    ){

      box(
        xx,
        .12,
        zz,
        .06,
        .04,
        .06,
        materialColor(
          0xffd28c,
          .2,
          0xffa142,
          2
        ),
        g,
        false,
        true
      );
    }
  }

  /* concession */

  const cz=
    room.b-2.3;

  box(
    room.inner+s*1.15,
    .84,
    cz,
    1.45,
    .16,
    3.1,
    M.wood,
    g
  );

  box(
    room.inner+s*1.15,
    .44,
    cz,
    1.32,
    .78,
    2.90,
    M.darkWood,
    g
  );

  box(
    room.inner+s*1.0,
    1.44,
    cz-.75,
    .62,
    1.10,
    .50,
    M.blackMetal,
    g
  );

  box(
    room.inner+s*1.0,
    2.01,
    cz-.75,
    .52,
    .38,
    .42,
    M.glass,
    g,
    false,
    true
  );

  warmWallLamp(
    g,
    room.inner+s*.74,
    cz+.64,
    0xffc37a,
    .6,
    4.2
  );

  /*
    Exactly 50 total cinema paintings:
    5 posters
    10 outer wall pieces
    10 entrance wall pieces
    10 upper/smaller pieces
    15 partition pieces
  */

  let n=0;

  for(let i=0;i<10;i++){

    const zz=
      room.a+4.9+i*1.04;

    addPainting(
      g,
      s===-1?1:-1,
      room.outer-s*.12,
      2.08,
      zz,
      500+n++,
      i%3===0?.64:.58,
      'An artwork displayed along the abandoned cinema wall.'
    );
  }

  for(let i=0;i<10;i++){

    const zz=
      room.a+5.3+i*1.45;

    addPainting(
      g,
      1,
      room.inner+s*.09,
      2.02,
      zz,
      500+n++,
      .56,
      'A quiet work displayed on the entrance wall of the old theater.'
    );
  }

  for(let i=0;i<10;i++){

    const zz=
      room.center-5.9+i*1.30;

    addPainting(
      g,
      s===-1?1:-1,
      room.outer-s*.12,
      3.78,
      zz,
      500+n++,
      .43,
      'A smaller framed work above the theater seats.'
    );
  }

  for(let i=0;i<15;i++){

    const panelZ=
      room.a+5+i*1.0;

    const panelX=
      room.inner+s*2.0;

    box(
      panelX,
      2.22,
      panelZ,
      .12,
      3.9,
      .74,
      M.darkWood,
      g
    );

    addPainting(
      g,
      s===-1?1:-1,
      panelX-s*.07,
      2.25,
      panelZ,
      600+i,
      .44,
      'A small work mounted on a wooden cinema partition.'
    );
  }

  addParticles(
    g,
    room,
    'dust',
    120,
    0xc5bbb0,
    .018,
    .42
  );
}

    .10,
    .26,
    M.blackMetal,
    g
  );

  /* dead plant */

  cyl(
    room.cx-s*2.1,
    .40,
    room.b-2.1,
    .18,
    .25,
    M.paper,
    14,
    g
  );

  for(let i=0;i<8;i++){

    line(
      new THREE.Vector3(
        room.cx-s*2.1,
        .55,
        room.b-2.1
      ),
      new THREE.Vector3(
        room.cx-s*
          (2.1+(i%2)*.08),
        .84+i%3*.06,
        room.b-2.1+(i-4)*.08
      ),
      .018,
      M.darkWood,
      g
    );
  }

  /* candelabra */

  cyl(
    room.cx-s*3,
    .85,
    room.center-5.55,
    .13,
    .10,
    M.brass,
    12,
    g
  );

  for(let i=0;i<3;i++){

    const a=
      -.7+i*.7;

    line(
      new THREE.Vector3(
        room.cx-s*3,
        .91,
        room.center-5.55
      ),
      new THREE.Vector3(
        room.cx-s*3+
          Math.sin(a)*.25,
        1.16,
        room.center-5.55+
          Math.cos(a)*.25
      ),
      .024,
      M.brass,
      g
    );

    sphere(
      room.cx-s*3+
        Math.sin(a)*.25,
      1.23,
      room.center-5.55+
        Math.cos(a)*.25,
      .045,
      materialColor(
        0xffd27c,
        .22,
        0xff9740,
        1.9
      ),
      g
    );
  }

  /* mysterious interior door */

  box(
    room.cx-s*2.0,
    1.92,
    room.b-.14,
    .12,
    3.56,
    1.46,
    M.darkWood,
    g
  );

  box(
    room.cx-s*2.06,
    1.92,
    room.b-.21,
    .035,
    3.18,
    1.10,
    materialColor(
      0x1e1717,
      1
    ),
    g,
    false,
    true
  );

  sphere(
    room.cx-s*2.18,
    1.69,
    room.b-.21,
    .055,
    M.brass,
    g
  );

  /*
    Exactly 24 Victorian paintings.
  */

  let n=0;

  for(let i=0;i<13;i++){

    addPainting(
      g,
      s===-1?1:-1,
      room.outer-s*.12,
      2.02,
      room.a+1.9+i*1.72,
      1000+n++,
      .57,
      'A Victorian night scene that feels oddly familiar.'
    );
  }

  for(let i=0;i<11;i++){

    const z=
      room.a+2.6+i*1.85;

    addPainting(
      g,
      s,
      room.inner+s*.10,
      2.02,
      z,
      1050+n++,
      .48,
      'A smaller work tucked into the darker side of the room.'
    );
  }

  addParticles(
    g,
    room,
    'dust',
    110,
    0xc4bbb0,
    .017,
    .34
  );
}

/* ------------------------------------------------------------
   PARTICLES
   ------------------------------------------------------------ */

function addParticles(
  g,
  room,
  type,
  count,
  color,
  size,
  opacity
){

  const arr=
    new Float32Array(
      count*3
    );

  const r=
    rng(
      Math.floor(
        room.center*13
      )+count
    );

  for(let i=0;i<count;i++){

    arr[i*3]=
      room.cx+
      (r()-.5)*13.5;

    arr[i*3+1]=
      .25+r()*4;

    arr[i*3+2]=
      room.center+
      (r()-.5)*22.5;
  }

  const geo=
    new THREE.BufferGeometry();

  geo.setAttribute(
    'position',
    new THREE.BufferAttribute(
      arr,
      3
    )
  );

  const p=
    new THREE.Points(
      geo,
      new THREE.PointsMaterial({
        color,
        size,
        transparent:true,
        opacity,
        depthWrite:false
      })
    );

  p.userData.particleType=type;

  g.add(p);
}

/* ------------------------------------------------------------
   BUILD ROOMS
   ------------------------------------------------------------ */

const rooms=[];

for(
  let i=0;
  i<lobbyInfo.length;
  i++
){

  const info=
    lobbyInfo[i];

  const room=
    roomShell(
      lobbyCenters[i],
      info.side,
      info.type==='horror'
        ?M.wall2
        :M.wall
    );

  rooms.push(room);

  if(
    info.type==='cinema'
  ){
    cinema(room);
  }

  if(
    info.type==='cottage'
  ){
    cottage(room);
  }

  if(
    info.type==='snow'
  ){
    snowRoom(room);
  }

  if(
    info.type==='street'
  ){
    streetRoom(room);
  }

  if(
    info.type==='horror'
  ){
    horror(room);
  }
}

/* ------------------------------------------------------------
   PLAYER
   ------------------------------------------------------------ */

let yaw=Math.PI;
let pitch=0;

let controlsEnabled=false;
let pointerLocked=false;

const keys={};

let vx=0;
let vz=0;
let footTimer=0;

document.addEventListener(
  'keydown',
  e=>keys[e.code]=true
);

document.addEventListener(
  'keyup',
  e=>keys[e.code]=false
);

renderer.domElement.addEventListener(
  'click',
  ()=>{

    if(!controlsEnabled){
      return;
    }

    if(
      document.pointerLockElement
      !==renderer.domElement
    ){

      renderer.domElement
        .requestPointerLock?.();

    }else{

      clickPainting();
    }
  }
);

document.addEventListener(
  'pointerlockchange',
  ()=>{
    pointerLocked=
      document.pointerLockElement
      ===renderer.domElement;
  }
);

document.addEventListener(
  'mousemove',
  e=>{

    if(!pointerLocked){
      return;
    }

    yaw-=
      e.movementX*.00225;

    pitch-=
      e.movementY*.00185;

    pitch=
      Math.max(
        -Math.PI/2+.08,
        Math.min(
          Math.PI/2-.08,
          pitch
        )
      );
  }
);

function move(dt){

  if(!controlsEnabled){
    return;
  }

  let ax=0;
  let az=0;

  if(keys.KeyA)ax--;
  if(keys.KeyD)ax++;
  if(keys.KeyW)az--;
  if(keys.KeyS)az++;

  if(ax||az){

    const len=
      Math.hypot(
        ax,
        az
      );

    ax/=len;
    az/=len;

    const speed=2.95;

    const fx=
      -Math.sin(yaw);

    const fz=
      -Math.cos(yaw);

    const rx=
      Math.cos(yaw);

    const rz=
      -Math.sin(yaw);

    const tx=
      (rx*ax+fx*az)*speed;

    const tz=
      (rz*ax+fz*az)*speed;

    vx+=
      (tx-vx)*
      Math.min(
        1,
        dt*13
      );

    vz+=
      (tz-vz)*
      Math.min(
        1,
        dt*13
      );

    footTimer+=dt;

    if(
      footTimer>.43
    ){

      playFootstep();
      footTimer=0;
    }

  }else{

    vx*=
      Math.pow(
        .0008,
        dt
      );

    vz*=
      Math.pow(
        .0008,
        dt
      );
  }

  const nx=
    camera.position.x+
    vx*dt;

  const nz=
    camera.position.z+
    vz*dt;

  if(
    canMove(
      nx,
      camera.position.z
    )
  ){

    camera.position.x=nx;

  }else{

    vx=0;
  }

  if(
    canMove(
      camera.position.x,
      nz
    )
  ){

    camera.position.z=nz;

  }else{

    vz=0;
  }

  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}

/* ------------------------------------------------------------
   AUDIO
   ------------------------------------------------------------ */

let audioCtx=null;
let master=null;
let audioOn=true;

function setupAudio(){

  try{

    audioCtx=
      new(
        window.AudioContext||
        window.webkitAudioContext
      )();

    master=
      audioCtx.createGain();

    master.gain.value=.34;

    master.connect(
      audioCtx.destination
    );

    const o=
      audioCtx.createOscillator();

    const g=
      audioCtx.createGain();

    const f=
      audioCtx.createBiquadFilter();

    o.type='sine';
    o.frequency.value=49;

    g.gain.value=.055;

    f.type='lowpass';
    f.frequency.value=130;

    o.connect(f);
    f.connect(g);
    g.connect(master);

    o.start();

    const b=
      audioCtx.createBuffer(
        1,
        audioCtx.sampleRate*2,
        audioCtx.sampleRate
      );

    const d=
      b.getChannelData(0);

    for(
      let i=0;
      i<d.length;
      i++
    ){

      d[i]=
        (Math.random()*2-1)*.06;
    }

    const n=
      audioCtx.createBufferSource();

    n.buffer=b;
    n.loop=true;

    const ng=
      audioCtx.createGain();

    ng.gain.value=.022;

    n.connect(ng);
    ng.connect(master);

    n.start();

  }catch(e){

    console.warn(e);
  }
}

function playFootstep(){

  if(
    !audioCtx||
    !audioOn
  ){
    return;
  }

  const o=
    audioCtx.createOscillator();

  const g=
    audioCtx.createGain();

  const t=
    audioCtx.currentTime;

  o.type='triangle';

  o.frequency.setValueAtTime(
    83+Math.random()*12,
    t
  );

  o.frequency.exponentialRampToValueAtTime(
    42,
    t+.11
  );

  g.gain.setValueAtTime(
    .0001,
    t
  );

  g.gain.exponentialRampToValueAtTime(
    .040,
    t+.015
  );

  g.gain.exponentialRampToValueAtTime(
    .0001,
    t+.11
  );

  o.connect(g);
  g.connect(master);

  o.start(t);
  o.stop(t+.12);
}

function roomTone(type){

  if(
    !audioCtx||
    !audioOn
  ){
    return;
  }

  const f={
    cinema:82,
    cottage:68,
    snow:124,
    street:91,
    horror:57
  }[type]||65;

  const o=
    audioCtx.createOscillator();

  const g=
    audioCtx.createGain();

  const t=
    audioCtx.currentTime;

  o.type=
    type==='horror'
      ?'triangle'
      :'sine';

  o.frequency.setValueAtTime(
    f,
    t
  );

  o.frequency.exponentialRampToValueAtTime(
    f*.55,
    t+1.5
  );

  g.gain.setValueAtTime(
    .0001,
    t
  );

  g.gain.exponentialRampToValueAtTime(
    .018,
    t+.18
  );

  g.gain.exponentialRampToValueAtTime(
    .0001,
    t+1.55
  );

  o.connect(g);
  g.connect(master);

  o.start(t);
  o.stop(t+1.6);
}

document.getElementById('mute').onclick=()=>{

  audioOn=!audioOn;

  if(master){

    master.gain.setTargetAtTime(
      audioOn?.34:0,
      audioCtx.currentTime,
      .04
    );
  }

  document.getElementById(
    'mute'
  ).textContent=
    audioOn
      ?'SOUND ON'
      :'SOUND OFF';
};

/* ------------------------------------------------------------
   PAINTING MODAL
   ------------------------------------------------------------ */

const raycaster=
  new THREE.Raycaster();

function clickPainting(){

  raycaster.setFromCamera(
    {
      x:0,
      y:0
    },
    camera
  );

  const hits=
    raycaster.intersectObjects(
      clickable,
      false
    );

  if(!hits.length){
    return;
  }

  const p=
    hits[0].object;

  document.getElementById(
    'noteTitle'
  ).textContent=
    p.userData.title;

  document.getElementById(
    'noteText'
  ).textContent=
    p.userData.note;

  document.getElementById(
    'noteModal'
  ).style.display='flex';

  document.exitPointerLock?.();
}

document.getElementById(
  'noteClose'
).onclick=()=>{

  document.getElementById(
    'noteModal'
  ).style.display='none';
};

document.getElementById(
  'noteModal'
).onclick=e=>{

  if(
    e.target.id===
    'noteModal'
  ){

    e.target.style.display=
      'none';
  }
};

/* ------------------------------------------------------------
   ROOM DETECTION
   ------------------------------------------------------------ */

let currentArea='hall';

function detectRoom(){

  let area='hall';
  let idx=-1;

  for(
    let i=0;
    i<rooms.length;
    i++
  ){

    const r=rooms[i];

    const inside=
      camera.position.z>=r.a &&
      camera.position.z<=r.b;

    const insideSide=
      r.side<0
        ?camera.position.x<
          -(HALL_HALF+.16)
        :camera.position.x>
          HALL_HALF+.16;

    if(
      inside &&
      insideSide
    ){

      idx=i;
      area=
        lobbyInfo[i].type;

      break;
    }
  }

  if(
    area!==currentArea
  ){

    currentArea=area;

    roomTone(area);
  }

  document.getElementById(
    'roomLabel'
  ).textContent=
    idx>=0
      ?lobbyInfo[idx].name
      :'HALLWAY';
}

/* ------------------------------------------------------------
   ANIMATION
   ------------------------------------------------------------ */

let elapsed=0;

function animateWorld(dt){

  elapsed+=dt;

  for(
    const h of hallLights
  ){

    const f=
      .035*
      Math.sin(
        elapsed*1.35+
        h.phase
      )+
      .018*
      Math.sin(
        elapsed*5.3+
        h.phase*1.7
      );

    h.l.intensity=
      Math.max(
        .18,
        h.base+f
      );
  }

  scene.traverse(
    o=>{

      const type=
        o.userData?.particleType;

      if(!type){
        return;
      }

      const a=
        o.geometry
         .attributes
         .position
         .array;

      for(
        let i=0;
        i<a.length;
        i+=3
      ){

        if(
          type==='snow'
        ){

          a[i+1]-=
            dt*.42;

          a[i]+=
            Math.sin(
              elapsed*.45+i
            )*
            dt*.005;

          if(
            a[i+1]<.2
          ){

            a[i+1]=4.2;
          }

        }else if(
          type==='mist'
        ){

          a[i+1]+=
            dt*.01;

          if(
            a[i+1]>4
          ){

            a[i+1]=.3;
          }

        }else{

          a[i+1]+=
            dt*.015;

          a[i]+=
            Math.sin(
              elapsed*.5+i
            )*
            dt*.003;

          if(
            a[i+1]>4.3
          ){

            a[i+1]=.25;
          }
        }
      }

      o.geometry
       .attributes
       .position
       .needsUpdate=true;
    }
  );

  scene.traverse(
    o=>{

      if(
        o.isPointLight &&
        o.color &&
        o.color.r>.8 &&
        o.color.g>.25 &&
        o.color.b<.32
      ){

        o.intensity+=
          Math.sin(
            elapsed*9
          )*.012;
      }
    }
  );
}

/* ------------------------------------------------------------
   ENTER
   ------------------------------------------------------------ */

const welcome=
  document.getElementById(
    'welcome'
  );

const nameInput=
  document.getElementById(
    'nameInput'
  );

const enterBtn=
  document.getElementById(
    'enterBtn'
  );

const welcomeMessage=
  document.getElementById(
    'welcomeMessage'
  );

function startGallery(){

  const name=
    (
      nameInput.value.trim()||
      'Guest'
    ).replace(
      /[<>]/g,
      ''
    );

  welcomeMessage.textContent=
    'Welcome, '+
    name+
    '. Your artwork is waiting for you in Lobby 1.';

  welcomeMessage.style.display=
    'block';

  enterBtn.style.display=
    'none';

  nameInput.style.display=
    'none';

  setupAudio();

  if(
    audioCtx?.state===
    'suspended'
  ){

    audioCtx.resume();
  }

  setTimeout(
    ()=>{

      welcome.style.opacity='0';

      setTimeout(
        ()=>{

          welcome.style.display=
            'none';

          controlsEnabled=true;

          renderer.domElement
            .requestPointerLock?.();

        },
        650
      );

    },
    850
  );
}

enterBtn.onclick=
  startGallery;

nameInput.onkeydown=
  e=>{

    if(e.key==='Enter'){
      startGallery();
    }
  };

/* preview helper */
if(
  location.hash==='#preview'
){

  welcome.style.display=
    'none';

  controlsEnabled=true;

  camera.position.set(
    0,
    1.68,
    9
  );
}

setTimeout(
  ()=>document
    .getElementById('loading')
    .classList.add('hide'),
  700
);

/* ------------------------------------------------------------
   RESIZE
   ------------------------------------------------------------ */

window.addEventListener(
  'resize',
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

/* ------------------------------------------------------------
   LOOP
   ------------------------------------------------------------ */

let previous=
  performance.now();

function loop(){

  requestAnimationFrame(loop);

  const now=
    performance.now();

  const dt=
    Math.min(
      .05,
      (now-previous)/1000
    );

  previous=now;

  move(dt);
  detectRoom();
  setAtmosphere(currentArea);
  animateWorld(dt);

  renderer.render(
    scene,
    camera
  );
}

loop();
</script>
