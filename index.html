<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ramsha Art Studio — Interactive Gallery</title>
<style>
:root{--blue:#72d8ff;--blueSoft:#b7ebff;--cream:#e8dfce;--burgundy:#351c25;--walnut:#211714}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100e11;font-family:"DM Sans",Arial,sans-serif}body{color:#eee8dc}
#loading{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#0d0b0d;color:#e6dfd3;letter-spacing:.22em;font-size:12px;transition:opacity .8s}
#loading.hide{opacity:0;pointer-events:none}
#ui{position:fixed;inset:0;z-index:20;pointer-events:none}
#brand,#roomLabel{position:absolute;top:22px;font-family:Georgia,serif;font-size:14px;letter-spacing:.14em;opacity:.82}#brand{left:24px;text-transform:uppercase}#roomLabel{right:24px;font-size:13px}
#hint{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid rgba(232,223,206,.14);background:rgba(18,14,15,.46);backdrop-filter:blur(8px);border-radius:999px;font-size:11px;letter-spacing:.06em;color:rgba(244,237,226,.78)}
#mute{position:absolute;top:56px;right:24px;pointer-events:auto;cursor:pointer;border:1px solid rgba(232,223,206,.18);background:rgba(18,14,15,.46);color:#e8dfce;padding:7px 10px;border-radius:8px;font-size:11px;letter-spacing:.08em;backdrop-filter:blur(8px)}
#crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;transform:translate(-50%,-50%);opacity:.65}#crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(255,248,235,.72)}#crosshair:before{width:8px;height:1px;left:0;top:3px}#crosshair:after{width:1px;height:8px;top:0;left:3px}
#welcome{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 46%,rgba(82,63,50,.22),transparent 44%),linear-gradient(180deg,#171216,#0d0c0e)}
.welcomeBox{width:min(560px,calc(100vw - 40px));text-align:center;padding:44px 34px 40px;border:1px solid rgba(232,223,206,.12);background:rgba(17,14,15,.72);box-shadow:0 30px 100px rgba(0,0,0,.5);backdrop-filter:blur(14px)}
.kicker{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(232,223,206,.52);margin-bottom:16px}h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,7vw,60px);font-weight:400;letter-spacing:.02em}.subtitle{margin:17px auto 28px;max-width:380px;font-family:Georgia,serif;line-height:1.7;color:rgba(232,223,206,.7);font-size:14px;font-style:italic}
.nameWrap{width:min(330px,100%);margin:auto}#nameInput{width:100%;height:46px;border:1px solid rgba(232,223,206,.18);border-radius:8px;background:rgba(255,255,255,.035);color:#eee7db;padding:0 15px;outline:none;font-size:14px;text-align:center}#nameInput:focus{border-color:rgba(168,230,255,.42)}#enterBtn{margin-top:12px;width:100%;height:46px;border:0;border-radius:8px;background:#d8c8ad;color:#1b1715;font-size:12px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:transform .2s ease,background .2s ease}#enterBtn:hover{transform:translateY(-1px);background:#eee0c6}#welcomeMessage{display:none;margin-top:23px;font-family:Georgia,serif;font-size:14px;line-height:1.7;color:rgba(232,223,206,.74)}
#noteModal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(4,3,4,.56);backdrop-filter:blur(5px);pointer-events:auto}.noteBox{width:min(460px,calc(100vw - 34px));background:#181315;border:1px solid rgba(232,223,206,.14);box-shadow:0 30px 100px rgba(0,0,0,.58);padding:30px}.noteEyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.22em;color:rgba(232,223,206,.45);margin-bottom:12px}#noteTitle{margin:0;font-family:Georgia,serif;font-weight:400;font-size:26px}#noteText{margin:15px 0 0;font-size:13px;line-height:1.75;color:rgba(232,223,206,.72)}.noteClose{margin-top:23px;border:1px solid rgba(232,223,206,.16);background:transparent;color:#e8dfce;padding:9px 14px;border-radius:7px;cursor:pointer;font-size:11px}
</style>
</head>
<body>
<div id="loading">ENTERING THE GALLERY…</div>
<div id="welcome"><div class="welcomeBox"><div class="kicker">Ramsha Art Studio</div><h1>Interactive Gallery</h1><div class="subtitle">an interactive gallery of quiet, strange places</div><div class="nameWrap"><input id="nameInput" type="text" maxlength="40" placeholder="Your name"><button id="enterBtn">Enter the gallery</button></div><div id="welcomeMessage"></div></div></div>
<div id="ui"><div id="brand">Ramsha Art Studio</div><div id="roomLabel">HALLWAY</div><button id="mute">SOUND ON</button><div id="crosshair"></div><div id="hint">WASD to move · mouse to look · click a painting</div></div>
<div id="noteModal"><div class="noteBox"><div class="noteEyebrow">Artwork</div><h2 id="noteTitle"></h2><p id="noteText"></p><button class="noteClose" id="noteClose">Close</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

if(!window.THREE){
  document.getElementById('loading').textContent='Three.js could not be loaded. Refresh the page.';
  throw new Error('Three.js unavailable');
}

/* ============================================================
   BASE WORLD — deliberately stable and readable
   ============================================================ */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,220);
camera.position.set(0,1.68,5);
camera.rotation.order='YXZ';

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.28;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const HALL_HALF=1.4,HALL_LENGTH=132,ROOM_W=15,ROOM_L=24,ROOM_H=4.8,DOOR_HALF=1.62;
const lobbyCenters=[18,43,68,93,118];
const lobbyInfo=[
  {name:'LOBBY 1 · ABANDONED CINEMA',side:-1,type:'cinema'},
  {name:'LOBBY 2 · COZY COTTAGE',side:1,type:'cottage'},
  {name:'LOBBY 3 · SNOWY RURAL NIGHT',side:-1,type:'snow'},
  {name:'LOBBY 4 · RESIDENTIAL STREET',side:1,type:'street'},
  {name:'LOBBY 5 · VICTORIAN ROOM',side:-1,type:'horror'}
];

/* Broad readable light, plus warm architectural wash. */
scene.background=new THREE.Color(0x29242a);
scene.add(new THREE.HemisphereLight(0xb6b0b3,0x403035,.95));
scene.add(new THREE.AmbientLight(0x8f8186,.42));
const mainLight=new THREE.DirectionalLight(0xffe1bb,.64);
mainLight.position.set(-7,11,18);
mainLight.target.position.set(0,0,65);
scene.add(mainLight,mainLight.target);
const coolLight=new THREE.DirectionalLight(0xb8d3ea,.20);
coolLight.position.set(8,9,95);coolLight.target.position.set(0,1,75);scene.add(coolLight,coolLight.target);

const atmos={
  hall:{color:0x29242a,density:.00018},
  cinema:{color:0x1d2530,density:.00028},
  cottage:{color:0x2c2420,density:.00016},
  snow:{color:0x72859a,density:.00055},
  street:{color:0x334652,density:.00046},
  horror:{color:0x251d22,density:.00050}
};
scene.fog=new THREE.FogExp2(atmos.hall.color,atmos.hall.density);
let targetFogColor=new THREE.Color(atmos.hall.color),targetFogDensity=atmos.hall.density;
function setAtmosphere(type){const a=atmos[type]||atmos.hall;targetFogColor.set(a.color);targetFogDensity=a.density;scene.fog.color.lerp(targetFogColor,.035);scene.fog.density+=(targetFogDensity-scene.fog.density)*.035;scene.background.lerp(targetFogColor,.018)}

function seeded(seed){let t=(seed>>>0)||1;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
function texture(c,rx=1,ry=1){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);t.encoding=THREE.sRGBEncoding;return t}
function canvasBase(seed,w,h,color){const r=seeded(seed),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=color;x.fillRect(0,0,w,h);for(let i=0;i<w*h/60;i++){x.fillStyle=`rgba(255,255,255,${.008+r()*.018})`;x.fillRect(r()*w,r()*h,1+r()*2,1+r()*2)}return{c,x,r}}
function wallpaper(seed,base='#8d7b74') {const{c,x,r}=canvasBase(seed,512,512,base);for(let xx=0;xx<512;xx+=43){x.strokeStyle='rgba(67,48,45,.12)';x.lineWidth=1;x.beginPath();x.moveTo(xx,0);x.lineTo(xx,512);x.stroke()}for(let yy=25;yy<512;yy+=64){for(let xx=9;xx<512;xx+=43){x.strokeStyle='rgba(54,39,38,.09)';x.beginPath();x.moveTo(xx,yy-10);x.quadraticCurveTo(xx+10,yy,xx,yy+10);x.quadraticCurveTo(xx-10,yy,xx,yy-10);x.stroke()}}for(let i=0;i<16;i++){x.fillStyle=`rgba(49,37,37,${.018+r()*.035})`;x.beginPath();x.ellipse(r()*512,r()*512,8+r()*22,4+r()*12,r()*Math.PI,0,Math.PI*2);x.fill()}return texture(c,2.4,2.2)}
function wood(seed,dark=false){const{c,x,r}=canvasBase(seed,512,512,dark?'#4a3026':'#795a43');for(let i=0;i<36;i++){const yy=i*15+r()*8;x.strokeStyle=dark?'rgba(14,9,7,.24)':'rgba(31,20,14,.17)';x.lineWidth=1+r()*1.2;x.beginPath();let xx=-15;x.moveTo(xx,yy);while(xx<530){xx+=22+r()*30;x.lineTo(xx,yy+Math.sin(xx*.026+i)*3)}x.stroke()}return texture(c,2,4.5)}
function fabric(seed,base){const{c,x,r}=canvasBase(seed,256,256,base);for(let i=0;i<1100;i++){x.fillStyle=`rgba(255,245,232,${.008+r()*.022})`;x.fillRect(r()*256,r()*256,1,1)}return texture(c,3,3)}
function rug(seed,base='#4c2c35'){const{c,x,r}=canvasBase(seed,512,512,base);x.strokeStyle='rgba(205,171,128,.26)';x.lineWidth=5;x.strokeRect(22,22,468,468);x.lineWidth=2;x.strokeRect(43,43,426,426);for(let i=0;i<10;i++){const m=62+i*14;x.strokeStyle=`rgba(215,174,132,${.04+r()*.06})`;x.strokeRect(m,m,512-m*2,512-m*2)}return texture(c,1,2)}
function brick(seed){const{c,x,r}=canvasBase(seed,512,512,'#78584d');for(let y=0;y<512;y+=29){const off=(y/29%2)*35;for(let xx=-70;xx<560;xx+=70){x.strokeStyle='rgba(42,26,23,.40)';x.lineWidth=3.5;x.strokeRect(xx-off,y,70,29);x.fillStyle=`rgba(230,193,159,${.01+r()*.035})`;x.fillRect(xx-off+4,y+4,62,21)}}return texture(c,2.2,2.2)}

const M={
 wall:new THREE.MeshStandardMaterial({map:wallpaper(4),roughness:.91}),
 wallDark:new THREE.MeshStandardMaterial({map:wallpaper(11,'#73615d'),roughness:.95}),
 wood:new THREE.MeshStandardMaterial({map:wood(5),roughness:.86}),
 darkWood:new THREE.MeshStandardMaterial({map:wood(8,true),roughness:.92}),
 brass:new THREE.MeshStandardMaterial({color:0xb08a4c,metalness:.68,roughness:.30}),
 metal:new THREE.MeshStandardMaterial({color:0x242322,metalness:.64,roughness:.60}),
 burgundy:new THREE.MeshStandardMaterial({map:fabric(9,'#5a2634'),roughness:.98}),
 olive:new THREE.MeshStandardMaterial({map:fabric(16,'#666253'),roughness:.97}),
 brown:new THREE.MeshStandardMaterial({map:fabric(20,'#493029'),roughness:.96}),
 paper:new THREE.MeshStandardMaterial({color:0xd8cdbd,roughness:.89}),
 stone:new THREE.MeshStandardMaterial({color:0x81786b,roughness:1}),
 concrete:new THREE.MeshStandardMaterial({color:0x777775,roughness:1}),
 asphalt:new THREE.MeshStandardMaterial({color:0x303437,roughness:.96}),
 snow:new THREE.MeshStandardMaterial({color:0xe8edf1,roughness:1}),
 greenery:new THREE.MeshStandardMaterial({color:0x35463a,roughness:1})
};
function cmat(color,rough=.8,em=0,ei=0){return new THREE.MeshStandardMaterial({color,roughness:rough,emissive:em,emissiveIntensity:ei})}

function box(x,y,z,sx,sy,sz,material,a,b,c){
  let parent=scene,cast=true,receive=true;
  if(a && typeof a.add==="function"){
    parent=a;
    if(typeof b==="boolean")cast=b;
    if(typeof c==="boolean")receive=c;
  }else{
    if(typeof a==="boolean")cast=a;
    if(typeof b==="boolean")receive=b;
    if(c && typeof c.add==="function")parent=c;
  }
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
  m.position.set(x,y,z);
  m.castShadow=cast;
  m.receiveShadow=receive;
  parent.add(m);
  return m;
}
function cyl(x,y,z,r,h,material,segments=16,a,b){
  let parent=scene,rot={};
  if(a && typeof a.add==="function"){
    parent=a;
    if(b && typeof b === "object" && typeof b.add !== "function")rot=b;
  }else{
    if(a && typeof a === "object")rot=a;
    if(b && typeof b.add==="function")parent=b;
  }
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),material);
  m.position.set(x,y,z);
  m.rotation.set(rot.x||0,rot.y||0,rot.z||0);
  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);
  return m;
}
function sphere(x,y,z,r,material,parent=scene){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,10),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function lineBetween(a,b,r,material,parent=scene){const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z,len=Math.hypot(dx,dy,dz);const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,7),material);m.position.set((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(dx,dy,dz).normalize());m.castShadow=true;parent.add(m);return m}

/* ------------------------------------------------------------
   REALISTIC WORLD REBUILD
   Keeps the original dimensions, navigation and interaction.
   ------------------------------------------------------------ */

/* Slightly broader architectural fill so materials remain readable. */
const worldFillWarm=new THREE.DirectionalLight(0xffe0ba,.30);
worldFillWarm.position.set(-6,8,38);
worldFillWarm.target.position.set(0,1,65);
scene.add(worldFillWarm,worldFillWarm.target);

const worldFillCool=new THREE.DirectionalLight(0xb5d0e6,.16);
worldFillCool.position.set(7,7,90);
worldFillCool.target.position.set(0,1,90);
scene.add(worldFillCool,worldFillCool.target);

/* ------------------------------------------------------------
   ARCHITECTURE HELPERS
   ------------------------------------------------------------ */

function panelMolding(side,z){
  const x=side*1.285;
  box(x,.42,z,.085,.10,1.55,M.darkWood,scene,false,true);
  box(x,.46,z-0.78,.085,1.00,.08,M.darkWood,scene,false,true);
  box(x,.46,z+0.78,.085,1.00,.08,M.darkWood,scene,false,true);
  box(x,.92,z,.085,.08,1.48,M.darkWood,scene,false,true);
}

function hallwayLamp(side,z,idx){
  const x=side*1.27;

  box(x-side*.025,2.58,z,.12,.26,.17,M.brass,scene,false,true);
  sphere(x-side*.10,2.72,z,.075,cmat(0xffd18a,.20,0xffad4a,2.0),scene);

  const glow=new THREE.PointLight(
    0xffc37b,
    idx%5===0?1.18:.94,
    8.2,
    2
  );
  glow.position.set(x-side*.25,2.60,z);
  glow.castShadow=idx%4===0;
  scene.add(glow);
  hallLights.push({l:glow,base:glow.intensity,phase:idx*.71});
}

function oldFrame(side,z,seed){
  addPainting(
    scene,
    side*1.30,
    2.02,
    z,
    side<0?Math.PI/2:-Math.PI/2,
    seed,
    .55,
    'A night scene encountered quietly along the old manor corridor.'
  );
}

/* ------------------------------------------------------------
   HALLWAY — OLD MANOR / GALLERY
   ------------------------------------------------------------ */

box(0,-.08,HALL_LENGTH/2,2*HALL_HALF,.16,HALL_LENGTH,M.wood,scene,false,true);
box(0,.012,HALL_LENGTH/2,1.58,.035,HALL_LENGTH-.3,new THREE.MeshStandardMaterial({map:rug(2,'#4f3039'),roughness:1}),scene,false,true);

/* worn runner edges */
box(-.84,.032,HALL_LENGTH/2,.055,.025,HALL_LENGTH-.3,cmat(0x9a755f,.96),scene,false,true);
box(.84,.032,HALL_LENGTH/2,.055,.025,HALL_LENGTH-.3,cmat(0x9a755f,.96),scene,false,true);

/* substantial old dado and baseboards */
box(-1.36,.28,HALL_LENGTH/2,.18,.52,HALL_LENGTH,M.darkWood,scene,false,true);
box(1.36,.28,HALL_LENGTH/2,.18,.52,HALL_LENGTH,M.darkWood,scene,false,true);
box(-1.33,.91,HALL_LENGTH/2,.10,.13,HALL_LENGTH,M.wood,scene,false,true);
box(1.33,.91,HALL_LENGTH/2,.10,.13,HALL_LENGTH,M.wood,scene,false,true);
box(-1.32,.58,HALL_LENGTH/2,.10,.08,HALL_LENGTH,M.darkWood,scene,false,true);
box(1.32,.58,HALL_LENGTH/2,.10,.08,HALL_LENGTH,M.darkWood,scene,false,true);

/* crown moulding */
box(-1.34,4.40,HALL_LENGTH/2,.14,.16,HALL_LENGTH,M.wood,scene,false,true);
box(1.34,4.40,HALL_LENGTH/2,.14,.16,HALL_LENGTH,M.wood,scene,false,true);

for(let z=5;z<130;z+=10){
  box(0,4.49,z,2.84,.18,.24,M.darkWood,scene,false,true);
}

/* wall panel rhythm intentionally irregular */
for(const z of [6,16.5,27,38.5,50,61,72.5,84,95.5,108,120.5]){
  panelMolding(-1,z);
}
for(const z of [9,20.5,32,44.5,56,68.5,80,91.5,103,115.5,127]){
  panelMolding(1,z);
}

/* hallway wall segments retain the five real openings */
const colliders=[];
function addCollider(x1,x2,z1,z2){colliders.push({minX:Math.min(x1,x2),maxX:Math.max(x1,x2),minZ:Math.min(z1,z2),maxZ:Math.max(z1,z2)})}
function hit(x,z,r,b){return x+r>b.minX&&x-r<b.maxX&&z+r>b.minZ&&z-r<b.maxZ}
function canMove(x,z){
  if(x<-(HALL_HALF+ROOM_W-.42)||x>(HALL_HALF+ROOM_W-.42)||z<.7||z>HALL_LENGTH-.7)return false;
  for(const b of colliders)if(hit(x,z,.27,b))return false;
  return true;
}

function doorFrame(side,z){
  const x=side*HALL_HALF;
  box(x-side*.12,3.88,z,.28,.20,3.58,M.darkWood,scene,false,true);
  box(x-side*.12,1.94,z-DOOR_HALF-.08,.28,3.78,.24,M.wood,scene,false,true);
  box(x-side*.12,1.94,z+DOOR_HALF+.08,.28,3.78,.24,M.wood,scene,false,true);
  box(x-side*.18,1.86,z-DOOR_HALF+.15,.05,3.30,.04,M.brass,scene,false,true);
  box(x-side*.18,1.86,z-DOOR_HALF+.15,.05,3.30,.04,M.brass,scene,false,true);
  sphere(x+side*.01,1.48,z-DOOR_HALF+.16,.05,M.brass,scene);
  box(x+side*.03,3.28,z,.035,.20,.82,M.brass,scene,false,true);
}

function hallwayWall(side){
  const x=side*HALL_HALF;
  const openings=lobbyCenters.filter((z,i)=>lobbyInfo[i].side===side);
  let cursor=0;
  for(const z of openings){
    const a=z-DOOR_HALF,b=z+DOOR_HALF;
    if(a>cursor){
      box(x,ROOM_H/2,(cursor+a)/2,.16,ROOM_H,a-cursor,M.wall,scene,false,true);
      addCollider(x-.08,x+.08,cursor,a);
    }
    doorFrame(side,z);
    cursor=b;
  }
  if(cursor<HALL_LENGTH){
    box(x,ROOM_H/2,(cursor+HALL_LENGTH)/2,.16,ROOM_H,HALL_LENGTH-cursor,M.wall,scene,false,true);
    addCollider(x-.08,x+.08,cursor,HALL_LENGTH);
  }
}

hallwayWall(-1);
hallwayWall(1);

box(0,ROOM_H/2,HALL_LENGTH+.07,2.8,ROOM_H,.16,M.wall,scene,false,true);
addCollider(-1.4,1.4,HALL_LENGTH-.02,HALL_LENGTH+.16);

const hallLights=[];
for(let i=0,z=4;z<130;z+=7.6){
  hallwayLamp(-1,z,i++);
  hallwayLamp(1,z+3.8,i++);
}

/* one slightly dead fixture: believable, not pitch-black */
box(0,4.56,79.5,.42,.05,.42,cmat(0x5c5148,.55),scene,false,true);

/* hallway details */
function sideTableHall(x,z){
  box(x,.76,z,.60,.10,.44,M.wood);
  for(const dx of[-.22,.22])for(const dz of[-.14,.14])box(x+dx,.38,z+dz,.05,.72,.05,M.darkWood);
  cyl(x,.93,z,.058,.13,M.paper,12);
}
function mirrorHall(side,z){
  const x=side*1.285;
  box(x,2.12,z,.08,1.72,1.02,M.darkWood);
  box(x+side*.045,2.12,z,.025,1.50,.80,cmat(0x69747b,.17),scene,false,true);
}
function radiatorHall(side,z){
  const x=side*1.30;
  box(x,.48,z,.13,.62,.92,M.metal);
  for(let i=0;i<6;i++)box(x-side*.078,.48,z-.34+i*.135,.05,.48,.065,M.brass,scene,false,true);
}
function coatHall(x,z){

function roomShell(center,side,wallMaterial=M.wall){
  const g=new THREE.Group();
  g.userData.isRoom=true;
  g.userData.paintCount=0;
  scene.add(g);
  const inner=side*HALL_HALF;
  const outer=side*(HALL_HALF+ROOM_W);
  const cx=side*(HALL_HALF+ROOM_W/2);
  const a=center-ROOM_L/2;
  const b=center+ROOM_L/2;

  box(cx,-.07,center,ROOM_W,.14,ROOM_L,M.wood,g,false,true);
  const ceiling=box(cx,ROOM_H+.02,center,ROOM_W,.16,ROOM_L,M.darkWood,g,false,true);
  box(outer,ROOM_H/2,center,.18,ROOM_H,ROOM_L,wallMaterial,g,false,true);
  box(cx,ROOM_H/2,a,ROOM_W,ROOM_H,.18,wallMaterial,g,false,true);
  box(cx,ROOM_H/2,b,ROOM_W,ROOM_H,.18,wallMaterial,g,false,true);

  box(outer-side*.11,.56,center,.10,.12,ROOM_L,M.darkWood,g,false,true);
  box(outer-side*.11,4.43,center,.11,.17,ROOM_L,M.wood,g,false,true);

  /* simple floor-board seams */
  for(let z=a+.5;z<b;z+=1.9){
    box(cx,.012,z,ROOM_W-.2,.022,.026,M.darkWood,g,false,true);
  }

  addCollider(outer-side*.10,outer+side*.02,a,b);

  return{g,center,side,inner,outer,cx,a,b,ceiling};
}

/* ------------------------------------------------------------
   PAINTING SYSTEM — canvas-like, varied night scenes
   ------------------------------------------------------------ */
const clickable=[];
const artNames=[
  'The Orange Hour','A Quiet December','The Night Feeling','Anemoia',
  'After Midnight','Somewhere Familiar','The Empty Road','Rain at 2 AM',
  'Lights Left On','A House Across the Street','Before Everyone Wakes',
  'The Last Car Home','Quiet Weather','November Window','A Place I Remember',
  'Between Two Streets','The Last Porch Light','Someone Was Here'
];

const artPalette=[
  ['#101820','#51687b','#c99c6c'],
  ['#1b211e','#5f6b62','#c9ae82'],
  ['#211a20','#73505d','#cf9a7b'],
  ['#121c25','#466278','#d1a06f'],
  ['#24231f','#69725e','#c7a27b'],
  ['#211b18','#6b5145','#c99570'],
  ['#171d22','#506674','#a7b5b3'],
  ['#271c22','#684656','#c2876f']
];
const artCache=new Map();

function makeArtTexture(seed){
  const key=Math.abs(seed)%24;
  if(artCache.has(key))return artCache.get(key);

  const r=seeded(key*7919+31);
  const c=document.createElement('canvas');
  c.width=420;c.height=560;
  const x=c.getContext('2d');
  const p=artPalette[key%artPalette.length];
  const g=x.createLinearGradient(0,0,0,560);
  g.addColorStop(0,p[0]);g.addColorStop(.58,p[1]);g.addColorStop(1,p[2]);
  x.fillStyle=g;x.fillRect(0,0,420,560);

  /* distinct composition families */
  const mode=key%12;
  x.fillStyle='rgba(7,10,12,.70)';
  x.fillRect(0,370,420,190);

  if(mode===0||mode===5){
    x.fillStyle='#24282b';
    x.beginPath();x.moveTo(116,375);x.lineTo(300,375);x.lineTo(267,244);x.lineTo(188,244);x.closePath();x.fill();
    x.fillStyle='#302a27';x.fillRect(92,218,232,132);
    x.beginPath();x.moveTo(63,218);x.lineTo(208,105);x.lineTo(356,218);x.closePath();x.fill();
    x.fillStyle='#e1b16c';x.fillRect(135,256,42,53);x.fillRect(240,256,42,53);
  }
  else if(mode===1||mode===6){
    x.fillStyle='#182632';x.fillRect(42,60,336,318);
    x.strokeStyle='rgba(215,228,235,.40)';x.lineWidth=3;
    for(let i=0;i<42;i++){const px=55+r()*320,py=72+r()*275;x.beginPath();x.moveTo(px,py);x.lineTo(px-6,py+18+r()*34);x.stroke()}
    x.fillStyle='#ecc17b';x.fillRect(270,230,70,90);
  }
  else if(mode===2||mode===7){
    x.fillStyle='#161a1d';x.fillRect(55,252,312,116);
    x.fillStyle='#635b51';x.fillRect(96,215,220,43);
    x.fillStyle='#dcae72';x.fillRect(130,266,150,40);
    x.fillStyle='#e2b979';
    for(let i=0;i<6;i++)x.fillRect(38+i*66,420+r()*10,4,4);
  }
  else if(mode===3||mode===8){
    x.fillStyle='#202629';x.fillRect(65,235,290,140);
    x.fillStyle='#2d2725';x.beginPath();x.moveTo(42,235);x.lineTo(210,112);x.lineTo(380,235);x.closePath();x.fill();
    x.fillStyle='#efc17c';x.fillRect(136,278,42,58);x.fillRect(242,278,42,58);
  }
  else if(mode===4||mode===9){
    x.fillStyle='#171c20';x.fillRect(55,84,310,310);
    x.fillStyle='#6f665d';x.fillRect(104,300,212,70);
    x.fillStyle='#e8bc79';x.fillRect(235,155,82,120);
    x.fillStyle='#f7d999';x.fillRect(256,175,40,78);
  }
  else{
    x.fillStyle='#171b1d';x.fillRect(0,322,420,238);
    x.fillStyle='#2b2825';x.fillRect(111,210,198,130);
    x.beginPath();x.moveTo(86,210);x.lineTo(210,119);x.lineTo(335,210);x.closePath();x.fill();
    x.fillStyle='#dbab6c';x.fillRect(145,244,46,55);x.fillRect(226,244,46,55);
    x.fillStyle='rgba(214,221,218,.12)';x.beginPath();x.ellipse(210,360,160,50,0,0,Math.PI*2);x.fill();
  }

  /* subtle canvas weave */
  for(let i=0;i<900;i++){
    x.fillStyle=`rgba(255,255,255,${.004+r()*.015})`;
    x.fillRect(r()*420,r()*560,1,1);
  }
  const v=x.createLinearGradient(0,0,0,560);
  v.addColorStop(0,'rgba(255,255,255,.035)');
  v.addColorStop(.72,'rgba(255,255,255,0)');
  v.addColorStop(1,'rgba(0,0,0,.10)');
  x.fillStyle=v;x.fillRect(0,0,420,560);

  const t=new THREE.CanvasTexture(c);
  t.encoding=THREE.sRGBEncoding;
  t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),4);
  artCache.set(key,t);
  return t;
}

function addPainting(group,x,y,z,rotationY,seed,scale=1,note='A quiet piece from the gallery.'){
  const w=1.00*scale;
  const h=1.28*scale;
  const frame=0.065*scale;

  const art=new THREE.Mesh(
    new THREE.PlaneGeometry(w,h),
    new THREE.MeshStandardMaterial({
      map:makeArtTexture(seed),
      roughness:.84,
      emissive:0x241912,
      emissiveIntensity:.18,
      side:THREE.DoubleSide
    })
  );

  art.position.set(x,y,z);
  art.rotation.y=rotationY;
  group.add(art);

  const sideWall=Math.abs(Math.abs(rotationY)-Math.PI/2)<.2;

  if(sideWall){
    box(x,y+h/2+.035,z,frame,.075,w+.12,M.darkWood,group,false,true);
    box(x,y-h/2-.035,z,frame,.075,w+.12,M.darkWood,group,false,true);
    box(x,y,z-w/2-.035,.075,h+.12,frame,M.darkWood,group,false,true);
    box(x,y,z+w/2+.035,.075,h+.12,frame,M.darkWood,group,false,true);
  }else{
    box(x,y+h/2+.035,z,w+.12,.075,frame,M.darkWood,group,false,true);
    box(x,y-h/2-.035,z,w+.12,.075,frame,M.darkWood,group,false,true);
    box(x-w/2-.035,y,z,.075,h+.12,frame,M.darkWood,group,false,true);
    box(x+w/2+.035,y,z,.075,h+.12,frame,M.darkWood,group,false,true);
  }

  art.userData.title=artNames[Math.abs(seed)%artNames.length];
  art.userData.note=note;
  clickable.push(art);
  if(group.userData?.isRoom)group.userData.paintCount++;
  return art;
}

function outerPaint(room,y,z,seed,scale,note){
  addPainting(
    room.g,
    room.outer-room.side*.055,
    y,z,
    -room.side*Math.PI/2,
    seed,
    scale,
    note
  );
}
function frontPaint(room,y,z,seed,scale,note){
  addPainting(room.g,room.cx,y,room.a+.055,0,seed,scale,note);
}
function backPaint(room,y,z,seed,scale,note){
  addPainting(room.g,room.cx,y,room.b-.055,Math.PI,seed,scale,note);
}

function practicalRoomLight(g,x,y,z,color,intensity,dist){
  sphere(x,y,z,.075,cmat(color,.20,color,2.1),g);
  const l=new THREE.PointLight(color,intensity,dist,2);
  l.position.set(x,y,z);
  l.castShadow=true;
  g.add(l);
  return l;
}

function salonRow(room,wall,count,startSeed,y=2.0,scale=.5,note='A framed night scene from the collection.'){
  const span=ROOM_L-3.3;
  for(let i=0;i<count;i++){
    const z=wall==='outer'
      ?room.a+1.7+i*(span/(count-1))
      :null;

    if(wall==='outer')outerPaint(room,y,z,startSeed+i,scale,note);
    else if(wall==='front')frontPaint(room,y,0,startSeed+i,scale,note);
    else if(wall==='back')backPaint(room,y,0,startSeed+i,scale,note);
  }
}

/* ------------------------------------------------------------

function buildCinema(r){
  const g=r.g,s=r.side;

  /* dark but readable cinema carpet */
  box(r.cx,.015,r.center,ROOM_W-.20,.035,ROOM_L-.20,new THREE.MeshStandardMaterial({map:rug(41,'#3c252d'),roughness:1}),g,false,true);
  box(r.cx,.036,r.center,1.55,.022,ROOM_L-.4,new THREE.MeshStandardMaterial({map:rug(42,'#5b3440'),roughness:1}),g,false,true);

  /* screen on the far wall — logical sight line from the seats */
  box(r.cx,r.center*0+2.70,r.b-.14,6.15,.30,.32,M.darkWood,g);
  box(r.cx,2.70,r.b-.28,5.45,.05,.04,cmat(0x8997a0,.73,0x25343e,.35),g,false,true);
  box(r.cx,4.10,r.b-.33,5.75,.12,.10,M.brass,g,false,true);

  /* curtains */
  for(const x of[-2.98,2.98]){
    const c=box(r.cx+x,2.62,r.b-.34,.48,3.1,.26,M.burgundy,g);
    c.rotation.z=x<0?.035:-.035;
  }
  for(let i=0;i<7;i++)box(r.cx-2.72+i*.88,2.58,r.b-.30,.18,3.08,.20,M.burgundy,g);

  const screenGlow=practicalRoomLight(g,r.cx,2.7,r.b-.70,0x93bedb,.80,7.5);
  screenGlow.castShadow=false;

  /* projector at rear of the auditorium */
  const px=r.cx;
  const pz=r.a+3.3;
  box(px,2.45,pz,.84,.48,.64,M.metal,g);
  cyl(px,2.45,pz-.39,.18,.18,M.brass,18,g,{x:Math.PI/2});
  const projector=new THREE.SpotLight(0xb8d7eb,.95,20,Math.PI/9,.72,1.3);
  projector.position.set(px,2.52,pz+.28);
  projector.target.position.set(r.cx,2.72,r.b-.50);
  g.add(projector,projector.target);

  /* seats: all face the screen, with realistic spacing and a few missing */
  for(let row=0;row<4;row++){
    const zz=r.a+7.0+row*2.15;
    for(let col=-2;col<=2;col++){
      if((row===1&&col===2)||(row===3&&col===-1)||(row===3&&col===1))continue;
      const seat=new THREE.Group();
      seat.position.set(r.cx+col*1.05,.0,zz);
      seat.rotation.y=0;
      g.add(seat);
      box(0,.40,0,.72,.18,.70,M.burgundy,seat);
      box(0,.88,-.27,.72,.92,.13,M.burgundy,seat);
      for(const dx of[-.24,.24])for(const dz of[-.23,.23])box(dx,.17,dz,.07,.34,.07,M.darkWood,seat);
    }
  }

  /* aisle lights */
  for(let i=0;i<5;i++){
    box(r.cx,.11,r.a+6.2+i*2.15,.07,.04,.07,cmat(0xffd38a,.25,0xffa84c,2.1),g,false,true);
  }

  /* old foyer at the entrance end */
  const fy=r.a+1.8;
  box(r.outer-s*.10,1.25,fy,.45,2.4,3.3,M.darkWood,g);
  box(r.outer-s*.18,1.70,fy,.05,.70,2.1,cmat(0x29262b,.55),g,false,true);
  practicalRoomLight(g,r.outer-s*.40,2.45,fy,0xffc47c,.50,4.2);

  /* concession counter */
  const cz=r.a+4.3;
  box(r.inner+s*1.0,.82,cz,1.45,.15,2.5,M.wood,g);
  box(r.inner+s*1.0,.43,cz,1.30,.78,2.30,M.darkWood,g);
  box(r.inner+s*.93,1.50,cz-.72,.62,1.10,.54,M.burgundy,g);
  box(r.inner+s*.93,2.04,cz-.72,.52,.40,.46,M.glass,g,false,true);

  /* poster strip in foyer */
  for(let i=0;i<4;i++){
    addPainting(g,r.inner+s*.08,2.05,r.a+2.1+i*.85,s*Math.PI/2,3000+i,.42,'A faded cinema poster from the theater’s final years.');
  }

  /* 50 gallery works: 30 on the outer wall + 20 on two freestanding gallery partitions */
  let n=0;
  for(const y of[1.45,2.82]){
    for(let i=0;i<13;i++){
      outerPaint(r,y,r.a+1.65+i*((ROOM_L-3.3)/12),3000+n,.48,'One of the paintings displayed inside the abandoned cinema.');
      n++;
    }
  }

  for(const pX of[r.inner+s*2.55,r.inner+s*4.0]){
    box(pX,2.12,r.center,.13,4.0,8.2,M.darkWood,g);
    for(let i=0;i<10;i++){
      addPainting(g,pX-s*.08,2.08,r.a+1.55+i*2.02,-s*Math.PI/2,3200+n,.41,'A smaller work on a temporary wooden gallery wall inside the old cinema.');
      n++;
    }
  }

  /* little ceiling lights keep the room readable */
  for(const z of[r.a+7,r.center,r.b-5]){
    practicalRoomLight(g,r.cx,4.02,z,0xffc98d,.38,5.8);
  }

  addParticles(g,r,'dust',70,0xd8cec1,.016,.22);
}

  for(const zz of[hz-1.70,hz+1.70]){

  box(hx+s*1.45,3.34,hz-.82,.58,1.10,.55,M.brick,g);

    sphere(hx+s*1.45+Math.sin(i)*.05,3.95+i*.24,hz-.82+Math.cos(i)*.03,.13+i*.03,cmat(0xaeb5bc,1),g).material.opacity=.12;
  }

  /* pine trees with varied heights */
  for(let i=0;i<10;i++)pine(g,r.inner+s*(4.0+(i%4)*1.95),r.a+1.1+i*2.35,.65+(i%4)*.18);

  /* fence and wood pile */
  for(let i=0;i<9;i++)cyl(r.inner+s*5.8,.53,r.a+1+i*2.55,.045,1.05,M.darkWood,10,g);
  lineBetween(new THREE.Vector3(r.inner+s*5.8,.78,r.a+1),new THREE.Vector3(r.inner+s*5.8,.78,r.b-1),.035,M.darkWood,g);
  lineBetween(new THREE.Vector3(r.inner+s*5.8,.39,r.a+1),new THREE.Vector3(r.inner+s*5.8,.39,r.b-1),.035,M.darkWood,g);

  for(let i=0;i<5;i++)cyl(r.inner+s*6.0,.22+i*.16,r.b-3.0,.085,.95,M.darkWood,10,g,{z:Math.PI/2});

  /* lantern */
  const lx=r.inner+s*3.05,lz=r.b-2.15;
  box(lx,.80,lz,.21,.37,.21,M.metal,g);
  practicalRoomLight(g,lx,.84,lz,0xffa653,.52,3.8);

  /* a covered rural art pavilion: this is why 24 paintings are outside */
  const px=r.inner+s*1.9;
  box(px,1.90,r.center,.30,3.55,15.8,wallMaterialForSnow(),g);
  box(px,3.82,r.center,.72,.22,16.2,M.darkWood,g);
  box(px,4.02,r.center,.78,.20,16.4,M.snow,g,false,true);

  /* interior of the pavilion stays warm and protected from snow */
  practicalRoomLight(g,px-s*.55,3.05,r.center,0xffc67d,.52,7.2);
  practicalRoomLight(g,px-s*.55,2.70,r.center-5.0,0xffc67d,.40,5.2);
  practicalRoomLight(g,px-s*.55,2.70,r.center+5.0,0xffc67d,.40,5.2);

  for(let i=0;i<24;i++){

    addPainting(g,px-s*.17,2.00,z,-s*Math.PI/2,5000+i,.46,'A winter night painting protected beneath the rural gallery pavilion.');
  }

  /* snow banks / footprints */
  for(let i=0;i<14;i++){
    const x=r.inner+s*(2.5+(i%4)*2.55);

   ------------------------------------------------------------ */
function buildStreet(r){
  const g=r.g,s=r.side;
  r.ceiling.visible=false;
  r.g.children[2].visible=false;
  r.g.children[3].visible=false;
  r.g.children[4].visible=false;

  /* night sky panel */
  box(r.cx,4.20,r.center,14.8,.05,23.5,cmat(0x314653,1,0x142430,.30),g,false,true);
  box(r.cx,-.02,r.center,14.8,.08,23.5,cmat(0x454342,1),g,false,true);

  const roadX=r.cx-s*2.1;
  box(roadX,.015,r.center,4.75,.035,ROOM_L-.25,M.asphalt,g,false,true);
  for(const e of[-3.35,3.35])box(roadX,.055,r.center+e,1.42,.08,ROOM_L-.2,M.concrete,g,false,true);
  for(let i=0;i<11;i++)box(roadX,.058,r.a+1.5+i*2.02,.055,.025,.96,cmat(0xc9bea7,.88),g,false,true);

  /* four slightly different homes */
  houseDetailed(g,roadX-s*3.35,r.center-4.8,.98,.03,false,s,1);
  houseDetailed(g,roadX-s*3.60,r.center+4.0,.82,-.06,false,s,1);
  houseDetailed(g,roadX+s*3.30,r.center-3.8,.90,.06,false,s,-1);
  houseDetailed(g,roadX+s*3.45,r.center+5.0,.77,-.05,false,s,-1);

  /* utility infrastructure */
  const poleX=r.inner+s*2.35;
  cyl(poleX,2.50,r.a+4,.06,4.65,M.darkWood,10,g);
  box(poleX,4.24,r.a+4,.12,.10,1.60,M.darkWood,g);
  lineBetween(new THREE.Vector3(poleX,4.24,r.a+4),new THREE.Vector3(r.outer-s*.22,4.04,r.b-2.1),.014,M.metal,g);
  lineBetween(new THREE.Vector3(poleX,4.15,r.a+4),new THREE.Vector3(r.outer-s*.22,4.30,r.a+1),.014,M.metal,g);

  for(const z of[r.a+2,r.center-1,r.center+7])streetLamp(g,roadX-s*2.55,z,s);
  car(g,roadX-s*1.65,r.center+1.2);
  mailbox(g,roadX+s*4.0,r.center-2.0);
  hydrant(g,roadX-s*4.05,r.center+5.5);

  /* one rubbish bin by a driveway — purposeful, not decorative */
  box(roadX+s*4.05,.52,r.center+7.1,.45,1.05,.55,cmat(0x3c4847,.86),g);
  box(roadX+s*4.05,1.08,r.center+7.08,.42,.08,.51,M.darkWood,g);

  /* 24 paintings are integrated into house windows as a neighborhood art walk.
     4 houses × 6 works. They are visible through warm-lit windows. */
  let seed=6000;
  const houseSpecs=[
    [roadX-s*3.35,r.center-4.8,.98],
    [roadX-s*3.60,r.center+4.0,.82],
    [roadX+s*3.30,r.center-3.8,.90],
    [roadX+s*3.45,r.center+5.0,.77]
  ];

  for(let h=0;h<4;h++){
    const hs=houseSpecs[h];
    const hx=hs[0],hz=hs[1],sc=hs[2];
    const frontSide=-1;

    for(let i=0;i<6;i++){
      const wx=h<2?hx-s*.03:hx+s*.03;
      const row=i<3?0:1;
      const col=i%3;
      const wz=hz+[-.88,0,.88][col]*sc;
      const wy=row===0?1.22*sc:1.95*sc;
      const glass=cmat(
        row===0&&col===1?0xd19c59:0x2b3640,
        .34,
        row===0&&col===1?0x9b602a:0,
        row===0&&col===1?.75:0
      );
      box(wx,wy,wz,.025,.48*sc,.36*sc,glass,g,false,true);
      const rot=h<2?Math.PI/2:-Math.PI/2;
      addPainting(g,wx+(h<2?s*.018:-s*.018),wy,wz,rot,seed++,.24,'A night painting visible through the window of the neighborhood art walk.');
    }
  }

  /* porch lamps / window pools */
  for(const spec of[
    [roadX-s*3.35,r.center-4.8,.98],
    [roadX-s*3.60,r.center+4.0,.82],
    [roadX+s*3.30,r.center-3.8,.90],
    [roadX+s*3.45,r.center+5.0,.77]
  ]){
    const l=practicalRoomLight(g,spec[0]-(spec[0]>0?s*.12:-s*.12),2.30,spec[1],0xffbf69,.30,4.5);
    l.castShadow=false;
  }

  addParticles(g,r,'mist',55,0xb9c9d1,.017,.11);
}

function houseDetailed(g,x,z,sc,rot,garage,s,frontSide){
  const q=new THREE.Group();
  q.position.set(x,0,z);
  q.rotation.y=rot;
  g.add(q);

  const hm=new THREE.MeshStandardMaterial({
    map:wood(150+Math.floor(x*3+z),false),
    roughness:.95
  });

  const width=2.65*sc;
  const depth=3.0*sc;
  const height=2.15*sc;

  box(0,height/2,0,width,height,depth,hm,q);
  box(0,height+.10,0,width+.28,.36*sc,depth+.30,M.darkWood,q);

  /* front porch facing the street */
  box(frontSide*(width/2+.28),.36,0,.62,.16,1.58*sc,M.wood,q);
  box(frontSide*(width/2+.31),1.45,0,.08,.10,1.72*sc,M.darkWood,q);
  for(const zz of[-.72,.72])cyl(frontSide*(width/2+.31),.82,zz*sc,.045,1.52*sc,M.darkWood,10,q);

  /* three downstairs windows with three upstairs windows. The door is slightly off-centre, so the facade actually works. */
  const windowZ=[-.88,0,.88];
  for(const zz of windowZ){
    box(frontSide*(width/2+.035),1.22*sc,zz*sc,.045,.62*sc,.52*sc,cmat(zz===0?0xd6a15c:0x2a3439,.28,zz===0?0xa5622e:0,zz===0?.70:0),q,false,true);
    box(frontSide*(width/2+.07),1.22*sc,zz*sc,.025,.48*sc,.39*sc,M.darkWood,q,false,true);
    box(frontSide*(width/2+.035),1.95*sc,zz*sc,.04,.50*sc,.44*sc,cmat(zz===2*.88?0x2a3033:0xd19a58,.30,zz===2*.88?0:0x92592a,zz===2*.88?0:.55),q,false,true);
  }

  box(frontSide*(width/2+.06),.88*sc,-.42*sc,.07,1.14*sc,.46*sc,M.darkWood,q);
  /* a small hedge and one planter */
  for(let i=0;i<3;i++){
    sphere(frontSide*(width*.46),.34*sc,-.96*sc+i*.42,.26*sc,M.greenery,q).scale.y=.72;
  }
}

   LOBBY 5 — EERIE VICTORIAN MYSTERY
   ------------------------------------------------------------ */
function buildHorror(r){
  const g=r.g,s=r.side;

  box(r.cx,.01,r.center,ROOM_W-.10,.035,ROOM_L-.10,new THREE.MeshStandardMaterial({map:wood(77,true),roughness:1}),g,false,true);
  box(r.cx,.036,r.center,7.9,.025,9.6,new THREE.MeshStandardMaterial({map:rug(79,'#422b34'),roughness:1}),g,false,true);

  /* draped sofa and one chair facing the wrong direction */
  const drape=new THREE.MeshStandardMaterial({map:fabric(82,'#766c60'),roughness:1});
  sofa(g,r.cx-s*3.45,r.center-2.0,drape,.02);
  const wrong=chair(g,r.cx-s*4.1,r.center+3.2,M.olive,.80);
  wrong.rotation.y=.80;

  /* tall cabinet */
  box(r.outer-s*.30,1.30,r.center+3.55,.54,2.40,2.12,M.darkWood,g);
  for(let i=0;i<3;i++)box(r.outer-s*.58,.74+i*.50,r.center+3.55,.05,.06,1.82,M.brass,g,false,true);

  /* clock */
  grandClock(g,r.outer-s*.30,r.center-4.65);

  /* mirror with dark reflected surface */
  box(r.outer-s*.31,2.24,r.center+.15,.07,1.72,1.06,M.darkWood,g);
  box(r.outer-s*.35,2.24,r.center+.15,.025,1.50,.84,cmat(0x1a1b1d,.14),g,false,true);

  /* old window and curtain */
  windowUnit(g,r.outer-s*.14,2.28,r.center+6.25,2.72,2.18,0x22272d);
  box(r.outer-s*.23,2.28,r.center+4.80,.17,2.36,.56,M.olive,g);

  /* small side table / telephone */
  sideTable(r.cx-s*5.20,r.center+1.15);
  box(r.cx-s*5.20,1.02,r.center+1.15,.44,.24,.30,M.metal,g);
  box(r.cx-s*5.20,.93,r.a+2.45,.31,.10,.26,M.metal,g);

  /* covered trunk */
  box(r.cx-s*4.85,.46,r.b-2.45,1.38,.62,.73,M.brown,g);

  /* candelabra */
  candelabra(g,r.cx-s*3.0,r.center-5.5);

  /* sealed service door — ordinary Victorian door, subtly ominous */
  box(r.cx-s*2.05,1.92,r.b-.13,.13,3.55,1.48,M.darkWood,g);
  box(r.cx-s*2.11,1.92,r.b-.20,.035,3.18,1.10,cmat(0x1d1617,1),g,false,true);
  sphere(r.cx-s*2.23,1.70,r.b-.20,.055,M.brass,g);

  /* 24 paintings in a believable salon arrangement */
  let n=0;

  /* 12 around the long outer wall */
  for(const y of[1.54,2.92]){
    for(let i=0;i<6;i++){
      const z=r.a+2.1+i*4.0;
      outerPaint(r,y,z,7000+n,.50,'A slightly unsettling Victorian night scene hanging in the old room.');
      n++;
    }
  }

  /* 6 on each end wall, forming salon groupings */
  for(let i=0;i<6;i++){
    const zz=r.a+.05;
    const x=r.inner+s*(2.4+i*1.7);
    addPainting(g,x,2.0,zz,0,7100+n,.43,'A framed work in the Victorian salon.');n++;
  }
  for(let i=0;i<6;i++){
    const zz=r.b-.05;
    const x=r.inner+s*(2.4+i*1.7);
    addPainting(g,x,2.0,zz,Math.PI,7200+n,.43,'A framed work hanging above the darker side of the room.');n++;
  }

  /* practical pools — enough visibility, still uneasy */
  practicalRoomLight(g,r.cx-s*4.9,2.20,r.center+1.55,0xffc27c,.40,4.8);
  practicalRoomLight(g,r.cx-s*3.0,2.40,r.center-5.5,0xffc07a,.28,3.5);
  practicalRoomLight(g,r.outer-s*.60,2.35,r.center+6.25,0x708ca0,.16,4.5);

  addParticles(g,r,'dust',80,0xd0c6bc,.016,.20);
}

const rooms=[];
for(let i=0;i<lobbyInfo.length;i++){
  const info=lobbyInfo[i];
  const r=roomShell(lobbyCenters[i],info.side,info.type==='horror'?M.wallDark:M.wall);

function er(){return} // harmless marker; kept outside movement path
document.addEventListener('pointerlockchange',()=>pointerLocked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!pointerLocked)return;yaw-=e.movementX*.00225;pitch-=e.movementY*.00185;pitch=Math.max(-Math.PI/2+.08,Math.min(Math.PI/2-.08,pitch))});
function move(dt){if(!controlsEnabled)return;let ax=0,az=0;if(keys.KeyA)ax--;if(keys.KeyD)ax++;if(keys.KeyW)az--;if(keys.KeyS)az++;if(ax||az){const l=Math.hypot(ax,az);ax/=l;az/=l;const speed=2.85,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),tx=(rx*ax+fx*az)*speed,tz=(rz*ax+fz*az)*speed;vx+=(tx-vx)*Math.min(1,dt*12);vz+=(tz-vz)*Math.min(1,dt*12);footTimer+=dt;if(footTimer>.43){footstep();footTimer=0}}else{vx*=Math.pow(.001,dt);vz*=Math.pow(.001,dt)}const nx=camera.position.x+vx*dt,nz=camera.position.z+vz*dt;if(canMove(nx,camera.position.z))camera.position.x=nx;else vx=0;if(canMove(camera.position.x,nz))camera.position.z=nz;else vz=0;camera.rotation.y=yaw;camera.rotation.x=pitch}

/* ------------------------------------------------------------
   PAINTING CLICK
   ------------------------------------------------------------ */
const raycaster=new THREE.Raycaster();
function clickPainting(){raycaster.setFromCamera({x:0,y:0},camera);const hits=raycaster.intersectObjects(clickable,false);if(!hits.length)return;const p=hits[0].object;document.getElementById('noteTitle').textContent=p.userData.title;document.getElementById('noteText').textContent=p.userData.note;document.getElementById('noteModal').style.display='flex';document.exitPointerLock?.()}
document.getElementById('noteClose').onclick=()=>document.getElementById('noteModal').style.display='none';document.getElementById('noteModal').onclick=e=>{if(e.target.id==='noteModal')e.target.style.display='none'};

/* ------------------------------------------------------------
   AUDIO
   ------------------------------------------------------------ */
let audioCtx=null,masterGain=null,audioOn=true;
function setupAudio(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();masterGain=audioCtx.createGain();masterGain.gain.value=.32;masterGain.connect(audioCtx.destination);const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();osc.type='sine';osc.frequency.value=49;g.gain.value=.05;f.type='lowpass';f.frequency.value=145;osc.connect(f);f.connect(g);g.connect(masterGain);osc.start()}catch(e){console.warn(e)}}
function footstep(){if(!audioCtx||!audioOn)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type='triangle';o.frequency.setValueAtTime(83+Math.random()*13,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.036,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+.11);o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+.12)}
function roomTone(type){if(!audioCtx||!audioOn)return;const f={cinema:82,cottage:68,snow:124,street:91,horror:57}[type]||65,o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type=type==='horror'?'triangle':'sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.55,t+1.5);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.016,t+.18);g.gain.exponentialRampToValueAtTime(.0001,t+1.55);o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+1.6)}
document.getElementById('mute').onclick=()=>{audioOn=!audioOn;if(masterGain)masterGain.gain.setTargetAtTime(audioOn?.32:0,audioCtx.currentTime,.04);document.getElementById('mute').textContent=audioOn?'SOUND ON':'SOUND OFF'};

/* ------------------------------------------------------------
   ROOM DETECTION / ATMOSPHERE
   ------------------------------------------------------------ */
let currentArea='hall';let lastArea='hall';let toneCooldown=0;
function detectRoom(){let area='hall',idx=-1;for(let i=0;i<rooms.length;i++){const r=rooms[i];const insideZ=camera.position.z>=r.a&&camera.position.z<=r.b;const beyond=r.side<0?camera.position.x<-(HALL_HALF+.16):camera.position.x>(HALL_HALF+.16);if(insideZ&&beyond){area=lobbyInfo[i].type;idx=i;break}}if(area!==lastArea){currentArea=area;lastArea=area;toneCooldown=0;roomTone(area)}document.getElementById('roomLabel').textContent=idx>=0?lobbyInfo[idx].name:'HALLWAY'}

/* ------------------------------------------------------------
   ANIMATION
   ------------------------------------------------------------ */
let elapsed=0;
function animateWorld(dt){elapsed+=dt;for(const h of hallLights)h.l.intensity=Math.max(.48,h.base+.035*Math.sin(elapsed*1.35+h.phase)+.018*Math.sin(elapsed*5.2+h.phase*1.6));scene.traverse(o=>{const type=o.userData?.particleType;if(!type)return;const a=o.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3){if(type==='snow'){a[i+1]-=dt*.42;a[i]+=Math.sin(elapsed*.45+i)*dt*.004;if(a[i+1]<.2)a[i+1]=4.2}else if(type==='rain'){a[i+1]-=dt*3.1;if(a[i+1]<.2)a[i+1]=4.2}else if(type==='mist'){a[i+1]+=dt*.008;if(a[i+1]>4.1)a[i+1]=.25}else{a[i+1]+=dt*.014;if(a[i+1]>4.3)a[i+1]=.25}}o.geometry.attributes.position.needsUpdate=true});toneCooldown+=dt;if(currentArea!=='hall'&&toneCooldown>18){roomTone(currentArea);toneCooldown=0}}

/* ------------------------------------------------------------
   WELCOME
   ------------------------------------------------------------ */
const welcome=document.getElementById('welcome'),input=document.getElementById('nameInput'),enter=document.getElementById('enterBtn'),message=document.getElementById('welcomeMessage');
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function enterGallery(){const name=input.value.trim()||'Guest';message.innerHTML='Welcome, '+escapeHTML(name)+'. Your artwork is waiting for you in Lobby 1.';message.style.display='block';enter.style.display='none';input.style.display='none';setupAudio();if(audioCtx?.state==='suspended')audioCtx.resume();setTimeout(()=>{welcome.style.opacity='0';setTimeout(()=>{welcome.style.display='none';controlsEnabled=true;renderer.domElement.requestPointerLock?.()},650)},850)}
enter.onclick=enterGallery;input.onkeydown=e=>{if(e.key==='Enter')enterGallery()};
if(location.hash==='#preview'){welcome.style.display='none';controlsEnabled=true;}
setTimeout(()=>document.getElementById('loading').classList.add('hide'),1400);

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

let prev=performance.now();
function loop(){requestAnimationFrame(loop);const now=performance.now(),dt=Math.min(.05,(now-prev)/1000);prev=now;move(dt);detectRoom();setAtmosphere(currentArea);animateWorld(dt);renderer.render(scene,camera)}
loop();
</script>
</body>
