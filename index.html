<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>
<style>
  :root{ --neon:#5ef2ff; --paper:#e8dcc0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; font-family:'Georgia',serif; }
  #app{ position:relative; width:100%; height:100%; }
  canvas{ display:block; }

  #welcome{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 40%,#0a0a14 0%,#000 80%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:50; color:#cbd6e6;
  }
  #welcome h1{
    font-size:2.2em; letter-spacing:2px; color:var(--neon);
    text-shadow:0 0 12px var(--neon),0 0 30px var(--neon);
    margin-bottom:8px;
  }
  #welcome p{ opacity:.7; margin-bottom:22px; }
  #nameInput{
    padding:12px 16px; font-size:1.1em; border-radius:6px;
    border:1px solid #345; background:#0e1420; color:#e8f0ff;
    width:280px; text-align:center; margin-bottom:16px;
  }
  #enterBtn{
    padding:12px 28px; font-size:1.05em; letter-spacing:1px;
    cursor:pointer; border-radius:6px; border:1px solid var(--neon);
    background:transparent; color:var(--neon);
    text-shadow:0 0 8px var(--neon); transition:all .25s;
  }
  #enterBtn:hover{
    background:var(--neon); color:#001; box-shadow:0 0 20px var(--neon);
  }
  #welcomeMsg{
    font-size:1.3em; color:#fff; text-align:center;
    max-width:520px; line-height:1.5;
  }

  #crosshair{
    position:absolute; top:50%; left:50%; width:6px; height:6px;
    margin:-3px 0 0 -3px; border-radius:50%;
    background:rgba(255,255,255,.7); z-index:20; pointer-events:none;
  }

  #hint{
    position:absolute; bottom:18px; left:50%;
    transform:translateX(-50%); color:#9fb3c8; font-size:.85em;
    background:rgba(0,0,0,.4); padding:6px 14px;
    border-radius:20px; z-index:20; pointer-events:none;
  }

  #muteBtn{
    position:absolute; top:16px; right:16px; z-index:30;
    background:rgba(0,0,0,.5); color:#cde; border:1px solid #456;
    border-radius:6px; padding:8px 12px; cursor:pointer; font-size:.9em;
  }

  #roomLabel{
    position:absolute; top:16px; left:16px; z-index:20;
    color:var(--neon); text-shadow:0 0 8px var(--neon);
    font-size:1em; letter-spacing:2px; opacity:0; transition:opacity .6s;
  }

  .modalOverlay{
    position:absolute; inset:0; display:none; align-items:center;
    justify-content:center; z-index:60;
    background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
  }

  .note{
    width:340px; max-width:80vw; background:var(--paper);
    color:#3a2f22; padding:26px 24px; border-radius:2px;
    box-shadow:0 0 40px rgba(0,0,0,.7), inset 0 0 40px rgba(120,90,50,.25);
    transform:rotate(-1.2deg); font-family:'Georgia',serif; position:relative;
  }

  .note::before{
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(
      0deg,transparent,transparent 24px,rgba(0,0,0,.03) 25px
    );
    pointer-events:none;
  }

  .note h3{
    font-size:1.15em; margin-bottom:10px;
    border-bottom:1px solid rgba(0,0,0,.2); padding-bottom:6px;
  }

  .note p{ line-height:1.5; font-size:.95em; }

  .note button{
    margin-top:16px; padding:8px 16px;
    border:1px solid #3a2f22; background:transparent;
    cursor:pointer; color:#3a2f22;
  }

  .win{
    background:#111; color:#ffd27a; border:2px solid #ffd27a;
    box-shadow:0 0 40px #ffb84a; transform:rotate(0); text-align:center;
  }

  .win h3{ color:#ffd27a; border-color:#553; }
  .win button{ border-color:#ffd27a; color:#ffd27a; }

  #loading{
    position:absolute; inset:0; background:#000; color:#5ef2ff;
    display:flex; align-items:center; justify-content:center;
    z-index:100; font-size:1.1em; letter-spacing:2px;
  }
</style>
</head>
<body>
<div id="app">

  <div id="loading">LOADING GALLERY…</div>

  <div id="welcome">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of cozy &amp; eerie things</p>

    <div id="stepEnterName">
      <input id="nameInput" placeholder="Enter your name" maxlength="20">
      <br>
      <button id="enterBtn">ENTER GALLERY</button>
    </div>

    <div id="welcomeMsg" style="display:none;"></div>
  </div>

  <div id="roomLabel"></div>
  <div id="crosshair" style="display:none;"></div>

  <div id="hint" style="display:none;">
    WASD to move · mouse to look · click a painting
  </div>

  <button id="muteBtn" style="display:none;">🔊 Sound</button>

  <div class="modalOverlay" id="noteOverlay">
    <div class="note" id="noteBox">
      <h3 id="noteTitle">Untitled</h3>
      <p id="noteBody">...</p>
      <button id="noteClose">close</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================================
   UI
   ========================================================================= */

const $ = id => document.getElementById(id);

let gameStarted = false;
let galleryReady = false;
let dom = null;

function showFatalError(msg){
  const lbl = $('roomLabel');
  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';
  lbl.textContent = '⚠ ' + msg;
  console.error(msg);
}

$('enterBtn').onclick = () => {

  const name =
    $('nameInput').value.trim() || 'friend';

  $('stepEnterName').style.display = 'none';

  const wm = $('welcomeMsg');

  wm.style.display = 'block';

  wm.textContent =
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn('Audio failed to start:',e);
  }

  setTimeout(() => {

    $('welcome').style.display = 'none';
    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';

    gameStarted = true;

    if(!galleryReady){

      showFatalError(
        '3D engine did not start — open the browser console (F12) for details.'
      );

    }else if(dom){

      dom.requestPointerLock();

    }

  },2200);
};

$('muteBtn').onclick = () => {

  muted = !muted;

  if(master){
    master.gain.value =
      muted ? 0 : 0.25;
  }

  $('muteBtn').textContent =
    muted ? '🔇 Sound' : '🔊 Sound';
};

$('noteClose').onclick = () => {
  $('noteOverlay').style.display = 'none';
};

function openNote(d){

  if(dom){
    document.exitPointerLock();
  }

  const box = $('noteBox');

  box.classList.toggle(
    'win',
    !!d.winner
  );

  $('noteTitle').textContent =
    d.winner
      ? '🎉 You found a free print!'
      : d.label;

  $('noteBody').textContent =
    d.story;

  $('noteOverlay').style.display =
    'flex';
}


/* =========================================================================
   AUDIO
   ========================================================================= */

let audioCtx,
    master,
    noiseSrc,
    droneOsc,
    muted=false;

function footstepTick(dt){}

function startAudio(){

  if(audioCtx) return;

  audioCtx =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  master =
    audioCtx.createGain();

  master.gain.value=.25;

  master.connect(
    audioCtx.destination
  );

  droneOsc =
    audioCtx.createOscillator();

  droneOsc.type='sine';
  droneOsc.frequency.value=55;

  const droneGain =
    audioCtx.createGain();

  droneGain.gain.value=.15;

  droneOsc
    .connect(droneGain)
    .connect(master);

  droneOsc.start();

  const bufSize =
    2*audioCtx.sampleRate;

  const buf =
    audioCtx.createBuffer(
      1,
      bufSize,
      audioCtx.sampleRate
    );

  const data =
    buf.getChannelData(0);

  for(let i=0;i<bufSize;i++){

    data[i] =
      Math.random()*2-1;

  }

  noiseSrc =
    audioCtx.createBufferSource();

  noiseSrc.buffer=buf;
  noiseSrc.loop=true;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type='lowpass';
  filter.frequency.value=500;

  const noiseGain =
    audioCtx.createGain();

  noiseGain.gain.value=.06;

  noiseSrc
    .connect(filter)
    .connect(noiseGain)
    .connect(master);

  noiseSrc.start();

  setInterval(() => {

    if(
      muted ||
      !gameStarted ||
      !galleryReady
    ) return;

    const near =
      currentRoom();

    const o =
      audioCtx.createOscillator();

    const g =
      audioCtx.createGain();

    o.type =
      near && near.tag === 'LOBBY 5'
        ? 'sawtooth'
        : 'sine';

    o.frequency.value =
      near && near.tag === 'LOBBY 5'
        ? 120 + Math.random()*200
        : 300 + Math.random()*200;

    g.gain.value=0;

    o.connect(g).connect(master);

    o.start();

    g.gain.linearRampToValueAtTime(
      near && near.tag === 'LOBBY 5'
        ? .08
        : .03,
      audioCtx.currentTime+.3
    );

    g.gain.linearRampToValueAtTime(
      0,
      audioCtx.currentTime+1.4
    );

    o.stop(
      audioCtx.currentTime+1.5
    );

  },5000);
}

function currentRoom(){

  if(
    !window._rooms ||
    !window._camera
  ) return null;

  return window._rooms.reduce(
    (a,r) =>
      Math.abs(r.z-window._camera.position.z)
      <
      Math.abs(a.z-window._camera.position.z)
        ? r
        : a,
    window._rooms[0]
  );
}


/* =========================================================================
   THREE SETUP
   ========================================================================= */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x03030a);

const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth/innerHeight,
    .1,
    200
  );

camera.position.set(
  0,
  1.7,
  4
);

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    2
  )
);

dom =
  renderer.domElement;

$('app').prepend(dom);

$('loading').style.display =
  'none';

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================================
   LIGHTING
   ========================================================================= */

scene.add(
  new THREE.AmbientLight(
    0x252a38,
    1.25
  )
);

const hallLight =
  new THREE.PointLight(
    0x506080,
    .7,
    45
  );

hallLight.position.set(
  0,
  3.4,
  16
);

scene.add(hallLight);


/* =========================================================================
   FLOOR / CEILING
   ========================================================================= */

const floorMat =
  new THREE.MeshStandardMaterial({
    color:0x111116,
    roughness:1
  });

const floor =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      30,
      140
    ),
    floorMat
  );

floor.rotation.x =
  -Math.PI/2;

floor.position.set(
  0,
  0,
  60
);

scene.add(floor);

const ceil =
  floor.clone();

ceil.position.y =
  4.2;

ceil.rotation.x =
  Math.PI/2;

scene.add(ceil);


/* =========================================================================
   TEXTURES
   ========================================================================= */

function canvasTexture(
  draw,
  w=512,
  h=384
){

  const c =
    document.createElement('canvas');

  c.width=w;
  c.height=h;

  const ctx =
    c.getContext('2d');

  draw(
    ctx,
    w,
    h
  );

  const tex =
    new THREE.CanvasTexture(c);

  tex.needsUpdate=true;

  return tex;
}

function placeholderArt(
  label,
  hue
){

  return canvasTexture(
    (ctx,w,h)=>{

      const g =
        ctx.createLinearGradient(
          0,
          0,
          w,
          h
        );

      g.addColorStop(
        0,
        `hsl(${hue},25%,18%)`
      );

      g.addColorStop(
        .55,
        `hsl(${hue},35%,8%)`
      );

      g.addColorStop(
        1,
        '#050509'
      );

      ctx.fillStyle=g;
      ctx.fillRect(
        0,
        0,
        w,
        h
      );

      ctx.fillStyle=
        'rgba(255,255,255,.06)';

      for(
        let i=0;
        i<14;
        i++
      ){

        ctx.beginPath();

        ctx.arc(
          Math.random()*w,
          Math.random()*h,
          10+Math.random()*40,
          0,
          Math.PI*2
        );

        ctx.fill();

      }

      ctx.fillStyle=
        '#dce9ef';

      ctx.font=
        'bold 28px Georgia';

      ctx.textAlign=
        'center';

      ctx.fillText(
        'RAMSHA ART STUDIO',
        w/2,
        h/2-15
      );

      ctx.font=
        '20px Georgia';

      ctx.fillStyle=
        'rgba(255,255,255,.72)';

      ctx.fillText(
        label,
        w/2,
        h/2+28
      );

    }
  );
}

function neonSignTexture(
  text,
  color
){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle=
        '#05070b';

      ctx.fillRect(
        0,
        0,
        w,
        h
      );

      ctx.font=
        'bold 42px Georgia';

      ctx.textAlign=
        'center';

      ctx.textBaseline=
        'middle';

      ctx.shadowColor=
        color;

      ctx.shadowBlur=
        20;

      ctx.fillStyle=
        color;

      ctx.fillText(
        text,
        w/2,
        h/2
      );

    },
    512,
    160
  );
}


/* =========================================================================
   PAINTINGS
   ========================================================================= */

const clickable=[];

function createPainting(
  cfg,
  group
){

  const w=1.5,
        h=1.05;

  const mat =
    new THREE.MeshStandardMaterial({
      map:
        placeholderArt(
          cfg.label,
          cfg.hue || 210
        ),
      roughness:.8
    });

  const mesh =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        w,
        h
      ),
      mat
    );

  mesh.position.set(
    cfg.x,
    cfg.y,
    cfg.z
  );

  mesh.rotation.y =
    cfg.ry;

  const frame =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        w+.14,
        h+.14
      ),
      new THREE.MeshStandardMaterial({
        color:0x17120f
      })
    );

  frame.position.copy(
    mesh.position
  );

  frame.rotation.y =
    cfg.ry;

  frame.translateZ(-.02);

  group.add(
    frame,
    mesh
  );

  mesh.userData =
    cfg;

  clickable.push(mesh);

  if(cfg.img){

    new THREE.TextureLoader().load(
      cfg.img,
      tex => {

        mat.map=tex;
        mat.needsUpdate=true;

      },
      undefined,
      ()=>{}
    );

  }
}


/* =========================================================================
   GENERAL OBJECT HELPERS
   ========================================================================= */

function prop(
  geo,
  color,
  x,
  y,
  z,
  ry=0,
  opts={}
){

  const mat =
    new THREE.MeshStandardMaterial({

      color,

      roughness:
        opts.roughness ?? .85,

      metalness:
        opts.metalness ?? 0,

      emissive:
        opts.emissive || 0x000000,

      emissiveIntensity:
        opts.emissiveIntensity || 0,

      transparent:
        !!opts.transparent,

      opacity:
        opts.opacity ?? 1

    });

  const m =
    new THREE.Mesh(
      geo,
      mat
    );

  m.position.set(
    x,
    y,
    z
  );

  if(ry)
    m.rotation.y=ry;

  if(opts.rx)
    m.rotation.x=opts.rx;

  if(opts.rz)
    m.rotation.z=opts.rz;

  return m;
}

function box(
  g,
  w,
  h,
  d,
  color,
  x,
  y,
  z,
  ry=0
){

  g.add(
    prop(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      color,
      x,
      y,
      z,
      ry
    )
  );

}

function cylinder(
  g,
  r1,
  r2,
  h,
  color,
  x,
  y,
  z,
  segments=12
){

  g.add(
    prop(
      new THREE.CylinderGeometry(
        r1,
        r2,
        h,
        segments
      ),
      color,
      x,
      y,
      z
    )
  );

}

function glowingBulb(
  g,
  color,
  x,
  y,
  z,
  intensity=1
){

  const bulb =
    prop(
      new THREE.SphereGeometry(
        .10,
        12,
        10
      ),
      color,
      x,
      y,
      z,
      0,
      {
        emissive:color,
        emissiveIntensity:intensity*2
      }
    );

  g.add(bulb);

  const light =
    new THREE.PointLight(
      color,
      intensity,
      7
    );

  light.position.set(
    x,
    y,
    z
  );

  g.add(light);

  flickerLights.push({
    light,
    mode:'soft',
    base:intensity
  });

  return bulb;
}

function carpet(
  g,
  w,
  d,
  color,
  x,
  z
){

  g.add(
    prop(
      new THREE.BoxGeometry(
        w,
        .035,
        d
      ),
      color,
      x,
      .025,
      z,
      0,
      {
        roughness:1
      }
    )
  );

}


/* =========================================================================
   UPGRADED LIFELIKE HELPERS
   ========================================================================= */

function roundedSeat(
  g,
  x,
  y,
  z,
  color,
  scaleX=1,
  scaleY=1,
  scaleZ=1
){

  const s =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .5,
        12,
        8
      ),
      new THREE.MeshStandardMaterial({
        color,
        roughness:.88
      })
    );

  s.position.set(
    x,
    y,
    z
  );

  s.scale.set(
    scaleX,
    scaleY,
    scaleZ
  );

  g.add(s);

  return s;
}

function detailedChair(
  g,
  x,
  z,
  seatColor=0x4a2028,
  scale=1
){

  const c =
    new THREE.Group();

  c.position.set(
    x,
    0,
    z
  );

  roundedSeat(
    c,
    0,
    .62,
    0,
    seatColor,
    .72*scale,
    .20*scale,
    .70*scale
  );

  roundedSeat(
    c,
    0,
    1.16,
    .28,
    seatColor,
    .72*scale,
    .78*scale,
    .18*scale
  );

  [-.48,.48].forEach(dx=>{

    c.add(
      prop(
        new THREE.CylinderGeometry(
          .045,
          .065,
          .48*scale,
          8
        ),
        0x241714,
        dx*scale,
        .43,
        0
      )
    );

    c.add(
      prop(
        new THREE.CylinderGeometry(
          .045,
          .055,
          .48*scale,
          8
        ),
        0x241714,
        dx*scale,
        .78,
        .03
      )
    );

  });

  c.add(
    prop(
      new THREE.BoxGeometry(
        .09*scale,
        .08*scale,
        .48*scale
      ),
      0x211312,
      -.43*scale,
      .79,
      .03
    )
  );

  c.add(
    prop(
      new THREE.BoxGeometry(
        .09*scale,
        .08*scale,
        .48*scale
      ),
      0x211312,
      .43*scale,
      .79,
      .03
    )
  );

  g.add(c);

  return c;
}

function roundTable(
  g,
  x,
  y,
  z,
  r,
  color=0x4b3020
){

  const top =
    prop(
      new THREE.CylinderGeometry(
        r,
        r*.98,
        .13,
        20
      ),
      color,
      x,
      y,
      z
    );

  g.add(top);

  const stem =
    prop(
      new THREE.CylinderGeometry(
        .09,
        .13,
        .62,
        12
      ),
      color,
      x,
      y-.36,
      z
    );

  g.add(stem);

  const foot =
    prop(
      new THREE.CylinderGeometry(
        .35,
        .42,
        .08,
        16
      ),
      color,
      x,
      y-.68,
      z
    );

  g.add(foot);

  return top;
}

function framedPicture(
  g,
  x,
  y,
  z,
  ry,
  w=.8,
  h=1.0,
  frameColor=0x241817
){

  const frame =
    prop(
      new THREE.BoxGeometry(
        w+.12,
        h+.12,
        .08
      ),
      frameColor,
      x,
      y,
      z,
      ry
    );

  g.add(frame);

  const art =
    prop(
      new THREE.PlaneGeometry(
        w,
        h
      ),
      0x303846,
      x,
      y,
      z,
      ry,
      {
        emissive:0x121722,
        emissiveIntensity:.15
      }
    );

  g.add(art);

}

function bookshelfDetailed(
  g,
  x,
  z
){

  const wood=0x3b251b;

  g.add(
    prop(
      new THREE.BoxGeometry(
        1.65,
        2.7,
        .35
      ),
      wood,
      x,
      1.35,
      z
    )
  );

  [.35,.95,1.55,2.15].forEach(y=>{

    g.add(
      prop(
        new THREE.BoxGeometry(
          1.42,
          .07,

function cobweb(
  g,
  x,
  y,
  z,
  ry=0
){

  const mat =
    new THREE.LineBasicMaterial({
      color:0x8a7774,
      transparent:true,
      opacity:.28
    });

  const pts=[];

  for(
    let i=0;
    i<7;
    i++
  ){

    const a =
      i*Math.PI/6;

    pts.push(
      new THREE.Vector3(
        Math.cos(a)*.75,
        Math.sin(a)*.55,
        0
      )
    );

  }

  const geo =
    new THREE.BufferGeometry()
      .setFromPoints(pts);

  const web =
    new THREE.Line(
      geo,
      mat
    );

  web.position.set(
    x,
    y,
    z
  );

  web.rotation.y=
    ry;

  g.add(web);

}


/* =========================================================================
   ROOM FACTORY
   ========================================================================= */

const ROOM_W=8.5;
const ROOM_D=11;
const ROOM_H=4.2;

const HALL_HALF=1.35;
const HALL_LENGTH=112;

const flickerLights=[];

function createRoom(cfg){

  const group =
    new THREE.Group();

  const cx =
    cfg.side *
    (
      HALL_HALF+
      ROOM_W/2
    );

  group.position.set(
    cx,
    0,
    cfg.z
  );

  scene.add(group);

  const wallMat =
    new THREE.MeshStandardMaterial({
      color:cfg.wallColor,
      roughness:.96,
      side:THREE.DoubleSide
    });

  const roomFloorMat =
    new THREE.MeshStandardMaterial({
      color:cfg.floorColor,
      roughness:1
    });

  /* FAR WALL */

  const far =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_D,
        ROOM_H
      ),
      wallMat
    );

  far.position.set(
    cfg.side*ROOM_W/2,
    ROOM_H/2,
    0
  );

  far.rotation.y=
    Math.PI/2;

  group.add(far);

  /* SIDE WALLS */

  [-1,1].forEach(s=>{

    const wall =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          ROOM_W,
          ROOM_H
        ),
        wallMat
      );

    wall.position.set(
      0,
      ROOM_H/2,
      s*ROOM_D/2
    );

    wall.rotation.y=
      s*Math.PI/2;

    group.add(wall);

  });

  /* FLOOR */

  const rf =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_D
      ),
      roomFloorMat
    );

  rf.rotation.x=
    -Math.PI/2;

  rf.position.y=.01;

  group.add(rf);

  /* ROOM LIGHT */

  const light =
    new THREE.PointLight(
      cfg.light,
      cfg.lightIntensity || 1,
      14
    );

  light.position.set(
    cfg.side*1.2,
    3.25,
    0
  );

  group.add(light);

  if(cfg.flicker){

    flickerLights.push({
      light,
      mode:cfg.flicker
    });

  }

  /* NEON ROOM LABEL */

  const signMat =
    new THREE.MeshBasicMaterial({
      map:
        neonSignTexture(
          cfg.tag,
          cfg.neon
        ),
      transparent:true
    });

  const sign =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        2.1,
        .65
      ),
      signMat
    );

  sign.position.set(
    -cfg.side*(ROOM_W/2-.15),
    3.15,
    0
  );

  sign.rotation.y=
    cfg.side<0
      ? Math.PI/2
      : -Math.PI/2;

  group.add(sign);

  /* PAINTINGS */

  if(cfg.paintings){

    cfg.paintings.forEach(
      p =>
        createPainting(
          p,
          group
        )
    );

  }

  if(cfg.decorate)
    cfg.decorate(group);

  return group;
}

/* =========================================================================
   CORRIDOR
   ========================================================================= */

function buildCorridor(){

  const doorHalf=
    HALL_HALF;

  /* LONG WALLS WITH ROOM GAPS */

  const roomCenters =
    rooms.map(
      r=>r.z
    );

  [-1,1].forEach(side=>{

    const wallX =
      side*HALL_HALF;

    const wallMat =
      new THREE.MeshStandardMaterial({
        color:0x171a22,
        roughness:.95,
        side:THREE.DoubleSide
      });

    const gaps =
      roomCenters.map(
        z=>[
          z-ROOM_D/2,
          z+ROOM_D/2
        ]
      );

    let cursor=0;

    gaps.forEach(
      gap=>{

        const start=
          cursor;

        const end=
          Math.max(
            cursor,
            gap[0]
          );

        if(end>start){

          const len=
            end-start;

          const wall=
            new THREE.Mesh(
              new THREE.PlaneGeometry(
                len,
                ROOM_H
              ),
              wallMat
            );

          wall.rotation.y=
            side*Math.PI/2;

          wall.position.set(
            wallX,
            ROOM_H/2,
            start+len/2
          );

          scene.add(wall);

        }

        cursor=
          gap[1];

      }
    );

    if(
      cursor<
      HALL_LENGTH
    ){

      const len=
        HALL_LENGTH-cursor;

      const wall=
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            len,
            ROOM_H
          ),
          wallMat
        );

      wall.rotation.y=
        side*Math.PI/2;

      wall.position.set(
        wallX,
        ROOM_H/2,
        cursor+len/2
      );

      scene.add(wall);

    }

  });


  /* WALL SCOnCES */

  for(
    let z=6;
    z<HALL_LENGTH;
    z+=10
  ){

    const nearRoom =
      rooms.some(
        r =>
          Math.abs(
            r.z-z
          )<ROOM_D/2
      );

    if(nearRoom)
      continue;

    [-1,1].forEach(side=>{

      const x=
        side*(HALL_HALF-.05);

      const fixture=
        prop(
          new THREE.BoxGeometry(
            .12,
            .32,
            .18
          ),
          0x34313a,
          x,
          2.55,
          z,
          0
        );

      scene.add(fixture);

      const bulb=
        prop(
          new THREE.SphereGeometry(
            .07,
            10,
            8
          ),
          0xc7dcff,
          x-side*.08,
          2.55,
          z,
          0,
          {
            emissive:0xabcaff,
            emissiveIntensity:1.8
          }
        );

      scene.add(bulb);

      const light=
        new THREE.PointLight(
          0x92aaff,
          .25,
          5
        );

      light.position.set(
        x-side*.12,
        2.55,
        z
      );

      scene.add(light);

    });

  }


  /* DOORWAY FRAMES */

  rooms.forEach(r=>{

    const side=
      r.side;

    const x=
      side*HALL_HALF;

    const z=
      r.z-ROOM_D/2;

    const mat=
      new THREE.MeshStandardMaterial({
        color:
          r.wallColor,
        roughness:.9
      });

    /* left post */
    scene.add(
      prop(
        new THREE.BoxGeometry(
          .14,
          ROOM_H,
          .16
        ),
        r.wallColor,
        x,
        ROOM_H/2,
        z
      )
    );

    /* right post */
    scene.add(
      prop(
        new THREE.BoxGeometry(
          .14,
          ROOM_H,
          .16
        ),
        r.wallColor,
        x,
        ROOM_H/2,
        r.z+ROOM_D/2
      )
    );

    /* top lintel */

    scene.add(
      prop(
        new THREE.BoxGeometry(
          .16,
          .18,
          ROOM_D
        ),
        r.wallColor,
        x,
        ROOM_H-.08,
        r.z
      )
    );

    /* threshold */

    scene.add(
      prop(
        new THREE.BoxGeometry(
          .35,
          .06,
          .8
        ),
        0x28242b,
        side*
          (HALL_HALF+.15),
        .03,
        z
      )
    );

  });


  /* CEILING LIGHTS */

  for(
    let z=4;
    z<HALL_LENGTH;
    z+=8
  ){

    const light=
      new THREE.PointLight(
        0x8191b0,
        .22,
        7
      );

    light.position.set(
      0,
      3.9,
      z
    );

    scene.add(light);

    const fixture=
      prop(
        new THREE.CylinderGeometry(
          .12,
          .15,
          .08,
          12
        ),
        0x30323b,
        0,
        4.02,
        z
      );

    scene.add(fixture);

  }


  /* CORRIDOR WALL DETAILS */

  for(
    let z=12;
    z<HALL_LENGTH;
    z+=16
  ){

    [-1,1].forEach(side=>{

      const frame =
        new THREE.Mesh(
          new THREE.BoxGeometry(
            .05,
            1.8,
            1.2
          ),
          new THREE.MeshStandardMaterial({
            color:0x252833,
            roughness:.9
          })
        );

      frame.position.set(
        side*
          (HALL_HALF-.035),
        1.65,
        z
      );

      scene.add(frame);

    });

  }

}

buildCorridor();


/* =========================================================================
   MOVEMENT
   ========================================================================= */

window._rooms=rooms;
window._camera=camera;

let yaw=Math.PI;
let pitch=0;

const keys={};

document.addEventListener(
  'keydown',
  e =>
    keys[e.code]=true
);

document.addEventListener(
  'keyup',
  e =>
    keys[e.code]=false
);

dom=renderer.domElement;

dom.addEventListener(
  'click',
  ()=>{
    if(
      gameStarted &&
      document.pointerLockElement!==dom
    ){
      dom.requestPointerLock();
    }
  }
);

document.addEventListener(
  'mousemove',
  e=>{

    if(
      document.pointerLockElement!==dom
    ) return;

    yaw -=
      e.movementX*.0022;

    pitch -=
      e.movementY*.0022;

    pitch =
      Math.max(
        -1.2,
        Math.min(
          1.2,
          pitch
        )
      );

  }
);

const LIMIT={
  xMin:
    -(HALL_HALF+
      ROOM_W-.4),

  xMax:
    HALL_HALF+
    ROOM_W-.4,

  zMin:1,

  zMax:HALL_LENGTH
};

function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    'YXZ'
  );

  const speed=
    3.2*dt;

  const fwd =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  let mv =
    new THREE.Vector3();

  if(keys['KeyW'])
    mv.add(fwd);

  if(keys['KeyS'])
    mv.sub(fwd);

  if(keys['KeyD'])
    mv.add(right);

  if(keys['KeyA'])
    mv.sub(right);

  if(mv.length()>0){

    mv
      .normalize()
      .multiplyScalar(speed);

    camera.position.x =
      Math.max(
        LIMIT.xMin,
        Math.min(
          LIMIT.xMax,
          camera.position.x+
          mv.x
        )
      );

    camera.position.z =
      Math.max(
        LIMIT.zMin,
        Math.min(
          LIMIT.zMax,
          camera.position.z+
          mv.z
        )
      );

    footstepTick(dt);

  }

  const near =
    rooms.reduce(
      (a,r) =>
        Math.abs(
          r.z-camera.position.z
        )
        <
        Math.abs(
          a.z-camera.position.z
        )
          ? r
          : a,
      rooms[0]
    );

  const lbl =
    document.getElementById(
      'roomLabel'
    );

  if(
    Math.abs(
      near.z-camera.position.z
    )<5.5
  ){

    lbl.style.opacity=1;

    lbl.textContent=
      near.tag;

  }else{

    lbl.style.opacity=0;

  }

}


/* =========================================================================
   ANIMATION
   ========================================================================= */

function animateFlicker(t){

  flickerLights.forEach(
    o=>{

      if(
        !o.light
      ) return;

      if(
        o.mode==='flicker'
      ){

        o.light.intensity =
          .75+
          Math.random()*.5;

      }

      else if(
        o.mode==='ember'
      ){

        o.light.intensity =
          .95+
          Math.sin(t*7)*.20+
          Math.random()*.08;

      }

      else if(
        o.mode==='lamp'
      ){

        o.light.intensity =
          .70+
          Math.sin(t*2.5)*.08;

      }

      else if(
        o.mode==='strobe'
      ){

        o.light.intensity =
          Math.sin(t*9)>0
            ? .72
            : .42;

      }

      else if(
        o.mode==='pulse'
      ){

        o.light.intensity =
          .8+
          Math.sin(t*2)*.2;

      }

      else if(
        o.mode==='soft'
      ){

        o.light.intensity =
          o.base+
          Math.sin(t*3)*.04;

      }

    }
  );

  scene.traverse(
    o=>{

      if(
        o.userData &&
        o.userData.isSnow
      ){

        const p =
          o.geometry.attributes.position;

        for(
          let i=1;
          i<p.count*3;
          i+=3
        ){

          p.array[i]-=.01;

          if(
            p.array[i]<0
          ){

            p.array[i]=ROOM_H;

          }

        }

        p.needsUpdate=true;

      }

      if(
        o.userData &&
        o.userData.isFire
      ){

        o.material.opacity =
          .8+
          Math.sin(t*10)*.2;

        o.material.transparent=true;

        const s=
          1+
          Math.sin(
            t*13+
            o.id
          )*.08;

        o.scale.x=s;
        o.scale.z=s;

      }

    }
  );

}


/* =========================================================================
   MAIN LOOP
   ========================================================================= */

const clock =
  new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  const t =
    performance.now()/
    1000;

  if(gameStarted)
    updateMovement(dt);

  animateFlicker(t);

  renderer.render(
    scene,
    camera
  );

}

galleryReady=true;

animate();

   ========================================================================= */

const raycaster =
  new THREE.Raycaster();

dom.addEventListener(
  'mousedown',
  e=>{

    if(!gameStarted)
      return;

    if(
      document.pointerLockElement!==dom
    )
      return;

    const mouse =
      new THREE.Vector2(
        0,
        0
      );

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits =
      raycaster.intersectObjects(
        clickable,
        false
      );

    if(
      hits.length
    ){

      openNote(
        hits[0].object.userData
      );

    }

  }
);
