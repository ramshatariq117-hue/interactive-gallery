<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>
<style>
  :root{ --neon:#5ef2ff; --paper:#e8dcc0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; font-family:'Georgia',serif; }
  #app{ position:relative; width:100%; height:100%; }
  canvas{ display:block; }

  /* ---------- Welcome screen ---------- */
  #welcome{
    position:absolute; inset:0; background:radial-gradient(circle at 50% 40%,#0a0a14 0%,#000 80%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; color:#cbd6e6;
  }
  #welcome h1{ font-size:2.2em; letter-spacing:2px; color:var(--neon); text-shadow:0 0 12px var(--neon),0 0 30px var(--neon); margin-bottom:8px; }
  #welcome p{ opacity:.7; margin-bottom:22px; }
  #nameInput{
    padding:12px 16px; font-size:1.1em; border-radius:6px; border:1px solid #345; background:#0e1420; color:#e8f0ff;
    width:280px; text-align:center; margin-bottom:16px;
  }
  #enterBtn{
    padding:12px 28px; font-size:1.05em; letter-spacing:1px; cursor:pointer; border-radius:6px; border:1px solid var(--neon);
    background:transparent; color:var(--neon); text-shadow:0 0 8px var(--neon); transition:all .25s;
  }
  #enterBtn:hover{ background:var(--neon); color:#001; box-shadow:0 0 20px var(--neon); }
  #welcomeMsg{ font-size:1.3em; color:#fff; text-align:center; max-width:520px; line-height:1.5; }

  /* ---------- HUD ---------- */
  #crosshair{
    position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border-radius:50%; background:rgba(255,255,255,.7); z-index:20; pointer-events:none;
  }
  #hint{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%); color:#9fb3c8; font-size:.85em;
    background:rgba(0,0,0,.4); padding:6px 14px; border-radius:20px; z-index:20; pointer-events:none;
  }
  #muteBtn{
    position:absolute; top:16px; right:16px; z-index:30; background:rgba(0,0,0,.5); color:#cde; border:1px solid #456;
    border-radius:6px; padding:8px 12px; cursor:pointer; font-size:.9em;
  }
  #roomLabel{
    position:absolute; top:16px; left:16px; z-index:20; color:var(--neon); text-shadow:0 0 8px var(--neon);
    font-size:1em; letter-spacing:2px; opacity:0; transition:opacity .6s;
  }

  /* ---------- Modals ---------- */
  .modalOverlay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:60;
    background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
  }
  .note{
    width:340px; max-width:80vw; background:var(--paper); color:#3a2f22; padding:26px 24px; border-radius:2px;
    box-shadow:0 0 40px rgba(0,0,0,.7), inset 0 0 40px rgba(120,90,50,.25);
    transform:rotate(-1.2deg); font-family:'Georgia',serif; position:relative;
  }
  .note::before{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(0,0,0,.03) 25px); pointer-events:none; }
  .note h3{ font-size:1.15em; margin-bottom:10px; border-bottom:1px solid rgba(0,0,0,.2); padding-bottom:6px; }
  .note p{ line-height:1.5; font-size:.95em; }
  .note button{ margin-top:16px; padding:8px 16px; border:1px solid #3a2f22; background:transparent; cursor:pointer; color:#3a2f22; }
  .win{ background:#111; color:#ffd27a; border:2px solid #ffd27a; box-shadow:0 0 40px #ffb84a; transform:rotate(0); text-align:center; }
  .win h3{ color:#ffd27a; border-color:#553; }
  .win button{ border-color:#ffd27a; color:#ffd27a; }

  #loading{ position:absolute; inset:0; background:#000; color:#5ef2ff; display:flex; align-items:center; justify-content:center; z-index:100; font-size:1.1em; letter-spacing:2px; }
</style>
</head>
<body>
<div id="app">
  <div id="loading">LOADING GALLERY…</div>

  <div id="welcome">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of cozy &amp; eerie things</p>
    <div id="stepEnterName">
      <input id="nameInput" placeholder="Enter your name" maxlength="20">
      <br><button id="enterBtn">ENTER GALLERY</button>
    </div>
    <div id="welcomeMsg" style="display:none;"></div>
  </div>

  <div id="roomLabel"></div>
  <div id="crosshair" style="display:none;"></div>
  <div id="hint" style="display:none;">WASD to move · mouse to look · click a painting</div>
  <button id="muteBtn" style="display:none;">🔊 Sound</button>

  <div class="modalOverlay" id="noteOverlay">
    <div class="note" id="noteBox">
      <h3 id="noteTitle">Untitled</h3>
      <p id="noteBody">...</p>
      <button id="noteClose">close</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   RAMSHA ART STUDIO — interactive 3D gallery
   Beginner map:
   - PAINTINGS array near the bottom = edit this to swap in your own art.
   - Each room is built by createRoom() using a small config object.
   - Movement: WASD + mouse look (pointer lock). Click a painting to open its note.

   NOTE ON STRUCTURE: the "Enter Gallery" button is wired up FIRST, on its
   own, before any 3D code runs. The 3D scene is built inside initGallery()
   wrapped in a try/catch. This means: even if the 3D engine has a problem
   (unsupported browser, blocked script, GPU issue), the button still
   responds instead of silently doing nothing — and you'll see a clear
   on-screen error saying what went wrong instead of a dead click.
   ========================================================================= */

const $ = id => document.getElementById(id);
let gameStarted = false;   // true once the visitor has clicked Enter
let galleryReady = false;  // true once the 3D scene finished building
let dom = null;            // the canvas element, set once the scene exists

function showFatalError(msg){
  const lbl = $('roomLabel');
  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';
  lbl.textContent = '⚠ ' + msg;
  console.error(msg);
}

// ---------- ENTER GALLERY button (independent of the 3D engine) ----------
$('enterBtn').onclick = () => {
  const name = $('nameInput').value.trim() || 'friend';
  $('stepEnterName').style.display = 'none';
  const wm = $('welcomeMsg');
  wm.style.display = 'block';
  wm.textContent = `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;
  try { startAudio(); } catch(e){ console.warn('Audio failed to start:', e); }
  setTimeout(() => {
    $('welcome').style.display = 'none';
    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';
    gameStarted = true;
    if(!galleryReady) showFatalError('3D engine did not start — open the browser console (F12) for details.');
    else if(dom) dom.requestPointerLock();
  }, 2200);
};
$('muteBtn').onclick = () => {
  muted = !muted;
  if(master) master.gain.value = muted ? 0 : 0.25;
  $('muteBtn').textContent = muted ? '🔇 Sound' : '🔊 Sound';
};
$('noteClose').onclick = () => { $('noteOverlay').style.display = 'none'; };
function openNote(d){
  if(dom) document.exitPointerLock();
  const box = $('noteBox');
  box.classList.toggle('win', !!d.winner);
  $('noteTitle').textContent = d.winner ? '🎉 You found a free print!' : d.label;
  $('noteBody').textContent = d.story;
  $('noteOverlay').style.display = 'flex';
}

// ---------- lightweight procedural ambience (Web Audio, no external files) ----------
// Independent of Three.js — works even if the 3D scene fails to load.
let audioCtx, master, noiseSrc, droneOsc, muted = false;
function footstepTick(dt){ /* placeholder hook if you add real footstep samples later */ }
function startAudio(){
  if(audioCtx) return; // already started
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  master = audioCtx.createGain(); master.gain.value=0.25; master.connect(audioCtx.destination);

  droneOsc = audioCtx.createOscillator(); droneOsc.type='sine'; droneOsc.frequency.value=55;
  const droneGain = audioCtx.createGain(); droneGain.gain.value=0.15;
  droneOsc.connect(droneGain).connect(master); droneOsc.start();

  const bufSize = 2*audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1,bufSize,audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i]=Math.random()*2-1;
  noiseSrc = audioCtx.createBufferSource(); noiseSrc.buffer=buf; noiseSrc.loop=true;
  const filter = audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=500;
  const noiseGain = audioCtx.createGain(); noiseGain.gain.value=0.06;
  noiseSrc.connect(filter).connect(noiseGain).connect(master); noiseSrc.start();

  // occasional random "event" blip so rooms feel alive (esp. Lobby 5)
  setInterval(()=>{
    if(muted || !gameStarted || !galleryReady) return;
    const near = currentRoom();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type = near && near.tag==='LOBBY 5' ? 'sawtooth' : 'sine';
    o.frequency.value = (near && near.tag==='LOBBY 5') ? 120+Math.random()*200 : 300+Math.random()*200;
    g.gain.value=0; o.connect(g).connect(master);
    o.start(); g.gain.linearRampToValueAtTime((near && near.tag==='LOBBY 5')?0.08:0.03, audioCtx.currentTime+0.3);
    g.gain.linearRampToValueAtTime(0, audioCtx.currentTime+1.4);
    o.stop(audioCtx.currentTime+1.5);
  }, 5000);
}
function currentRoom(){
  if(!window._rooms || !window._camera) return null;
  return window._rooms.reduce((a,r)=> Math.abs(r.z-window._camera.position.z) < Math.abs(a.z-window._camera.position.z) ? r : a, window._rooms[0]);
}

// ---------- everything below needs Three.js — wrapped so a failure here
//            can never break the button above ----------
try {
initGallery();
galleryReady = true;
} catch(err){
  showFatalError('Gallery failed to load: ' + err.message);
}

function initGallery(){

// ---------- basic setup ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03030a);
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 1.7, 4); // start just inside the hallway, facing further in
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('app').prepend(renderer.domElement);
document.getElementById('loading').style.display='none';

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.AmbientLight(0x1a1f2e, 1.1));
const hallLight = new THREE.PointLight(0x2a3550, 0.6, 40);
hallLight.position.set(0,4,20); scene.add(hallLight);

// ---------- floor / ceiling for the whole level ----------
const floorMat = new THREE.MeshStandardMaterial({color:0x0c0c10, roughness:1});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60,140), floorMat);
floor.rotation.x=-Math.PI/2; floor.position.set(0,0,60); scene.add(floor);
const ceil = floor.clone(); ceil.position.y=4.2; ceil.rotation.x=Math.PI/2; scene.add(ceil);

// ---------- helper: canvas texture (for placeholder art + neon text) ----------
function canvasTexture(draw, w=512, h=384){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'), w, h);
  const t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t;
}
function placeholderArt(label, hue){
  return canvasTexture((ctx,w,h)=>{
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0, `hsl(${hue},35%,18%)`); g.addColorStop(1, `hsl(${hue+30},30%,8%)`);
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=6; ctx.strokeRect(10,10,w-20,h-20);
    ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='24px Georgia'; ctx.textAlign='center';
    ctx.fillText('PLACEHOLDER', w/2, h/2-10);
    ctx.font='18px Georgia'; ctx.fillText(label, w/2, h/2+22);
  });
}
function neonSignTexture(text, color){
  return canvasTexture((ctx,w,h)=>{
    ctx.clearRect(0,0,w,h);
    ctx.font='bold 90px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=color; ctx.shadowBlur=30;
    ctx.fillStyle=color; ctx.fillText(text, w/2, h/2);
    ctx.shadowBlur=30; ctx.fillText(text, w/2, h/2);
  }, 512, 160);
}

// ---------- painting factory ----------
// clickable[] holds all painting meshes for raycasting
const clickable = [];
function createPainting(cfg, group){
  // cfg = {x,y,z,ry,label,story,winner,img,hue}
  const w=1.5, h=1.05;
  let mat = new THREE.MeshStandardMaterial({map:placeholderArt(cfg.label,cfg.hue||210), roughness:.8});
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
  mesh.position.set(cfg.x,cfg.y,cfg.z); mesh.rotation.y=cfg.ry;
  const frame = new THREE.Mesh(new THREE.PlaneGeometry(w+.14,h+.14), new THREE.MeshStandardMaterial({color:0x1a1410}));
  frame.position.copy(mesh.position); frame.rotation.y=cfg.ry;
  frame.translateZ(-0.02);
  group.add(frame, mesh);
  mesh.userData = cfg;
  clickable.push(mesh);

  // try to load a real image if the beginner has added one; falls back silently
  if(cfg.img){
    new THREE.TextureLoader().load(cfg.img, tex=>{ mat.map=tex; mat.needsUpdate=true; }, undefined, ()=>{});
  }
}

// ---------- room factory ----------
// side: -1 = left of hallway, +1 = right.  z = center of room along hallway.
const ROOM_W = 7, ROOM_D = 9, ROOM_H = 4.2, HALL_HALF = 2.6;
const flickerLights = []; // {light, mode}
function createRoom(cfg){
  const group = new THREE.Group();
  const cx = cfg.side * (HALL_HALF + ROOM_W/2);
  group.position.set(cx, 0, cfg.z);
  scene.add(group);

  const wallMat = new THREE.MeshStandardMaterial({color:cfg.wallColor, roughness:1});
  const floorMat2 = new THREE.MeshStandardMaterial({color:cfg.floorColor||cfg.wallColor, roughness:1});
  const back = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W,ROOM_H), wallMat);
  back.position.set(0,ROOM_H/2, cfg.side*ROOM_D/2); back.rotation.y = cfg.side>0?Math.PI:0;
  group.add(back);
  [ -1,1 ].forEach(s=>{
    const side = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_D,ROOM_H), wallMat);
    side.position.set(s*ROOM_W/2, ROOM_H/2, 0);
    side.rotation.y = s>0 ? -Math.PI/2 : Math.PI/2;
    group.add(side);
  });
  const rf = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_W,ROOM_D), floorMat2);
  rf.rotation.x=-Math.PI/2; rf.position.y=0.01; group.add(rf);

  // fog-ish tint via a point light matching theme
  const roomLight = new THREE.PointLight(cfg.lightColor, cfg.lightIntensity||1, 12);
  roomLight.position.set(0,2.6,0); group.add(roomLight);
  if(cfg.flicker) flickerLights.push({light:roomLight, base:cfg.lightIntensity||1, mode:cfg.flicker});

  // doorway neon sign, facing the hallway
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.2,0.7), new THREE.MeshBasicMaterial({map:neonSignTexture(cfg.tag,cfg.neon), transparent:true}));
  sign.position.set(cfg.side*(HALL_HALF-0.02), 3.1, cfg.z);
  sign.rotation.y = cfg.side>0 ? -Math.PI/2 : Math.PI/2;
  scene.add(sign);
  if(cfg.glowDoor){
    const glow = new THREE.PointLight(cfg.neonHex, 1.6, 6);
    glow.position.set(cfg.side*(HALL_HALF+0.3), 2.2, cfg.z); scene.add(glow);
    flickerLights.push({light:glow, base:1.6, mode:'pulse'});
  }

  (cfg.paintings||[]).forEach(p=>createPainting(p, group));
  if(cfg.decorate) cfg.decorate(group);
  return group;
}

// ---------- ROOM CONFIGS (the fun part — edit freely) ----------
const rooms = [
  { tag:'LOBBY 1', side:-1, z:16, wallColor:0x22241f, floorColor:0x15150f, lightColor:0x5b6b4a, lightIntensity:.9,
    neon:'#8fffb0', neonHex:0x8fffb0, glowDoor:true, flicker:'flicker',
    paintings:[
      {x:-1.8,y:1.6,z:3.9,ry:0,label:'A-F 01',story:'A collector once said this one watched her back on quiet nights.',hue:100},
      {x:0,y:1.6,z:3.9,ry:0,label:'A-F 02',story:'Found rolled up behind an old cinema screen.',hue:90},
      {x:1.8,y:1.6,z:3.9,ry:0,label:'G-M 01',story:'Congratulations — you found a free digital print! Message @ramshaartstudio to claim it.',hue:110,winner:true},
      {x:-3.4,y:1.6,z:0,ry:Math.PI/2,label:'G-M 02',story:'The seats in this room used to fold shut on their own.',hue:80},
      {x:3.4,y:1.6,z:0,ry:-Math.PI/2,label:'N-S 01',story:'Nobody remembers what film was playing when the theatre closed.',hue:70},
    ],
    decorate:(g)=>{
      // rows of old "cinema seat" boxes
      for(let i=0;i<3;i++){
        const seat = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6), new THREE.MeshStandardMaterial({color:0x2b241c}));
        seat.position.set(-2+i*2, 0.3, -3); g.add(seat);
      }
      const signA = new THREE.Mesh(new THREE.PlaneGeometry(1.4,0.4), new THREE.MeshBasicMaterial({map:neonSignTexture('A-F','#8fffb0'),transparent:true}));
      signA.position.set(-1.8,3.2,3.85); g.add(signA);
      const signB = signA.clone(); signB.material = new THREE.MeshBasicMaterial({map:neonSignTexture('G-M','#8fffb0'),transparent:true}); signB.position.set(0.8,3.2,3.85); g.add(signB);
    }
  },
  { tag:'LOBBY 2', side:1, z:36, wallColor:0x1b2436, floorColor:0xeef3fb, lightColor:0x6fb3ff, lightIntensity:1.1,
    neon:'#9fd7ff', neonHex:0x9fd7ff,
    paintings:[
      {x:-1.6,y:1.6,z:3.9,ry:0,label:'Snow 01',story:'Painted from a single streetlamp on a January night.',hue:210},
      {x:1.6,y:1.6,z:3.9,ry:0,label:'Snow 02',story:'The road in this one leads nowhere in particular — that was the point.',hue:220},
      {x:-3.4,y:1.6,z:0,ry:Math.PI/2,label:'Snow 03',story:'Blue hour lasts eleven minutes here in winter.',hue:200},
    ],
    decorate:(g)=>{
      // simple rural house silhouettes
      const hMat = new THREE.MeshStandardMaterial({color:0x0e1522});
      [[-2,0,-3],[1.5,0,-3.2]].forEach(p=>{
        const house = new THREE.Mesh(new THREE.BoxGeometry(1.2,1,1.2), hMat);
        house.position.set(p[0],0.5,p[2]); g.add(house);
      });
      // snow particles
      const N=300, pos=new Float32Array(N*3);
      for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*ROOM_W; pos[i*3+1]=Math.random()*ROOM_H; pos[i*3+2]=(Math.random()-.5)*ROOM_D; }
      const geo=new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
      const snow = new THREE.Points(geo, new THREE.PointsMaterial({color:0xffffff,size:0.03}));
      snow.userData.isSnow=true; g.add(snow);
    }
  },
  { tag:'LOBBY 3', side:-1, z:56, wallColor:0x2e1c14, floorColor:0x3a2418, lightColor:0xff9a4d, lightIntensity:1.2, flicker:'ember',
    neon:'#ffb877', neonHex:0xffb877,
    paintings:[
      {x:-1.6,y:1.5,z:3.9,ry:0,label:'Cozy 01',story:'Painted while it was actually raining outside — you can tell.',hue:20},
      {x:1.6,y:1.5,z:3.9,ry:0,label:'Cozy 02',story:'This one smells like woodsmoke, if paintings could smell.',hue:15},
    ],
    decorate:(g)=>{
      const sofa = new THREE.Mesh(new THREE.BoxGeometry(2,0.7,0.9), new THREE.MeshStandardMaterial({color:0x8a1f22}));
      sofa.position.set(0,0.35,-2.6); g.add(sofa);
      const fire = new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.6), new THREE.MeshBasicMaterial({color:0xff7a2a}));
      fire.position.set(0,0.4,-3.85); g.add(fire);
      fire.userData.isFire = true;
    }
  },
  { tag:'LOBBY 4', side:1, z:76, wallColor:0x0d1220, floorColor:0x151b2b, lightColor:0x8fa4ff, lightIntensity:.8, flicker:'lamp',
    neon:'#c9d4ff', neonHex:0xc9d4ff,
    paintings:[
      {x:-1.6,y:1.5,z:3.9,ry:0,label:'Night 01',story:'A late walk, an unlocked door, a light left on for someone.',hue:230},
      {x:1.6,y:1.5,z:3.9,ry:0,label:'Night 02',story:'Congratulations — this one\'s a free print too! Message @ramshaartstudio to claim it.',hue:235,winner:true},
    ],
    decorate:(g)=>{
      const moon = new THREE.Mesh(new THREE.SphereGeometry(0.35,16,16), new THREE.MeshBasicMaterial({color:0xf3f0e0}));
      moon.position.set(2.2,3.3,-3.6); g.add(moon);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,2), new THREE.MeshStandardMaterial({color:0x111}));
      post.position.set(-1.5,1,0); g.add(post);
      const bench = new THREE.Mesh(new THREE.BoxGeometry(1.2,0.35,0.4), new THREE.MeshStandardMaterial({color:0x2a2a2a}));
      bench.position.set(1,0.2,1); g.add(bench);
    }
  },
  { tag:'LOBBY 5', side:-1, z:96, wallColor:0x140708, floorColor:0x0c0404, lightColor:0xff2a2a, lightIntensity:.7, flicker:'strobe',
    neon:'#ff3b3b', neonHex:0xff3b3b,
    paintings:[
      {x:-1.6,y:1.5,z:3.9,ry:0,label:'??? 01',story:'Nobody has hung this one straight for more than a day.',hue:0},
      {x:1.6,y:1.5,z:3.9,ry:0,label:'??? 02',story:'You are not the first person to feel watched in here.',hue:0},
      {x:0,y:1.5,z:0,ry:Math.PI,label:'??? 03',story:'It was cheaper to leave the porch light on.',hue:0},
    ],
  },
];
rooms.forEach(createRoom);

window._rooms = rooms;
window._camera = camera;

// ---------- movement (WASD + pointer-lock mouse look) ----------
// yaw starts at Math.PI so the camera faces +Z (into the hallway) — Three.js
// cameras look down -Z by default, so this turns it to face the level.
let yaw=Math.PI, pitch=0;
const keys={};
document.addEventListener('keydown', e=>keys[e.code]=true);
document.addEventListener('keyup', e=>keys[e.code]=false);

dom = renderer.domElement; // assigns the OUTER `dom` variable (declared near the top)
dom.addEventListener('click', ()=>{ if(gameStarted && document.pointerLockElement!==dom) dom.requestPointerLock(); });
document.addEventListener('mousemove', e=>{
  if(document.pointerLockElement!==dom) return;
  yaw   -= e.movementX*0.0022;
  pitch -= e.movementY*0.0022;
  pitch = Math.max(-1.2, Math.min(1.2, pitch));
});

// bounding box for the whole level (simplified — no per-wall collision)
const LIMIT = { xMin:-(HALL_HALF+ROOM_W-0.4), xMax:HALL_HALF+ROOM_W-0.4, zMin:1, zMax:112 };

function updateMovement(dt){
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  const speed = 3.2*dt;
  const fwd = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  let mv = new THREE.Vector3();
  if(keys['KeyW']) mv.add(fwd);
  if(keys['KeyS']) mv.sub(fwd);
  if(keys['KeyD']) mv.add(right);
  if(keys['KeyA']) mv.sub(right);
  if(mv.length()>0){
    mv.normalize().multiplyScalar(speed);
    camera.position.x = Math.max(LIMIT.xMin, Math.min(LIMIT.xMax, camera.position.x+mv.x));
    camera.position.z = Math.max(LIMIT.zMin, Math.min(LIMIT.zMax, camera.position.z+mv.z));
    footstepTick(dt);
  }
  // update room label
  const near = rooms.reduce((a,r)=> Math.abs(r.z-camera.position.z) < Math.abs(a.z-camera.position.z) ? r : a, rooms[0]);
  const lbl = document.getElementById('roomLabel');
  if(Math.abs(near.z-camera.position.z) < 5.5){ lbl.style.opacity=1; lbl.textContent = near.tag; }
  else lbl.style.opacity=0;
}

// ---------- flicker / ambient animation ----------
let clock = new THREE.Clock();
function animateFlicker(t){
  flickerLights.forEach(f=>{
    if(f.mode==='flicker') f.light.intensity = f.base * (0.7+Math.random()*0.5);
    else if(f.mode==='ember') f.light.intensity = f.base * (0.85+Math.sin(t*6)*0.1+Math.random()*0.1);
    else if(f.mode==='lamp') f.light.intensity = f.base * (Math.random()<0.02 ? 0.2 : 1);
    else if(f.mode==='strobe') f.light.intensity = f.base * (Math.random()<0.05 ? 2.2 : 0.5);
    else if(f.mode==='pulse') f.light.intensity = f.base * (0.8+Math.sin(t*2)*0.3);
  });
  scene.traverse(o=>{
    if(o.userData && o.userData.isSnow){ const p=o.geometry.attributes.position;
      for(let i=1;i<p.count*3;i+=3){ p.array[i]-=0.01; if(p.array[i]<0) p.array[i]=ROOM_H; } p.needsUpdate=true; }
    if(o.userData && o.userData.isFire){ o.material.opacity = 0.8+Math.sin(t*10)*0.2; o.material.transparent=true; }
  });
}

function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(gameStarted) updateMovement(dt);
  animateFlicker(clock.elapsedTime);
  renderer.render(scene, camera);
}
loop();

// ---------- click-to-inspect paintings ----------
const ray = new THREE.Raycaster();
dom.addEventListener('mousedown', e=>{
  if(!gameStarted || document.pointerLockElement!==dom) return;
  ray.setFromCamera({x:0,y:0}, camera);
  const hit = ray.intersectObjects(clickable)[0];
  if(hit) openNote(hit.object.userData);
});

} // ---------- end of initGallery() ----------
</script>
</body>
</html>
