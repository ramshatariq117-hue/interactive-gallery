<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
:root{
  --neon:#e8b48c;
  --paper:#e8dcc0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Georgia,serif;
}

#app{
  position:relative;
  width:100%;
  height:100%;
}

canvas{
  display:block;
}

#welcome{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 40%,#130d10 0%,#000 82%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:50;
  color:#d7cbd0;
}

#welcome h1{
  font-size:2.2em;
  letter-spacing:2px;
  color:#e7c1a0;
  text-shadow:0 0 12px #b77754,0 0 30px #6e352b;
  margin-bottom:8px;
}

#welcome p{
  opacity:.7;
  margin-bottom:22px;
}

#nameInput{
  padding:12px 16px;
  font-size:1.1em;
  border-radius:6px;
  border:1px solid #5a3933;
  background:#160f12;
  color:#f0e8e5;
  width:280px;
  text-align:center;
  margin-bottom:16px;
}

#enterBtn{
  padding:12px 28px;
  font-size:1.05em;
  letter-spacing:1px;
  cursor:pointer;
  border-radius:6px;
  border:1px solid #d39770;
  background:transparent;
  color:#e7b28e;
  text-shadow:0 0 8px #a96043;
  transition:all .25s;
}

#enterBtn:hover{
  background:#d39770;
  color:#180b08;
  box-shadow:0 0 20px #a96043;
}

#welcomeMsg{
  font-size:1.3em;
  color:#fff;
  text-align:center;
  max-width:520px;
  line-height:1.5;
}

#crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:6px;
  height:6px;
  margin:-3px 0 0 -3px;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  z-index:20;
  pointer-events:none;
}

#hint{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  color:#d6c3ba;
  font-size:.85em;
  background:rgba(25,11,10,.68);
  padding:7px 15px;
  border-radius:20px;
  z-index:20;
  pointer-events:none;
  border:1px solid rgba(218,166,130,.18);
}

#muteBtn{
  position:absolute;
  top:16px;
  right:16px;
  z-index:30;
  background:rgba(25,11,10,.68);
  color:#e6d6ce;
  border:1px solid #65453d;
  border-radius:6px;
  padding:8px 12px;
  cursor:pointer;
  font-size:.9em;
}

#roomLabel{
  position:absolute;
  top:16px;
  left:16px;
  z-index:20;
  color:#e9b58e;
  text-shadow:0 0 8px #9c563c;
  font-size:1em;
  letter-spacing:2px;
  opacity:0;
  transition:opacity .6s;
}

.modalOverlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(2px);
}

.note{
  width:340px;
  max-width:80vw;
  background:var(--paper);
  color:#3a2f22;
  padding:26px 24px;
  border-radius:2px;
  box-shadow:0 0 40px rgba(0,0,0,.7),inset 0 0 40px rgba(120,90,50,.25);
  transform:rotate(-1.2deg);
  font-family:Georgia,serif;
  position:relative;
}

.note::before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 24px,
    rgba(0,0,0,.03) 25px
  );
  pointer-events:none;
}

.note h3{
  font-size:1.15em;
  margin-bottom:10px;
  border-bottom:1px solid rgba(0,0,0,.2);
  padding-bottom:6px;
}

.note p{
  line-height:1.5;
  font-size:.95em;
}

.note button{
  margin-top:16px;
  padding:8px 16px;
  border:1px solid #3a2f22;
  background:transparent;
  cursor:pointer;
  color:#3a2f22;
}

.win{
  background:#111;
  color:#ffd27a;
  border:2px solid #ffd27a;
  box-shadow:0 0 40px #ffb84a;
  transform:rotate(0);
  text-align:center;
}

.win h3{
  color:#ffd27a;
  border-color:#553;
}

.win button{
  border-color:#ffd27a;
  color:#ffd27a;
}

#loading{
  position:absolute;
  inset:0;
  background:#000;
  color:#e6aa82;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  font-size:1.1em;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div id="app">

  <div id="loading">LOADING GALLERY…</div>

  <div id="welcome">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of cozy &amp; eerie things</p>

    <div id="stepEnterName">
      <input id="nameInput" placeholder="Enter your name" maxlength="20">
      <br>
      <button id="enterBtn">ENTER GALLERY</button>
    </div>

    <div id="welcomeMsg" style="display:none;"></div>
  </div>

  <div id="roomLabel"></div>
  <div id="crosshair" style="display:none;"></div>
  <div id="hint" style="display:none;">WASD to move · mouse to look · click a painting</div>
  <button id="muteBtn" style="display:none;">🔊 Sound</button>

  <div class="modalOverlay" id="noteOverlay">
    <div class="note" id="noteBox">
      <h3 id="noteTitle">Untitled</h3>
      <p id="noteBody">...</p>
      <button id="noteClose">close</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   UI
============================================================ */

const $ = id => document.getElementById(id);

let gameStarted=false;
let galleryReady=false;
let dom=null;

function showFatalError(msg){
  const lbl=$('roomLabel');
  lbl.style.opacity=1;
  lbl.style.color='#ff6b6b';
  lbl.textContent='⚠ '+msg;
  console.error(msg);
}

$('enterBtn').onclick=()=>{

  const name=$('nameInput').value.trim() || 'friend';

  $('stepEnterName').style.display='none';

  const wm=$('welcomeMsg');
  wm.style.display='block';
  wm.textContent=
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn(e);
  }

  setTimeout(()=>{

    $('welcome').style.display='none';
    $('crosshair').style.display='block';
    $('hint').style.display='block';
    $('muteBtn').style.display='block';

    gameStarted=true;

    if(!galleryReady){
      showFatalError(
        '3D engine did not start — open the browser console (F12) for details.'
      );
    }else if(dom){
      dom.requestPointerLock();
    }

  },2200);
};

$('muteBtn').onclick=()=>{

  muted=!muted;

  if(master){
    master.gain.value=muted ? 0 : .25;
  }

  $('muteBtn').textContent=
    muted ? '🔇 Sound' : '🔊 Sound';
};

$('noteClose').onclick=()=>{
  $('noteOverlay').style.display='none';
};

function openNote(d){

  if(dom) document.exitPointerLock();

  const box=$('noteBox');

  box.classList.toggle('win',!!d.winner);

  $('noteTitle').textContent=
    d.winner
      ? '🎉 You found a free print!'
      : d.label;

  $('noteBody').textContent=d.story;

  $('noteOverlay').style.display='flex';
}


/* ============================================================
   AUDIO
============================================================ */

let audioCtx;
let master;
let noiseSrc;
let droneOsc;
let muted=false;
let footstepTimer=0;

function footstepTick(dt){

  if(!audioCtx || muted) return;

  footstepTimer-=dt;

  if(footstepTimer>0) return;

  footstepTimer=.38;

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.type='triangle';
  o.frequency.value=82+Math.random()*25;

  g.gain.value=0;

  o.connect(g).connect(master);

  const now=audioCtx.currentTime;

  g.gain.linearRampToValueAtTime(
    .035,
    now+.015
  );

  g.gain.exponentialRampToValueAtTime(
    .001,
    now+.09
  );

  o.start(now);
  o.stop(now+.1);
}

function startAudio(){

  if(audioCtx) return;

  audioCtx=
    new(window.AudioContext||window.webkitAudioContext)();

  master=audioCtx.createGain();
  master.gain.value=.25;
  master.connect(audioCtx.destination);

  droneOsc=audioCtx.createOscillator();
  droneOsc.type='sine';
  droneOsc.frequency.value=55;

  const droneGain=audioCtx.createGain();
  droneGain.gain.value=.11;

  droneOsc.connect(droneGain).connect(master);
  droneOsc.start();

  const bufSize=2*audioCtx.sampleRate;

  const buf=
    audioCtx.createBuffer(
      1,
      bufSize,
      audioCtx.sampleRate
    );

  const data=buf.getChannelData(0);

  for(let i=0;i<bufSize;i++){
    data[i]=Math.random()*2-1;
  }

  noiseSrc=audioCtx.createBufferSource();
  noiseSrc.buffer=buf;
  noiseSrc.loop=true;

  const filter=
    audioCtx.createBiquadFilter();

  filter.type='lowpass';
  filter.frequency.value=450;

  const noiseGain=audioCtx.createGain();
  noiseGain.gain.value=.025;

  noiseSrc
    .connect(filter)
    .connect(noiseGain)
    .connect(master);

  noiseSrc.start();

  setInterval(()=>{

    if(muted || !gameStarted || !galleryReady)
      return;

    const near=currentRoom();

    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    const spooky=
      near && near.tag==='LOBBY 5';

    o.type=spooky?'sawtooth':'sine';

    o.frequency.value=
      spooky
        ? 120+Math.random()*200
        : 300+Math.random()*200;

    g.gain.value=0;

    o.connect(g).connect(master);
    o.start();

    g.gain.linearRampToValueAtTime(
      spooky?.055:.022,
      audioCtx.currentTime+.3
    );

    g.gain.linearRampToValueAtTime(
      0,
      audioCtx.currentTime+1.4
    );

    o.stop(audioCtx.currentTime+1.5);

  },5000);
}

function currentRoom(){

  if(!window._rooms || !window._camera)
    return null;

  return window._rooms.reduce(
    (a,r)=>
      Math.abs(r.z-window._camera.position.z)
      <
      Math.abs(a.z-window._camera.position.z)
        ?r:a,
    window._rooms[0]
  );
}


/* ============================================================
   THREE SETUP
============================================================ */

let scene;
let camera;
let renderer;
let clock;

try{

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x080506);

  scene.fog=
    new THREE.FogExp2(
      0x0b0708,
      .010
    );

  camera=
    new THREE.PerspectiveCamera(
      72,
      innerWidth/innerHeight,
      .1,
      240
    );

  camera.position.set(
    0,
    1.7,
    5
  );

  renderer=
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      2
    )
  );

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  renderer.outputEncoding=
    THREE.sRGBEncoding;

  document
    .getElementById('app')
    .prepend(renderer.domElement);

  dom=renderer.domElement;

  clock=new THREE.Clock();

  $('loading').style.display='none';

  galleryReady=true;

}catch(err){

  console.error(err);

  showFatalError(
    '3D engine failed to initialise.'
  );
}


/* ============================================================
   MATERIAL HELPERS
============================================================ */

function M(color,opts={}){

  return new THREE.MeshStandardMaterial({

    color,

    roughness:
      opts.roughness!==undefined
        ?opts.roughness
        :.82,

    metalness:
      opts.metalness!==undefined
        ?opts.metalness
        :0,

    emissive:
      opts.emissive!==undefined
        ?opts.emissive
        :0x000000,

    emissiveIntensity:
      opts.emissiveIntensity!==undefined
        ?opts.emissiveIntensity
        :0,

    transparent:
      opts.transparent||false,

    opacity:
      opts.opacity!==undefined
        ?opts.opacity
        :1,

    side:
      opts.side!==undefined
        ?opts.side
        :THREE.FrontSide
  });
}

function addMesh(
  parent,
  geometry,
  material,
  x=0,
  y=0,
  z=0,
  rx=0,
  ry=0,
  rz=0
){

  const mesh=
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(x,y,z);
  mesh.rotation.set(rx,ry,rz);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  return mesh;
}

function box(
  parent,
  w,h,d,
  color,
  x,y,z,
  ry=0,
  opts={}
){

  return addMesh(
    parent,
    new THREE.BoxGeometry(w,h,d),
    M(color,opts),
    x,y,z,
    0,ry,0
  );
}

function sphere(
  parent,
  radius,
  color,
  x,y,z,
  scale=[1,1,1],
  opts={}
){

  const mesh=
    addMesh(
      parent,
      new THREE.SphereGeometry(
        radius,
        18,
        12
      ),
      M(color,opts),
      x,y,z
    );

  mesh.scale.set(
    scale[0],
    scale[1],
    scale[2]
  );

  return mesh;
}

function cyl(
  parent,
  r1,r2,h,
  color,
  x,y,z,
  segments=16,
  ry=0,
  opts={}
){

  return addMesh(
    parent,
    new THREE.CylinderGeometry(
      r1,r2,h,segments
    ),
    M(color,opts),
    x,y,z,
    0,ry,0
  );
}

function torus(
  parent,
  radius,
  tube,
  color,
  x,y,z,
  rx=0,
  ry=0,
  rz=0,
  opts={}
){

  return addMesh(
    parent,
    new THREE.TorusGeometry(
      radius,
      tube,
      10,
      24
    ),
    M(color,opts),
    x,y,z,
    rx,ry,rz
  );
}

function tubeBetween(
  parent,
  a,
  b,
  radius,
  color,
  opts={}
){

  const dir=
    new THREE.Vector3()
      .subVectors(b,a);

  const len=dir.length();

  const mesh=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        len,
        8
      ),
      M(color,opts)
    );

  mesh.position
    .copy(a)
    .add(b)
    .multiplyScalar(.5);

  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    dir.normalize()
  );

  mesh.castShadow=true;

  parent.add(mesh);

  return mesh;
}


/* ============================================================
   TEXTURES
============================================================ */

function canvasTexture(draw,w=512,h=384){

  const c=document.createElement('canvas');

  c.width=w;
  c.height=h;

  const ctx=c.getContext('2d');

  draw(ctx,w,h);

  const tex=new THREE.CanvasTexture(c);

  tex.wrapS=THREE.ClampToEdgeWrapping;
  tex.wrapT=THREE.ClampToEdgeWrapping;
  tex.encoding=THREE.sRGBEncoding;

  return tex;
}

function wallpaperTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle='#54191f';
      ctx.fillRect(0,0,w,h);

      for(let x=0;x<w;x+=56){

        ctx.strokeStyle=
          'rgba(230,157,128,.13)';

        ctx.lineWidth=2;

        ctx.beginPath();

        for(let y=-20;y<h+30;y+=30){

          ctx.moveTo(x,y);

          ctx.quadraticCurveTo(
            x+28,
            y+15,
            x,
            y+30
          );
        }

        ctx.stroke();
      }

      for(let x=28;x<w;x+=112){

        for(let y=28;y<h;y+=58){

          ctx.fillStyle=
            'rgba(245,190,150,.13)';

          ctx.beginPath();

          ctx.arc(
            x,y,3.5,
            0,
            Math.PI*2
          );

          ctx.fill();
        }
      }
    },
    512,
    512
  );
}

function woodTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle='#3a2119';
      ctx.fillRect(0,0,w,h);

      for(let y=0;y<h;y+=38){

        ctx.fillStyle=
          y%76===0
            ?'#4b2a20'
            :'#2d1814';

        ctx.fillRect(
          0,y,w,30
        );

        ctx.strokeStyle=
          'rgba(190,115,72,.14)';

        ctx.beginPath();

        ctx.moveTo(0,y+11);

        ctx.bezierCurveTo(
          w*.25,y+2,
          w*.65,y+20,
          w,y+9
        );

        ctx.stroke();
      }
    },
    512,
    512
  );
}

function placeholderArt(label,hue=210){

  return canvasTexture(
    (ctx,w,h)=>{

      const grad=
        ctx.createLinearGradient(
          0,0,w,h
        );

      grad.addColorStop(
        0,
        `hsl(${hue},28%,28%)`
      );

      grad.addColorStop(
        .5,
        `hsl(${hue},24%,12%)`
      );

      grad.addColorStop(
        1,
        '#050507'
      );

      ctx.fillStyle=grad;
      ctx.fillRect(0,0,w,h);

      ctx.fillStyle=
        `hsla(${hue},70%,80%,.16)`;

      ctx.beginPath();

      ctx.arc(
        w*.7,
        h*.27,
        h*.15,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.strokeStyle=
        `hsla(${hue},60%,85%,.24)`;

      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.moveTo(
        w*.06,
        h*.75
      );

      ctx.quadraticCurveTo(
        w*.42,
        h*.5,
        w*.93,
        h*.77
      );

      ctx.stroke();

      if(label){

        ctx.fillStyle=
          'rgba(255,255,255,.82)';

        ctx.font=
          'bold 25px Georgia';

        ctx.textAlign='center';

        ctx.fillText(
          label,
          w/2,
          h*.9
        );
      }
    },
    640,
    450
  );
}

function signTexture(text,color){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle='#20100f';
      ctx.fillRect(0,0,w,h);

      ctx.strokeStyle=color;
      ctx.lineWidth=7;

      ctx.strokeRect(
        12,12,w-24,h-24
      );

      ctx.shadowColor=color;
      ctx.shadowBlur=18;

      ctx.fillStyle=color;

      ctx.font=
        'bold 48px Georgia';

      ctx.textAlign='center';
      ctx.textBaseline='middle';

      ctx.fillText(
        text,
        w/2,
        h/2
      );

      ctx.shadowBlur=0;
    },
    700,
    170
  );
}


/* ============================================================
   PAINTINGS
============================================================ */

const clickable=[];

function createPainting(cfg,parent){

  const w=cfg.w||1.55;
  const h=cfg.h||1.08;

  const artMat=
    new THREE.MeshStandardMaterial({
      map:
        cfg.texture ||
        placeholderArt(
          cfg.label,
          cfg.hue||210
        ),
      roughness:.8
    });

  const art=
    new THREE.Mesh(
      new THREE.PlaneGeometry(w,h),
      artMat
    );

  art.position.set(
    cfg.x,
    cfg.y,
    cfg.z
  );

  art.rotation.y=
    cfg.ry||0;

  art.castShadow=false;

  const frame=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w+.16,
        h+.16,
        .075
      ),
      M(
        cfg.frameColor||0x281712,
        {roughness:.5}
      )
    );

  frame.position.copy(
    art.position
  );

  frame.rotation.copy(
    art.rotation
  );

  frame.translateZ(-.045);

  parent.add(
    frame,
    art
  );

  art.userData=cfg;

  clickable.push(art);

  if(cfg.img){

    new THREE.TextureLoader()
      .load(
        cfg.img,
        tex=>{

          tex.encoding=
            THREE.sRGBEncoding;

          artMat.map=tex;
          artMat.needsUpdate=true;

        },
        undefined,
        ()=>{}
      );
  }

  return art;
}


/* ============================================================
   GALLERY DIMENSIONS
============================================================ */

/*
   ONE hallway.

   It is intentionally narrow:
   2.8 metres wide.

   Every room opens directly from it.

   Rooms alternate left / right.
*/

const HALL_HALF=1.4;
const HALL_LENGTH=132;

const ROOM_W=15;
const ROOM_D=24;
const ROOM_H=4.8;

const DOOR_HALF=1.55;

const lobbyCenters=[
  18,
  43,
  68,
  93,
  118
];

const rooms=[];

const flickerLights=[];
const fireMeshes=[];
const snowParticles=[];
const rainParticles=[];
const pendulums=[];
const animatedObjects=[];


/* ============================================================
   HALLWAY FLOOR
============================================================ */

const floorTex=woodTexture();

floorTex.wrapS=
floorTex.wrapT=
  THREE.RepeatWrapping;

floorTex.repeat.set(
  2,
  20
);

const hallFloor=
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      HALL_HALF*2,
      HALL_LENGTH
    ),
    new THREE.MeshStandardMaterial({
      map:floorTex,
      roughness:.9
    })
  );

hallFloor.rotation.x=-Math.PI/2;

hallFloor.position.set(
  0,
  0,
  HALL_LENGTH/2
);

hallFloor.receiveShadow=true;

scene.add(hallFloor);

/*
   IMPORTANT:

   Wall segments stop before each doorway.
   This creates actual openings.

   There is no second hidden room.
*/

function buildHallWall(side){

  const x=side*HALL_HALF;

  let start=1;

  for(const zc of lobbyCenters){

    const gapStart=
      zc-DOOR_HALF-.2;

    if(gapStart>start){

      box(
        scene,
        .18,
        ROOM_H,
        gapStart-start,
        0x4b171d,
        x,
        ROOM_H/2,
        (start+gapStart)/2
      );
    }

    start=
      zc+DOOR_HALF+.2;
  }

  if(start<HALL_LENGTH){

    box(
      scene,
      .18,
      ROOM_H,
      HALL_LENGTH-start,
      0x4b171d,
      x,
      ROOM_H/2,
      (start+HALL_LENGTH)/2
    );
  }


  /* wallpaper surface */

  const tex=wallpaperTexture();

  tex.wrapS=
  tex.wrapT=
    THREE.RepeatWrapping;

  tex.repeat.set(
    1.5,
    3
  );

  let pStart=1;

  for(const zc of lobbyCenters){

    const gapStart=
      zc-DOOR_HALF-.2;

    if(gapStart>pStart){

      const panel=
        new THREE.Mesh(
          new THREE.PlaneGeometry(
            ROOM_H-.3,
            gapStart-pStart
          ),
          new THREE.MeshStandardMaterial({
            map:tex,
            roughness:1
          })
        );

      panel.rotation.y=
        side<0
          ?Math.PI/2
          :-Math.PI/2;

      panel.position.set(
        x-side*.096,
        ROOM_H/2,
        (pStart+gapStart)/2
      );

      scene.add(panel);
    }

    pStart=
      zc+DOOR_HALF+.2;
  }

  if(pStart<HALL_LENGTH){

    const panel=
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          ROOM_H-.3,
          HALL_LENGTH-pStart
        ),
        new THREE.MeshStandardMaterial({
          map:tex,
          roughness:1
        })
      );

    panel.rotation.y=
      side<0
        ?Math.PI/2
        :-Math.PI/2;

    panel.position.set(
      x-side*.096,
      ROOM_H/2,
      (pStart+HALL_LENGTH)/2
    );

    scene.add(panel);
  }
}

/* ============================================================
   ACTUAL DOORWAYS
============================================================ */

/*
   This is the important correction.

   LEFT room:
     room occupies left side
     doorway is on its RIGHT wall

   RIGHT room:
     room occupies right side
     doorway is on its LEFT wall

   The threshold and door are aligned with
   that exact boundary.
*/

function makeDoorway(
  side,
  z,
  number,
  title,
  color
){

  const wallX=
    side*HALL_HALF;

  const frameColor=0x291411;

  /* left/right jambs along the hallway direction */

  box(
    scene,
    .20,
    3.55,
    .20,
    frameColor,
    wallX,
    1.78,
    z-DOOR_HALF
  );

  box(
    scene,
    .20,
    3.55,
    .20,
    frameColor,
    wallX,
    1.78,
    z+DOOR_HALF
  );

  /* lintel */

  box(
    scene,
    .20,
    .22,
    DOOR_HALF*2+.2,
    frameColor,
    wallX,
    3.55,
    z
  );


  /*
     The doorway recess goes INTO THE ROOM,
     not into the hallway.
  */

  const recessX=
    wallX+side*.08;

  box(
    scene,
    .06,
    3.2,
    DOOR_HALF*2,
    0x11090a,
    recessX,
    1.62,
    z
  );


  /*
     Door panel:
     hinged on the room side and swung inward.

     It is NOT sitting across the hallway.
  */

  const doorX=
    wallX+side*.48;

  const door=
    box(
      scene,
      .12,
      3.05,
      2.25,
      0x402018,
      doorX,
      1.55,
      z-1.0,
      side*.82,
      {
        roughness:.7
      }
    );

  animatedObjects.push({
    type:'door',
    object:door
  });


  /* inset panel */

  box(
    scene,
    .035,
    2.55,
    1.72,
    0x2c1512,
    wallX+side*.55,
    1.55,
    z-1.0,
    side*.82
  );


  /* brass handle */

  sphere(
    scene,
    .075,
    0xc39458,
    wallX+side*.64,
    1.58,
    z-.13,
    [1,1,1],
    {
      metalness:.8,
      roughness:.25
    }
  );


  /*
     CORRECT threshold:
     it is perpendicular to the doorway,
     not stretched across the entire hallway.
  */

  box(
    scene,
    .34,
    .08,
    DOOR_HALF*2,
    0x5d3728,
    wallX,
    .045,
    z
  );


  /* small warm light just inside room */

  const entryLight=
    new THREE.PointLight(
      number===5
        ?0x84252a
        :0xffae6c,
      number===5
        ?.4
        :.65,
      5
    );

  entryLight.position.set(
    wallX+side*1.0,
    2.5,
    z
  );

  scene.add(entryLight);


  /* sign belongs above doorway */

  const sign=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1.65,
        .4
      ),
      new THREE.MeshStandardMaterial({
        map:signTexture(
          `LOBBY ${number}`,
          color
        ),
        roughness:.7
      })
    );

  sign.position.set(
    wallX,
    3.95,
    z
  );

  /*
     Face the hallway.
     The sign is NOT floating in the middle of the room.
  */

  sign.rotation.y=
    side<0
      ?-Math.PI/2
      :Math.PI/2;

  scene.add(sign);
}


/* ============================================================
   ROOM CREATOR
============================================================ */

function createRoom(cfg){

  const group=
    new THREE.Group();

  /*
     Correct room placement:

     side -1 = entirely LEFT of hallway
     side +1 = entirely RIGHT of hallway
  */

  group.position.set(
    cfg.side*(HALL_HALF+ROOM_W/2),
    0,
    cfg.z
  );

  scene.add(group);

  const room={
    z:cfg.z,
    tag:`LOBBY ${cfg.number}`,
    side:cfg.side,
    group
  };

  rooms.push(room);


  /* floor */

  const floor=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_D
      ),
      M(cfg.floor,{roughness:.94})
    );

  floor.rotation.x=-Math.PI/2;
  floor.position.y=.01;
  floor.receiveShadow=true;

  group.add(floor);


  /* room ceiling */

  box(
    group,
    ROOM_W,
    .16,
    ROOM_D,
    cfg.ceiling,
    0,
    ROOM_H,
    0
  );


  /*
     Outer wall.
     This is the wall farthest from the hallway.
  */

  box(
    group,
    .18,
    ROOM_H,
    ROOM_D,
    cfg.wall,
    cfg.side*ROOM_W/2,
    ROOM_H/2,
    0
  );


  /* front/back side walls */

  box(
    group,
    ROOM_W,
    ROOM_H,
    .18,
    cfg.wall,
    0,
    ROOM_H/2,
    -ROOM_D/2
  );

  box(
    group,
    ROOM_W,
    ROOM_H,
    .18,
    cfg.wall,
    0,
    ROOM_H/2,
    ROOM_D/2
  );


  /* room light */

  const light=
    new THREE.PointLight(
      cfg.light,
      cfg.intensity,
      25
    );

  light.position.set(
    cfg.side*2,
    3.5,
    0
  );

  light.castShadow=true;

  light.shadow.mapSize.width=512;
  light.shadow.mapSize.height=512;

  group.add(light);

  flickerLights.push({
    light,
    base:cfg.intensity,
    mode:cfg.flicker||'soft'
  });


  /* paintings */

  (cfg.paintings||[])
    .forEach(
      p=>createPainting(p,group)
    );


  /* one doorway only */

  makeDoorway(
    cfg.side,
    cfg.z,
    cfg.number,
    cfg.title,
    cfg.neon
  );


  return group;
}

/* pine trees */

function pineTree(parent,x,z,s=1){

  cyl(
    parent,
    .13*s,
    .18*s,
    2.1*s,
    0x49382d,
    x,
    1.05*s,
    z,
    12
  );

  for(let i=0;i<3;i++){

    const cone=
      new THREE.Mesh(
        new THREE.ConeGeometry(
          (1.15-i*.2)*s,
          1.7*s,
          12
        ),
        M(0x263b30)
      );

    cone.position.set(
      x,
      (1.45+i*.62)*s,
      z
    );

    parent.add(cone);

    sphere(
      parent,
      .16*s,
      0xe7ecee,
      x,
      (2.2+i*.48)*s,
      z,
      [1.5,.35,1.5]
    );
  }
}

/* ============================================================

============================================================ */

window._rooms=rooms;
window._camera=camera;

let yaw=Math.PI;
let pitch=0;

const keys={};

document.addEventListener(
  'keydown',
  e=>{
    keys[e.code]=true;
  }
);

document.addEventListener(
  'keyup',
  e=>{
    keys[e.code]=false;
  }
);

dom.addEventListener(
  'click',
  ()=>{
    if(
      gameStarted &&
      document.pointerLockElement!==dom
    ){
      dom.requestPointerLock();
    }
  }
);

document.addEventListener(
  'mousemove',
  e=>{

    if(document.pointerLockElement!==dom)
      return;

    yaw-=e.movementX*.0022;

    pitch-=e.movementY*.0022;

    pitch=Math.max(
      -1.2,
      Math.min(
        1.2,
        pitch
      )
    );
  }
);

const LIMIT={
  xMin:-(HALL_HALF+ROOM_W-.35),
  xMax:HALL_HALF+ROOM_W-.35,
  zMin:1,
  zMax:HALL_LENGTH-1
};

function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    'YXZ'
  );

  const speed=3.2*dt;

  const fwd=
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right=
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  let mv=
    new THREE.Vector3();

  if(keys['KeyW'])
    mv.add(fwd);

  if(keys['KeyS'])
    mv.sub(fwd);

  if(keys['KeyD'])
    mv.add(right);

  if(keys['KeyA'])
    mv.sub(right);

  if(mv.length()>0){

    mv
      .normalize()
      .multiplyScalar(speed);

    camera.position.x=
      Math.max(
        LIMIT.xMin,
        Math.min(
          LIMIT.xMax,
          camera.position.x+mv.x
        )
      );

    camera.position.z=
      Math.max(
        LIMIT.zMin,
        Math.min(
          LIMIT.zMax,
          camera.position.z+mv.z
        )
      );

    footstepTick(dt);
  }

  const near=
    rooms.reduce(
      (a,r)=>
        Math.abs(r.z-camera.position.z)
        <
        Math.abs(a.z-camera.position.z)
          ?r:a,
      rooms[0]
    );

  const lbl=$('roomLabel');

  if(
    Math.abs(
      near.z-camera.position.z
    )<8
  ){

    lbl.style.opacity=1;
    lbl.textContent=near.tag;

  }else{

    lbl.style.opacity=0;
  }
}


/* ============================================================
   ANIMATION
============================================================ */

function animateWorld(t){

  const time=t*.001;


  /* lights */

  flickerLights.forEach(item=>{

    const l=item.light;

    if(item.mode==='flicker'){

      l.intensity=
        item.base*
        (
          .78+
          Math.random()*.28
        );

    }else if(item.mode==='ember'){

      l.intensity=
        item.base*
        (
          .84+
          Math.sin(time*7)*.07+
          Math.random()*.07
        );

    }else if(item.mode==='lamp'){

      l.intensity=
        item.base*
        (
          .96+
          Math.sin(time*1.6)*.035
        );

    }else if(item.mode==='strobe'){

      l.intensity=
        item.base*
        (
          Math.random()>.97
            ?.18
            :.92
        );

    }else{

      l.intensity=
        item.base*
        (
          .98+
          Math.sin(time*1.2)*.02
        );
    }
  });


  /* snow */

  snowParticles.forEach(p=>{

    p.position.y-=.009;

    p.position.x+=
      Math.sin(
        time*1.2+
        p.position.z
      )*.0007;

    if(p.position.y<.04)
      p.position.y=4.75;
  });


  /* rain */

  rainParticles.forEach(p=>{

    p.position.y-=.06;

    if(p.position.y<.04)
      p.position.y=4.65;
  });


  /* fire */

  fireMeshes.forEach(f=>{

    f.scale.y=
      1.35+
      Math.sin(time*8)*.12+
      Math.sin(time*13)*.08;

    f.rotation.z=
      Math.sin(time*5)*.08;
  });


  /* pendulum */

  pendulums.forEach(p=>{

    p.rotation.z=
      Math.sin(time*1.7)*.18;
  });


  /* other animated objects */

  animatedObjects.forEach(item=>{

    if(item.type==='beam'){

      item.object.material.opacity=
        .025+
        Math.sin(time*2.2)*.007;

    }

    if(item.type==='carLight'){

      item.object.intensity=
        item.base+
        Math.sin(time*2)*.025;
    }

  });
}


/* ============================================================
   PAINTING INTERACTION
============================================================ */

const raycaster=
  new THREE.Raycaster();

const mouse=
  new THREE.Vector2();

dom.addEventListener(
  'mousedown',
  e=>{

    if(!gameStarted)
      return;

    mouse.x=0;
    mouse.y=0;

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits=
      raycaster.intersectObjects(
        clickable,
        false
      );

    if(hits.length){

      openNote(
        hits[0].object.userData
      );
    }
  }
);


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
  'resize',
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* ============================================================
   LOOP
============================================================ */

function animate(t){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  if(gameStarted)
    updateMovement(dt);

  animateWorld(t);

  renderer.render(
    scene,
    camera
  );
}

animate(0);
