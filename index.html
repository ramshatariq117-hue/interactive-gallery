<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
:root{
  --blue:#72d8ff;
  --blueSoft:#a8e6ff;
  --cream:#e8dfce;
  --burgundy:#351c25;
  --walnut:#21130f;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020307;
  font-family:Georgia,serif;
}

#app{
  position:relative;
  width:100%;
  height:100%;
}

canvas{
  display:block;
}

#loading{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#020611;
  color:#72d8ff;
  letter-spacing:3px;
  font-size:1.05rem;
}

#welcome{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#dbeeff;
  background:
    radial-gradient(
      ellipse at 50% 38%,
      rgba(24,61,105,.95) 0%,
      rgba(8,24,48,.96) 28%,
      rgba(2,8,19,.99) 65%,
      #010307 100%
    );
}

#welcome::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 45%,rgba(87,177,229,.10),transparent 32%),
    linear-gradient(90deg,transparent 0%,rgba(78,146,190,.035) 50%,transparent 100%);

}

#welcome h1{
  position:relative;
  font-size:2.25rem;
  letter-spacing:4px;
  color:var(--blue);
  text-shadow:
    0 0 12px rgba(114,216,255,.8),
    0 0 38px rgba(62,153,212,.45);
  margin-bottom:10px;
}

#welcome p{
  position:relative;
  color:#b8cfe0;
  opacity:.8;
  letter-spacing:1px;
  margin-bottom:28px;
}

#nameInput{
  position:relative;
  width:285px;
  padding:13px 16px;
  border-radius:5px;
  border:1px solid rgba(120,191,226,.42);
  background:rgba(3,13,28,.75);
  color:#e7f6ff;
  outline:none;
  text-align:center;
  font-size:1rem;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}

#nameInput:focus{
  border-color:#72d8ff;

}

  margin-top:15px;
  padding:12px 28px;
  border:1px solid #72d8ff;
  border-radius:5px;

  color:#8ee1ff;
  letter-spacing:2px;

  transition:.25s;
}

#enterBtn:hover{
  background:#72d8ff;

  box-shadow:0 0 25px rgba(114,216,255,.4);
}

#welcomeMsg{

  max-width:520px;

  color:#edf8ff;

  font-size:1.25rem;
}

#crosshair{
  position:absolute;
  top:50%;
  left:50%;
  width:5px;
  height:5px;
  margin:-2.5px 0 0 -2.5px;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  z-index:20;
  pointer-events:none;
}

#hint{
  position:absolute;
  bottom:17px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  padding:7px 15px;

  color:#d9d1c9;
  background:rgba(17,12,13,.72);
  border:1px solid rgba(224,184,145,.18);

  pointer-events:none;
  white-space:nowrap;
}

#muteBtn{
  position:absolute;
  top:15px;
  right:15px;
  z-index:30;
  padding:8px 12px;
  border-radius:5px;
  border:1px solid rgba(196,157,126,.4);
  background:rgba(20,13,13,.72);
  color:#e8d9ce;
  cursor:pointer;
}

#roomLabel{
  position:absolute;
  top:17px;
  left:17px;
  z-index:20;

  color:#9fe5ff;

.modalOverlay{

.note{

}

.note h3{
  margin-bottom:11px;

  line-height:1.55;

}

.note button{
  margin-top:17px;
  padding:8px 17px;

  background:transparent;

  cursor:pointer;
}

.note.win{
  background:#091522;
  color:#c7edff;
  border:1px solid #72d8ff;

  transform:none;

.note.win button{

</style>
</head>

<body>

<div id="app">

  <div id="loading">ENTERING THE GALLERY…</div>

  <div id="welcome">

    <h1>RAMSHA ART STUDIO</h1>

    <p>an interactive gallery of quiet, strange places</p>

    <div id="stepEnterName">
      <input
        id="nameInput"
        maxlength="20"
        autocomplete="off"
        placeholder="Enter your name"
      >

      <button id="enterBtn">ENTER GALLERY</button>
    </div>

    <div id="welcomeMsg" style="display:none"></div>

  </div>

  <div id="roomLabel"></div>

  <div id="crosshair" style="display:none"></div>

  <div id="hint" style="display:none">
    WASD to move · mouse to look · click a painting
  </div>

  <button id="muteBtn" style="display:none">🔊 Sound</button>

  <div class="modalOverlay" id="noteOverlay">
    <div class="note" id="noteBox">
      <h3 id="noteTitle">Untitled</h3>
      <p id="noteBody"></p>
      <button id="noteClose">close</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   BASIC UI
========================================================= */

const $ = id => document.getElementById(id);

let gameStarted = false;
let galleryReady = false;
let dom = null;

function showFatalError(message){
  console.error(message);
  const label=$("roomLabel");
  label.style.opacity=1;
  label.style.color="#ff7777";
  label.textContent="⚠ "+message;
}

$("enterBtn").onclick=()=>{

  const name=$("nameInput").value.trim() || "friend";

  $("stepEnterName").style.display="none";

  $("welcomeMsg").style.display="block";
  $("welcomeMsg").textContent=
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn("Audio unavailable:",e);
  }

  setTimeout(()=>{

    $("welcome").style.display="none";
    $("crosshair").style.display="block";
    $("hint").style.display="block";
    $("muteBtn").style.display="block";

    gameStarted=true;

    if(!galleryReady){
      showFatalError("3D engine did not start.");
    }else{
      dom.requestPointerLock();
    }

  },2200);
};

$("muteBtn").onclick=()=>{

  muted=!muted;

  if(master){
    master.gain.value=muted ? 0 : .25;
  }

  $("muteBtn").textContent=
    muted ? "🔇 Sound" : "🔊 Sound";
};

$("noteClose").onclick=()=>{
  $("noteOverlay").style.display="none";
};


/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;
let master=null;
let noiseSrc=null;
let droneOsc=null;
let muted=false;
let footstepTimer=0;

function startAudio(){

  if(audioCtx)return;

  audioCtx=
    new(window.AudioContext||window.webkitAudioContext)();

  master=audioCtx.createGain();
  master.gain.value=.25;
  master.connect(audioCtx.destination);

  droneOsc=audioCtx.createOscillator();
  droneOsc.type="sine";
  droneOsc.frequency.value=49;

  const droneGain=audioCtx.createGain();
  droneGain.gain.value=.12;

  droneOsc
    .connect(droneGain)
    .connect(master);

  droneOsc.start();

  const length=2*audioCtx.sampleRate;

  const buffer=
    audioCtx.createBuffer(
      1,
      length,
      audioCtx.sampleRate
    );

  const data=buffer.getChannelData(0);

  for(let i=0;i<length;i++){
    data[i]=(Math.random()*2-1);
  }

  noiseSrc=audioCtx.createBufferSource();
  noiseSrc.buffer=buffer;
  noiseSrc.loop=true;

  const filter=audioCtx.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=420;

  const noiseGain=audioCtx.createGain();
  noiseGain.gain.value=.018;

  noiseSrc
    .connect(filter)
    .connect(noiseGain)
    .connect(master);

  noiseSrc.start();

  setInterval(()=>{

    if(!audioCtx || muted || !gameStarted)return;

    const room=currentRoom();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    const eerie=
      room &&
      room.tag==="LOBBY 5";

    osc.type=eerie ? "triangle" : "sine";
    osc.frequency.value=
      eerie
      ? 100+Math.random()*170
      : 250+Math.random()*160;

    gain.gain.value=0;

    osc.connect(gain).connect(master);

    const now=audioCtx.currentTime;

    osc.start(now);

    gain.gain.linearRampToValueAtTime(
      eerie?.035:.012,
      now+.35
    );

    gain.gain.linearRampToValueAtTime(
      0,
      now+1.7
    );

    osc.stop(now+1.8);

  },5500);
}

function footstepTick(dt){

  if(!audioCtx || muted)return;

  footstepTimer-=dt;

  if(footstepTimer>0)return;

  footstepTimer=.38;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="triangle";
  osc.frequency.value=75+Math.random()*25;

  gain.gain.value=0;

  osc.connect(gain).connect(master);

  const now=audioCtx.currentTime;

  gain.gain.linearRampToValueAtTime(
    .025,
    now+.015
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now+.085
  );

  osc.start(now);
  osc.stop(now+.1);
}


/* =========================================================
   THREE.JS
========================================================= */

let scene,camera,renderer,clock;

try{

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x05070c);

  scene.fog=
    new THREE.FogExp2(
      0x07090e,
      .010
    );

  camera=
    new THREE.PerspectiveCamera(
      72,
      innerWidth/innerHeight,
      .1,
      220
    );

  camera.position.set(
    0,
    1.68,
    5
  );

  renderer=
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  renderer.outputEncoding=
    THREE.sRGBEncoding;

  renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

  renderer.toneMappingExposure=.9;

  $("app").prepend(renderer.domElement);

  dom=renderer.domElement;

  clock=new THREE.Clock();

  galleryReady=true;

  $("loading").style.display="none";

}catch(error){

  console.error(error);

  showFatalError(
    "3D engine failed to initialise."
  );
}


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
  new THREE.HemisphereLight(
    0x18283b,
    0x140b0a,
    .9
  )
);

scene.add(
  new THREE.AmbientLight(
    0x18202d,
    .55
  )
);


/* =========================================================
   HELPERS
========================================================= */

function material(color,opts={}){

  return new THREE.MeshStandardMaterial({

    color,

    roughness:
      opts.roughness!==undefined
      ?opts.roughness
      :.82,

    metalness:
      opts.metalness!==undefined
      ?opts.metalness
      :0,

    emissive:
      opts.emissive!==undefined
      ?opts.emissive
      :0x000000,

    emissiveIntensity:
      opts.emissiveIntensity!==undefined
      ?opts.emissiveIntensity
      :0,

    transparent:
      opts.transparent||false,

    opacity:
      opts.opacity!==undefined
      ?opts.opacity
      :1,

    side:
      opts.side!==undefined
      ?opts.side
      :THREE.FrontSide
  });
}

function mesh(
  parent,
  geometry,
  mat,
  x=0,
  y=0,
  z=0,
  rx=0,
  ry=0,
  rz=0
){

  const m=new THREE.Mesh(
    geometry,
    mat
  );

  m.position.set(x,y,z);
  m.rotation.set(rx,ry,rz);

  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);

  return m;
}

function box(
  parent,
  w,h,d,
  color,
  x,y,z,
  ry=0,
  opts={}
){

  return mesh(
    parent,
    new THREE.BoxGeometry(w,h,d),
    material(color,opts),
    x,y,z,
    0,ry,0
  );
}

function sphere(
  parent,
  radius,
  color,
  x,y,z,
  scale=[1,1,1],
  opts={}
){

  const m=mesh(
    parent,
    new THREE.SphereGeometry(
      radius,
      20,
      14
    ),
    material(color,opts),
    x,y,z
  );

  m.scale.set(
    scale[0],
    scale[1],
    scale[2]
  );

  return m;
}

function cylinder(
  parent,
  radiusTop,
  radiusBottom,
  height,
  color,
  x,y,z,
  segments=18,
  rx=0,
  ry=0,
  rz=0,
  opts={}
){

  return mesh(
    parent,
    new THREE.CylinderGeometry(
      radiusTop,
      radiusBottom,
      height,
      segments
    ),
    material(color,opts),
    x,y,z,
    rx,ry,rz
  );
}

function lineBetween(
  parent,
  a,
  b,
  radius,
  color,
  opts={}
){

  const direction=
    new THREE.Vector3()
      .subVectors(b,a);

  const length=
    direction.length();

  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius,
      length,
      8
    ),
    material(color,opts)
  );

  m.position
    .copy(a)
    .add(b)
    .multiplyScalar(.5);

  m.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    direction.normalize()
  );

  m.castShadow=true;

  parent.add(m);

  return m;
}


/* =========================================================
   TEXTURES
========================================================= */

function canvasTexture(draw,w=512,h=384){

  const canvas=
    document.createElement("canvas");

  canvas.width=w;
  canvas.height=h;

  const ctx=
    canvas.getContext("2d");

  draw(ctx,w,h);

  const texture=
    new THREE.CanvasTexture(canvas);

  texture.encoding=
    THREE.sRGBEncoding;

  return texture;
}

function paintingTexture(label,hue=210){

  return canvasTexture(
    (ctx,w,h)=>{

      const gradient=
        ctx.createLinearGradient(
          0,0,w,h
        );

      gradient.addColorStop(
        0,
        `hsl(${hue},28%,28%)`
      );

      gradient.addColorStop(
        .55,
        `hsl(${hue},24%,12%)`
      );

      gradient.addColorStop(
        1,
        "#050609"
      );

      ctx.fillStyle=gradient;
      ctx.fillRect(0,0,w,h);

      ctx.fillStyle=
        `hsla(${hue},65%,75%,.12)`;

      ctx.beginPath();
      ctx.arc(
        w*.68,
        h*.3,
        h*.16,
        0,
        Math.PI*2
      );
      ctx.fill();

      ctx.strokeStyle=
        `hsla(${hue},65%,80%,.25)`;

      ctx.lineWidth=4;

      ctx.beginPath();

      ctx.moveTo(
        w*.06,
        h*.76
      );

      ctx.quadraticCurveTo(
        w*.4,
        h*.48,
        w*.94,
        h*.75
      );

      ctx.stroke();

      ctx.fillStyle=
        "rgba(255,255,255,.78)";

      ctx.font=
        "25px Georgia";

      ctx.textAlign="center";

      ctx.fillText(
        label,
        w/2,
        h*.9
      );

    },
    640,
    450
  );
}

function wallpaperTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle="#27343a";
      ctx.fillRect(0,0,w,h);

      for(let x=18;x<w;x+=58){

        ctx.strokeStyle=
          "rgba(206,186,151,.075)";

        ctx.lineWidth=2;

        ctx.beginPath();

        for(
          let y=-30;
          y<h+30;
          y+=30
        ){

          ctx.moveTo(x,y);

          ctx.quadraticCurveTo(
            x+25,
            y+15,
            x,
            y+30
          );
        }

        ctx.stroke();
      }

      for(let x=29;x<w;x+=116){

        for(
          let y=22;
          y<h;
          y+=62
        ){

          ctx.fillStyle=
            "rgba(220,198,161,.06)";

          ctx.beginPath();

          ctx.arc(
            x,
            y,
            2.5,
            0,
            Math.PI*2
          );

          ctx.fill();
        }
      }

    },
    512,
    512
  );
}

function runnerTexture(){

  return canvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle="#321d24";
      ctx.fillRect(0,0,w,h);

      ctx.fillStyle="#442832";
      ctx.fillRect(
        w*.12,
        0,
        w*.76,
        h
      );

      ctx.strokeStyle=
        "rgba(190,139,120,.24)";

      ctx.lineWidth=5;

      ctx.strokeRect(
        w*.19,
        0,
        w*.62,
        h
      );

      for(let y=0;y<h;y+=80){

        ctx.strokeStyle=
          "rgba(218,173,146,.12)";

        ctx.beginPath();
        ctx.moveTo(
          w*.19,
          y
        );
        ctx.lineTo(
          w*.81,
          y
        );
        ctx.stroke();
      }

    },
    256,
    1024
  );
}


/* =========================================================
   PAINTINGS
========================================================= */

const clickable=[];

function createPainting(cfg,parent){

  const w=cfg.w||1.35;
  const h=cfg.h||.95;

  const artMat=
    new THREE.MeshStandardMaterial({

      map:
        cfg.texture ||
        paintingTexture(
          cfg.label||"",
          cfg.hue||210
        ),

      roughness:.88
    });

  const art=
    new THREE.Mesh(
      new THREE.PlaneGeometry(w,h),
      artMat
    );

  art.position.set(
    cfg.x,
    cfg.y,
    cfg.z
  );

  art.rotation.y=
    cfg.ry||0;

  art.castShadow=false;

  const frame=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w+.15,
        h+.15,
        .075
      ),
      material(
        cfg.frame||0x261812,
        {roughness:.48}
      )
    );

  frame.position.copy(
    art.position
  );

  frame.rotation.copy(
    art.rotation
  );

  frame.translateZ(-.045);

  parent.add(
    frame,
    art
  );

  art.userData=cfg;

  clickable.push(art);

  if(cfg.img){

    new THREE.TextureLoader()
      .load(
        cfg.img,
        tex=>{

          tex.encoding=
            THREE.sRGBEncoding;

          artMat.map=tex;
          artMat.needsUpdate=true;

        },
        undefined,
        ()=>{}
      );
  }

  return art;
}


/* =========================================================
   ARCHITECTURE
========================================================= */

const HALL_HALF=1.4;
const HALL_LENGTH=132;

const ROOM_W=15;
const ROOM_D=24;
const ROOM_H=4.8;

const DOOR_HALF=1.62;

const lobbyCenters=[
  18,
  43,
  68,
  93,
  118
];

const rooms=[];
const flickerLights=[];
const fireMeshes=[];
const snowParticles=[];
const rainParticles=[];
const pendulums=[];
const movingLights=[];


/* =========================================================
   HALLWAY FLOOR
========================================================= */

const floorTexture=runnerTexture();

floorTexture.wrapS=
  floorTexture.wrapT=
  THREE.RepeatWrapping;

floorTexture.repeat.set(
  1,
  18
);

const hallFloor=
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      HALL_HALF*2,
      HALL_LENGTH
    ),
    new THREE.MeshStandardMaterial({
      map:floorTexture,
      roughness:.9
    })
  );

hallFloor.rotation.x=-Math.PI/2;
hallFloor.position.set(
  0,
  0,
  HALL_LENGTH/2
);

hallFloor.receiveShadow=true;

scene.add(hallFloor);


/* =========================================================
   HALLWAY WALLS
   REAL CONTINUOUS WALLS WITH REAL DOOR OPENINGS
========================================================= */

function buildHallSide(side){

  const x=side*HALL_HALF;

  const wallColor=0x2b2023;
  const lowerColor=0x211514;
  const trimColor=0x63463b;

  let cursor=1;

  for(const zc of lobbyCenters){

    const openingStart=
      zc-DOOR_HALF-.05;

    const openingEnd=
      zc+DOOR_HALF+.05;

    if(openingStart>cursor){

      const length=
        openingStart-cursor;

      box(
        scene,
        .20,
        ROOM_H,
        length,
        wallColor,
        x,
        ROOM_H/2,
        (cursor+openingStart)/2
      );

      box(
        scene,
        .23,
        .92,
        length,
        lowerColor,
        x-side*.03,
        .46,
        (cursor+openingStart)/2

/* =========================================================
   ROOM SHELL
========================================================= */

function createRoom(cfg){

  const group=
    new THREE.Group();

  /*
    THIS position is the actual room position.
    Left rooms extend left.
    Right rooms extend right.
  */

  group.position.set(
    cfg.side*(HALL_HALF+ROOM_W/2),
    0,
    cfg.z
  );

  scene.add(group);

  rooms.push({
    z:cfg.z,
    side:cfg.side,
    tag:"LOBBY "+cfg.number,
    group
  });

  /*
    Floor
  */

  box(
    group,
    ROOM_W,
    .10,
    ROOM_D,
    cfg.floor,
    0,
    -.05,
    0,
    0,
    {roughness:.95}
  );

  /*
    OUTER WALL
  */

  const outerX=
    cfg.side*(ROOM_W/2);

  box(
    group,
    .20,
    ROOM_H,
    ROOM_D,
    cfg.wall,
    outerX,
    ROOM_H/2,
    0
  );

  /*
    BACK WALL
  */

  box(
    group,
    ROOM_W,
    ROOM_H,
    .20,
    cfg.wall,
    0,
    ROOM_H/2,
    ROOM_D/2
  );

  /*
    FRONT WALL — segmented around the door opening.
    This is what makes the door a genuine opening.
  */

  const hallX=
    -cfg.side*(ROOM_W/2);

  const edge=
    DOOR_HALF+.12;

  const segmentLength=
    ROOM_D/2-edge;

  box(
    group,
    .20,
    ROOM_H,
    segmentLength,
    cfg.wall,
    hallX,
    ROOM_H/2,
    -(ROOM_D/2+edge)/2
  );

  box(
    group,
    .20,
    ROOM_H,
    segmentLength,
    cfg.wall,
    hallX,
    ROOM_H/2,
    +(ROOM_D/2+edge)/2
  );

  /*
    Ceiling
  */

  box(
    group,
    ROOM_W,
    .15,
    ROOM_D,
    cfg.ceiling||0x171315,
    0,
    ROOM_H,
    0
  );

  /*
    Inner wallpaper on side/back walls.
  */

  if(cfg.wallpaper!==false){

    const tex=wallpaperTexture();

    tex.wrapS=
      tex.wrapT=
      THREE.RepeatWrapping;

    tex.repeat.set(
      2.2,
      3
    );

    const wallMat=
      new THREE.MeshStandardMaterial({
        map:tex,
        roughness:1
      });

    /*
      outer wall interior
    */

    const outerPanel=
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          ROOM_H-.35,
          ROOM_D-.25
        ),
        wallMat
      );

    outerPanel.position.set(
      outerX-cfg.side*.11,
      ROOM_H/2,
      0
    );

    outerPanel.rotation.y=
      cfg.side<0
      ?Math.PI/2
      :-Math.PI/2;

    group.add(outerPanel);

    /*
      back wall
    */

    const backPanel=
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          ROOM_W-.25,
          ROOM_H-.35
        ),
        wallMat
      );

    backPanel.position.set(
      0,
      ROOM_H/2,
      ROOM_D/2-.11
    );

    backPanel.rotation.y=Math.PI;

    group.add(backPanel);

  }

  /*
    Room lighting.
  */

  const mainLight=
    new THREE.PointLight(
      cfg.light||0xffd09b,
      cfg.intensity||.9,
      21
    );

  mainLight.position.set(
    cfg.side*2,
    3.55,
    -1
  );

  mainLight.castShadow=true;

  mainLight.shadow.mapSize.width=512;
  mainLight.shadow.mapSize.height=512;

  group.add(mainLight);

  flickerLights.push({
    light:mainLight,
    base:cfg.intensity||.9,
    mode:cfg.flicker||"soft"
  });

  /*
    Actual door.
  */

  createDoorway(group,cfg);

  return group;
}

/* =========================================================
   MOVEMENT
========================================================= */

let yaw=Math.PI;
let pitch=0;

const keys={};

document.addEventListener(
  "keydown",
  e=>{
    keys[e.code]=true;
  }
);

document.addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);

dom.addEventListener(
  "click",
  ()=>{
    if(
      gameStarted &&
      document.pointerLockElement!==dom &&
      $("noteOverlay").style.display!=="flex"
    ){
      dom.requestPointerLock();
    }
  }
);

document.addEventListener(
  "mousemove",
  e=>{

    if(
      document.pointerLockElement!==dom
    )return;

    yaw-=e.movementX*.0022;

    pitch-=e.movementY*.0022;

    pitch=Math.max(
      -1.2,
      Math.min(
        1.2,
        pitch
      )
    );
  }
);


/*
  These limits keep the player inside
  the complete architecture.
*/

const LIMIT={
  xMin:-(HALL_HALF+ROOM_W-.38),
  xMax:HALL_HALF+ROOM_W-.38,
  zMin:1,
  zMax:HALL_LENGTH-1
};

function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    "YXZ"
  );

  const speed=3.2*dt;

  const forward=
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right=
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  const movement=
    new THREE.Vector3();

  if(keys["KeyW"])
    movement.add(forward);

  if(keys["KeyS"])
    movement.sub(forward);

  if(keys["KeyD"])
    movement.add(right);

  if(keys["KeyA"])
    movement.sub(right);

  if(movement.length()>0){

    movement
      .normalize()
      .multiplyScalar(speed);

    camera.position.x=
      Math.max(
        LIMIT.xMin,
        Math.min(
          LIMIT.xMax,
          camera.position.x+movement.x
        )
      );

    camera.position.z=
      Math.max(
        LIMIT.zMin,
        Math.min(
          LIMIT.zMax,
          camera.position.z+movement.z
        )
      );

    footstepTick(dt);
  }

  /*
    Room label.
  */

  if(rooms.length){

    const nearest=
      rooms.reduce(
        (a,r)=>
          Math.abs(
            r.z-camera.position.z
          ) <
          Math.abs(
            a.z-camera.position.z
          )
          ?r
          :a,
        rooms[0]
      );

    const label=$("roomLabel");

    if(
      Math.abs(
        nearest.z-camera.position.z
      )<8
    ){

      label.style.opacity=1;
      label.textContent=nearest.tag;

    }else{

      label.style.opacity=0;
    }
  }
}


/* =========================================================
   ROOM LOOKUP
========================================================= */

function currentRoom(){

  if(
    !window._rooms ||
    !window._camera
  )return null;

  return window._rooms.reduce(
    (a,r)=>
      Math.abs(
        r.z-window._camera.position.z
      ) <
      Math.abs(
        a.z-window._camera.position.z
      )
      ?r
      :a,
    window._rooms[0]
  );
}


/* =========================================================
   PAINTING CLICK
========================================================= */

const raycaster=
  new THREE.Raycaster();

const mouse=
  new THREE.Vector2();

dom.addEventListener(
  "mousedown",
  e=>{

    if(!gameStarted)return;

    /*
      Crosshair interaction:
      the painting directly beneath
      the center of the screen is selected.
    */

    mouse.x=0;
    mouse.y=0;

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits=
      raycaster.intersectObjects(
        clickable,
        false
      );

    if(hits.length){

      openNote(
        hits[0].object.userData
      );
    }
  }
);


/* =========================================================
   NOTE
========================================================= */

function openNote(data){

  if(dom){
    document.exitPointerLock();
  }

  const boxEl=$("noteBox");

  boxEl.classList.toggle(
    "win",
    !!data.winner
  );

  $("noteTitle").textContent=
    data.winner
    ? "🎉 You found a free print!"
    : (data.label||"Untitled");

  $("noteBody").textContent=
    data.story ||
    "A quiet piece from the gallery.";

  $("noteOverlay").style.display="flex";
}


/* =========================================================
   WORLD ANIMATION
========================================================= */

function animateWorld(t){

  const time=t*.001;

  /*
    Practical lights subtly breathe.
    No violent random flashing.
  */

  flickerLights.forEach(item=>{

    const light=item.light;

    if(item.mode==="flicker"){

      light.intensity=
        item.base*
        (
          .78+
          Math.random()*.22
        );

    }else if(item.mode==="ember"){

      light.intensity=
        item.base*
        (
          .86+
          Math.sin(time*8)*.07+
          Math.random()*.07
        );

    }else if(item.mode==="lamp"){

      light.intensity=
        item.base*
        (
          .96+
          Math.sin(time*1.6)*.035
        );

    }else{

      light.intensity=
        item.base*
        (
          .98+
          Math.sin(time*1.3)*.018
        );
    }
  });


  /*
    Snow.
  */

  snowParticles.forEach(p=>{

    const obj=p.object;

    obj.position.y-=.008;

    obj.position.x+=
      Math.sin(
        time*1.3+
        obj.position.z
      )*.0008;

    if(obj.position.y<.08){

      obj.position.y=
        4.7;
    }
  });


  /*
    Rain.
  */

  rainParticles.forEach(p=>{

    const obj=p.object;

    obj.position.y-=.075;

    if(obj.position.y<.12){

      obj.position.y=
        4.55;
    }
  });


  /*
    Fire.
  */

  fireMeshes.forEach((f,i)=>{

    f.scale.y=
      1.25+
      Math.sin(
        time*8+i
      )*.13+
      Math.sin(
        time*13+i*2
      )*.07;

    f.rotation.z=
      Math.sin(
        time*5+i
      )*.06;
  });


  /*
    Grandfather clock.
  */

  pendulums.forEach(p=>{

    p.rotation.z=
      Math.sin(
        time*1.75
      )*.16;
  });


  /*
    Cinema projector beam.
  */

  movingLights.forEach(item=>{

    if(item.type==="beam"){

      item.object.material.opacity=
        .022+
        Math.sin(
          time*2.1
        )*.006;
    }
  });
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(t){

  requestAnimationFrame(animate);

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  if(gameStarted){

    updateMovement(dt);
  }

  animateWorld(t);

  renderer.render(
    scene,
    camera
  );
}
