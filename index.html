<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#welcome{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 42%,rgba(52,76,112,.30),transparent 40%),
    linear-gradient(145deg,#080d18,#111c30 52%,#070b13);
  color:white;
}

.welcomeInner{
  width:min(620px,90vw);
  text-align:center;
  padding:40px;
}

#welcome h1{
  margin:0 0 12px;
  font-family:Georgia,serif;
  font-size:clamp(40px,7vw,76px);
  font-weight:400;
  letter-spacing:.12em;
}

#welcome p{
  color:#bdc8d8;
  font-size:15px;
  letter-spacing:.08em;
  margin:0 0 35px;
}

#nameInput{
  width:min(350px,90%);
  padding:14px 17px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(0,0,0,.25);
  color:white;
  outline:none;
  border-radius:4px;
  font-size:15px;
  text-align:center;
}

#nameInput::placeholder{
  color:#8490a3;
}

#enterBtn{
  display:block;
  margin:14px auto 0;
  padding:13px 30px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.07);
  color:white;
  border-radius:4px;
  cursor:pointer;
  letter-spacing:.12em;
  transition:.2s;
}

#enterBtn:hover{
  background:rgba(255,255,255,.14);
}

#welcomeMsg{
  min-height:22px;
  margin-top:17px;
  color:#9eafc8;
  font-size:13px;
}

#loading{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  align-items:center;
  justify-content:center;
  background:#06080d;
  color:#dbe5f2;
  letter-spacing:.18em;
  font-size:12px;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:8px;
  height:8px;
  margin:-4px;
  border:1px solid rgba(255,255,255,.75);
  border-radius:50%;
  z-index:8;
  pointer-events:none;
  opacity:.75;
}

#hint{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  color:rgba(255,255,255,.7);
  font-size:12px;
  letter-spacing:.06em;
  z-index:8;
  pointer-events:none;
  text-shadow:0 1px 4px #000;
}

#muteBtn{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:10;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(0,0,0,.3);
  color:#ddd;
  padding:8px 12px;
  border-radius:4px;
  cursor:pointer;
}

#roomLabel{
  position:fixed;
  left:50%;
  top:27px;
  transform:translateX(-50%);
  color:rgba(255,255,255,.72);
  font-family:Georgia,serif;
  font-size:15px;
  letter-spacing:.16em;
  z-index:8;
  text-shadow:0 1px 5px #000;
  pointer-events:none;
}

#noteOverlay{
  position:fixed;
  inset:0;
  z-index:25;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(5px);
}

#noteBox{
  width:min(570px,88vw);
  background:#10131a;
  color:#e7ebf1;
  padding:32px;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 80px rgba(0,0,0,.65);
}

#noteTitle{
  font-family:Georgia,serif;
  font-size:27px;
  margin-bottom:13px;
}

#noteBody{
  color:#aeb7c4;
  line-height:1.7;
  font-size:14px;
}

#noteClose{
  margin-top:22px;
  background:none;
  color:#dfe7f1;
  border:1px solid rgba(255,255,255,.2);
  padding:9px 16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="loading">ENTERING GALLERY…</div>

<div id="welcome">
  <div class="welcomeInner">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of quiet, strange places</p>

    <div id="stepEnterName">
      <input id="nameInput" maxlength="28" placeholder="Your name">
      <button id="enterBtn">ENTER GALLERY</button>
      <div id="welcomeMsg"></div>
    </div>
  </div>
</div>

<div id="crosshair"></div>
<div id="roomLabel"></div>

<div id="hint">
  WASD to walk · Mouse to look · Click paintings to view
</div>

<button id="muteBtn">SOUND ON</button>

<div id="noteOverlay">
  <div id="noteBox">
    <div id="noteTitle"></div>
    <div id="noteBody"></div>
    <button id="noteClose">CLOSE</button>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* ============================================================
   RAMSHA ART STUDIO
   COMPLETE GALLERY
   ============================================================ */

"use strict";


/* ============================================================
   DOM
   ============================================================ */

const welcome=document.getElementById("welcome");
const loading=document.getElementById("loading");
const nameInput=document.getElementById("nameInput");
const enterBtn=document.getElementById("enterBtn");
const welcomeMsg=document.getElementById("welcomeMsg");
const roomLabel=document.getElementById("roomLabel");
const noteOverlay=document.getElementById("noteOverlay");
const noteTitle=document.getElementById("noteTitle");
const noteBody=document.getElementById("noteBody");
const noteClose=document.getElementById("noteClose");
const muteBtn=document.getElementById("muteBtn");


/* ============================================================
   SCENE
   ============================================================ */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x05070b);

scene.fog=new THREE.FogExp2(
  0x080b12,
  .012
);


const camera=new THREE.PerspectiveCamera(
  72,
  window.innerWidth/window.innerHeight,
  .05,
  220
);

camera.position.set(
  0,
  1.68,
  5
);


const renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

renderer.outputEncoding=THREE.sRGBEncoding;

renderer.toneMapping=
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=.92;

document.body.appendChild(renderer.domElement);


/* ============================================================
   GLOBAL LIGHT
   ============================================================ */

const hemisphere=new THREE.HemisphereLight(
  0x9baeca,
  0x06080c,
  .30
);

scene.add(hemisphere);


const ambient=new THREE.AmbientLight(
  0x65738d,
  .14
);

scene.add(ambient);


/* ============================================================
   WORLD CONSTANTS
   ============================================================ */

const HALL_HALF=1.4;
const HALL_LENGTH=132;

const ROOM_W=15;
const ROOM_D=24;
const ROOM_H=4.8;

const DOOR_HALF=1.62;

const lobbyCenters=[
  18,
  43,
  68,
  93,
  118
];


/* ============================================================
   COLLISION
   ============================================================ */

const collisions=[];

const PLAYER_RADIUS=.34;


function addCollisionRect(
  minX,
  minZ,
  maxX,
  maxZ
){

  collisions.push({
    minX:Math.min(minX,maxX),
    maxX:Math.max(minX,maxX),
    minZ:Math.min(minZ,maxZ),
    maxZ:Math.max(minZ,maxZ)
  });

}


function circleHitsRect(
  x,
  z,
  radius,
  rect
){

  const nearestX=Math.max(
    rect.minX,
    Math.min(x,rect.maxX)
  );

  const nearestZ=Math.max(
    rect.minZ,
    Math.min(z,rect.maxZ)
  );

  const dx=x-nearestX;
  const dz=z-nearestZ;

  return (
    dx*dx+
    dz*dz
  ) < radius*radius;
}


function resolveCollisions(
  x,
  z
){

  let px=x;
  let pz=z;

  for(let pass=0;pass<5;pass++){

    for(const rect of collisions){

      if(!circleHitsRect(
        px,
        pz,
        PLAYER_RADIUS,
        rect
      )){
        continue;
      }

      const nearestX=Math.max(
        rect.minX,
        Math.min(px,rect.maxX)
      );

      const nearestZ=Math.max(
        rect.minZ,
        Math.min(pz,rect.maxZ)
      );

      let dx=px-nearestX;
      let dz=pz-nearestZ;

      const distance=Math.sqrt(
        dx*dx+dz*dz
      );

      if(distance>.0001){

        const push=
          PLAYER_RADIUS-distance;

        px+=
          dx/distance*push;

        pz+=
          dz/distance*push;

      }else{

        const left=
          Math.abs(px-rect.minX);

        const right=
          Math.abs(rect.maxX-px);

        const top=
          Math.abs(pz-rect.minZ);

        const bottom=
          Math.abs(rect.maxZ-pz);

        const smallest=
          Math.min(
            left,
            right,
            top,
            bottom
          );

        if(smallest===left){
          px=rect.minX-PLAYER_RADIUS;
        }else if(smallest===right){
          px=rect.maxX+PLAYER_RADIUS;
        }else if(smallest===top){
          pz=rect.minZ-PLAYER_RADIUS;
        }else{
          pz=rect.maxZ+PLAYER_RADIUS;
        }

      }
    }
  }

  return {
    x:px,
    z:pz
  };
}


/* ============================================================
   MATERIAL HELPERS
   ============================================================ */

function makeMaterial(
  color,
  options={}
){

  return new THREE.MeshStandardMaterial({

    color:color,

    roughness:
      options.roughness!==undefined
      ?options.roughness
      :.82,

    metalness:
      options.metalness!==undefined
      ?options.metalness
      :0,

    emissive:
      options.emissive!==undefined
      ?options.emissive
      :0x000000,

    emissiveIntensity:
      options.emissiveIntensity!==undefined
      ?options.emissiveIntensity
      :0,

    transparent:
      options.transparent||false,

    opacity:
      options.opacity!==undefined
      ?options.opacity
      :1
  });
}


function makeMesh(
  geometry,
  material
){

  const object=
    new THREE.Mesh(
      geometry,
      material
    );

  object.castShadow=true;
  object.receiveShadow=true;

  return object;
}


function makeBox(
  x,
  y,
  z,
  sx,
  sy,
  sz,
  color,
  options={}
){

  const object=makeMesh(
    new THREE.BoxGeometry(
      sx,
      sy,
      sz
    ),
    makeMaterial(
      color,
      options
    )
  );

  object.position.set(
    x,
    y,
    z
  );

  return object;
}


function makeSphere(
  x,
  y,
  z,
  radius,
  color,
  options={}
){

  const object=makeMesh(
    new THREE.SphereGeometry(
      radius,
      18,
      12
    ),
    makeMaterial(
      color,
      options
    )
  );

  object.position.set(
    x,
    y,
    z
  );

  return object;
}


function makeCylinder(
  x,
  y,
  z,
  radiusTop,
  radiusBottom,
  height,
  color,
  segments=16,
  options={}
){

  const object=makeMesh(
    new THREE.CylinderGeometry(
      radiusTop,
      radiusBottom,
      height,
      segments
    ),
    makeMaterial(
      color,
      options
    )
  );

  object.position.set(
    x,
    y,
    z
  );

  return object;
}


/* ============================================================
   TEXTURES
   ============================================================ */

function createCanvasTexture(
  draw,
  width=512,
  height=512
){

  const canvas=
    document.createElement("canvas");

  canvas.width=width;
  canvas.height=height;

  const ctx=
    canvas.getContext("2d");

  draw(
    ctx,
    width,
    height
  );

  const texture=
    new THREE.CanvasTexture(canvas);

  texture.encoding=
    THREE.sRGBEncoding;

  return texture;
}


function createPaintingTexture(
  seed
){

  const palettes=[
    ["#08141d","#29475b","#9b765e"],
    ["#120f17","#4b2d37","#a27361"],
    ["#08181b","#28525b","#c1a477"],
    ["#11151a","#333d48","#7d7566"],
    ["#170e14","#4a3039","#936c5c"],
    ["#0a1019","#253b50","#71869a"]
  ];

  const p=
    palettes[
      Math.abs(seed)%palettes.length
    ];

  return createCanvasTexture(
    (ctx,w,h)=>{

      const gradient=
        ctx.createLinearGradient(
          0,
          0,
          w,
          h
        );

      gradient.addColorStop(
        0,
        p[0]
      );

      gradient.addColorStop(
        .5,
        p[1]
      );

      gradient.addColorStop(
        1,
        p[2]
      );

      ctx.fillStyle=gradient;
      ctx.fillRect(
        0,
        0,
        w,
        h
      );


      for(let i=0;i<25;i++){

        const x=
          (seed*71+i*97)%w;

        const y=
          (seed*43+i*61)%h;

        const radius=
          25+(i*17)%100;

        ctx.fillStyle=
          "rgba(255,255,255,"+
          (.025+(i%4)*.012)+
          ")";

        ctx.beginPath();

        ctx.arc(
          x,
          y,
          radius,
          0,
          Math.PI*2
        );

        ctx.fill();
      }


      ctx.strokeStyle=
        "rgba(255,255,255,.08)";

      ctx.lineWidth=4;

      for(let i=0;i<5;i++){

        ctx.beginPath();

        ctx.moveTo(
          i*w/5,
          0
        );

        ctx.quadraticCurveTo(
          w*.5,
          h*(.2+i*.12),
          w,
          h*(.15+i*.15)
        );

        ctx.stroke();
      }

    },
    640,
    420
  );
}


function createWallpaperTexture(
  base,
  accent
){

  return createCanvasTexture(
    (ctx,w,h)=>{

      ctx.fillStyle=
        "#"+
        base.toString(16).padStart(6,"0");

      ctx.fillRect(
        0,
        0,
        w,
        h
      );

      ctx.strokeStyle=
        "#"+
        accent.toString(16).padStart(6,"0");

      ctx.globalAlpha=.20;

      ctx.lineWidth=2;

      for(let x=0;x<w;x+=44){

        ctx.beginPath();

        ctx.moveTo(
          x,
          0
        );

        ctx.lineTo(
          x,
          h
        );

        ctx.stroke();
      }

      for(let y=0;y<h;y+=58){

        ctx.beginPath();

        ctx.moveTo(
          0,
          y
        );

        ctx.lineTo(
          w,
          y
        );

        ctx.stroke();
      }

      ctx.globalAlpha=1;

    },
    512,
    512
  );
}


/* ============================================================
   PAINTINGS
   ============================================================ */

const clickable=[];


function createPainting(config){

  const group=
    new THREE.Group();

  const frame=
    makeBox(
      0,
      0,
      0,
      config.w+.18,
      config.h+.18,
      .12,
      config.frame||0x171619,
      {
        roughness:.48,
        metalness:.12
      }
    );

  const artMaterial=
    new THREE.MeshStandardMaterial({

      map:
        config.texture||
        createPaintingTexture(
          config.seed||1
        ),

      roughness:.88
    });

  const art=
    makeMesh(
      new THREE.PlaneGeometry(
        config.w,
        config.h
      ),
      artMaterial
    );

  art.position.z=.071;

  group.add(frame);
  group.add(art);

  group.position.set(
    config.x||0,
    config.y||2,
    config.z||0
  );

  if(config.rotation){

    group.rotation.set(
      config.rotation.x||0,
      config.rotation.y||0,
      config.rotation.z||0
    );
  }

  group.userData.painting={
    title:
      config.title||
      "Untitled",

    body:
      config.body||
      "A quiet place caught between memory and imagination."
  };

  clickable.push(group);

  scene.add(group);

  return group;
}


/* ============================================================
   HALLWAY
   ============================================================ */

function buildHallway(){

  /* FLOOR */

  scene.add(
    makeBox(
      0,
      -.10,
      HALL_LENGTH/2,
      HALL_HALF*2,
      .20,
      HALL_LENGTH,
      0x28252a,
      {roughness:.98}
    )
  );


  /* RUNNER */

  scene.add(
    makeBox(
      0,
      .012,
      HALL_LENGTH/2,
      1.38,
      .035,
      HALL_LENGTH,
      0x35313a,
      {roughness:1}
    )
  );


  for(
    let z=3;
    z<HALL_LENGTH;
    z+=4
  ){

    scene.add(
      makeBox(
        0,
        .036,
        z,
        1.02,
        .012,
        .025,
        0x5b5159,
        {roughness:1}
      )
    );
  }


  /* CEILING */

  scene.add(
    makeBox(
      0,
      ROOM_H+.08,
      HALL_LENGTH/2,
      HALL_HALF*2+.3,
      .18,
      HALL_LENGTH,
      0x0d1015,
      {roughness:.97}
    )
  );


  /* CEILING BEAMS */

  for(
    let z=5;
    z<HALL_LENGTH;
    z+=9
  ){

    scene.add(
      makeBox(
        0,
        ROOM_H-.10,
        z,
        HALL_HALF*2+.25,
        .18,
        .22,
        0x171a20,
        {roughness:.72}
      )
    );
  }


  /* WALLS WITH DOOR OPENINGS */

  for(const side of [-1,1]){

    const wallX=
      side*HALL_HALF;

    let previous=0;

    for(const center of lobbyCenters){

      const start=
        center-DOOR_HALF;

      if(start>previous){

        const length=
          start-previous;

        scene.add(
          makeBox(
            wallX,
            ROOM_H/2,
            (previous+start)/2,
            .20,
            ROOM_H,
            length,
            0x20252d,
            {roughness:.96}
          )
        );

        addCollisionRect(
          wallX-.12,
          previous,
          wallX+.12,
          start
        );
      }

      previous=
        center+DOOR_HALF;
    }


    if(previous<HALL_LENGTH){

      scene.add(
        makeBox(
          wallX,
          ROOM_H/2,
          (previous+HALL_LENGTH)/2,
          .20,
          ROOM_H,
          HALL_LENGTH-previous,
          0x20252d,
          {roughness:.96}
        )
      );

      addCollisionRect(
        wallX-.12,
        previous,
        wallX+.12,
        HALL_LENGTH
      );
    }


    /* BASEBOARD */

    scene.add(
      makeBox(
        wallX-side*.08,
        .18,
        HALL_LENGTH/2,
        .16,
        .34,
        HALL_LENGTH,
        0x111318,
        {roughness:.62}
      )
    );


    /* VERTICAL TRIM */

    for(
      let z=4;
      z<HALL_LENGTH;
      z+=8
    ){

      const tooClose=
        lobbyCenters.some(
          center=>
            Math.abs(z-center)
            <DOOR_HALF+.55
        );

      if(tooClose) continue;

      scene.add(
        makeBox(
          wallX-side*.07,
          2.30,
          z,
          .07,
          4.35,
          .08,
          0x14171d,
          {roughness:.58}
        )
      );
    }
  }


  /* WALL SCONCES */

  for(
    let z=6;
    z<HALL_LENGTH-3;
    z+=9
  ){

    const nearDoor=
      lobbyCenters.some(
        center=>
          Math.abs(z-center)<2.7
      );

    if(nearDoor) continue;

    for(const side of [-1,1]){

      const x=
        side*(HALL_HALF-.13);

      scene.add(
        makeBox(
          x,
          2.88,
          z,
          .08,
          .30,
          .18,
          0x79664d,
          {
            metalness:.55,
            roughness:.32
          }
        )
      );

      scene.add(
        makeSphere(
          x-side*.22,
          2.84,
          z,
          .075,
          0xffc88d,
          {
            emissive:0xff8c45,
            emissiveIntensity:1.5
          }
        )
      );

      const light=
        new THREE.PointLight(
          0xffc58d,
          .27,
          5
        );

      light.position.set(
        x-side*.25,
        2.75,
        z
      );

      scene.add(light);
    }
  }


  /* SMALL CONSOLE TABLES */

  const tablePositions=[
    {side:-1,z:9},
    {side:1,z:32},
    {side:-1,z:56},
    {side:1,z:81},
    {side:-1,z:106},
    {side:1,z:128}
  ];

  for(const item of tablePositions){

    const x=
      item.side*.95;

    scene.add(
      makeBox(
        x,
        .72,
        item.z,
        .58,
        .95,
        .42,
        0x30262a,
        {roughness:.76}
      )
    );

    scene.add(
      makeBox(
        x,
        1.22,
        item.z,
        .67,
        .10,
        .50,
        0x4a3430,
        {roughness:.72}
      )
    );

    scene.add(
      makeSphere(
        x,
        1.40,
        item.z,
        .09,
        0x665447,
        {roughness:.85}
      )
    );
  }


  /* HALLWAY PAINTINGS */

  let paintingIndex=0;

  for(
    let z=5;
    z<HALL_LENGTH-3;
    z+=6.5
  ){

    if(
      lobbyCenters.some(
        c=>Math.abs(z-c)<3.0
      )
    ){
      continue;
    }

    const side=
      paintingIndex%2===0?-1:1;

    createPainting({

      x:
        side*(HALL_HALF-.02),

      y:2.15,

      z:z,

      w:.78,

      h:1.12,

const rooms=[];


function createRoom(config){

  const group=
    new THREE.Group();

  const centerX=
    config.side*
    (HALL_HALF+ROOM_W/2);

  group.position.set(
    centerX,
    0,
    config.z
  );

  scene.add(group);


  const half=
    ROOM_W/2;

  const depth=
    ROOM_D/2;


  /* FLOOR */

  group.add(
    makeBox(
      0,
      -.12,
      0,
      ROOM_W,
      .24,
      ROOM_D,
      config.floor,
      {roughness:.98}
    )
  );


  /* CEILING */

  group.add(
    makeBox(
      0,
      ROOM_H+.10,
      0,
      ROOM_W+.15,
      .20,
      ROOM_D+.15,
      config.ceiling,
      {roughness:.98}
    )
  );


  /* OUTER SIDE WALL */

  const outerLocalX=
    config.side<0
    ?-half
    :half;

  group.add(
    makeBox(
      outerLocalX,
      ROOM_H/2,
      0,
      .20,
      ROOM_H,
      ROOM_D,
      config.wall,
      {roughness:.97}
    )
  );


  const outerWorldX=
    centerX+outerLocalX;

  addCollisionRect(
    outerWorldX-.12,
    config.z-depth,
    outerWorldX+.12,
    config.z+depth
  );


  /* HALLWAY SIDE WALL */

  const hallLocalX=
    config.side<0
    ?half
    :-half;

  const hallWorldX=
    centerX+hallLocalX;


  /* negative-z wall section */

  const negativeLength=
    depth-DOOR_HALF;

  if(negativeLength>0){

    group.add(
      makeBox(
        hallLocalX,
        ROOM_H/2,
        (-depth-DOOR_HALF)/2,
        .20,
        ROOM_H,
        negativeLength,
        config.wall,
        {roughness:.97}
      )
    );

    addCollisionRect(
      hallWorldX-.12,
      config.z-depth,
      hallWorldX+.12,
      config.z-DOOR_HALF
    );
  }


  /* positive-z wall section */

  const positiveLength=
    depth-DOOR_HALF;

  if(positiveLength>0){

    group.add(
      makeBox(
        hallLocalX,
        ROOM_H/2,
        (DOOR_HALF+depth)/2,
        .20,
        ROOM_H,
        positiveLength,
        config.wall,
        {roughness:.97}
      )
    );

    addCollisionRect(
      hallWorldX-.12,
      config.z+DOOR_HALF,
      hallWorldX+.12,
      config.z+depth
    );
  }


  /* FRONT END WALL */

  group.add(
    makeBox(
      0,
      ROOM_H/2,
      -depth,
      ROOM_W,
      ROOM_H,
      .20,
      config.wall,
      {roughness:.97}
    )
  );

  addCollisionRect(
    centerX-half,
    config.z-depth-.12,
    centerX+half,
    config.z-depth+.12
  );


  /* BACK END WALL */

  group.add(
    makeBox(
      0,
      ROOM_H/2,
      depth,
      ROOM_W,
      ROOM_H,
      .20,
      config.wall,
      {roughness:.97}
    )
  );

  addCollisionRect(
    centerX-half,
    config.z+depth-.12,
    centerX+half,
    config.z+depth+.12
  );


  /* WALLPAPER */

  const wallpaperMaterial=
    new THREE.MeshStandardMaterial({
      map:
        createWallpaperTexture(
          config.wall,
          config.accent||0x555555
        ),
      roughness:.99
    });


  /* END WALL PANELS */

  for(
    const z of [-8,-4,4,8]
  ){

    const panel=
      makeMesh(
        new THREE.PlaneGeometry(
          2.6,
          3.25
        ),
        wallpaperMaterial
      );

    panel.position.set(
      hallLocalX-config.side*.115,
      2.28,
      z
    );

    panel.rotation.y=
      config.side<0
      ?Math.PI/2
      :-Math.PI/2;

    group.add(panel);
  }


  /* BACK WALL DECORATIVE PANELING */

  for(
    const x of [-5,-2.5,0,2.5,5]
  ){

    const panel=
      makeMesh(
        new THREE.PlaneGeometry(
          2.0,
          3.25
        ),
        wallpaperMaterial
      );

    panel.position.set(
      x,
      2.25,
      depth+.115
    );

    panel.rotation.y=Math.PI;

    group.add(panel);
  }


  /* BASEBOARDS */

  group.add(
    makeBox(
      outerLocalX,
      .20,
      0,
      .12,
      .35,
      ROOM_D-.25,
      0x171317,
      {roughness:.62}
    )
  );


  /* MAIN LIGHT */

  const mainLight=
    new THREE.PointLight(
      config.light,
      config.intensity,
      13
    );

  mainLight.position.set(
    config.side*.3,
    3.65,
    1
  );

  group.add(mainLight);


  /* PENDANT */

  group.add(
    makeCylinder(
      0,
      3.78,
      0,
      .025,
      .025,
      .70,
      0x101216,
      8,
      {roughness:.6}
    )
  );


  group.add(
    makeCylinder(
      0,
      3.40,
      0,
      .27,
      .17,
      .25,
      config.lampShade||0x343039,
      18,
      {roughness:.7}
    )
  );


  const pendantLight=
    new THREE.PointLight(
      config.light,
      .18,
      5
    );

  pendantLight.position.set(
    0,
    3.16,
    0
  );

  group.add(pendantLight);


  /* DOOR */

  createDoor(
    config
  );


  const roomData={
    config:config,
    group:group,
    centerX:centerX,
    mainLight:mainLight
  };

  rooms.push(roomData);

  return roomData;
}

function createDoor(config){

  const group=
    new THREE.Group();

  const side=
    config.side;

  const localX=
    side<0
    ?ROOM_W/2+.02
    :-ROOM_W/2-.02;


  /* DARK RECESS */

  group.add(
    makeBox(
      0,
      2.20,
      0,
      .32,
      4.45,
      DOOR_HALF*2+.48,
      0x08090d,
      {roughness:1}
    )
  );


  /* DOOR */

  group.add(
    makeBox(
      -side*.035,
      2.05,
      0,
      .12,
      3.88,
      DOOR_HALF*2-.10,
      config.doorColor||0x211719,
      {roughness:.75}
    )
  );


  /* DOOR PANELS */

  for(
    const z of [-.95,.95]
  ){

    group.add(
      makeBox(
        -side*.105,
        2.08,
        z,
        .025,
        1.32,
        .72,
        0x130f12,
        {roughness:.72}
      )
    );
  }


  /* FRAME POSTS */

  for(
    const z of [
      -DOOR_HALF-.14,
      DOOR_HALF+.14
    ]
  ){

    group.add(
      makeBox(
        -side*.14,
        2.28,
        z,
        .24,
        4.55,
        .20,
        0x17151a,
        {
          roughness:.55,
          metalness:.08
        }
      )
    );
  }


  /* FRAME TOP */

  group.add(
    makeBox(
      -side*.14,
      4.48,
      0,
      .24,
      .20,
      DOOR_HALF*2+.48,
      0x17151a,
      {roughness:.55}
    )
  );


  /* HANDLE */

  group.add(
    makeSphere(
      -side*.22,
      2.02,
      1.0,
      .075,
      0xb18a50,
      {
        metalness:.8,
        roughness:.22
      }
    )
  );


  /* PLAQUE */

  group.add(
    makeBox(
      -side*.19,
      4.05,
      0,
      .06,
      .38,
      1.20,
      0x11161c,
      {
        metalness:.25,
        roughness:.48
      }
    )
  );


  /* DOORWAY LIGHT */

  const doorLight=
    new THREE.PointLight(
      config.neon||0xffc28d,
      .40,
      5
    );

  doorLight.position.set(
    -side*.55,
    3.45,
    0
  );

  group.add(doorLight);


  group.position.set(
    localX,
    0,
    config.z
  );

  scene.add(group);
}

function updateRoomLabel(){

  for(
    const room of rooms
  ){

    const dx=
      Math.abs(
        camera.position.x-
        room.centerX

/* ============================================================
   MOVEMENT
   ============================================================ */

const keys={
  KeyW:false,
  KeyA:false,
  KeyS:false,
  KeyD:false
};


let yaw=Math.PI;
let pitch=0;

let lastStepTime=0;


document.addEventListener(
  "keydown",
  event=>{

    if(
      keys[event.code]!==undefined
    ){

      keys[event.code]=true;
    }
  }
);


document.addEventListener(
  "keyup",
  event=>{

    if(
      keys[event.code]!==undefined
    ){

      keys[event.code]=false;
    }
  }
);


document.addEventListener(
  "mousemove",
  event=>{

    if(
      document.pointerLockElement !==
      renderer.domElement
    ){
      return;
    }

    yaw-=
      event.movementX*.0021;

    pitch-=
      event.movementY*.0018;

    pitch=
      Math.max(
        -Math.PI/2+.12,
        Math.min(
          Math.PI/2-.12,
          pitch
        )
      );
  }
);


function updateMovement(dt){

  const forward=
    new THREE.Vector3(
      Math.sin(yaw),
      0,
      Math.cos(yaw)
    );

  const right=
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  const movement=
    new THREE.Vector3();


  if(keys.KeyW){
    movement.add(forward);
  }

  if(keys.KeyS){
    movement.sub(forward);
  }

  if(keys.KeyD){
    movement.add(right);
  }

  if(keys.KeyA){
    movement.sub(right);
  }


  if(
    movement.lengthSq()===0
  ){
    return;
  }


  movement.normalize();


  const speed=3.35;


  const intendedX=
    camera.position.x+
    movement.x*speed*dt;

  const intendedZ=
    camera.position.z+
    movement.z*speed*dt;


  /* X */

  const xResult=
    resolveCollisions(
      intendedX,
      camera.position.z
    );

  camera.position.x=
    xResult.x;


  /* Z */

  const zResult=
    resolveCollisions(
      camera.position.x,
      intendedZ
    );

  camera.position.z=
    zResult.z;


  camera.position.y=1.68;


  const now=
    performance.now();

  if(
    now-lastStepTime>390
  ){

    playFootstep();

    lastStepTime=now;
  }
}

function inspectPainting(){

  raycaster.setFromCamera(
    new THREE.Vector2(0,0),
    camera
  );


  const hits=
    raycaster.intersectObjects(
      clickable,
      true
    );


  if(!hits.length){
    return;
  }


  let object=
    hits[0].object;


  while(
    object &&
    !object.userData.painting
  ){

    object=
      object.parent;
  }


  if(
    object &&
    object.userData.painting
  ){

    openPainting(
      object.userData.painting
    );
  }
}

/* ============================================================
   AUDIO
   ============================================================ */

let audioContext=null;
let masterGain=null;
let muted=false;


function initAudio(){

  if(audioContext){
    return;
  }


  const AudioContextClass=
    window.AudioContext||
    window.webkitAudioContext;


  if(!AudioContextClass){
    return;
  }


  audioContext=
    new AudioContextClass();


  masterGain=
    audioContext.createGain();

  masterGain.gain.value=
    .22;

  masterGain.connect(
    audioContext.destination
  );


  /* LOW DRONE */

  const drone=
    audioContext.createOscillator();

  const droneGain=
    audioContext.createGain();


  drone.type=
    "sine";

  drone.frequency.value=
    49;

  droneGain.gain.value=
    .030;


  drone.connect(
    droneGain
  );

  droneGain.connect(
    masterGain
  );

  drone.start();


  /* LOW NOISE */

  const buffer=
    audioContext.createBuffer(
      1,
      audioContext.sampleRate*2,
      audioContext.sampleRate
    );


  const data=
    buffer.getChannelData(0);


  for(
    let i=0;
    i<data.length;
    i++
  ){

    data[i]=
      Math.random()*2-1;
  }


  const noise=
    audioContext.createBufferSource();

  noise.buffer=
    buffer;

  noise.loop=true;


  const filter=
    audioContext.createBiquadFilter();

  filter.type=
    "lowpass";

  filter.frequency.value=
    180;


  const noiseGain=
    audioContext.createGain();

  noiseGain.gain.value=
    .010;


  noise.connect(
    filter
  );

  filter.connect(
    noiseGain
  );

  noiseGain.connect(
    masterGain
  );

  noise.start();
}


function playFootstep(){

  if(
    !audioContext||
    !masterGain||
    muted
  ){
    return;
  }


  const oscillator=
    audioContext.createOscillator();

  const gain=
    audioContext.createGain();


  oscillator.type=
    "triangle";

  oscillator.frequency.value=
    58+
    Math.random()*18;


  const now=
    audioContext.currentTime;


  gain.gain.setValueAtTime(
    .035,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    now+.08
  );


  oscillator.connect(
    gain
  );

  gain.connect(
    masterGain
  );


  oscillator.start();

  oscillator.stop(
    now+.09
  );
}

/* ============================================================
   WORLD ANIMATION
   ============================================================ */

function animateWorld(
  time,
  dt
){

  /* ROOM 1 PROJECTOR */

  if(
    rooms[0].projectorBeam
  ){

    rooms[0].projectorBeam.material.opacity=
      .038+
      Math.sin(time*.003)*.008;
  }


  /* ROOM 1 LIGHT FLICKER */

  rooms[0].mainLight.intensity=
    .22+
    Math.sin(time*.004)*.018+
    Math.sin(time*.009)*.012;


  /* CABIN FIRE */

  if(
    rooms[1].fireLight
  ){

    rooms[1].fireLight.intensity=
      1.05+
      Math.sin(time*.007)*.12+
      Math.sin(time*.019)*.06;
  }


  /* SNOW */

  if(
    rooms[1].snow
  ){

    const positions=
      rooms[1].snow.geometry
        .attributes
        .position
        .array;

    for(
      let i=1;
      i<positions.length;
      i+=3
    ){

      positions[i]-=
        dt*.62;

      if(
        positions[i]<0
      ){

        positions[i]=4.2;
      }
    }

    rooms[1].snow.geometry
      .attributes
      .position
      .needsUpdate=true;
  }


  /* RAIN */

  if(
    rooms[2].rain
  ){

    const positions=
      rooms[2].rain.geometry
        .attributes
        .position
        .array;

    for(
      let i=1;
      i<positions.length;
      i+=3
    ){

      positions[i]-=
        dt*3.4;

      if(
        positions[i]<.15
      ){

        positions[i]=4.4;
      }
    }

    rooms[2].rain.geometry
      .attributes
      .position
      .needsUpdate=true;
  }


  /* COTTAGE FIRE */

  if(
    rooms[2].fireLight
  ){

    rooms[2].fireLight.intensity=
      1.0+
      Math.sin(time*.006)*.10+
      Math.sin(time*.017)*.045;
  }


  /* VICTORIAN PENDULUM */

  if(
    rooms[4].pendulum
  ){

    rooms[4].pendulum.rotation.z=
      Math.sin(time*.0022)*.10;
  }
}


/* ============================================================
   ENTER GALLERY
   ============================================================ */

let galleryStarted=false;


function enterGallery(){

  if(galleryStarted){
    return;
  }


  const name=
    nameInput.value.trim();


  if(!name){

    welcomeMsg.textContent=
      "Please enter your name.";

    nameInput.focus();

    return;
  }


  galleryStarted=true;


  welcomeMsg.textContent=
    "Welcome, "+name+".";


  /*
    Audio is allowed to fail silently.
    It must never stop the gallery from opening.
  */

  try{
    initAudio();

    if(
      audioContext &&
      audioContext.state==="suspended"
    ){

      audioContext.resume()
        .catch(()=>{});
    }

  }catch(error){

    console.warn(
      "Audio unavailable:",
      error
    );
  }


  loading.style.display=
    "flex";


  setTimeout(
    ()=>{

      loading.style.display=
        "none";

      welcome.style.display=
        "none";


      try{

        renderer.domElement
          .requestPointerLock();

      }catch(error){

        console.warn(
          "Pointer lock unavailable:",
          error
        );
      }

    },
    650
  );
}


enterBtn.addEventListener(
  "click",
  enterGallery
);


nameInput.addEventListener(

    if(
      event.key==="Enter"

);

   ============================================================ */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);


/* ============================================================
   MAIN LOOP
   ============================================================ */

let previousTime=
  performance.now();


function animate(
  time
){

  requestAnimationFrame(
    animate
  );


  const dt=
    Math.min(
      .05,
      (time-previousTime)/1000
    );

  previousTime=time;


  updateMovement(dt);


  camera.rotation.order=
    "YXZ";

  camera.rotation.y=
    yaw;

  camera.rotation.x=
    pitch;


  animateWorld(
    time,
    dt
  );


  updateRoomLabel();


  renderer.render(
    scene,
    camera
  );
}


/* ============================================================
   START
   ============================================================ */

loading.style.display="none";

welcome.style.display="flex";

animate(
