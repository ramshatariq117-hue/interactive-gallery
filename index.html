<!DOCTYPE html>
<html lang="en">
<head>

<title>Ramsha Art Studio — Interactive Gallery</title>

<style>

  --blue:#72d8ff;

*{

html,body{

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* ============================================================
   RAMSHA ART STUDIO — INTERACTIVE GALLERY
   Visual rebuild:
   - aged manor hallway
   - abandoned cinema
   - cozy cottage
   - snowy rural night
   - residential street
   - eerie Victorian room
   ============================================================ */

/* ------------------------------------------------------------
   BASIC SETUP
   ------------------------------------------------------------ */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  72,
  window.innerWidth / window.innerHeight,
  0.05,
  220
);

camera.position.set(0,1.68,5);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.8));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.88;

document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------
   GLOBAL CONSTANTS
   ------------------------------------------------------------ */

const HALL_HALF = 1.4;
const HALL_LENGTH = 132;
const ROOM_W = 15;
const ROOM_L = 24;
const ROOM_H = 4.8;
const DOOR_HALF = 1.62;

const lobbyCenters = [18,43,68,93,118];

const lobbyInfo = [
  {name:"LOBBY 1 · ABANDONED CINEMA", side:-1, type:"cinema"},
  {name:"LOBBY 2 · COZY COTTAGE", side: 1, type:"cottage"},
  {name:"LOBBY 3 · SNOWY RURAL NIGHT", side:-1, type:"snow"},
  {name:"LOBBY 4 · RESIDENTIAL STREET", side: 1, type:"street"},
  {name:"LOBBY 5 · VICTORIAN ROOM", side:-1, type:"horror"}
];

/* ------------------------------------------------------------
   LIGHTING / FOG
   ------------------------------------------------------------ */

scene.background = new THREE.Color(0x111014);

scene.add(
  new THREE.HemisphereLight(
    0x625c69,
    0x100d0e,
    0.36
  )
);

scene.add(
  new THREE.AmbientLight(
    0x473f46,
    0.15
  )
);

const atmosphere = {
  hall:{
    color:0x171318,
    density:0.00125
  },
  cinema:{
    color:0x101620,
    density:0.0030
  },
  cottage:{
    color:0x171514,
    density:0.00105
  },
  snow:{
    color:0x64758e,
    density:0.0025
  },
  street:{
    color:0x15202a,
    density:0.0018
  },
  horror:{
    color:0x120f13,
    density:0.0036
  }
};

scene.fog = new THREE.FogExp2(
  atmosphere.hall.color,
  atmosphere.hall.density
);

function setAtmosphere(key){
  const a = atmosphere[key] || atmosphere.hall;
  scene.fog.color.lerp(new THREE.Color(a.color),0.18);
  scene.fog.density += (a.density - scene.fog.density) * 0.08;
  scene.background.lerp(new THREE.Color(a.color),0.045);
}

/* ------------------------------------------------------------
   SEEDED RANDOM
   ------------------------------------------------------------ */

function seededRandom(seed){
  let t = seed >>> 0;
  return function(){
    t += 0x6D2B79F5;
    let r = Math.imul(t ^ t >>> 15,1 | t);
    r ^= r + Math.imul(r ^ r >>> 7,61 | r);
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------
   CANVAS MATERIAL SYSTEM
   ------------------------------------------------------------ */

function noiseFill(ctx,w,h,base,amount,rng){
  ctx.fillStyle=base;
  ctx.fillRect(0,0,w,h);

  const count = Math.floor(w*h/45);

  for(let i=0;i<count;i++){
    const x = rng()*w;
    const y = rng()*h;
    const a = (rng()*amount).toFixed(3);

    ctx.fillStyle = "rgba(255,255,255,"+a+")";
    ctx.fillRect(x,y,1+rng()*2,1+rng()*2);
  }
}

function textureFromCanvas(canvas,repeatX=1,repeatY=1){
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX,repeatY);
  tex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(),8);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function makeWallpaperTexture(seed=1){
  const rng = seededRandom(seed);
  const c = document.createElement("canvas");
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext("2d");

  noiseFill(ctx,512,512,"#75665d",0.06,rng);

  for(let x=0;x<512;x+=42){
    ctx.strokeStyle="rgba(50,35,32,.14)";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,512);
    ctx.stroke();
  }

  for(let y=24;y<512;y+=60){
    for(let x=4;x<512;x+=42){
      const yy = y + ((x/42)%2 ? 15 : 0);
      ctx.strokeStyle="rgba(40,27,25,.10)";
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x,yy-11);
      ctx.quadraticCurveTo(x+10,yy,x,yy+11);
      ctx.quadraticCurveTo(x-10,yy,x,yy-11);
      ctx.stroke();
    }
  }

  for(let i=0;i<28;i++){
    const x=rng()*512;
    const y=rng()*512;
    const r=4+rng()*24;
    ctx.fillStyle="rgba(40,27,25,"+(0.025+rng()*0.045)+")";
    ctx.beginPath();
    ctx.ellipse(x,y,r,r*.65,rng()*Math.PI,0,Math.PI*2);
    ctx.fill();
  }

  return textureFromCanvas(c,2.5,2.2);
}

function makeWoodTexture(seed=1,dark=false){
  const rng = seededRandom(seed);
  const c = document.createElement("canvas");
  c.width=512;
  c.height=512;
  const ctx=c.getContext("2d");

  noiseFill(
    ctx,
    512,
    512,
    dark ? "#34231d" : "#75533a",
    .045,
    rng
  );

  for(let i=0;i<34;i++){
    const y=i*16+rng()*8;

    ctx.strokeStyle = dark
      ? "rgba(11,7,6,.24)"
      : "rgba(37,20,13,.22)";

    ctx.lineWidth = 1+rng()*1.5;

    ctx.beginPath();

    let x=-20;
    ctx.moveTo(x,y);

    while(x<540){
      x+=18+rng()*34;
      ctx.lineTo(
        x,
        y+Math.sin(x*.025+i)*3
      );
    }

    ctx.stroke();
  }

  for(let i=0;i<12;i++){
    const x=rng()*512;
    const y=rng()*512;

    ctx.strokeStyle = "rgba(20,12,9,.18)";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.ellipse(
      x,y,
      8+rng()*18,
      2+rng()*5,
      rng()*Math.PI,
      0,
      Math.PI*2
    );
    ctx.stroke();
  }

  return textureFromCanvas(c,2,5);
}

function makeFabricTexture(seed=1,base="#49313a"){
  const rng=seededRandom(seed);
  const c=document.createElement("canvas");
  c.width=256;
  c.height=256;
  const ctx=c.getContext("2d");

  noiseFill(ctx,256,256,base,.08,rng);

  for(let i=0;i<1300;i++){
    const x=rng()*256;
    const y=rng()*256;
    ctx.fillStyle =
      "rgba(235,220,205,"+(0.012+rng()*0.025)+")";
    ctx.fillRect(x,y,1,1);
  }

  return textureFromCanvas(c,3,3);
}

function makeRugTexture(seed=2){
  const rng=seededRandom(seed);
  const c=document.createElement("canvas");
  c.width=512;
  c.height=512;
  const ctx=c.getContext("2d");

  noiseFill(ctx,512,512,"#49272f",.06,rng);

  ctx.strokeStyle="rgba(196,157,110,.24)";
  ctx.lineWidth=5;
  ctx.strokeRect(24,24,464,464);

  ctx.lineWidth=2;
  ctx.strokeRect(44,44,424,424);

  for(let i=0;i<12;i++){
    const inset=65+i*13;
    ctx.strokeStyle =
      "rgba(195,150,112,"+(0.055+rng()*0.075)+")";
    ctx.strokeRect(
      inset,
      inset,
      512-inset*2,
      512-inset*2
    );
  }

  return textureFromCanvas(c,1,2);
}

function makeBrickTexture(seed=1){
  const rng=seededRandom(seed);
  const c=document.createElement("canvas");
  c.width=512;
  c.height=512;
  const ctx=c.getContext("2d");

  noiseFill(ctx,512,512,"#6d4f44",.06,rng);

  const bw=72;
  const bh=29;

  for(let row=0;row<18;row++){
    const y=row*bh;
    const offset=(row%2)*36;

    for(let col=-1;col<9;col++){
      const x=col*bw-offset;

      ctx.strokeStyle="rgba(35,23,20,.58)";
      ctx.lineWidth=4;

      ctx.strokeRect(
        x,
        y,
        bw,
        bh
      );

      ctx.fillStyle =
        "rgba(210,175,145,"+(0.015+rng()*0.045)+")";
      ctx.fillRect(
        x+4,
        y+4,
        bw-8,
        bh-8
      );
    }
  }

  return textureFromCanvas(c,2.3,2.2);
}

/* ------------------------------------------------------------
   MATERIAL HELPERS
   ------------------------------------------------------------ */

function mat(opts={}){
  return new THREE.MeshStandardMaterial({
    color:opts.color ?? 0xffffff,
    map:opts.map || null,
    roughness:opts.roughness ?? .78,
    metalness:opts.metalness ?? 0,
    emissive:opts.emissive ?? 0x000000,
    emissiveIntensity:opts.emissiveIntensity ?? 0,
    transparent:opts.transparent ?? false,
    opacity:opts.opacity ?? 1
  });
}

const MAT = {
  wall:mat({
    map:makeWallpaperTexture(4),
    roughness:.94
  }),
  wallDark:mat({
    color:0x40343a,
    map:makeWallpaperTexture(9),
    roughness:.98
  }),
  wood:mat({
    map:makeWoodTexture(5,false),
    roughness:.88
  }),
  woodDark:mat({
    map:makeWoodTexture(8,true),
    roughness:.94
  }),
  brass:mat({
    color:0x8b6b3d,
    roughness:.34,
    metalness:.72
  }),
  blackMetal:mat({
    color:0x181716,
    roughness:.68,
    metalness:.75
  }),
  carpet:mat({
    map:makeRugTexture(7),
    roughness:1
  }),
  velvet:mat({
    map:makeFabricTexture(9,"#4b1f2b"),
    roughness:.97
  }),
  sofa:mat({
    map:makeFabricTexture(16,"#574b43"),
    roughness:.97
  }),
  leather:mat({
    map:makeFabricTexture(20,"#3c2923"),
    roughness:.9
  }),
  brick:mat({
    map:makeBrickTexture(3),
    roughness:.97
  }),
  stone:mat({
    color:0x71695f,
    roughness:1
  }),
  glass:mat({
    color:0x6e8290,
    roughness:.16,
    metalness:.04,
    transparent:true,
    opacity:.24
  }),
  darkGlass:mat({
    color:0x111820,
    roughness:.18,
    transparent:true,
    opacity:.42
  }),
  porcelain:mat({
    color:0xa79c8c,
    roughness:.57
  }),
  paper:mat({
    color:0xd4c9b8,
    roughness:.9
  }),
  foliage:mat({
    color:0x263229,
    roughness:1
  }),
  snow:mat({
    color:0xe8edf1,
    roughness:1
  }),
  asphalt:mat({
    color:0x1d2023,
    roughness:.96
  }),
  concrete:mat({
    color:0x615f5c,
    roughness:1
  })
};

/* ------------------------------------------------------------
   GEOMETRY HELPERS
   ------------------------------------------------------------ */

function box(
  x,y,z,
  sx,sy,sz,
  material,
  cast=true,
  receive=true,
  parent=scene
){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(sx,sy,sz),
    material
  );

  m.position.set(x,y,z);
  m.castShadow=cast;
  m.receiveShadow=receive;
  parent.add(m);

  return m;
}

function cyl(
  x,y,z,
  radius,height,
  material,
  segments=16,
  rot=null,
  parent=scene
){
  const m = new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius,
      height,
      segments
    ),
    material
  );

  m.position.set(x,y,z);

  if(rot){
    m.rotation.set(rot.x||0,rot.y||0,rot.z||0);
  }

  m.castShadow=true;
  m.receiveShadow=true;
  parent.add(m);

  return m;
}

function sphere(
  x,y,z,
  radius,
  material,
  parent=scene
){
  const m=new THREE.Mesh(
    new THREE.SphereGeometry(radius,18,12),
    material
  );

  m.position.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;

  parent.add(m);
  return m;
}

function lineBetween(
  a,b,
  radius,
  material,
  parent=scene
){
  const dx=b.x-a.x;
  const dy=b.y-a.y;
  const dz=b.z-a.z;

  const len=Math.sqrt(dx*dx+dy*dy+dz*dz);

  const m=new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius,
      radius,
      len,
      7
    ),
    material
  );

  m.position.set(
    (a.x+b.x)/2,
    (a.y+b.y)/2,
    (a.z+b.z)/2
  );

  m.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(dx,dy,dz).normalize()
  );

  m.castShadow=true;
  parent.add(m);

  return m;
}

/* ------------------------------------------------------------
   COLLISION SYSTEM
   ------------------------------------------------------------ */

const colliders=[];

function addCollider(x1,x2,z1,z2){
  colliders.push({
    minX:Math.min(x1,x2),
    maxX:Math.max(x1,x2),
    minZ:Math.min(z1,z2),
    maxZ:Math.max(z1,z2)
  });
}

function circleHitsBox(x,z,r,b){
  return (
    x+r>b.minX &&
    x-r<b.maxX &&
    z+r>b.minZ &&
    z-r<b.maxZ
  );
}

function canMoveTo(x,z){
  const playerRadius=.27;

  if(
    x < -(HALL_HALF+ROOM_W-.45) ||
    x >  (HALL_HALF+ROOM_W-.45) ||
    z < .75 ||
    z > HALL_LENGTH-.7
  ){
    return false;
  }

  for(const c of colliders){
    if(circleHitsBox(x,z,playerRadius,c)){
      return false;
    }
  }

  return true;
}

/* ------------------------------------------------------------
   HALL FLOOR / CEILING
   ------------------------------------------------------------ */

function buildHallFloor(){

  box(
    0,-.07,HALL_LENGTH/2,
    2*HALL_HALF,
    .14,
    HALL_LENGTH,
    MAT.wood,
    false,
    true
  );

  const runner=box(

function addHallSideWallSegments(side){

  const x=side*HALL_HALF;

  const openings=lobbyCenters
    .filter((z,i)=>lobbyInfo[i].side===side)
    .sort((a,b)=>a-b);

  let cursor=0;

  for(const center of openings){

    const start=center-DOOR_HALF;
    const end=center+DOOR_HALF;

    if(start>cursor){
      const len=start-cursor;

      box(
        x,
        ROOM_H/2,
        cursor+len/2,
        .16,
        ROOM_H,
        len,
        MAT.wall,
        false,
        true
      );

      box(
        x-side*.09,
        .76,
        cursor+len/2,
        .10,
        .07,
        len,
        MAT.wood,
        false,
        true
      );

      addCollider(
        x-.08,
        x+.08,
        cursor,
        start
      );
    }

    addDoorArchitecture(
      side,
      center
    );

    cursor=end;
  }

  if(cursor<HALL_LENGTH){
    const len=HALL_LENGTH-cursor;

    box(
      x,
      ROOM_H/2,
      cursor+len/2,
      .16,
      ROOM_H,
      len,
      MAT.wall,
      false,
      true
    );

    addCollider(
      x-.08,
      x+.08,
      cursor,
      HALL_LENGTH
    );
  }
}

   ------------------------------------------------------------ */

function createRoomShell(center,side){

  const g=new THREE.Group();
  scene.add(g);

  const xInner=side*HALL_HALF;
  const xOuter=side*(HALL_HALF+ROOM_W);
  const zMin=center-ROOM_L/2;
  const zMax=center+ROOM_L/2;

  /* floor */
  box(
    side*(HALL_HALF+ROOM_W/2),
    -.07,
    center,
    ROOM_W,
    .14,
    ROOM_L,
    MAT.wood,
    false,
    true,
    g
  );

  /* ceiling */
  box(
    side*(HALL_HALF+ROOM_W/2),
    ROOM_H+.02,
    center,
    ROOM_W,
    .18,
    ROOM_L,
    MAT.woodDark,
    false,
    true,
    g
  );

  /* outer/back wall */
  box(
    xOuter,
    ROOM_H/2,
    center,
    .18,
    ROOM_H,
    ROOM_L,
    MAT.wall,
    false,
    true,
    g
  );

  /* front/back side walls */
  box(
    side*(HALL_HALF+ROOM_W/2),
    ROOM_H/2,
    zMin,
    ROOM_W,
    ROOM_H,
    .18,
    MAT.wall,
    false,
    true,
    g
  );

  box(
    side*(HALL_HALF+ROOM_W/2),
    ROOM_H/2,
    zMax,
    ROOM_W,
    ROOM_H,
    .18,
    MAT.wall,
    false,
    true,
    g
  );

  /* trim along outer walls */
  box(
    xOuter-side*.10,
    .59,
    center,
    .10,
    .08,
    ROOM_L,
    MAT.woodDark,
    false,
    true,
    g
  );

  box(
    side*(HALL_HALF+ROOM_W/2),
    .59,
    zMin+side*0,
    ROOM_W,
    .08,
    .10,
    MAT.woodDark,
    false,
    true,
    g
  );

  /* ceiling beams */
  for(let x=xInner+side*3;x*side<xOuter*side;x+=side*3){
    box(
      x,
      ROOM_H-.10,
      center,
      .15,
      .18,
      ROOM_L-.2,
      MAT.woodDark,
      false,
      true,
      g
    );
  }

  /* architectural colliders */

  addCollider(
    Math.min(
      xOuter,
      xOuter-side*.20
    ),
    Math.max(
      xOuter,
      xOuter-side*.20
    ),
    zMin,
    zMax
  );

  addCollider(
    side*(HALL_HALF+ROOM_W/2)-ROOM_W/2,
    side*(HALL_HALF+ROOM_W/2)+ROOM_W/2,
    zMin-.09,
    zMin+.09
  );

  addCollider(
    side*(HALL_HALF+ROOM_W/2)-ROOM_W/2,
    side*(HALL_HALF+ROOM_W/2)+ROOM_W/2,
    zMax-.09,
    zMax+.09
  );

  return {
    g,
    center,
    side,
    inner:xInner,
    outer:xOuter,
    zMin,
    zMax,
    centerX:side*(HALL_HALF+ROOM_W/2)
  };
}

      width+.18,

  for(const zz of [-width/2,width/2]){

      z+zz,
      .12,
      height+.08,

      frame,

  box(

  box(

    z,
    .10,
    .055,
    width,
    frame,
    false,true,group
  ).rotation.y=rotationY;

  return glass;
}

function makePaintingCanvas(seed=1,variant=0){
  const rng=seededRandom(seed*913+variant*101);

  const c=document.createElement("canvas");
  c.width=512;
  c.height=620;

  const ctx=c.getContext("2d");

  const palette=
    paintingPalettes[(seed+variant)%paintingPalettes.length];

  const grad=ctx.createLinearGradient(0,0,0,620);
  grad.addColorStop(0,palette[0]);
  grad.addColorStop(.56,palette[1]);
  grad.addColorStop(1,palette[2]);

  ctx.fillStyle=grad;
  ctx.fillRect(0,0,512,620);

  ctx.fillStyle="rgba(255,255,255,.025)";
  ctx.fillRect(0,0,512,620);

  const mode=(seed+variant)%8;

  if(mode===0){
    /* road */
    ctx.fillStyle="rgba(12,14,17,.58)";
    ctx.fillRect(0,370,512,250);

    ctx.beginPath();
    ctx.moveTo(196,620);
    ctx.lineTo(274,620);
    ctx.lineTo(293,370);
    ctx.lineTo(232,370);
    ctx.closePath();
    ctx.fillStyle="rgba(20,22,26,.95)";
    ctx.fill();

    ctx.fillStyle="rgba(223,190,140,.55)";
    ctx.fillRect(252,415,4,40);
    ctx.fillRect(253,486,4,42);

    ctx.fillStyle="rgba(231,181,105,.9)";
    ctx.fillRect(214,330,84,42);

    ctx.fillStyle="rgba(30,23,21,.8)";
    ctx.fillRect(228,346,55,48);
  }

  else if(mode===1){
    /* house */
    ctx.fillStyle="rgba(23,21,21,.92)";
    ctx.fillRect(108,276,298,194);

    ctx.beginPath();
    ctx.moveTo(72,278);
    ctx.lineTo(257,143);
    ctx.lineTo(440,278);
    ctx.closePath();

    ctx.fillStyle="rgba(39,29,29,.98)";
    ctx.fill();

    ctx.fillStyle="rgba(232,178,102,.9)";
    ctx.fillRect(151,325,52,50);
    ctx.fillRect(308,325,52,50);

    ctx.fillStyle="rgba(248,202,130,.78)";
    ctx.fillRect(224,314,64,78);

    ctx.fillStyle="rgba(9,11,14,.7)";
    ctx.fillRect(0,465,512,155);
  }

  else if(mode===2){
    /* rainy window */
    ctx.fillStyle="rgba(20,29,38,.95)";
    ctx.fillRect(54,82,404,456);

    ctx.strokeStyle="rgba(197,210,219,.45)";
    ctx.lineWidth=7;

    for(let i=0;i<25;i++){
      const x=rng()*460+26;
      const y=rng()*450+90;

      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-7,y+30+rng()*40);
      ctx.stroke();
    }

    ctx.fillStyle="rgba(239,188,112,.72)";
    ctx.fillRect(313,293,72,82);
  }

  else if(mode===3){
    /* gas station / distant lights */
    ctx.fillStyle="rgba(12,17,19,.88)";
    ctx.fillRect(0,392,512,228);

    ctx.fillStyle="rgba(39,39,37,.93)";
    ctx.fillRect(126,268,262,126);

    ctx.fillStyle="rgba(219,170,94,.88)";
    ctx.fillRect(180,296,156,50);

    ctx.fillStyle="rgba(130,158,165,.55)";
    ctx.fillRect(149,354,70,28);
    ctx.fillRect(292,354,70,28);

    for(let i=0;i<8;i++){
      ctx.fillStyle="rgba(238,193,120,.7)";
      ctx.fillRect(
        34+i*61,
        434+rng()*12,
        4,
        4
      );
    }
  }

  else if(mode===4){
    /* bedroom */
    ctx.fillStyle="rgba(14,20,26,.95)";
    ctx.fillRect(50,95,412,425);

    ctx.fillStyle="rgba(154,132,111,.32)";
    ctx.fillRect(118,357,255,126);

    ctx.fillStyle="rgba(231,186,117,.85)";
    ctx.fillRect(270,172,102,140);

    ctx.fillStyle="rgba(249,219,157,.62)";
    ctx.fillRect(290,192,60,98);

    ctx.fillStyle="rgba(26,31,37,.9)";
    ctx.fillRect(0,526,512,94);
  }

  else if(mode===5){
    /* fog road */
    ctx.fillStyle="rgba(203,208,203,.10)";
    ctx.beginPath();
    ctx.ellipse(255,370,215,85,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="rgba(18,19,20,.75)";
    ctx.beginPath();
    ctx.moveTo(206,620);
    ctx.lineTo(305,620);
    ctx.lineTo(286,352);
    ctx.lineTo(235,352);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="rgba(232,197,144,.62)";
    ctx.fillRect(222,303,68,48);
  }

  else if(mode===6){
    /* car beneath lamp */
    ctx.fillStyle="rgba(13,16,20,.9)";
    ctx.fillRect(0,423,512,197);

    ctx.fillStyle="rgba(69,57,52,.95)";
    ctx.beginPath();
    ctx.roundRect(150,363,210,76,14);
    ctx.fill();

    ctx.fillStyle="rgba(53,72,78,.8)";
    ctx.fillRect(181,350,67,34);
    ctx.fillRect(264,350,67,34);

    ctx.fillStyle="rgba(244,190,101,.9)";
    ctx.fillRect(149,382,28,18);
    ctx.fillRect(333,382,28,18);

    ctx.fillStyle="rgba(234,193,126,.45)";
    ctx.fillRect(248,128,5,235);
  }

  else{
    /* little distant house */
    ctx.fillStyle="rgba(15,18,19,.88)";
    ctx.fillRect(0,440,512,180);

    ctx.fillStyle="rgba(32,28,25,.96)";
    ctx.fillRect(180,284,154,165);

    ctx.beginPath();
    ctx.moveTo(157,284);
    ctx.lineTo(258,204);
    ctx.lineTo(358,284);
    ctx.closePath();

    ctx.fillStyle="rgba(45,35,31,.98)";
    ctx.fill();

    ctx.fillStyle="rgba(239,185,106,.9)";
    ctx.fillRect(215,329,36,43);
    ctx.fillRect(275,329,36,43);
  }

  /* atmospheric veil */
  const veil=ctx.createLinearGradient(0,0,0,620);
  veil.addColorStop(0,"rgba(255,255,255,.035)");
  veil.addColorStop(.55,"rgba(255,255,255,0)");
  veil.addColorStop(1,"rgba(0,0,0,.13)");

  ctx.fillStyle=veil;
  ctx.fillRect(0,0,512,620);

  return textureFromCanvas(c,1,1);
}

function addPainting(
  group,
  x,y,z,
  rotationY,
  seed,
  scale=1,
  note="A quiet little piece from the gallery."
){
  const frame=box(
    x,
    y,
    z,
    .09*scale,
    1.66*scale,
    1.30*scale,
    MAT.woodDark,
    true,
    true,
    group
  );

  frame.rotation.y=rotationY;

  const texture=makePaintingCanvas(seed,Math.floor(seed%15));

  const artwork=box(
    x,
    y,
    z,
    .035*scale,
    1.43*scale,
    1.08*scale,
    mat({
      map:texture,
      roughness:.72
    }),
    false,
    true,
    group
  );

  artwork.rotation.y=rotationY;

  artwork.userData.note=note;
  artwork.userData.title=paintingTitles[(seed-1)%paintingTitles.length];

  clickable.push(artwork);

  /* tiny brass hooks */
  const hookMat=MAT.brass;

  const hookA=sphere(
    x + Math.sin(rotationY)*(-.30*scale),
    y+0.82*scale,
    z + Math.cos(rotationY)*(-.30*scale),
    .025,
    hookMat,
    group
  );

  hookA.rotation.y=rotationY;

  return artwork;
}

function addDust(group,room){

  const count=95;
  const positions=new Float32Array(count*3);
  const rng=seededRandom(Math.floor(room.center*13));

  for(let i=0;i<count;i++){
    positions[i*3]=room.centerX+(rng()-.5)*(ROOM_W-1);
    positions[i*3+1]=.4+rng()*3.5;
    positions[i*3+2]=room.center+(rng()-.5)*(ROOM_L-1);
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute(
    "position",
    new THREE.BufferAttribute(positions,3)
  );

  const points=new THREE.Points(
    geo,
    new THREE.PointsMaterial({
      color:0xd9d0c5,
      size:.017,
      transparent:true,
      opacity:.34,
      depthWrite:false
    })
  );

  points.userData.dust=true;
  group.add(points);
}

function pineTree(group,x,z,s=1){

  cyl(
    x,
    .65*s,
    z,
    .12*s,

    9,

  );

        (.70-i*.11)*s,
        (1.20-.07*i)*s,
        10
      ),
      MAT.foliage
    );

    cone.position.set(
      x,
      1.38*s+i*.36*s,
      z
    );

    cone.castShadow=true;
    cone.receiveShadow=true;
    group.add(cone);
  }

  sphere(

function addSnow(group,room){

  const count=520;
  const pos=new Float32Array(count*3);

  const rng=seededRandom(556+room.center);

  for(let i=0;i<count;i++){
    pos[i*3]=room.centerX+(rng()-.5)*12;
    pos[i*3+1]=.3+rng()*4.1;
    pos[i*3+2]=room.center+(rng()-.5)*21;
  }

  const geo=new THREE.BufferGeometry();

  geo.setAttribute(
    "position",
    new THREE.BufferAttribute(pos,3)
  );

  const snow=new THREE.Points(
    geo,
    new THREE.PointsMaterial({
      color:0xe9f0f5,
      size:.025,
      transparent:true,
      opacity:.7,
      depthWrite:false
    })
  );

  snow.userData.snow=true;

  group.add(snow);
}

/* ------------------------------------------------------------
   PLAYER / MOVEMENT
   ------------------------------------------------------------ */

const keys={};

let yaw=Math.PI;
let pitch=0;

let velocityX=0;
let velocityZ=0;

let controlsEnabled=false;
let pointerLocked=false;

document.addEventListener("keydown",e=>{
  keys[e.code]=true;
});

document.addEventListener("keyup",e=>{
  keys[e.code]=false;
});

renderer.domElement.addEventListener("click",()=>{

  if(!controlsEnabled) return;

  if(document.pointerLockElement!==renderer.domElement){
    renderer.domElement.requestPointerLock();
  }else{
    checkPaintingClick();
  }

});

document.addEventListener("pointerlockchange",()=>{

  pointerLocked=
    document.pointerLockElement===renderer.domElement;

});

document.addEventListener("mousemove",e=>{

  if(!pointerLocked) return;

  yaw-=e.movementX*.00225;
  pitch-=e.movementY*.00185;

  pitch=Math.max(
    -Math.PI/2+.08,
    Math.min(Math.PI/2-.08,pitch)
  );
});

/* ------------------------------------------------------------
   PLAYER AUDIO
   ------------------------------------------------------------ */

let audioCtx=null;
let masterGain=null;
let droneGain=null;
let audioOn=true;
let footTimer=0;
let toneTimer=0;

function setupAudio(){

  try{

    audioCtx=
      new (window.AudioContext||window.webkitAudioContext)();

    masterGain=audioCtx.createGain();
    masterGain.gain.value=.34;
    masterGain.connect(audioCtx.destination);

    droneGain=audioCtx.createGain();
    droneGain.gain.value=.055;

    const osc=audioCtx.createOscillator();

    osc.type="sine";
    osc.frequency.value=49;

    const filter=audioCtx.createBiquadFilter();
    filter.type="lowpass";
    filter.frequency.value=150;

    osc.connect(filter);
    filter.connect(droneGain);
    droneGain.connect(masterGain);

    osc.start();

    /* noise */
    const buffer=audioCtx.createBuffer(
      1,
      audioCtx.sampleRate*2,
      audioCtx.sampleRate
    );

    const data=buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
      data[i]=(Math.random()*2-1)*.10;
    }

    const noise=audioCtx.createBufferSource();
    noise.buffer=buffer;
    noise.loop=true;

    const noiseFilter=audioCtx.createBiquadFilter();
    noiseFilter.type="lowpass";
    noiseFilter.frequency.value=320;

    const noiseGain=audioCtx.createGain();
    noiseGain.gain.value=.035;

    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(masterGain);

    noise.start();

  }catch(e){
    console.warn("Audio unavailable",e);
  }
}

function playFootstep(){

  if(!audioCtx || !audioOn) return;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="triangle";

  osc.frequency.setValueAtTime(
    83+Math.random()*16,
    audioCtx.currentTime
  );

  osc.frequency.exponentialRampToValueAtTime(
    42,
    audioCtx.currentTime+.11
  );

  gain.gain.setValueAtTime(
    .0001,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .045,
    audioCtx.currentTime+.012
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    audioCtx.currentTime+.11
  );

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start();
  osc.stop(audioCtx.currentTime+.12);
}

function playRoomTone(type){

  if(!audioCtx || !audioOn) return;

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type=
    type==="horror"
      ?"triangle"
      :type==="snow"
        ?"sine"
        :"sine";

  let freq=110;

  if(type==="cinema") freq=82;
  if(type==="cottage") freq=68;
  if(type==="snow") freq=124;
  if(type==="street") freq=91;
  if(type==="horror") freq=57;

  osc.frequency.setValueAtTime(
    freq,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    freq*.58,
    now+1.8
  );

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .025,
    now+.18
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+1.8
  );

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start(now);
  osc.stop(now+1.85);
}

function toggleMute(){

  audioOn=!audioOn;

  if(masterGain){

    masterGain.gain.setTargetAtTime(
      audioOn?.34:0,
      audioCtx.currentTime,
      .04
    );

  }

  document.getElementById("mute").textContent=
    audioOn
      ?"SOUND ON"
      :"SOUND OFF";
}

document.getElementById("mute")
  .addEventListener("click",toggleMute);

function escapeHTML(str){
  return str.replace(
    /[&<>"']/g,
    ch=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    })[ch]
  );
}

const raycaster=new THREE.Raycaster();

function checkPaintingClick(){

/* ------------------------------------------------------------
   ROOM DETECTION
   ------------------------------------------------------------ */

let currentArea="hall";
let lastLobby=-1;

function detectArea(){

  let area="hall";
  let lobby=-1;

  for(let i=0;i<rooms.length;i++){

    const r=rooms[i];

    const insideZ=
      camera.position.z>=r.zMin &&
      camera.position.z<=r.zMax;

    const beyondWall=
      (
        r.side<0 &&
        camera.position.x<-(HALL_HALF+.18)
      ) ||
      (
        r.side>0 &&
        camera.position.x>(HALL_HALF+.18)
      );

    if(insideZ && beyondWall){
      lobby=i;
      area=lobbyInfo[i].type;
      break;
    }
  }

  if(area!==currentArea){
    currentArea=area;

    if(area!=="hall"){
      playRoomTone(area);
    }
  }

  const label=
    lobby>=0
      ?lobbyInfo[lobby].name
      :"HALLWAY";

  document.getElementById("roomLabel")
    .textContent=label;
}

/* ------------------------------------------------------------
   MOVEMENT
   ------------------------------------------------------------ */

function updateMovement(dt){

  if(!controlsEnabled) return;

  let inputX=0;
  let inputZ=0;

  if(keys.KeyA) inputX-=1;
  if(keys.KeyD) inputX+=1;
  if(keys.KeyW) inputZ-=1;
  if(keys.KeyS) inputZ+=1;

  const moving=
    inputX!==0 || inputZ!==0;

  if(moving){

    const len=Math.hypot(inputX,inputZ);
    inputX/=len;
    inputZ/=len;

    const speed=2.85;

    /*
      Camera faces along -Z when yaw=0.
      Transform local input through yaw.
    */
    const forwardX=-Math.sin(yaw);
    const forwardZ=-Math.cos(yaw);

    const rightX=Math.cos(yaw);
    const rightZ=-Math.sin(yaw);

    const targetVX=
      (rightX*inputX+forwardX*inputZ)*speed;

    const targetVZ=
      (rightZ*inputX+forwardZ*inputZ)*speed;

    velocityX+=(targetVX-velocityX)*
      Math.min(1,dt*13);

    velocityZ+=(targetVZ-velocityZ)*
      Math.min(1,dt*13);

    footTimer+=dt;

    if(
      footTimer >
      .43 &&
      Math.hypot(velocityX,velocityZ)>.7
    ){
      playFootstep();
      footTimer=0;
    }

  }else{

    velocityX*=Math.pow(.001,dt);
    velocityZ*=Math.pow(.001,dt);
  }

  const nextX=
    camera.position.x+
    velocityX*dt;

  const nextZ=
    camera.position.z+
    velocityZ*dt;

  if(canMoveTo(nextX,camera.position.z)){
    camera.position.x=nextX;
  }else{
    velocityX=0;
  }

  if(canMoveTo(camera.position.x,nextZ)){
    camera.position.z=nextZ;
  }else{
    velocityZ=0;
  }

  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
}

/* ------------------------------------------------------------
   ANIMATION
   ------------------------------------------------------------ */

let elapsed=0;

function animateWorld(dt){

  elapsed+=dt;

  /* hallway light imperfections */
  hallwayLights.forEach((entry,i)=>{

    const flicker=
      Math.sin(elapsed*1.35+entry.phase)*.035+
      Math.sin(elapsed*5.1+entry.phase*1.7)*.018;

    let intensity=
      Math.max(.18,entry.base+flicker);

    if(
      i===5 ||
      i===13 ||
      i===22
    ){
      intensity *=
        .78+
        Math.sin(elapsed*8.3+i)*.11;
    }

    entry.light.intensity=intensity;

    entry.bulb.material.emissiveIntensity=
      1.35+intensity*.55;
  });

  /* rain */
  scene.traverse(obj=>{

    if(obj.userData?.rain){

      const a=obj.geometry.attributes.position;
      const arr=a.array;

      for(let i=0;i<arr.length;i+=3){

        arr[i+1]-=dt*3.3;

        if(arr[i+1]<.15){
          arr[i+1]=4.2;
        }
      }

      a.needsUpdate=true;
    }

    if(obj.userData?.snow){

      const a=obj.geometry.attributes.position;
      const arr=a.array;

      for(let i=0;i<arr.length;i+=3){

        arr[i+1]-=dt*.42;

        arr[i]-=
          Math.sin(elapsed*.55+i)*dt*.008;

        if(arr[i+1]<.18){
          arr[i+1]=4.25;
        }
      }

      a.needsUpdate=true;
    }

    if(obj.userData?.dust){

      const a=obj.geometry.attributes.position;
      const arr=a.array;

      for(let i=0;i<arr.length;i+=3){

        arr[i+1]+=
          dt*(.015+
          Math.sin(elapsed*.7+i)*.006);

        arr[i]+=
          Math.sin(elapsed*.45+i*.03)*dt*.004;

        if(arr[i+1]>4.35){
          arr[i+1]=.35;
        }
      }

      a.needsUpdate=true;
    }

    /* horror clocks */
    if(obj.userData?.pendulum){
      obj.userData.pendulum.rotation.z=
        Math.sin(elapsed*2.2)*.14;
    }
  });

  /* fireplace pulse */
  scene.traverse(obj=>{
    if(obj.isPointLight && obj.color){
      if(
        obj.color.r>.8 &&
        obj.color.g>.35 &&
        obj.color.b<.3
      ){
        obj.intensity +=
          Math.sin(elapsed*9.0)*
          .012;
      }
    }
  });
}

/* ------------------------------------------------------------
   RESIZE
   ------------------------------------------------------------ */

window.addEventListener("resize",()=>{

  camera.aspect=
    window.innerWidth/window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

/* ------------------------------------------------------------
   INITIALIZATION
   ------------------------------------------------------------ */

setTimeout(()=>{
  document.getElementById("loading")
    .classList.add("hide");
},700);

/* ------------------------------------------------------------
   LOOP
   ------------------------------------------------------------ */

let previousTime=performance.now();

function render(){

  requestAnimationFrame(render);

  const now=performance.now();

  const dt=Math.min(
    .05,
    (now-previousTime)/1000
  );

  previousTime=now;

  updateMovement(dt);
  detectArea();
  animateWorld(dt);

  /* environment transitions */
  setAtmosphere(currentArea);

  toneTimer+=dt;

  if(
    currentArea!=="hall" &&
    toneTimer>18+
      Math.random()*12
  ){
    playRoomTone(currentArea);
    toneTimer=0;
  }

  renderer.render(scene,camera);
}

render();
