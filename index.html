<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramsha Art Studio — Interactive Gallery</title>

<style>
  :root{
    --neon:#5ef2ff;
    --paper:#e8dcc0;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:'Georgia',serif;
  }

  #app{
    position:relative;
    width:100%;
    height:100%;
  }

  canvas{
    display:block;
  }

  #welcome{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 40%,#0a0a14 0%,#000 80%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:50;
    color:#cbd6e6;
  }

  #welcome h1{
    font-size:2.2em;
    letter-spacing:2px;
    color:var(--neon);
    text-shadow:0 0 12px var(--neon),0 0 30px var(--neon);
    margin-bottom:8px;
  }

  #welcome p{
    opacity:.7;
    margin-bottom:22px;
  }

  #nameInput{
    padding:12px 16px;
    font-size:1.1em;
    border-radius:6px;
    border:1px solid #345;
    background:#0e1420;
    color:#e8f0ff;
    width:280px;
    text-align:center;
    margin-bottom:16px;
  }

  #enterBtn{
    padding:12px 28px;
    font-size:1.05em;
    letter-spacing:1px;
    cursor:pointer;
    border-radius:6px;
    border:1px solid var(--neon);
    background:transparent;
    color:var(--neon);
    text-shadow:0 0 8px var(--neon);
    transition:all .25s;
  }

  #enterBtn:hover{
    background:var(--neon);
    color:#001;
    box-shadow:0 0 20px var(--neon);
  }

  #welcomeMsg{
    font-size:1.3em;
    color:#fff;
    text-align:center;
    max-width:520px;
    line-height:1.5;
  }

  #crosshair{
    position:absolute;
    top:50%;
    left:50%;
    width:6px;
    height:6px;
    margin:-3px 0 0 -3px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    z-index:20;
    pointer-events:none;
  }

  #hint{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    color:#9fb3c8;
    font-size:.85em;
    background:rgba(0,0,0,.4);
    padding:6px 14px;
    border-radius:20px;
    z-index:20;
    pointer-events:none;
  }

  #muteBtn{
    position:absolute;
    top:16px;
    right:16px;
    z-index:30;
    background:rgba(0,0,0,.5);
    color:#cde;
    border:1px solid #456;
    border-radius:6px;
    padding:8px 12px;
    cursor:pointer;
    font-size:.9em;
  }

  #roomLabel{
    position:absolute;
    top:16px;
    left:16px;
    z-index:20;
    color:var(--neon);
    text-shadow:0 0 8px var(--neon);
    font-size:1em;
    letter-spacing:2px;
    opacity:0;
    transition:opacity .6s;
  }

  .modalOverlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(2px);
  }

  .note{
    width:340px;
    max-width:80vw;
    background:var(--paper);
    color:#3a2f22;
    padding:26px 24px;
    border-radius:2px;
    box-shadow:
      0 0 40px rgba(0,0,0,.7),
      inset 0 0 40px rgba(120,90,50,.25);
    transform:rotate(-1.2deg);
    font-family:'Georgia',serif;
    position:relative;
  }

  .note::before{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      0deg,
      transparent,
      transparent 24px,
      rgba(0,0,0,.03) 25px
    );
    pointer-events:none;
  }

  .note h3{
    font-size:1.15em;
    margin-bottom:10px;
    border-bottom:1px solid rgba(0,0,0,.2);
    padding-bottom:6px;
  }

  .note p{
    line-height:1.5;
    font-size:.95em;
  }

  .note button{
    margin-top:16px;
    padding:8px 16px;
    border:1px solid #3a2f22;
    background:transparent;
    cursor:pointer;
    color:#3a2f22;
  }

  .win{
    background:#111;
    color:#ffd27a;
    border:2px solid #ffd27a;
    box-shadow:0 0 40px #ffb84a;
    transform:rotate(0);
    text-align:center;
  }

  .win h3{
    color:#ffd27a;
    border-color:#553;
  }

  .win button{
    border-color:#ffd27a;
    color:#ffd27a;
  }

  #loading{
    position:absolute;
    inset:0;
    background:#000;
    color:#5ef2ff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    font-size:1.1em;
    letter-spacing:2px;
  }
</style>
</head>

<body>

<div id="app">

  <div id="loading">LOADING GALLERY…</div>

  <div id="welcome">
    <h1>RAMSHA ART STUDIO</h1>
    <p>an interactive gallery of cozy &amp; eerie things</p>

    <div id="stepEnterName">
      <input id="nameInput" placeholder="Enter your name" maxlength="20">
      <br>
      <button id="enterBtn">ENTER GALLERY</button>
    </div>

    <div id="welcomeMsg" style="display:none;"></div>
  </div>

  <div id="roomLabel"></div>

  <div id="crosshair" style="display:none;"></div>

  <div id="hint" style="display:none;">
    WASD to move · mouse to look · click a painting
  </div>

  <button id="muteBtn" style="display:none;">🔊 Sound</button>

  <div class="modalOverlay" id="noteOverlay">
    <div class="note" id="noteBox">
      <h3 id="noteTitle">Untitled</h3>
      <p id="noteBody">...</p>
      <button id="noteClose">close</button>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =========================================================
   BASIC UI
========================================================= */

const $ = id => document.getElementById(id);

let gameStarted = false;
let galleryReady = false;
let dom = null;

function showFatalError(msg){
  const lbl = $('roomLabel');
  lbl.style.opacity = 1;
  lbl.style.color = '#ff6b6b';
  lbl.textContent = '⚠ ' + msg;
  console.error(msg);
}

$('enterBtn').onclick = () => {

  const name =
    $('nameInput').value.trim() || 'friend';

  $('stepEnterName').style.display = 'none';

  const wm = $('welcomeMsg');

  wm.style.display = 'block';

  wm.textContent =
    `Welcome, ${name}. Your artwork is waiting for you in Lobby 1.`;

  try{
    startAudio();
  }catch(e){
    console.warn('Audio failed to start:',e);
  }

  setTimeout(() => {

    $('welcome').style.display = 'none';
    $('crosshair').style.display = 'block';
    $('hint').style.display = 'block';
    $('muteBtn').style.display = 'block';

    gameStarted = true;

    if(!galleryReady){

      showFatalError(
        '3D engine did not start — open the browser console (F12) for details.'
      );

    }else if(dom){

      dom.requestPointerLock();

    }

  },2200);

};

$('muteBtn').onclick = () => {

  muted = !muted;

  if(master){
    master.gain.value =
      muted ? 0 : 0.25;
  }

  $('muteBtn').textContent =
    muted ? '🔇 Sound' : '🔊 Sound';

};

$('noteClose').onclick = () => {
  $('noteOverlay').style.display = 'none';
};

function openNote(d){

  if(dom)
    document.exitPointerLock();

  const box = $('noteBox');

  box.classList.toggle(
    'win',
    !!d.winner
  );

  $('noteTitle').textContent =
    d.winner
      ? '🎉 You found a free print!'
      : d.label;

  $('noteBody').textContent =
    d.story;

  $('noteOverlay').style.display = 'flex';

}


/* =========================================================
   AUDIO
========================================================= */

let audioCtx,
    master,
    noiseSrc,
    droneOsc,
    muted=false;

function footstepTick(dt){}

function startAudio(){

  if(audioCtx)
    return;

  audioCtx =
    new (window.AudioContext ||
         window.webkitAudioContext)();

  master =
    audioCtx.createGain();

  master.gain.value = .25;

  master.connect(
    audioCtx.destination
  );

  droneOsc =
    audioCtx.createOscillator();

  droneOsc.type='sine';
  droneOsc.frequency.value=55;

  const droneGain =
    audioCtx.createGain();

  droneGain.gain.value=.15;

  droneOsc
    .connect(droneGain)
    .connect(master);

  droneOsc.start();

  const bufSize =
    2 * audioCtx.sampleRate;

  const buf =
    audioCtx.createBuffer(
      1,
      bufSize,
      audioCtx.sampleRate
    );

  const data =
    buf.getChannelData(0);

  for(let i=0;i<bufSize;i++)
    data[i]=Math.random()*2-1;

  noiseSrc =
    audioCtx.createBufferSource();

  noiseSrc.buffer=buf;
  noiseSrc.loop=true;

  const filter =
    audioCtx.createBiquadFilter();

  filter.type='lowpass';
  filter.frequency.value=500;

  const noiseGain =
    audioCtx.createGain();

  noiseGain.gain.value=.06;

  noiseSrc
    .connect(filter)
    .connect(noiseGain)
    .connect(master);

  noiseSrc.start();

  setInterval(() => {

    if(
      muted ||
      !gameStarted ||
      !galleryReady
    )
      return;

    const near=currentRoom();

    const o =
      audioCtx.createOscillator();

    const g =
      audioCtx.createGain();

    o.type =
      near && near.tag==='LOBBY 5'
        ? 'sawtooth'
        : 'sine';

    o.frequency.value =
      near && near.tag==='LOBBY 5'
        ? 120+Math.random()*200
        : 300+Math.random()*200;

    g.gain.value=0;

    o.connect(g).connect(master);

    o.start();

    g.gain.linearRampToValueAtTime(
      near && near.tag==='LOBBY 5'
        ? .08
        : .03,
      audioCtx.currentTime+.3
    );

    g.gain.linearRampToValueAtTime(
      0,
      audioCtx.currentTime+1.4
    );

    o.stop(
      audioCtx.currentTime+1.5
    );

  },5000);

}

function currentRoom(){

  if(
    !window._rooms ||
    !window._camera
  )
    return null;

  return window._rooms.reduce(
    (a,r) =>
      Math.abs(
        r.z-window._camera.position.z
      )
      <
      Math.abs(
        a.z-window._camera.position.z
      )
        ? r
        : a,
    window._rooms[0]
  );

}


/* =========================================================
   THREE.JS
========================================================= */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x03030a);

const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth/innerHeight,
    .1,
    200
  );

camera.position.set(
  0,
  1.7,
  4
);

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(
    devicePixelRatio,
    2
  )
);

$('app').prepend(
  renderer.domElement
);

dom =
  renderer.domElement;

$('loading').style.display='none';

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
  new THREE.AmbientLight(
    0x252a38,
    1.25
  )
);

const hallLight =
  new THREE.PointLight(
    0x506080,
    .7,
    45
  );

hallLight.position.set(
  0,
  3.4,
  16
);

scene.add(hallLight);


/* =========================================================
   FLOOR / CEILING
========================================================= */

const floorMat =
  new THREE.MeshStandardMaterial({
    color:0x111116,
    roughness:1
  });

const floor =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      30,
      140
    ),
    floorMat
  );

floor.rotation.x=-Math.PI/2;
floor.position.set(
  0,
  0,
  60
);

scene.add(floor);

const ceil =
  floor.clone();

ceil.position.y=4.2;
ceil.rotation.x=Math.PI/2;

scene.add(ceil);


/* =========================================================
   TEXTURE HELPERS
========================================================= */

function canvasTexture(
  draw,
  w=512,
  h=384
){

  const c =
    document.createElement('canvas');

  c.width=w;
  c.height=h;

  const ctx =
    c.getContext('2d');

  draw(
    ctx,
    w,
    h
  );

  const tex =
    new THREE.CanvasTexture(c);

  tex.wrapS =
    THREE.ClampToEdgeWrapping;

  tex.wrapT =
    THREE.ClampToEdgeWrapping;

  return tex;
}


function placeholderArt(
  label,
  hue=210
){

  return canvasTexture(
    (ctx,w,h) => {

      const grad =
        ctx.createLinearGradient(
          0,0,
          w,h
        );

      grad.addColorStop(
        0,
        `hsl(${hue},35%,17%)`
      );

      grad.addColorStop(
        .55,
        `hsl(${hue+20},30%,9%)`
      );

      grad.addColorStop(
        1,
        '#050508'
      );

      ctx.fillStyle=grad;
      ctx.fillRect(
        0,0,w,h
      );

      ctx.fillStyle=
        'rgba(255,255,255,.08)';

      ctx.fillRect(
        30,
        30,
        w-60,
        h-60
      );

      ctx.fillStyle=
        'rgba(255,255,255,.6)';

      ctx.font=
        '28px Georgia';

      ctx.textAlign='center';

      ctx.fillText(
        'RAMSHA ART STUDIO',
        w/2,
        h/2-12
      );

      ctx.font=
        '20px Georgia';

      ctx.fillStyle=
        'rgba(255,255,255,.35)';

      ctx.fillText(
        label,
        w/2,
        h/2+28
      );

    }
  );

}


function neonSignTexture(
  text,
  color
){

  return canvasTexture(
    (ctx,w,h) => {

      ctx.fillStyle='#07090c';

      ctx.fillRect(
        0,0,w,h
      );

      ctx.font=
        'bold 46px Georgia';

      ctx.textAlign='center';
      ctx.textBaseline='middle';

      ctx.shadowColor=color;
      ctx.shadowBlur=25;

      ctx.fillStyle=color;

      ctx.fillText(
        text,
        w/2,
        h/2
      );

      ctx.shadowBlur=5;

      ctx.fillText(
        text,
        w/2,
        h/2
      );

    },
    640,
    180
  );

}


function posterTexture(
  title,
  subtitle,
  color
){

  return canvasTexture(
    (ctx,w,h) => {

      ctx.fillStyle='#120f10';
      ctx.fillRect(
        0,0,w,h
      );

      ctx.fillStyle=color;

      ctx.globalAlpha=.18;

      ctx.beginPath();

      ctx.arc(
        w*.5,
        h*.42,
        h*.28,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.globalAlpha=1;

      ctx.strokeStyle=color;
      ctx.lineWidth=5;

      ctx.strokeRect(
        22,
        22,
        w-44,
        h-44
      );

      ctx.fillStyle='#eee';

      ctx.textAlign='center';

      ctx.font='bold 32px Georgia';

      ctx.fillText(
        title,
        w/2,
        h*.72
      );

      ctx.font='18px Georgia';

      ctx.fillStyle='#aaa';

      ctx.fillText(
        subtitle,
        w/2,
        h*.84
      );

    },
    320,
    460
  );

}


/* =========================================================
   MATERIAL / GEOMETRY HELPERS
========================================================= */

function mat(
  color,
  opts={}
){

  return new THREE.MeshStandardMaterial({

    color,

    roughness:
      opts.roughness ??
      .8,

    metalness:
      opts.metalness ??
      0,

    emissive:
      opts.emissive ??
      0x000000,

    emissiveIntensity:
      opts.emissiveIntensity ??
      0,

    transparent:
      !!opts.transparent,

    opacity:
      opts.opacity ??
      1,

    side:
      opts.side ??
      THREE.FrontSide,

    map:
      opts.map ||
      null

  });

}


function mesh(
  g,
  geometry,
  color,
  x,
  y,
  z,
  ry=0,
  opts={}
){

  const m =
    new THREE.Mesh(
      geometry,
      mat(color,opts)
    );

  m.position.set(
    x,y,z
  );

  m.rotation.y=ry;

  if(opts.rx)
    m.rotation.x=opts.rx;

  if(opts.rz)
    m.rotation.z=opts.rz;

  if(opts.scale)
    m.scale.copy(opts.scale);

  g.add(m);

  return m;

}


function box(
  g,
  w,h,d,
  color,
  x,y,z,
  ry=0,
  opts={}
){

  return mesh(
    g,
    new THREE.BoxGeometry(
      w,h,d
    ),
    color,
    x,y,z,
    ry,
    opts
  );

}


function sphere(
  g,
  r,
  color,
  x,y,z,
  opts={}
){

  return mesh(
    g,
    new THREE.SphereGeometry(
      r,
      16,
      12
    ),
    color,
    x,y,z,
    0,
    opts
  );

}


function cylinder(
  g,
  r1,r2,h,
  color,
  x,y,z,
  segments=16,
  opts={}
){

  return mesh(
    g,
    new THREE.CylinderGeometry(
      r1,
      r2,
      h,
      segments
    ),
    color,
    x,y,z,
    0,
    opts
  );

}


function cone(
  g,
  r,h,
  color,
  x,y,z,
  opts={}
){

  return mesh(
    g,
    new THREE.ConeGeometry(
      r,
      h,
      16
    ),
    color,
    x,y,z,
    0,
    opts
  );

}


function torus(
  g,
  radius,
  tube,
  color,
  x,y,z,
  rx=0,
  ry=0,
  rz=0,
  opts={}
){

  const m =
    new THREE.Mesh(
      new THREE.TorusGeometry(
        radius,
        tube,
        10,
        20
      ),
      mat(color,opts)
    );

  m.position.set(
    x,y,z
  );

  m.rotation.set(
    rx,ry,rz
  );

  g.add(m);

  return m;

}


function tubeBetween(
  g,
  a,
  b,
  radius,
  color,
  opts={}
){

  const start =
    new THREE.Vector3(
      a.x,a.y,a.z
    );

  const end =
    new THREE.Vector3(
      b.x,b.y,b.z
    );

  const dir =
    new THREE.Vector3()
      .subVectors(
        end,
        start
      );

  const len=dir.length();

  const m =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        len,
        10
      ),
      mat(color,opts)
    );

  m.position.copy(
    start.clone()
      .add(end)
      .multiplyScalar(.5)
  );

  m.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    dir.normalize()
  );

  g.add(m);

  return m;

}


function carpet(
  g,
  w,d,
  color,
  x,z
){

  box(
    g,
    w,
    .035,
    d,
    color,
    x,
    .025,
    z
  );

}


/* =========================================================
   LIGHTS
========================================================= */

const flickerLights=[];

function glowingBulb(
  g,
  color,
  x,y,z,
  intensity=1,
  radius=.1,
  distance=6,
  mode='soft'
){

  const bulb =
    sphere(
      g,
      radius,
      color,
      x,y,z,
      {
        emissive:color,
        emissiveIntensity:3
      }
    );

  const light =
    new THREE.PointLight(
      color,
      intensity,
      distance
    );

  light.position.set(
    x,y,z
  );

  g.add(light);

  flickerLights.push({
    light,
    bulb,
    base:intensity,
    mode
  });

  return light;

}


/* =========================================================
   PAINTINGS
========================================================= */

const clickable=[];

function createPainting(
  cfg,
  group
){

  const w=1.5;
  const h=1.05;

  const material =
    new THREE.MeshStandardMaterial({
      map:
        placeholderArt(
          cfg.label,
          cfg.hue || 210
        ),
      roughness:.8
    });

  const meshObj =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        w,h
      ),
      material
    );

  meshObj.position.set(
    cfg.x,
    cfg.y,
    cfg.z
  );

  meshObj.rotation.y=
    cfg.ry;

  const frameMat =
    new THREE.MeshStandardMaterial({
      color:
        cfg.frameColor ||
        0x17120f,
      roughness:.55
    });

  const frame =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        w+.14,
        h+.14
      ),
      frameMat
    );

  frame.position.copy(
    meshObj.position
  );

  frame.rotation.y=
    cfg.ry;

  frame.translateZ(-.02);

  group.add(
    frame,
    meshObj
  );

  meshObj.userData=cfg;

  clickable.push(
    meshObj
  );

  if(cfg.img){

    new THREE.TextureLoader()
      .load(
        cfg.img,
        tex => {

          material.map=tex;
          material.needsUpdate=true;

        },
        undefined,
        () => {}
      );

  }

}


/* =========================================================
   SMALL RECOGNIZABLE OBJECT BUILDERS
========================================================= */

function makePictureFrame(
  g,
  x,y,z,
  w,h,
  color,
  texture,
  ry=0

  g.add(frame);

  return frame;

    The opening remains visibly narrow,
    while the room opens behind it.
  */

  const x=
    side*HALL_HALF;

  const depth=.28;

  /* vertical jambs */

  box(
    g,
    depth,
    3.35,
    .22,
    0x332b28,

    1.68,

  );

    g,
    depth,
    .25,
    2.15,
    0x332b28,

/* =========================================================
   CORRIDOR
========================================================= */

function buildCorridor(){

  /*
     Instead of making a huge open gallery,
     each side is built as SEPARATE WALL SEGMENTS.
     The only openings are the actual doors.
  */

  const doorGap=2.35;

  for(
    const side of [-1,1]
  ){

    let previous=1;

    const roomZones=[
      16,
      36,
      56,
      76,
      96
    ];

    for(
      const roomZ of roomZones
    ){

      const gapStart=
        roomZ-doorGap/2;

      const gapEnd=
        roomZ+doorGap/2;

      const segmentLength=
        gapStart-previous;

      if(segmentLength>0){

        hallWall(
          side*HALL_HALF,
          ROOM_H/2,
          (previous+gapStart)/2,
          segmentLength,
          ROOM_H
        );

      }

      makeHallDoor(
        side,
        roomZ,
        'LOBBY '+(
          roomZones.indexOf(roomZ)+1
        ),
        [
          '#8fffb0',
          '#9fd7ff',
          '#ffb877',
          '#c9d4ff',
          '#ff3b3b'
        ][roomZones.indexOf(roomZ)]
      );

      previous=gapEnd;

    }

    const endLength=
      HALL_LENGTH-previous;

    if(endLength>0){

      hallWall(
        side*HALL_HALF,
        ROOM_H/2,
        (previous+HALL_LENGTH)/2,
        endLength,
        ROOM_H
      );

    }

  }


  /* hallway ceiling lights */

  for(
    let z=5;
    z<HALL_LENGTH;
    z+=8
  ){

    const light=
      new THREE.PointLight(
        0x75849d,
        .42,
        7
      );

    light.position.set(
      0,
      3.85,
      z
    );

    scene.add(light);

    const fixture=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .17,.17,.08,16
        ),
        new THREE.MeshStandardMaterial({
          color:0x343943,
          emissive:0x667388,
          emissiveIntensity:.25
        })
      );

    fixture.position.set(
      0,
      4.04,
      z
    );

    scene.add(fixture);

  }


  /* wall sconces */

  for(
    let z=9;
    z<HALL_LENGTH;
    z+=10
  ){

    if(
      [16,36,56,76,96]
        .some(
          r =>
            Math.abs(
              z-r
            )<2
        )
    )
      continue;

    for(
      const side of [-1,1]
    ){

      box(
        scene,
        .12,.35,.1,
        0x383b43,
        side*(HALL_HALF+.02),
        2.9,
        z
      );

      glowingBulb(
        scene,
        0x91a7c7,
        side*(HALL_HALF+.11),
        3.0,
        z,
        .3,
        .055,
        3.2,
        'soft'
      );

    }

  }


  /* ceiling beam detail */

  for(
    let z=4;
    z<HALL_LENGTH;
    z+=12
  ){

    box(
      scene,
      HALL_HALF*2+.2,
      .16,
      .16,
      0x252831,
      0,
      3.92,
      z
    );

  }

}

buildCorridor();


/* =========================================================
   ROOM ARCHITECTURE
========================================================= */

function createRoom(cfg){

  const group=
    new THREE.Group();

  const cx=
    cfg.side*
    (HALL_HALF+ROOM_W/2);

  group.position.set(
    cx,
    0,
    cfg.z
  );

  scene.add(group);

  const wallMat=
    new THREE.MeshStandardMaterial({
      color:cfg.wallColor,
      roughness:.96,
      side:THREE.DoubleSide
    });

  const roomFloorMat=
    new THREE.MeshStandardMaterial({
      color:cfg.floorColor,
      roughness:1
    });


  /* far wall */

  const far=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_D,
        ROOM_H
      ),
      wallMat
    );

  far.position.set(
    cfg.side*ROOM_W/2,
    ROOM_H/2,
    0
  );

  far.rotation.y=
    Math.PI/2;

  group.add(far);


  /* back side walls */

  const backWall=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_H
      ),
      wallMat
    );

  backWall.position.set(
    0,
    ROOM_H/2,
    ROOM_D/2
  );

  group.add(backWall);


  /* front side wall sections */

  const frontWall=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_H
      ),
      wallMat
    );

  frontWall.position.set(
    0,
    ROOM_H/2,
    -ROOM_D/2
  );

  group.add(frontWall);


  /* floor */

  const roomFloor=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_D
      ),
      roomFloorMat
    );

  roomFloor.rotation.x=
    -Math.PI/2;

  roomFloor.position.y=.012;

  group.add(roomFloor);


  /* ceiling */

  const roomCeil=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        ROOM_W,
        ROOM_D
      ),
      wallMat
    );

  roomCeil.rotation.x=
    Math.PI/2;

  roomCeil.position.y=
    ROOM_H-.02;

  group.add(roomCeil);


  const light=
    new THREE.PointLight(
      cfg.lightColor,
      cfg.lightIntensity,
      14
    );

  light.position.set(
    cfg.side*1.2,
    3.25,
    0
  );

  group.add(light);

  if(cfg.flicker){

    flickerLights.push({
      light,
      base:cfg.lightIntensity,
      mode:cfg.flicker
    });

  }


  /* lobby sign facing hallway */

  const sign=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1.7,
        .42
      ),
      new THREE.MeshStandardMaterial({
        map:
          neonSignTexture(
            cfg.tag,
            cfg.neon
          ),
        emissive:
          new THREE.Color(cfg.neon),
        emissiveIntensity:.5
      })
    );

  sign.position.set(
    -cfg.side*(ROOM_W/2-.02),
    3.18,
    0
  );

  sign.rotation.y=
    cfg.side<0
      ? -Math.PI/2
      : Math.PI/2;

  group.add(sign);


  if(cfg.decorate)
    cfg.decorate(group);


  if(cfg.paintings){

    cfg.paintings.forEach(
      p =>
        createPainting(
          p,
          group
        )
    );

  }

  return group;

}

      document.pointerLockElement!==dom
    )
      return;

    yaw -=
      e.movementX*.0022;

    pitch -=
      e.movementY*.0022;

    pitch=
      Math.max(
        -1.2,
        Math.min(
          1.2,
          pitch
        )
      );

  }
);


/* IMPORTANT:
   player remains inside central hallway bounds
   AND can move into rooms through their openings.
*/

const LIMIT={
  xMin:-(HALL_HALF+ROOM_W-.4),
  xMax:HALL_HALF+ROOM_W-.4,
  zMin:1,
  zMax:HALL_LENGTH
};


function updateMovement(dt){

  camera.rotation.set(
    pitch,
    yaw,
    0,
    'YXZ'
  );

  const speed=
    3.2*dt;

  const fwd=
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right=
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );

  let mv=
    new THREE.Vector3();

  if(keys['KeyW'])
    mv.add(fwd);

  if(keys['KeyS'])
    mv.sub(fwd);

  if(keys['KeyD'])
    mv.add(right);

  if(keys['KeyA'])
    mv.sub(right);

  if(mv.length()>0){

    mv
      .normalize()
      .multiplyScalar(speed);

    camera.position.x=
      Math.max(
        LIMIT.xMin,
        Math.min(
          LIMIT.xMax,
          camera.position.x+mv.x
        )
      );

    camera.position.z=
      Math.max(
        LIMIT.zMin,
        Math.min(
          LIMIT.zMax,
          camera.position.z+mv.z
        )
      );

    footstepTick(dt);

  }

  /*
     Do NOT pull the player toward room centers.
     The central corridor stays the natural route.
  */

  const near=
    rooms.reduce(
      (a,r) =>
        Math.abs(
          r.z-camera.position.z
        )
        <
        Math.abs(
          a.z-camera.position.z
        )
          ? r
          : a,
      rooms[0]
    );

  const lbl=
    document.getElementById(
      'roomLabel'
    );

  if(
    Math.abs(
      near.z-camera.position.z
    )<5.5
  ){

    lbl.style.opacity=1;
    lbl.textContent=near.tag;

  }else{

    lbl.style.opacity=0;

  }

}


/* =========================================================
   FLICKER ANIMATION
========================================================= */

function animateFlicker(t){

  flickerLights.forEach(
    obj => {

      let factor=1;

      if(obj.mode==='flicker'){

        factor=
          .82+
          Math.random()*.18;

      }

      else if(
        obj.mode==='ember'
      ){

        factor=
          .72+
          Math.sin(t*.011)*.12+
          Math.random()*.16;

      }

      else if(
        obj.mode==='lamp'
      ){

        factor=
          .94+
          Math.sin(t*.0017)*.04;

      }

      else if(
        obj.mode==='strobe'
      ){

        factor=
          Math.random()<.035
            ? .18
            : 1;

      }

      else if(
        obj.mode==='pulse'
      ){

        factor=
          .8+
          Math.sin(t*.003)*.2;

      }

      else{

        factor=
          .94+
          Math.sin(t*.002)*.03;

      }

      obj.light.intensity=
        obj.base*factor;

      if(obj.bulb){

        obj.bulb.material.emissiveIntensity=
          2.5*factor;

      }

      if(obj.fire){

        obj.fire.material.opacity=
          .65+
          Math.random()*.3;

      }

    }
  );

}


/* =========================================================
   ANIMATION
========================================================= */

const clock=
  new THREE.Clock();

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  const t=
    performance.now();

  if(gameStarted)
    updateMovement(dt);

  animateFlicker(t);


  /* snow */

  scene.traverse(
    obj => {

      if(
        obj.userData &&
        obj.userData.isSnow
      ){

        const pos=
          obj.geometry.attributes.position;

        for(
          let i=0;
          i<pos.count;
          i++
        ){

          let y=
            pos.getY(i);

          y -= .01;

          if(y<0)
            y=ROOM_H;

          pos.setY(
            i,
            y
          );

        }

        pos.needsUpdate=true;

      }

      if(
        obj.userData &&
        obj.userData.isRain
      ){

        obj.position.y -=
          dt*.7;

        if(
          obj.position.y<.25
        ){

          obj.position.y=
            .8+
            Math.random()*2.1;

        }

      }

    }
  );


  renderer.render(
    scene,
    camera
  );

}

animate();

galleryReady=true;


/* =========================================================
   PAINTING INTERACTION
========================================================= */

const raycaster=
  new THREE.Raycaster();

dom.addEventListener(
  'mousedown',
  e => {

    if(
      !gameStarted ||
      document.pointerLockElement!==dom
    )
      return;

    const mouse=
      new THREE.Vector2(
        0,
        0
      );

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits=
      raycaster.intersectObjects(
        clickable,
        false
      );

    if(
      hits.length
    ){

      openNote(
        hits[0].object.userData
      );

    }

  }
);

</script>
